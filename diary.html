<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Duwalcoe Diary</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e413a;--navy2:#1a5a50;--gold:#a8b938;--cream:#f8f5ef;--smoke:#edeae3;--mist:#d8d4cb;--ink:#1a1a2e;--sage:#2e7d5a;--rose:#9e2a2b;--sky:#2563ab}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
/* ── TOP BAR ── */
.topbar{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:'DM Serif Display',serif;font-size:18px;margin-right:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;border:none;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.b-gold{background:var(--gold);color:#fff}
.b-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.b-ghost:hover{background:rgba(255,255,255,.2)}
.b-danger{background:var(--rose);color:#fff}
.b-sage{background:var(--sage);color:#fff}
.b-sky{background:var(--sky);color:#fff}
.user-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .15s}
.user-pill.active{border-color:#fff}
.user-clinton{background:#1a5a50;color:#fff}
.user-wife{background:#6d28d9;color:#fff}
.user-daughter{background:#b45309;color:#fff}
.spacer{flex:1}

/* ── DATE NAV ── */
.date-nav{background:#fff;border-bottom:2px solid var(--mist);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date-nav .date-display{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);flex:1}
.date-nav .date-sub{font-size:12px;color:#888;margin-top:2px}
.day-tabs{display:flex;gap:4px}
.day-tab{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;background:var(--smoke);color:#888;transition:all .15s}
.day-tab:hover{background:var(--mist)}
.day-tab.active{background:var(--navy);color:#fff}
.day-tab.today{background:var(--gold);color:#fff}
.nav-arrow{background:none;border:1.5px solid var(--mist);color:var(--navy);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-arrow:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:calc(100vh - 120px)}
.diary-col{padding:20px;border-right:2px solid var(--mist)}
.side-col{padding:16px;background:#fff}

/* ── APPT SLOTS ── */
.slot-section{margin-bottom:24px}
.slot-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#aaa;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--smoke)}
.slot{background:#fff;border:1.5px solid var(--mist);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.slot:hover{border-color:var(--mist)}
.slot.filled{border-color:var(--sage);border-left:4px solid var(--sage)}
.slot.filled-fu{border-color:var(--sky);border-left:4px solid var(--sky)}
.slot.filled-rev{border-color:var(--gold);border-left:4px solid var(--gold)}
.slot.filled-block{border-color:#888;border-left:4px solid #888}
.slot.filled-teams{border-color:#6d28d9;border-left:4px solid #6d28d9}
.slot-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.slot-time{font-size:12px;font-weight:700;color:var(--navy);min-width:80px}
.slot-name{flex:1;font-size:13px;font-weight:600;color:var(--ink)}
.slot-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px}
.type-nb{background:#f0fdf4;color:var(--sage)}
.type-fu{background:#eff6ff;color:var(--sky)}
.type-rev{background:#fef9ee;color:#92400e}
.type-block{background:var(--smoke);color:#666}
.type-teams{background:#ede9fe;color:#6d28d9}
.type-sale{background:#f0fdf4;color:#166534;font-weight:800}
.type-prospect{background:#fef3c7;color:#92400e}
.active-sale{background:#f0fdf4;color:#166534;border-color:#166534!important}
.active-prospect{background:#fef3c7;color:#92400e;border-color:#92400e!important}
.slot-actions{display:flex;gap:4px}
.slot-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:4px;border-radius:5px;transition:background .15s}
.slot-btn:hover{background:var(--smoke)}
.slot-body{padding:0 14px 12px;display:none}
.slot-body.open{display:block}
.slot-body label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
.slot-body input,.slot-body textarea,.slot-body select{width:100%;border:1.5px solid var(--mist);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
.slot-body input:focus,.slot-body textarea:focus,.slot-body select:focus{border-color:var(--navy)}
.slot-body textarea{resize:vertical;min-height:60px}
.type-row{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.type-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;background:var(--smoke);color:#666;transition:all .15s}
.type-btn:hover{border-color:var(--mist)}
.type-btn.active-nb{background:#f0fdf4;color:var(--sage);border-color:var(--sage)}
.type-btn.active-fu{background:#eff6ff;color:var(--sky);border-color:var(--sky)}
.type-btn.active-rev{background:#fef9ee;color:#92400e;border-color:#92400e}
.type-btn.active-block{background:var(--smoke);color:#555;border-color:#999}
.type-btn.active-teams{background:#ede9fe;color:#6d28d9;border-color:#6d28d9}
.save-row{display:flex;gap:8px;margin-top:12px}
.empty-slot{color:#bbb;font-size:12px;font-style:italic}
.teams-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;background:#ede9fe;color:#6d28d9;border-radius:7px;font-size:12px;font-weight:600;text-decoration:none}
.teams-link:hover{background:#ddd6fe}
.outcome-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-top:6px}
.outcome-done{background:#f0fdf4;color:var(--sage)}
.outcome-follow{background:#eff6ff;color:var(--sky)}
.outcome-pending{background:#fef9ee;color:#92400e}

/* ── ADD FREE SLOT ── */
.add-slot-btn{width:100%;padding:10px;border:2px dashed var(--mist);background:transparent;border-radius:10px;color:#bbb;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px}
.add-slot-btn:hover{border-color:var(--navy);color:var(--navy);background:var(--smoke)}
.time-grid{display:flex;flex-direction:column;gap:0}
.time-row{display:grid;grid-template-columns:52px 1fr;min-height:52px;border-bottom:1px solid var(--smoke)}
.time-row:last-child{border-bottom:none}
.time-row .hr-label{padding:6px 8px 0;font-size:11px;font-weight:700;color:#bbb;text-align:right;border-right:2px solid var(--mist);background:var(--smoke)}
.time-row .hr-content{padding:4px 8px;position:relative;cursor:pointer;transition:background .15s;min-height:52px}
.time-row .hr-content:hover{background:var(--smoke)}
.time-row .hr-content.has-appt{cursor:default}
.hr-content.has-appt:hover{background:#fff}
.appt-block{background:#fff;border:1.5px solid var(--mist);border-radius:8px;padding:8px 10px;margin:2px 0;cursor:pointer;transition:border-color .15s}
.appt-block:hover{border-color:var(--navy)}
.appt-block.nb{border-left:4px solid var(--sage);background:#f0fdf4}
.appt-block.fu{border-left:4px solid var(--sky);background:#eff6ff}
.appt-block.rev{border-left:4px solid var(--gold);background:#fef9ee}
.appt-block.prospect{border-left:4px solid #f59e0b;background:#fffbeb}
.appt-block.teams{border-left:4px solid #6d28d9;background:#ede9fe}
.appt-block.block{border-left:4px solid #888;background:var(--smoke)}
.appt-block .ab-name{font-size:13px;font-weight:600;color:var(--ink)}
.appt-block .ab-meta{font-size:11px;color:#888;margin-top:2px;display:flex;gap:8px;align-items:center}
.appt-block .ab-sold{color:#166534;font-weight:700}
.empty-hour{color:#ccc;font-size:11px;padding:4px 0}

/* ── SCOREBOARD ── */
.scoreboard{background:var(--navy);color:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
.sb-title{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.sb-count{font-family:'DM Serif Display',serif;font-size:42px;color:var(--gold);line-height:1}
.sb-target{font-size:12px;opacity:.6;margin-top:4px}
.sb-bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:10px;overflow:hidden}
.sb-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.sb-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.sb-item{text-align:center;background:rgba(255,255,255,.08);border-radius:7px;padding:8px 4px}
.sb-item .n{font-size:18px;font-weight:700}
.sb-item .l{font-size:9px;opacity:.6;text-transform:uppercase;letter-spacing:.3px}

/* ── OTHER USERS ── */
.other-user{background:#fff;border:1.5px solid var(--mist);border-radius:10px;margin-bottom:10px;overflow:hidden}
.other-user-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:var(--smoke)}
.other-user-head .ou-name{font-weight:700;font-size:12px;flex:1}
.other-user-body{padding:10px 12px;display:none}
.other-user-body.open{display:block}
.ou-slot{font-size:12px;padding:5px 0;border-bottom:1px solid var(--smoke);display:flex;gap:8px;align-items:center}
.ou-slot:last-child{border-bottom:none}
.ou-slot .ou-time{color:#888;min-width:70px;font-size:11px}
.ou-slot .ou-name-s{font-weight:600}
.ou-empty{font-size:11px;color:#bbb;font-style:italic}

/* ── PRINT ── */
@media print{
  .topbar,.date-nav .day-tabs,.date-nav .nav-arrow,.side-col,.add-slot-btn,.slot-actions,.save-row,.btn{display:none!important}
  .main{display:block;grid-template-columns:1fr}
  .diary-col{border:none;padding:10px}
  body{background:#fff}
  .slot-body{display:block!important}
  .slot{page-break-inside:avoid}
}

.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Duwalcoe</div>
  <span style="font-size:12px;opacity:.6">Diary</span>
  <div class="spacer"></div>
  <!-- User selector -->
  <div id="userTabs" style="display:flex;gap:6px">
    <div class="user-pill user-clinton" id="pill-Clinton" onclick="setUser('Clinton')">Clinton</div>
    <div class="user-pill user-wife" id="pill-Wife" onclick="setUser('Wife')">Wife</div>
    <div class="user-pill user-daughter" id="pill-Daughter" onclick="setUser('Daughter')">Daughter</div>
  </div>
  <button class="btn b-ghost" onclick="window.open('planner_ref.html','_blank','width=1200,height=900')">📋 Reference Guide</button>
  <button class="btn b-ghost" onclick="window.print()">🖨 Print Day</button>
</div>

<div class="date-nav">
  <button class="nav-arrow" onclick="changeWeek(-1)">‹</button>
  <div>
    <div class="date-display" id="dateDisplay">Monday 30 March 2026</div>
    <div class="date-sub" id="weekDisplay">Week 14 · 30 Mar – 3 Apr 2026</div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <button class="nav-arrow" onclick="changeWeek(1)">›</button>
  <button class="btn b-ghost" style="font-size:11px;padding:6px 12px" onclick="goToday()">Today</button>
</div>

<div class="main">
  <!-- LEFT: Diary -->
  <div class="diary-col" id="diaryCol"></div>

  <!-- RIGHT: Scoreboard + Other users -->
  <div class="side-col">
    <div class="scoreboard" id="scoreboard"></div>

    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#aaa;margin-bottom:8px">Team's Week</div>
    <div id="otherUsers"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://ayyexuwxaghzljykslxr.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5eWV4dXd4YWdoemxqeWtzbHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTUyMTcsImV4cCI6MjA4OTg5MTIxN30.hp2cQ64FjKnThsLh2qfdqRKdiy39_900JfH6C0KKIx4';

var USERS=['Clinton','Wife','Daughter'];
var USER_COLORS={Clinton:'#1a5a50',Wife:'#6d28d9',Daughter:'#b45309'};

// Standard appointment slots for Tue-Thu
var STD_SLOTS=[
  {time:'10:30',label:'Appointment 1'},
  {time:'12:00',label:'Appointment 2'},
  {time:'13:30',label:'Appointment 3'},
  {time:'15:00',label:'Appointment 4 (back-up)'}
];

// State
var currentUser = localStorage.getItem('du_diary_user')||'Clinton';
var currentWeekStart = getMonday(new Date());
var currentDay = 0; // 0=Mon,...,4=Fri
var allData = {}; // { "Clinton|2026-W14|Mon": [...slots] }
var openSlot = null;

function setUser(u){
  currentUser=u;
  localStorage.setItem('du_diary_user',u);
  document.querySelectorAll('.user-pill').forEach(function(p){p.classList.remove('active');});
  document.getElementById('pill-'+u).classList.add('active');
  render();
}

function getMonday(d){
  var dt=new Date(d);
  var day=dt.getDay();
  var diff=dt.getDate()-day+(day===0?-6:1);
  dt.setDate(diff);
  dt.setHours(0,0,0,0);
  return dt;
}

function getWeekKey(monday){
  var d=monday||currentWeekStart;
  var jan1=new Date(d.getFullYear(),0,1);
  var wk=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return d.getFullYear()+'-W'+(wk<10?'0':'')+wk;
}

function getDayKey(dayIdx){
  return ['Mon','Tue','Wed','Thu','Fri'][dayIdx];
}

function getFullKey(user,dayIdx){
  return user+'|'+getWeekKey()+'|'+getDayKey(dayIdx);
}

function dayDate(dayIdx){
  var d=new Date(currentWeekStart);
  d.setDate(d.getDate()+dayIdx);
  return d;
}

function fmtDate(d){
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

function fmtShort(d){
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()];
}

function isAdminDay(dayIdx){ return dayIdx===0||dayIdx===4; }
function isToday(dayIdx){
  var today=new Date(); today.setHours(0,0,0,0);
  var dd=dayDate(dayIdx); dd.setHours(0,0,0,0);
  return today.getTime()===dd.getTime();
}

function getSlots(user, dayIdx){
  if(dayIdx<0||dayIdx>4) return [];
  var key=getFullKey(user,dayIdx);
  return allData[key]||[];
}

function setSlots(user,dayIdx,slots){
  if(dayIdx<0||dayIdx>4) return; // guard against plan tab index
  var key=getFullKey(user,dayIdx);
  allData[key]=slots||[];
}

function changeWeek(dir){
  var d=new Date(currentWeekStart);
  d.setDate(d.getDate()+dir*7);
  currentWeekStart=getMonday(d);
  loadWeek();
}

function goToday(){
  currentWeekStart=getMonday(new Date());
  var today=new Date();
  var day=today.getDay();
  currentDay=(day>=1&&day<=5)?day-1:0;
  loadWeek();
}

// ── SUPABASE ──
function sbGet(user,weekKey,cb){
  fetch(SB_URL+'/rest/v1/diary?User=eq.'+encodeURIComponent(user)+'&WeekKey=eq.'+encodeURIComponent(weekKey)+'&select=*',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  }).then(function(r){return r.json();}).then(cb).catch(function(){cb([]);});
}

function sbUpsert(user,weekKey,data){
  fetch(SB_URL+'/rest/v1/diary', {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{User:user, WeekKey:weekKey, Data:data}])
  }).then(function(r){
    if(r.ok){ showToast('Saved ✓'); }
    else { r.text().then(function(t){
      showToast('⚠️ Save failed '+r.status);
      console.error('Diary save error:', r.status, t);
    }); }
  }).catch(function(e){
    showToast('⚠️ No connection — saved locally');
    console.error('Diary save catch:', e);
  });
}


function loadWeek(){
  var wk=getWeekKey();
  var pending=USERS.length*1;
  var loaded=0;
  // Load all users for this week
  USERS.forEach(function(u){
    // Try local first
    var lk='du_diary_'+u+'_'+wk;
    var local=localStorage.getItem(lk);
    if(local){
      try{
        var d=JSON.parse(local);
        Object.keys(d).forEach(function(k){ allData[k]=d[k]; });
      }catch(e){}
    }
    sbGet(u,wk,function(rows){
      if(rows&&rows.length&&rows[0].Data){
        var d=rows[0].Data;
        // Merge server data — server is authoritative
        Object.keys(d).forEach(function(k){ allData[k]=d[k]; });
        // Also ensure all 5 day keys exist for current user
        if(u===currentUser){
          for(var di=0;di<5;di++){
            var dk=getFullKey(u,di);
            if(!allData.hasOwnProperty(dk)) allData[dk]=[];
          }
        }
        localStorage.setItem(lk,JSON.stringify(d));
      } else {
        // No server data — initialise empty day keys for current user
        if(u===currentUser){
          for(var di=0;di<5;di++){
            var dk=getFullKey(u,di);
            if(!allData.hasOwnProperty(dk)) allData[dk]=[];
          }
        }
      }
      loaded++;
      if(loaded>=USERS.length) render();
    });
  });
  render(); // render immediately with cached data
}

function saveCurrentUser(){
  var wk=getWeekKey();
  // Include ALL 5 days — even empty ones ([] is falsy so must use hasOwnProperty)
  var data={};
  for(var i=0;i<5;i++){
    var key=getFullKey(currentUser,i);
    if(allData.hasOwnProperty(key)) data[key]=allData[key];
  }
  var lk='du_diary_'+currentUser+'_'+wk;
  localStorage.setItem(lk,JSON.stringify(data));
  sbUpsert(currentUser,wk,data);
}

// ── RENDER ──
function render(){
  renderNav();
  renderDiary();
  renderScoreboard();
  renderOtherUsers();
}

function renderNav(){
  // Week display
  var monDate=dayDate(0);
  var friDate=dayDate(4);
  document.getElementById('weekDisplay').textContent=
    'Week '+getWeekKey().split('-W')[1]+' · '+fmtShort(monDate)+' – '+fmtShort(friDate)+' '+friDate.getFullYear();

  // Day tabs — Plan tab + Mon-Fri
  var tabs=document.getElementById('dayTabs');
  var DAY_NAMES=['Plan','Mon','Tue','Wed','Thu','Fri'];
  tabs.innerHTML=DAY_NAMES.map(function(n,i){
    var cls='day-tab';
    if(i===0&&currentDay===-1) cls+=' active';
    else if(i>0&&(i-1)===currentDay) cls+=' active';
    else if(i>0&&isToday(i-1)) cls+=' today';
    var lbl=i===0?'📋 Plan':n+' '+dayDate(i-1).getDate();
    return '<button class="'+cls+'" onclick="'+(i===0?'selectPlan()':'selectDay('+(i-1)+')')+'">'+lbl+'</button>';
  }).join('');

  // Date display
  if(currentDay===-1){
    document.getElementById('dateDisplay').textContent='Weekly Plan — Week '+getWeekKey().split('-W')[1];
  } else {
    document.getElementById('dateDisplay').textContent=fmtDate(dayDate(currentDay));
  }
}

function selectPlan(){
  currentDay=-1;
  openSlot=null;
  render();
}

function selectDay(i){
  currentDay=i;
  openSlot=null;
  render();
}

function renderDiary(){
  var col=document.getElementById('diaryCol');

  // Weekly plan page
  if(currentDay===-1){
    var planKey=getWeekKey()+'_plan';
    var plan={}; try{plan=JSON.parse(localStorage.getItem('du_plan_'+currentUser+'_'+planKey)||'{}');}catch(e){}
    var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
    function planBlock(id,title,icon,ph){
      return '<div style="background:#fff;border:1.5px solid var(--mist);border-radius:10px;overflow:hidden">'+
        '<div style="background:var(--navy);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">'+icon+' '+title+'</div>'+
        '<textarea id="pb_'+id+'" onchange="savePlan()" oninput="savePlan()" placeholder="'+ph+'" '+
        'style="width:100%;min-height:150px;padding:12px;border:none;outline:none;font-family:inherit;font-size:13px;resize:vertical;background:#fff;color:var(--ink)">'+
        esc(plan[id]||'')+'</textarea></div>';
    }
    html+=planBlock('prospects','Prospects to call','📞','Who do I want to call this week? Referrals? Follow ups?');
    html+=planBlock('personal','Personal / Family','🏠','Birthdays, appointments, errands...');
    html+=planBlock('goals','Goals & Focus','🎯','What must I achieve this week? My focus?');
    html+=planBlock('notes','General Notes','📝','Ideas, reminders, things to sort out...');
    html+='</div><div style="margin-top:10px;font-size:11px;color:#aaa;font-style:italic">Saves automatically. Resets each new week.</div>';
    col.innerHTML=html;
    return;
  }

  var slots=getSlots(currentUser,currentDay);
  slots.sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });

  // Build hour->slot index map
  var HOURS=['07','08','09','10','11','12','13','14','15','16','17','18'];
  var hourMap={};
  HOURS.forEach(function(h){ hourMap[h]=[]; });
  slots.forEach(function(s,i){
    var h=(s.time||'00').substring(0,2);
    if(!hourMap[h]){ hourMap[h]=[]; if(HOURS.indexOf(h)<0){ HOURS.push(h); HOURS.sort(); } }
    hourMap[h].push(i);
  });

  var html='<div class="time-grid">';
  HOURS.forEach(function(h){
    var idxs=hourMap[h]||[];
    html+='<div class="time-row">';
    html+='<div class="hr-label">'+h+':00</div>';
    html+='<div class="hr-content'+(idxs.length?' has-appt':'')+'" '+(idxs.length?'':'onclick="addSlotAtHour(\''+h+'\')" title="Tap to add"')+' >';
    if(idxs.length===0){
      html+='<span class="empty-hour">+ add</span>';
    } else {
      idxs.forEach(function(i){
        var s=slots[i]; var tc=(s.type||'block').toLowerCase(); var sid='fs'+i; var isOpen=openSlot===sid;
        html+='<div class="appt-block '+tc+'" id="'+sid+'">';
        html+='<div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleSlot(\''+sid+'\')">';
        html+='<span style="font-size:11px;color:#888;min-width:40px">'+(s.time||h+':00')+'</span>';
        html+='<span class="ab-name">'+(s.client?esc(s.client):'<span style="color:#bbb;font-style:italic">tap to fill</span>')+'</span>';
        if(s.type) html+='<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(0,0,0,.06)">'+s.type+'</span>';
        if(s.sold) html+='<span style="color:#166534;font-weight:700;font-size:12px">💰</span>';
        if(s.how==='Teams') html+='<span style="font-size:10px;background:#ede9fe;color:#6d28d9;padding:1px 7px;border-radius:8px">Teams</span>';
        else if(s.how==='Phone') html+='<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 7px;border-radius:8px">📞</span>';
        html+='<button class="slot-btn" style="margin-left:auto;font-size:12px" onclick="event.stopPropagation();deleteFreeSlot(event,'+i+')">🗑</button>';
        html+='</div>';
        if(isOpen){
          html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--mist)">';
          html+='<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:8px">';
          html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888">Time</label>';
          html+='<input id="fs_time_'+i+'" type="time" value="'+(s.time||h+':00')+'" style="border:1.5px solid var(--mist);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;width:120px">';
          html+='</div>';
          html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px">Client / Description</label>';
          html+='<input id="fs_client_'+i+'" type="text" value="'+esc(s.client||s.label||'')+'" placeholder="Johan Smith / Admin / Gym" style="width:100%;border:1.5px solid var(--mist);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;margin-bottom:8px">';
          html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px">Type</label>';
          html+='<div class="type-row" style="margin-bottom:8px">';
          ['NB','FU','REV','Prospect','Block'].forEach(function(tp){
            var act=(s.type||'NB')===tp;
            html+='<button class="type-btn'+(act?' active-'+tp.toLowerCase():'')+'" onclick="setFreeType('+i+',\''+tp+'\')">'+tp+'</button>';
          });
          html+='</div>';
          html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px">How / Where</label>';
          html+='<div class="type-row" style="margin-bottom:8px">';
          ['Address','Teams','Phone'].forEach(function(hw){
            var act=(s.how||'Address')===hw;
            html+='<button class="type-btn'+(act?' active-nb':'')+' " onclick="setSlotHow('+i+',\''+hw+'\')" style="font-size:12px">'+hw+'</button>';
          });
          html+='</div>';
          if((s.how||'Address')==='Teams'){
            html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px">Teams Link</label>';
            html+='<input id="fs_teams_'+i+'" type="text" value="'+esc(s.teams||'')+'" placeholder="https://teams.microsoft.com/..." style="width:100%;border:1.5px solid var(--mist);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;margin-bottom:8px">';
          }
          html+='<label style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;display:block;margin-bottom:4px">Notes</label>';
          html+='<textarea id="fs_notes_'+i+'" placeholder="What happened? Next step?" oninput="autoSaveNotes('+i+',this.value)" style="width:100%;border:1.5px solid var(--mist);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;min-height:100px;margin-bottom:8px">'+(s.notes||'')+'</textarea>';
          html+='<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px;font-size:13px">';
          html+='<input type="checkbox" id="fs_sold_'+i+'" '+(s.sold?'checked':'')+' onchange="setSold('+i+',this.checked)" style="width:16px;height:16px;accent-color:#166534">';
          html+='<span style="font-weight:700;color:#166534">Sale closed 💰</span></label>';
          if(s.sold) html+='<input id="fs_comm_'+i+'" type="number" value="'+(s.commission||'')+'" placeholder="Estimated commission (R)" oninput="autoSaveCommission('+i+',this.value)" style="border:2px solid #166534;border-radius:7px;padding:8px 10px;font-family:inherit;font-size:14px;font-weight:700;width:100%;margin-bottom:8px">';
          if(s.teams) html+='<a class="teams-link" href="'+esc(s.teams)+'" target="_blank">📹 Join Teams Meeting</a>';
          html+='<div class="save-row"><button class="btn b-sage" style="font-size:11px" onclick="saveFreeSlot('+i+')">Save</button>';
          html+='<button class="btn b-ghost" style="font-size:11px;color:var(--ink)" onclick="toggleSlot(\''+sid+'\')">Close</button></div></div>';
        }
        html+='</div>';
      });
    }
    html+='</div></div>';
  });

  html+='</div><button class="add-slot-btn" onclick="addFreeSlot()" style="margin-top:10px">+ Add appointment / block</button>';
  col.innerHTML=html;
}



function renderScoreboard(){
  var sb=document.getElementById('scoreboard');
  var nb=0,fu=0,rev=0,sales=0,prospect=0,commission=0;
  for(var d=0;d<5;d++){
    var slots=getSlots(currentUser,d);
    slots.forEach(function(s){
      if(!s.client) return;
      if(s.type==='NB') nb++;
      else if(s.type==='FU') fu++;
      else if(s.type==='REV') rev++;
      if(s.sold){ sales++; commission+=parseFloat(s.commission)||0; }
      else if(s.type==='Prospect') prospect++;
    });
  }
  var total=nb+fu+rev;
  var apptPct=Math.min(100,Math.round(total/8*100));
  var commPct=Math.min(100,Math.round(commission/75000*100));
  var commCol=commission>=75000?'#86efac':commission>=50000?'var(--gold)':'#93c5fd';
  sb.innerHTML=
    '<div class="sb-title">Appointments this week</div>'+
    '<div class="sb-count">'+total+'<span style="font-size:18px;color:rgba(255,255,255,.5)">/8</span></div>'+
    '<div class="sb-bar" style="margin-bottom:10px"><div class="sb-fill" style="width:'+apptPct+'%"></div></div>'+
    '<div class="sb-breakdown" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;margin-bottom:14px">'+
    '<div class="sb-item"><div class="n" style="color:#86efac">'+nb+'</div><div class="l">NB</div></div>'+
    '<div class="sb-item"><div class="n" style="color:#93c5fd">'+fu+'</div><div class="l">FU</div></div>'+
    '<div class="sb-item"><div class="n" style="color:var(--gold)">'+rev+'</div><div class="l">REV</div></div>'+
    '<div class="sb-item"><div class="n" style="color:#86efac">'+sales+'</div><div class="l">Sales</div></div>'+
    '<div class="sb-item"><div class="n" style="color:#fde68a">'+prospect+'</div><div class="l">Prosp</div></div>'+
    '</div>'+
    '<div style="border-top:1px solid rgba(255,255,255,.15);padding-top:12px">'+
    '<div class="sb-title">Commission target</div>'+
    '<div style="font-size:30px;font-weight:700;color:'+commCol+';margin:4px 0">R '+Math.round(commission).toLocaleString('en-ZA')+'</div>'+
    '<div style="font-size:11px;opacity:.5;margin-bottom:6px">of R\u00a075\u202f000 weekly target</div>'+
    '<div class="sb-bar"><div class="sb-fill" style="width:'+commPct+'%;background:'+commCol+'"></div></div>'+
    '<div style="font-size:11px;opacity:.5;margin-top:4px">'+commPct+'% of target</div>'+
    '</div>';
}


function renderOtherUsers(){
  var container=document.getElementById('otherUsers');
  var DAY_NAMES=['Mon','Tue','Wed','Thu','Fri'];
  var html='';
  USERS.filter(function(u){return u!==currentUser;}).forEach(function(u){
    html+='<div class="other-user">';
    html+='<div class="other-user-head" onclick="toggleOtherUser(\'ou_'+u+'\')">';
    html+='<div style="width:10px;height:10px;border-radius:50%;background:'+USER_COLORS[u]+';flex-shrink:0"></div>';
    html+='<div class="ou-name">'+u+'\'s Week</div>';
    html+='<span style="font-size:11px;color:#888">▼</span>';
    html+='</div>';
    html+='<div class="other-user-body" id="ou_'+u+'">';

    var hasAny=false;
    for(var d=0;d<5;d++){
      var slots=getSlots(u,d);
      var appts=slots.filter(function(s){return s.client&&['NB','FU','REV','Teams'].includes(s.type||'');});
      if(!isAdminDay(d)){
        ['10:30','12:00','13:30','15:00'].forEach(function(t){
          var found=slots.find(function(s){return s.time===t;});
          if(found&&found.client) appts.push(found);
        });
      }
      if(appts.length){
        hasAny=true;
        appts.forEach(function(s){
          html+='<div class="ou-slot">';
          html+='<span class="ou-time">'+DAY_NAMES[d]+' '+s.time+'</span>';
          html+='<span class="ou-name-s">'+esc(s.client)+'</span>';
          if(s.type) html+=' <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:var(--smoke)">'+s.type+'</span>';
          html+='</div>';
        });
      }
    }
    if(!hasAny) html+='<div class="ou-empty">No appointments this week</div>';
    html+='</div></div>';
  });
  container.innerHTML=html;
}

function toggleOtherUser(id){
  var el=document.getElementById(id);
  if(el) el.classList.toggle('open');
}

// ── SLOT ACTIONS ──
function toggleSlot(id){
  openSlot = openSlot===id ? null : id;
  render();
}

function typeTag(type){
  var map={NB:'type-nb',FU:'type-fu',REV:'type-rev',Block:'type-block',Teams:'type-teams'};
  var cls=map[type]||'type-block';
  return '<span class="slot-type '+cls+'">'+type+'</span>';
}

function setStdType(time,type){
  var slots=getSlots(currentUser,currentDay);
  var found=slots.find(function(s){return s.time===time;});
  if(!found){
    found={time:time,type:type,client:'',teams:'',notes:''};
    slots.push(found);
    setSlots(currentUser,currentDay,slots);
  } else {
    found.type=type;
  }
  // Update button states without full re-render
  document.querySelectorAll('#slot_std_'+time.replace(':','_')+' .type-btn').forEach(function(b){
    b.className='type-btn';
    if(b.textContent===type) b.classList.add('active-'+type.toLowerCase());
  });
}

function saveStdSlot(time){
  var tk=time.replace(':','_');
  var client=(document.getElementById('si_client_'+tk)||{value:''}).value.trim();
  var teams=(document.getElementById('si_teams_'+tk)||{value:''}).value.trim();
  var notes=(document.getElementById('si_notes_'+tk)||{value:''}).value.trim();
  var slots=getSlots(currentUser,currentDay);
  var found=slots.find(function(s){return s.time===time;});
  if(!found){
    found={time:time,type:'NB'};
    slots.push(found);
  }
  found.client=client;
  found.teams=teams;
  found.notes=notes;
  setSlots(currentUser,currentDay,slots);
  openSlot=null;
  saveCurrentUser();
  render();
}

function clearStdSlot(e,time){
  e.stopPropagation();
  var slots=getSlots(currentUser,currentDay);
  setSlots(currentUser,currentDay,slots.filter(function(s){return s.time!==time;}));
  saveCurrentUser();
  render();
}

function addSlotAtHour(h){
  var slots=getSlots(currentUser,currentDay);
  slots.push({time:h+':00',client:'',type:'NB',teams:'',notes:'',label:'',sold:false,commission:0});
  setSlots(currentUser,currentDay,slots);
  openSlot='fs'+(slots.length-1);
  render();
}

function addFreeSlot(){
  var slots=getSlots(currentUser,currentDay);
  var now=new Date();
  var h=String(now.getHours()).padStart(2,'0');
  var m=String(now.getMinutes()).padStart(2,'0');
  slots.push({time:h+':'+m,client:'',type:'Block',teams:'',notes:'',label:'New block'});
  setSlots(currentUser,currentDay,slots);
  openSlot='fs'+(slots.length-1);
  render();
}

function saveFreeSlot(i){
  var slots=getSlots(currentUser,currentDay);
  var s=slots[i];
  if(!s) return;
  s.time=(document.getElementById('ft_'+i)||document.getElementById('fs_time_'+i)||{value:s.time}).value;
  s.client=(document.getElementById('fc_'+i)||document.getElementById('fs_client_'+i)||{value:''}).value.trim();
  s.teams=(document.getElementById('ftm_'+i)||document.getElementById('fs_teams_'+i)||{value:''}).value.trim();
  // how is saved immediately via setSlotHow, keep existing value
  s.notes=(document.getElementById('fn_'+i)||document.getElementById('fs_notes_'+i)||{value:''}).value.trim();
  var commEl=document.getElementById('fs_comm_'+i);
  s.commission=commEl?parseFloat(commEl.value)||0:s.commission||0;
  var soldEl=document.getElementById('fs_sold_'+i);
  if(soldEl) s.sold=soldEl.checked;
  setSlots(currentUser,currentDay,slots);
  openSlot=null;
  saveCurrentUser();
  showToast('Saved ✓');
  render();
}

function setSlotHow(i,how){
  var slots=getSlots(currentUser,currentDay);
  if(slots[i]){ slots[i].how=how; setSlots(currentUser,currentDay,slots); }
  openSlot='fs'+i;
  render();
}

function setFreeType(i,type){
  var slots=getSlots(currentUser,currentDay);
  if(slots[i]) slots[i].type=type;
  setSlots(currentUser,currentDay,slots);
  document.querySelectorAll('#fslot_'+i+' .type-btn').forEach(function(b){
    b.className='type-btn';
    if(b.textContent===type) b.classList.add('active-'+type.toLowerCase());
  });
}

function deleteFreeSlot(e,i){
  e.stopPropagation();
  var slots=getSlots(currentUser,currentDay);
  slots.splice(i,1);
  setSlots(currentUser,currentDay,slots);
  openSlot=null;
  saveCurrentUser();
  render();
}

function autoSaveCommission(i, val){
  var slots=getSlots(currentUser,currentDay);
  if(slots[i]){ slots[i].commission=parseFloat(val)||0; setSlots(currentUser,currentDay,slots); saveCurrentUser(); }
}

function autoSaveNotes(i, val){
  var slots=getSlots(currentUser,currentDay);
  if(slots[i]){ slots[i].notes=val; setSlots(currentUser,currentDay,slots); saveCurrentUser(); }
}

function setSold(i, checked){
  var slots=getSlots(currentUser,currentDay);
  if(slots[i]){
    slots[i].sold=checked;
    if(!checked) slots[i].commission=0;
    setSlots(currentUser,currentDay,slots);
    render();
    // Re-open the slot after re-render
    openSlot='fs'+i;
    render();
  }
}

function savePlan(){
  var planKey=getWeekKey()+'_plan';
  var plan={};
  ['prospects','personal','goals','notes'].forEach(function(id){
    var el=document.getElementById('pb_'+id);
    if(el) plan[id]=el.value;
  });
  localStorage.setItem('du_plan_'+currentUser+'_'+planKey, JSON.stringify(plan));
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},1800);
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
setUser(currentUser);
// Set current day to today if it's a weekday
(function(){
  var today=new Date();
  var day=today.getDay();
  if(day>=1&&day<=5) currentDay=day-1;
})();
loadWeek();
</script>
