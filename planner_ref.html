function sbFetch(method, path, body, cb){
  var opts = { method: method, headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'resolution=merge-duplicates' : '' } };
  if(body) opts.body = JSON.stringify(body);
  fetch(SB_URL + path, opts)
    .then(function(r){
      if(!r.ok){ r.text().then(function(t){ console.error('SB error:', r.status, t); if(cb) cb(null, t); }).catch(function(){ if(cb) cb(null, 'HTTP '+r.status); }); return; }
      r.text().then(function(txt){
        if(!txt || !txt.trim()){ if(cb) cb({}); return; }
        try{ var d = JSON.parse(txt); if(cb) cb(d); } catch(e){ if(cb) cb({}); }
      }).catch(function(){ if(cb) cb({}); });
    })
    .catch(function(e){ console.error('SB fetch error:', e); if(cb) cb(null, e.message); });
}

function toast(msg, type){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = (type==='ok'?'✓ ':'⚠ ') + msg;
  t.style.borderLeft = '4px solid ' + (type==='ok'?'var(--sage)':'var(--rose)');
  t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 3000);
}

// ── Save to Supabase + localStorage ──
function savePlanner(){
  collectAll();

  var id = 'planner_' + name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();

  // localStorage immediately

    var idx = JSON.parse(localStorage.getItem('du_planner_index')||'[]');
    if(!idx.find(function(x){return x.id===id;})) idx.unshift({id:id, name:name, saved:now});
    else idx.forEach(function(x){ if(x.id===id) x.saved=now; });
    localStorage.setItem('du_planner_index', JSON.stringify(idx));
  }catch(e){}

  // Supabase

  var _timer = setTimeout(function(){

    toast('Saved locally — server timed out. Will sync next save.','err');

  sbFetch('POST', '/rest/v1/planner?on_conflict=ID', [row], function(res, err){

}

// ── Fetch latest fund data from CRM (Supabase) ──
function fetchFromCRM(){
  collectAll();
  var clientName = (S.client.name||'').trim();
  if(!clientName){ toast('Enter a client name first','err'); return; }

  // Find client by name in Supabase
  toast('Fetching from CRM…','ok');
  sbFetch('GET', '/rest/v1/clients?Name=eq.' + encodeURIComponent(clientName) + '&select=*&limit=1', null, function(clients, err){
    if(err || !clients || !clients.length){ toast('Client not found in CRM','err'); return; }
    var c = clients[0];
    S.clientId = c.ID || '';

    // Calculate age from DOB
    if(c.DOB){
      var p = (c.DOB||'').split('/');
      if(p.length === 3){
        var d = new Date(p[2]+'-'+p[1]+'-'+p[0]);
        if(!isNaN(d)) S.client.age = Math.floor((Date.now()-d)/31557600000);
      }
    }
    S.client.gender = c.Gender || S.client.gender;

    // Fetch active policies
    sbFetch('GET', '/rest/v1/policies?ClientID=eq.' + encodeURIComponent(c.ID) + '&Status=eq.Active&select=*', null, function(pols, err2){
      if(err2 || !pols){ toast('Could not fetch policies','err'); return; }

      // Build LA funds
      var laFunds = [];
      pols.forEach(function(p){
        if(p.Type === 'Living Annuity'){
          laFunds.push({
            desc: (p.Insurer||'') + (p.Product ? ' — '+p.Product : ''),
            balance: parseFloat(p.BenFundValue||'0')||0,
            drawdownPct: parseFloat(p.DrawdownRate||'5')||5,
            incomeEsc: 0,
            growthRate: parseFloat(p.PremGrowthRate||'8')||8,
            eac: parseFloat(p.BenEscalation||'2.5')||2.5
          });
        }
      });

      // Build Life Annuities
      var lifeAnns = [];
      pols.forEach(function(p){
        if(p.Type === 'Life Annuity'){
          lifeAnns.push({
            desc: (p.Insurer||'') + (p.Product ? ' — '+p.Product : ''),
            incomePM: parseFloat(p.BenLifeAnnuityIncome||p.BenLAIncome||'0')||0,
            esc: parseFloat(p.LifeAnnuityEsc||'0')||0
          });
        }
      });

      if(laFunds.length > 0) S.funds = laFunds;
      if(lifeAnns.length > 0) S.lifeAnn = lifeAnns;

      S.results = null;
      render();
      toast('Updated from CRM — ' + laFunds.length + ' LA fund(s), ' + lifeAnns.length + ' life annuit(ies)','ok');
    });
  });
}

// ── Load from Supabase ──
function loadPlanner(id){
  // Try localStorage first
  try{
    var local = JSON.parse(localStorage.getItem('du_planner_' + id)||'null');
    if(local && local.Data){
      var state = JSON.parse(local.Data);
      Object.keys(state).forEach(function(k){ if(k!=='results') S[k] = state[k]; });
      S.results = null;
      render();
      toast('Loaded ' + (S.client.name||id) + ' (local)','ok');
      return;
    }
  }catch(e){}
  // Fall back to Supabase
  sbFetch('GET', '/rest/v1/planner?ID=eq.' + encodeURIComponent(id) + '&select=*', null, function(rows){
    if(!rows || !rows.length){ toast('Not found','err'); return; }
    try{
      var state = JSON.parse(rows[0].Data);
      Object.keys(state).forEach(function(k){ if(k!=='results') S[k] = state[k]; });
      S.results = null;
      render();
      toast('Loaded ' + (S.client.name||id),'ok');
    }catch(e){ toast('Error loading data','err'); }
  });
}

// ── Search saved clients ──

  q = q.toLowerCase();
  // Search localStorage index
  var results = [];
  try{
    var idx = JSON.parse(localStorage.getItem('du_planner_index')||'[]');
    results = idx.filter(function(x){ return (x.name||'').toLowerCase().indexOf(q) > -1; }).slice(0,8);
  }catch(e){}
  if(!results.length){

    sbFetch('GET', '/rest/v1/planner?ClientName=ilike.*' + encodeURIComponent(q) + '*&select=ID,ClientName,LastSaved&limit=8', null, function(rows){
      if(!rows || !rows.length){ drop.innerHTML='<div style="padding:12px;font-size:12px;color:#aaa">No saved plans found</div>'; drop.style.display='block'; return; }

      }).join('');
      drop.style.display='block';
    });

  drop.innerHTML = results.map(function(r){

      +'<div style="font-size:11px;color:#889">Saved: '+(r.saved||'—')+'</div></div>';
  }).join('');
  drop.style.display='block';

// ── Crash recovery — check localStorage on load ──
function checkCrashRecovery(){
  try{
    var idx = JSON.parse(localStorage.getItem('du_planner_index')||'[]');
    if(!idx.length) return;
    var last = idx[0]; // most recent
    var local = JSON.parse(localStorage.getItem('du_planner_' + last.id)||'null');
    if(local && local.Data){
      // Check if saved within last 24 hours
      var savedTime = new Date(local.LastSaved);
      var hoursSince = (Date.now() - savedTime) / 3600000;
      if(hoursSince < 24){
        if(confirm('Recover last session?\n\n' + last.name + '\nSaved: ' + last.saved)){
          var state = JSON.parse(local.Data);
          Object.keys(state).forEach(function(k){ if(k!=='results') S[k] = state[k]; });
          S.results = null;
          render();
          toast('Recovered ' + last.name,'ok');
        }
      }
    }
  }catch(e){}
}

// ══ SA TAX ENGINE — 2026/2027 ═══════════════════════════════
var TAX_BRACKETS = [
  { limit: 245100,  base: 0,       rate: 0.18 },
  { limit: 383100,  base: 44118,   rate: 0.26 },
  { limit: 530200,  base: 79998,   rate: 0.31 },
  { limit: 695800,  base: 125599,  rate: 0.36 },
  { limit: 887000,  base: 185215,  rate: 0.39 },
  { limit: 1878600, base: 259783,  rate: 0.41 },
  { limit: Infinity,base: 666339,  rate: 0.45 }
];
var REBATES = { under65: 17820, age65to74: 27585, age75plus: 30834 };
var INTEREST_EXEMPT = { under65: 23800, age65plus: 34500 };
var MED_CREDITS = { main: 376, dep1: 752, dep2plus: 1006, extra: 254 }; // monthly

function getRebate(age){ return age >= 75 ? REBATES.age75plus : age >= 65 ? REBATES.age65to74 : REBATES.under65; }
function getInterestExempt(age){ return age >= 65 ? INTEREST_EXEMPT.age65plus : INTEREST_EXEMPT.under65; }

function calcTax(grossPA, age, medDeps, interestPA){
  var g = Math.max(0, grossPA);
  // Taxable interest (after exemption)
  var intExempt = getInterestExempt(age);
  var taxableInterest = Math.max(0, (interestPA||0) - intExempt);
  var totalTaxable = g + taxableInterest;
  if(totalTaxable <= 0) return { tax:0, nett: grossPA + (interestPA||0), avgRate:0 };
  var prevLimit = 0, tax = 0;
  for(var i = 0; i < TAX_BRACKETS.length; i++){
    var b = TAX_BRACKETS[i];
    if(totalTaxable <= b.limit){ tax = b.base + (totalTaxable - prevLimit) * b.rate; break; }
    prevLimit = b.limit;
  }
  // Rebate
  tax = Math.max(0, tax - getRebate(age));
  // Medical aid tax credits
  if(medDeps > 0){
    var medCredit = 0;
    if(medDeps === 1) medCredit = MED_CREDITS.main * 12;
    else if(medDeps === 2) medCredit = MED_CREDITS.dep1 * 12;
    else medCredit = MED_CREDITS.dep2plus * 12 + (medDeps - 3) * MED_CREDITS.extra * 12;
    tax = Math.max(0, tax - medCredit);
  }
  var totalGross = grossPA + (interestPA||0);
  var nett = totalGross - tax;
  var avgRate = totalGross > 0 ? tax / totalGross : 0;
  return { tax: Math.round(tax), nett: Math.round(nett), avgRate: Math.round(avgRate * 1000) / 10 };
}

function N(v){ var n = parseFloat(String(v||'0').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function R(v){ if(!v && v!==0) return '—'; var n=Math.round(N(v)); return n===0?'—':'R\u00a0'+n.toLocaleString('en-ZA'); }

// Migrate old flat expenses format → new flexible items format
function migrateExpenses(){
  if(S.expenses && !S.expenses.items){
    var items = [];
    if(N(S.expenses.monthlyPM) > 0 || true){
      items.push({ desc:'Monthly living expenses', amountPM: N(S.expenses.monthlyPM), esc: N(S.expenses.esc)||6 });
    }
    if(N(S.expenses.medAidPM) > 0 || true){
      items.push({ desc:'Medical aid', amountPM: N(S.expenses.medAidPM), esc: N(S.expenses.medAidEsc)||9 });
    }
    S.expenses = { items: items, medDeps: N(S.expenses.medDeps)||1 };
  }
  if(!S.expenses.items) S.expenses.items = [];
}

// ══ CALCULATE ═══════════════════════════════════════════════
function calculate(){
  collectAll();
  var age = N(S.client.age);
  var planTo = N(S.client.planToAge) || 90;
  var cpi = N(S.assumptions.cpi) / 100;
  var years = [];
  var fundLastsToAge = null;

  // Clone fund balances for projection
  var fundBals = S.funds.map(function(f){ return N(f.balance); });
  var fundDDs = S.funds.map(function(f){ return N(f.drawdownPct) / 100; });
  var fundGrs = S.funds.map(function(f){ return N(f.growthRate) / 100; });
  var fundEscs = S.funds.map(function(f){ return N(f.incomeEsc) / 100; });
  // Year 1 LA income per fund = balance * drawdown%
  var fundIncomes = S.funds.map(function(f,i){ return fundBals[i] * fundDDs[i]; });

  var totalFundStart = fundBals.reduce(function(a,b){return a+b;},0);

  // Life annuity starting incomes (annual)
  var lifeAnnIncomes = S.lifeAnn.map(function(a){ return N(a.incomePM) * 12; });
  var lifeAnnEscs = S.lifeAnn.map(function(a){ return N(a.esc) / 100; });

  // Other income (annual)
  var otherIncAmts = S.otherIncome.map(function(o){ return N(o.amountPM) * 12; });
  var otherIncEscs = S.otherIncome.map(function(o){ return N(o.esc) / 100; });
  var otherIncTypes = S.otherIncome.map(function(o){ return o.type||'Other Taxable'; });

  migrateExpenses();
  var expItems = S.expenses.items.map(function(ex){ return N(ex.amountPM) * 12; });
  var expEscs = S.expenses.items.map(function(ex){ return N(ex.esc) / 100; });
  var medDeps = N(S.expenses.medDeps);

  // Pre-compute capital events by age
  if(!S.capitalEvents) S.capitalEvents = [];
  var ceByAge = {};
  S.capitalEvents.forEach(function(ce){
    var a = N(ce.atAge);
    if(!a || N(ce.amount) <= 0) return;
    var yrsTo = Math.max(0, a - age);
    var ceGr = N(ce.growthRate) / 100;
    var amt = N(ce.amount) * Math.pow(1 + ceGr, yrsTo);
    if(!ceByAge[a]) ceByAge[a] = [];
    ceByAge[a].push({ desc: ce.desc, type: ce.type||'Inflow', amount: Math.round(amt), reinvest: ce.reinvest||false });
  });

  // Tax-free percentage of LA drawdown (from non-deductible reinvestments)
  var laTaxFreePct = 0;

  var yr1TotalGross = 0, yr1Nett = 0, yr1AvgRate = 0;

  for(var yr = 0; yr < (planTo - age); yr++){
    var curAge = age + yr;

    // Fund opening balances
    var fundOpen = fundBals.reduce(function(a,b){return a+b;},0);

    // LA income drawn (annual) — capped by fund balance
    var totalLAIncome = 0;
    var totalGrowth = 0;
    S.funds.forEach(function(f,i){
      if(fundBals[i] <= 0){ return; }
      // Enforce drawdown limits (2.5% - 17.5%)
      var ddPct = Math.min(0.175, Math.max(0.025, fundDDs[i]));
      var drawn = yr === 0 ? fundIncomes[i] : Math.min(fundBals[i], fundIncomes[i]);
      if(drawn > fundBals[i]) drawn = fundBals[i];
      totalLAIncome += drawn;
      // Growth on average balance (opening - half the drawdown)
      var avgBal = Math.max(0, fundBals[i] - drawn / 2);
      var growth = avgBal * fundGrs[i];
      totalGrowth += growth;
      fundBals[i] = Math.max(0, fundBals[i] - drawn + growth);
      // Escalate income for next year
      fundIncomes[i] = fundIncomes[i] * (1 + fundEscs[i]);
      // If income exceeds 17.5% of new balance, cap it
      if(fundBals[i] > 0 && fundIncomes[i] > fundBals[i] * 0.175){
        fundIncomes[i] = fundBals[i] * 0.175;
      }
      // If income is less than 2.5% of new balance, floor it
      if(fundBals[i] > 0 && fundIncomes[i] < fundBals[i] * 0.025){
        fundIncomes[i] = fundBals[i] * 0.025;
      }
    });

    // Life annuity income
    var totalLifeAnn = 0;
    S.lifeAnn.forEach(function(a,i){
      totalLifeAnn += lifeAnnIncomes[i];
      lifeAnnIncomes[i] *= (1 + lifeAnnEscs[i]);
    });

    // Other income — split by tax treatment
    var otherTaxable = 0, otherNonTax = 0, otherInterest = 0, otherDividend = 0;
    S.otherIncome.forEach(function(o,i){
      var amt = otherIncAmts[i];
      var tp = otherIncTypes[i];
      if(tp === 'Non-Taxable') otherNonTax += amt;
      else if(tp === 'Interest') otherInterest += amt;
      else if(tp === 'Dividend') otherDividend += amt; // exempt from income tax
      else otherTaxable += amt;
      otherIncAmts[i] *= (1 + otherIncEscs[i]);
    });
    var totalOtherInc = otherTaxable + otherNonTax + otherInterest + otherDividend;

    // Capital events for this age
    var ceInflows = 0, ceOutflows = 0, ceNotes = [];
    if(ceByAge[curAge]){
      ceByAge[curAge].forEach(function(ev){
        if(ev.type === 'Inflow'){
          if(ev.reinvest){
            // Add to first LA fund balance
            var fundTotal = fundBals.reduce(function(a,b){return a+b;},0);
            if(fundBals.length > 0){
              fundBals[0] += ev.amount;
              // Calculate tax-free percentage: injected / new total
              var newTotal = fundBals.reduce(function(a,b){return a+b;},0);
              // Add to cumulative tax-free % (non-deductible portion of new total)
              var additionalTFPct = ev.amount / newTotal;
              laTaxFreePct = laTaxFreePct + (1 - laTaxFreePct) * additionalTFPct;
              ceNotes.push('→ LA (+' + Math.round(laTaxFreePct*100) + '% tax-free)');
            }
            ceInflows += ev.amount;
          } else {
            // One-off non-taxable income — offsets expenses
            ceInflows += ev.amount;
          }
        } else {
          ceOutflows += ev.amount;
        }
      });
    }

    // Total gross income (capital inflows that are NOT reinvested appear as non-taxable income)
    var ceIncomeOnly = 0; // non-reinvested inflows
    if(ceByAge[curAge]){
      ceByAge[curAge].forEach(function(ev){
        if(ev.type === 'Inflow' && !ev.reinvest) ceIncomeOnly += ev.amount;
      });
    }
    var totalGross = totalLAIncome + totalLifeAnn + otherTaxable + otherInterest + otherNonTax + otherDividend + ceIncomeOnly;

    // Tax calculation — LA income (reduced by tax-free %) + Life Ann + other taxable + interest
    var taxableLAIncome = totalLAIncome * (1 - laTaxFreePct);
    var taxableGross = taxableLAIncome + totalLifeAnn + otherTaxable;
    var taxResult = calcTax(taxableGross, curAge, medDeps, otherInterest);
    var tax = taxResult.tax;
    var nett = totalGross - tax;

    // Expenses — sum all items + capital outflows
    var totalExp = expItems.reduce(function(a,b){return a+b;},0) + ceOutflows;

    var surplus = nett - totalExp;
    var fundClose = fundBals.reduce(function(a,b){return a+b;},0);
    var pvFund = fundClose / Math.pow(1 + cpi, yr + 1);

    // Track fund depletion
    if(fundOpen > 0 && fundClose <= 0 && !fundLastsToAge){
      fundLastsToAge = curAge;
    }

    if(yr === 0){
      yr1TotalGross = totalGross;
      yr1Nett = nett;
      yr1AvgRate = taxResult.avgRate;
    }

    years.push({
      age: curAge,
      fundOpening: Math.round(fundOpen),
      growth: Math.round(totalGrowth),
      laIncome: Math.round(totalLAIncome),
      effDrawdown: fundOpen > 0 ? Math.round(totalLAIncome / fundOpen * 1000) / 10 : 0,
      laTaxFreePct: Math.round(laTaxFreePct * 1000) / 10,
      lifeAnnIncome: Math.round(totalLifeAnn),
      otherIncome: Math.round(totalOtherInc),
      capitalEvent: Math.round(ceInflows - ceOutflows),
      ceInflow: Math.round(ceInflows),
      ceOutflow: Math.round(ceOutflows),
      totalGross: Math.round(totalGross),
      tax: Math.round(tax),
      nett: Math.round(nett),
      expenses: Math.round(totalExp),
      surplus: Math.round(surplus),
      fundClosing: Math.round(fundClose),
      pvFund: Math.round(pvFund)
    });

    // Escalate each expense item individually
    for(var ei = 0; ei < expItems.length; ei++){
      expItems[ei] *= (1 + expEscs[ei]);
    }
  }

  autoSaveLocal();
  S.results = {
    years: years,
    totalFundStart: Math.round(totalFundStart),
    totalIncomeYr1: Math.round(yr1TotalGross),
    nettIncomeYr1: Math.round(yr1Nett),
    fundLastsToAge: fundLastsToAge || (fundBals.reduce(function(a,b){return a+b;},0) > 0 ? planTo + '+' : age),
    avgTaxRate: yr1AvgRate
  };

  render();
}

// ══ HELPERS ═════════════════════════════════════════════════
function fld(id, label, val, type, extra){
  var t = (type==='number') ? 'text' : (type||'text');
  var im = (type==='number') ? ' inputmode="decimal"' : '';
  return '<div class="f"><label>'+label+'</label><input id="'+id+'" type="'+t+'"'+im+' value="'+(val!==undefined&&val!==null?val:'')+'" '+(extra||'')+'/></div>';
}
function sel(id, label, opts, val){
  return '<div class="f"><label>'+label+'</label><select id="'+id+'">'+opts.map(function(o){ return '<option'+(o===val?' selected':'')+'>'+o+'</option>'; }).join('')+'</select></div>';
}

function collectAll(){
  S.client.name = v('cl_name');
  S.client.age = N(v('cl_age')) || 65;
  S.client.gender = v('cl_gender');
  S.client.planToAge = N(v('cl_plan')) || 90;
  S.funds.forEach(function(f,i){
    f.desc = v('f_desc_'+i);
    f.balance = N(v('f_bal_'+i));
    f.drawdownPct = N(v('f_dd_'+i));
    f.growthRate = N(v('f_gr_'+i));
    f.incomeEsc = N(v('f_esc_'+i));
  });
  S.lifeAnn.forEach(function(a,i){
    a.desc = v('la_desc_'+i);
    a.incomePM = N(v('la_inc_'+i));
    a.esc = N(v('la_esc_'+i));
  });
  S.otherIncome.forEach(function(o,i){
    o.type = v('oi_type_'+i);
    o.desc = v('oi_desc_'+i);
    o.amountPM = N(v('oi_amt_'+i));
    o.esc = N(v('oi_esc_'+i));
  });
  migrateExpenses();
  S.expenses.items.forEach(function(ex,i){
    ex.desc = v('ex_desc_'+i);
    ex.amountPM = N(v('ex_amt_'+i));
    ex.esc = N(v('ex_esc_'+i));
  });
  S.expenses.medDeps = N(v('ex_meddeps'));
  if(!S.capitalEvents) S.capitalEvents = [];
  S.capitalEvents.forEach(function(ce,i){
    ce.desc = v('ce_desc_'+i);
    ce.type = v('ce_type_'+i);
    ce.atAge = N(v('ce_age_'+i));
    ce.amount = N(v('ce_amt_'+i));
    ce.growthRate = N(v('ce_gr_'+i));
    ce.reinvest = v('ce_reinvest_'+i) === 'Yes';
  });
  S.assumptions.cpi = N(v('as_cpi'));
}

function v(id){ var el=document.getElementById(id); return el?el.value:''; }

function hookInputs(){
  // Update calculated income display on balance/drawdown change — NO full re-render
  S.funds.forEach(function(f,i){
    var balEl = document.getElementById('f_bal_'+i);
    var ddEl = document.getElementById('f_dd_'+i);
    function updateIncome(){
      var bal = N(balEl ? balEl.value : 0);
      var dd = N(ddEl ? ddEl.value : 0);
      var mi = Math.round(bal * dd / 100 / 12);
      var wrap = balEl ? balEl.closest('.row-card') : null;
      if(!wrap) return;
      var disp = wrap.querySelector('.la-income-disp');
      if(!disp && bal > 0){
        disp = document.createElement('div');
        disp.className = 'la-income-disp';
        disp.style.cssText = 'font-size:11px;color:var(--sage);font-weight:700;margin-top:6px';
        wrap.appendChild(disp);
      }
      if(disp){
        if(bal > 0) disp.textContent = 'Calculated income: R\u00a0'+mi.toLocaleString('en-ZA')+' /pm ('+dd+'% of R\u00a0'+Math.round(bal).toLocaleString('en-ZA')+')';
        else disp.textContent = '';
      }
    }
    if(balEl) balEl.addEventListener('input', updateIncome);
    if(ddEl) ddEl.addEventListener('input', updateIncome);
  });
}

// ══ INIT ════════════════════════════════════════════════════
function checkCRMLaunch(){
  try{
    var raw = localStorage.getItem('du_planner_launch');
    if(!raw) return false;
    localStorage.removeItem('du_planner_launch'); // clean up after reading
    var data = JSON.parse(raw);
    if(!data || !data.name) return false;
    S.clientId = data.clientId || '';
    S.client.name = data.name;
    S.client.age = data.age || 65;
    S.client.gender = data.gender || 'Male';
    // Pre-fill LA funds from CRM
    if(data.funds && data.funds.length > 0){
      S.funds = data.funds;
    }
    // Pre-fill Life Annuities from CRM
    if(data.lifeAnn && data.lifeAnn.length > 0){
      S.lifeAnn = data.lifeAnn;
    }
    // Try to load saved projection for this client (other income, expenses, assumptions)
    var id = 'planner_' + data.name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();
    var saved = localStorage.getItem('du_planner_' + id);
    if(saved){
      try{
        var savedState = JSON.parse(JSON.parse(saved).Data);
        // Restore projection-specific data — NOT client/fund data (CRM is fresher)
        if(savedState.otherIncome) S.otherIncome = savedState.otherIncome;
        if(savedState.expenses) S.expenses = savedState.expenses;
        if(savedState.assumptions) S.assumptions = savedState.assumptions;
        if(savedState.client && savedState.client.planToAge) S.client.planToAge = savedState.client.planToAge;
      }catch(e){}
    }
    render();
    toast('Loaded ' + data.name + ' from CRM','ok');
    return true;
  }catch(e){ return false; }
}
(function(){
  var fromCRM = checkCRMLaunch();
  if(!fromCRM){
    render();
    setTimeout(checkCrashRecovery, 500);
  }
})();
