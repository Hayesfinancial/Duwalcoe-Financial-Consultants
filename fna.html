    rbBiz.appendChild(div()); // spacer
    card.appendChild(rbBiz);

    var bizNote = div('info');
    bizNote.style.cssText = 'font-size:11px;padding:6px 10px;margin-top:-4px;background:#eff6ff;border-color:#bfdbfe;color:#1e40af';
    bizNote.innerHTML = '<strong>Buy &amp; Sell</strong> pays to co-shareholder · <strong>Keyman</strong> pays to business · <strong>Contingent Liability</strong> settles business debt. None form part of personal estate.';
    card.appendChild(bizNote);

    // ── Business Benefits — read-only, mirrors personal Benefits section
    // Source of truth is the CRM (p.LumpBenefits, p.IncomeBenefits). To edit
    // benefit detail, capture in the CRM Policy Editor and reload the FNA.
    var bizBenSt = el('div','stitle','Benefits');
    bizBenSt.style.marginTop = '10px';
    card.appendChild(bizBenSt);

    var bizLumpRows = [];
    try { bizLumpRows = p.LumpBenefits ? JSON.parse(p.LumpBenefits) : []; } catch(e) { bizLumpRows = []; }

    // Legacy fallback — old business policies stored cover in single fields
    // (LoanAmount, BenDeath, BenDisability). If no LumpBenefits JSON, build
    // display rows from those so old policies aren't blank in the FNA.
    if (bizLumpRows.length === 0) {
      if (N(p.BenDeath) > 0)        bizLumpRows.push({type:'Life Cover',                   cover:p.BenDeath,        prem:'', premEsc:'', benEsc:''});
      if (N(p.BenDisability) > 0)   bizLumpRows.push({type:'Capital Disability',           cover:p.BenDisability,   prem:'', premEsc:'', benEsc:''});
      if (N(p.BenDreadDisease) > 0) bizLumpRows.push({type:'Dread Disease / Severe Illness',cover:p.BenDreadDisease, prem:'', premEsc:'', benEsc:''});
      // Legacy LoanAmount — only show if no Life Cover row already covers it
      if (N(p.LoanAmount) > 0 && !bizLumpRows.some(function(r){return r.type==='Life Cover';})) {
        bizLumpRows.push({type:'Life Cover', label:'(legacy Loan / Cover)', cover:p.LoanAmount, prem:'', premEsc:'', benEsc:''});
      }
    }

    if (bizLumpRows.length > 0) {
      var bizLumpSt = el('div','','Lump Sum Benefits');
      bizLumpSt.style.cssText = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);display:block;margin-bottom:4px;margin-top:8px';
      card.appendChild(bizLumpSt);

      var bizLumpTbl = document.createElement('table');
      bizLumpTbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px';
      var bizLhdr = document.createElement('tr');
      ['Type / Label','Cover','Premium','Prem Esc %','Ben Esc %'].forEach(function(h){
        var th = document.createElement('th');
        th.textContent = h;
        th.style.cssText = 'text-align:left;font-size:10px;color:var(--sub);font-weight:700;padding:3px 6px;border-bottom:1px solid var(--mist)';
        bizLhdr.appendChild(th);
      });
      bizLumpTbl.appendChild(bizLhdr);

      var bizLtbody = document.createElement('tbody');
      bizLumpRows.forEach(function(r){
        var tr = document.createElement('tr');
        var roCellStyleB = 'padding:4px 6px';
        var roDispStyleB = 'display:inline-block;padding:3px 7px;font-size:12px;color:var(--text);background:#fafaf6;border:1.5px solid var(--mist);border-radius:4px;min-width:50px';
        // Type + label
        var tt1 = document.createElement('td'); tt1.style.padding='4px 6px';
        var tlbl = document.createElement('div');
        tlbl.style.cssText = 'font-weight:600;font-size:12px;color:var(--text)';
        tlbl.textContent = (r.type||'') + (r.label?' — '+r.label:'');
        tt1.appendChild(tlbl); tr.appendChild(tt1);
        // Cover
        var tt2 = document.createElement('td'); tt2.style.cssText = roCellStyleB;
        var cD = document.createElement('span');
        cD.textContent = r.cover ? 'R\u202f'+(parseFloat(String(r.cover).replace(/[^0-9.\-]/g,''))||0).toLocaleString('en-ZA') : '—';
        cD.style.cssText = roDispStyleB;
        tt2.appendChild(cD); tr.appendChild(tt2);
        // Premium
        var tt3 = document.createElement('td'); tt3.style.cssText = roCellStyleB;
        var pD = document.createElement('span');
        pD.textContent = r.prem ? 'R\u202f'+(parseFloat(String(r.prem).replace(/[^0-9.\-]/g,''))||0).toLocaleString('en-ZA') : '—';
        pD.style.cssText = roDispStyleB;
        tt3.appendChild(pD); tr.appendChild(tt3);
        // Prem Esc
        var tt4 = document.createElement('td'); tt4.style.cssText = roCellStyleB;
        var peD = document.createElement('span');
        peD.textContent = r.premEsc ? r.premEsc + (String(r.premEsc).match(/^[0-9.]+$/)?'%':'') : '—';
        peD.style.cssText = roDispStyleB;
        tt4.appendChild(peD); tr.appendChild(tt4);
        // Ben Esc
        var tt5 = document.createElement('td'); tt5.style.cssText = roCellStyleB;
        var beD = document.createElement('span');
        beD.textContent = r.benEsc ? r.benEsc + (String(r.benEsc).match(/^[0-9.]+$/)?'%':'') : '—';
        beD.style.cssText = roDispStyleB;
        tt5.appendChild(beD); tr.appendChild(tt5);
        bizLtbody.appendChild(tr);
      });
      bizLumpTbl.appendChild(bizLtbody);
      card.appendChild(bizLumpTbl);
    } else {
      var noBizLump = div();
      noBizLump.style.cssText = 'font-style:italic;color:#9a9a8a;font-size:12px;padding:8px 6px;margin-top:8px';
      noBizLump.textContent = '— No lump sum benefits on file in CRM —';
      card.appendChild(noBizLump);
    }

    // ── Business Income Benefits — read-only (Momentum Business Income
    // Protection is captured here; sometimes marketed as a form of Keyman cover)
    var bizIpWrap = div();
    bizIpWrap.style.cssText = 'margin-top:8px';
    var bizIpLbl = el('label','','Business Income / Monthly Benefit');
    bizIpLbl.style.cssText = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);display:block;margin-bottom:4px';
    bizIpWrap.appendChild(bizIpLbl);

    var bizIpRows = [];
    try { bizIpRows = p.IncomeBenefits ? JSON.parse(p.IncomeBenefits) : []; } catch(e) { bizIpRows = []; }

    var bizIpTbl = document.createElement('table');
    var bizIpTbody = document.createElement('tbody');
    if (bizIpRows.length === 0) {
      var empTrB = document.createElement('tr');
      var empTdB = document.createElement('td');
      empTdB.colSpan = 3;
      empTdB.textContent = '— No income benefits on file in CRM —';
      empTdB.style.cssText = 'font-style:italic;color:#9a9a8a;font-size:12px;padding:8px 6px';
      empTrB.appendChild(empTdB);
      bizIpTbody.appendChild(empTrB);
    }
    bizIpRows.forEach(function(r){
      var tr = document.createElement('tr');
      var roCellStyleB2 = 'padding:4px 6px';
      var roDispStyleB2 = 'display:inline-block;padding:3px 7px;font-size:12px;color:var(--text);background:#fafaf6;border:1.5px solid var(--mist);border-radius:4px';
      // Type
      var x1 = document.createElement('td'); x1.style.cssText = roCellStyleB2;
      var tDB = document.createElement('span');
      tDB.textContent = r.type || '—';
      tDB.style.cssText = roDispStyleB2 + ';font-weight:600;min-width:140px';
      x1.appendChild(tDB); tr.appendChild(x1);
      // Amount
      var x2 = document.createElement('td'); x2.style.cssText = roCellStyleB2;
      var aD = document.createElement('span');
      aD.textContent = r.amount ? 'R\u202f'+(parseFloat(String(r.amount).replace(/[^0-9.\-]/g,''))||0).toLocaleString('en-ZA') : '—';
      aD.style.cssText = roDispStyleB2;
      x2.appendChild(aD); tr.appendChild(x2);
      // Escalation triple
      var x4 = document.createElement('td'); x4.style.cssText='padding:4px 6px;min-width:240px';
      var eg = div(); eg.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px';
      function mkEscB(label, currentVal){
        var w = div(); w.style.cssText='display:flex;flex-direction:column;gap:2px';
        var lb = el('span','',label); lb.style.cssText='font-size:9px;color:var(--sub);white-space:nowrap';
        var sp = document.createElement('span');
        sp.textContent = (currentVal!=null && currentVal!=='') ? currentVal + (String(currentVal).match(/^[0-9.]+$/)?'%':'') : '—';
        sp.style.cssText = 'display:block;padding:3px 6px;border:1.5px solid var(--mist);border-radius:4px;font-size:11px;background:#fafaf6;box-sizing:border-box;text-align:center';
        w.appendChild(lb); w.appendChild(sp); return w;
      }
      eg.appendChild(mkEscB('Prem Inc%', r.premEsc||r.esc));
      eg.appendChild(mkEscB('Ben Inc%',  r.benEsc));
      eg.appendChild(mkEscB('Claim Inc%', r.claimEsc));
      x4.appendChild(eg); tr.appendChild(x4);
      bizIpTbody.appendChild(tr);
    });
    bizIpTbl.appendChild(bizIpTbody);
    bizIpWrap.appendChild(bizIpTbl);
    card.appendChild(bizIpWrap);
  }

  // ── Life (Guaranteed) Annuity section
  if (isLifeAnn) {
    var laGst = el('div','stitle','Guaranteed Annuity Income');
    laGst.style.marginTop = '10px';
    card.appendChild(laGst);

    var laGRow1 = g3();
    laGRow1.appendChild(roDisp('Monthly Income Guaranteed', p.BenLifeAnnuityIncome ? 'R\u202f'+(parseFloat(String(p.BenLifeAnnuityIncome).replace(/[^0-9.\-]/g,''))||0).toLocaleString('en-ZA') : ''));
    laGRow1.appendChild(roDisp('Annual Income Escalation %', p.LifeAnnuityEsc ? p.LifeAnnuityEsc + '%' : ''));
    laGRow1.appendChild(roDisp('Joint Life % (spouse continuation)', p.LifeAnnuityJointPct ? p.LifeAnnuityJointPct + '%' : ''));
    card.appendChild(laGRow1);

    var laGRow2 = g3();
    laGRow2.appendChild(roDisp('Guaranteed period (years)', p.LifeAnnuityGuarYrs));
    laGRow2.appendChild(div()); // spacer
    laGRow2.appendChild(div()); // spacer
    card.appendChild(laGRow2);

    // Tax treatment — Life Annuity income is always taxable by default. Read-only display.
    var _laGFullyTaxable = p.LifeAnnuityTaxable !== 'No' && p.LifeAnnuityTaxable !== false;
    var laGTaxRow = div(); laGTaxRow.style.cssText = 'margin-top:8px;margin-bottom:4px;font-size:12px;color:var(--text)';
    laGTaxRow.innerHTML = _laGFullyTaxable
      ? '<strong>Tax treatment:</strong> Income is <strong>fully taxable (PAYE)</strong> — annuity income forms part of gross income per SARS.'
      : '<strong>Tax treatment:</strong> <strong>Partially / non-taxable</strong> — own non-deductible contributions; tax-free portion documented in ROA.';
    card.appendChild(laGTaxRow);

    // Estate treatment note
    var laGEstNote = div(); laGEstNote.style.cssText = 'font-size:11px;padding:8px 12px;margin-top:8px;border-radius:6px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af';
    var guarYrs = N(p.LifeAnnuityGuarYrs);
    if(guarYrs > 0){
      laGEstNote.innerHTML = '<strong>Life Annuity with ' + guarYrs + '-year guarantee:</strong> If the life assured dies within the guarantee period, '
        + 'the remaining guaranteed payments are commuted and may form part of the estate. No ongoing fund value after guarantee period. '
        + 'Income is fully taxable. Once-off purchase premium (not recurring).';
    } else {
      laGEstNote.innerHTML = '<strong>Life (Guaranteed) Annuity:</strong> No residual capital on death — income ceases. '
        + 'No fund value, no CGT, no estate duty. '
        + (N(p.LifeAnnuityJointPct) > 0 ? 'Joint life: ' + N(p.LifeAnnuityJointPct) + '% continues to spouse on death. ' : '')
        + 'Income is fully taxable. Once-off purchase premium (not recurring).';
    }
    card.appendChild(laGEstNote);
  }

  // Parse Beneficiaries array (CRM format) on first render to seed BeneficiaryType/Beneficiary
  if (p.Beneficiaries && !p._bensSeeded) {
    try {
      var bensArr = JSON.parse(p.Beneficiaries);
      if (bensArr && bensArr.length > 0) {
        // Use the first (primary) beneficiary to seed the simple fields
        var primaryBen = bensArr[0];
        if (!p.BeneficiaryType && primaryBen.type) p.BeneficiaryType = primaryBen.type;
        if (!p.Beneficiary && primaryBen.name)     p.Beneficiary     = primaryBen.name;
        // Auto-set EstateDutiable from type if not set.
        // Rule: only legally-married Spouse qualifies for s4(q) (EstateDutiable='No').
        // Everything else — Life Partner, Child, Parent, Dependant, Trust, Other,
        // Estate, and the legacy "Third Party" tag — is dutiable. Either deemed
        // property under s3(3) (life policies paid to non-spouse), executor-pathed
        // (Estate), or directly in the estate.
        // NB: this fixes a pre-existing inconsistency where Third Party was set to
        // 'No' here but 'Yes' in the second seed block below.
        if (!p.EstateDutiable) {
          if (isS4qSpouse(p.BeneficiaryType)) p.EstateDutiable = 'No';
          else                                p.EstateDutiable = 'Yes';
        }
        p._bensSeeded = true;
      }
    } catch(e) {}
  }

  var benSt = el('div','stitle','Beneficiary & Estate Routing');
  benSt.style.marginTop = '10px';
  card.appendChild(benSt);

  var btr = div();
  btr.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:10px';

  // Beneficiary name (read-only — CRM is source of truth)
  btr.appendChild(roDisp('Beneficiary Name', p.Beneficiary));

  // BeneficiaryType (read-only display with colour indicator)
  var btDispWrap = div('f');
  btDispWrap.appendChild(el('label','','Beneficiary Type'));
  var btDispBox = document.createElement('div');
  var _btVal = p.BeneficiaryType || '';
  // Palette handles all 8 new types (Spouse, Life Partner, Child, Parent,
  // Dependant, Trust, Estate, Other) plus the legacy "Third Party" tag.
  var _btPal = benTypePalette(_btVal);
  var _btColour = _btPal.fg;
  var _btBg = _btPal.bg;
  if (_btVal) {
    btDispBox.textContent = _btVal;
    btDispBox.style.cssText = 'border:1.5px solid var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-weight:700;background:'+_btBg+';color:'+_btColour+';min-height:20px;line-height:20px';
  } else {
    btDispBox.textContent = '— from CRM —';
    btDispBox.style.cssText = 'border:1.5px dashed var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;background:transparent;color:#9a9a8a;font-style:italic;min-height:20px;line-height:20px';
  }
  btDispWrap.appendChild(btDispBox);
  btr.appendChild(btDispWrap);

  // EstateDutiable (read-only display with colour indicator)
  var edDispWrap = div('f');
  edDispWrap.appendChild(el('label','','Estate Dutiable'));
  var edDispBox = document.createElement('div');
  var edVal = p.EstateDutiable || '';
  var _edColour = edVal === 'Yes' ? '#92400e' : edVal === 'No' ? '#166534' : '#9a9a8a';
  if (edVal) {
    edDispBox.textContent = edVal;
    edDispBox.style.cssText = 'border:1.5px solid var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-weight:700;color:'+_edColour+';background:#fafaf6;min-height:20px;line-height:20px';
  } else {
    edDispBox.textContent = '— from CRM —';
    edDispBox.style.cssText = 'border:1.5px dashed var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;background:transparent;color:#9a9a8a;font-style:italic;min-height:20px;line-height:20px';
  }
  edDispWrap.appendChild(edDispBox);
  btr.appendChild(edDispWrap);
  card.appendChild(btr);

  // ── Beneficiary routing explanation
  var bt = p.BeneficiaryType || '';
  if (bt) {
    var routeInf = div();
    routeInf.style.cssText = 'padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:6px';
    if (bt === 'Spouse') {
      routeInf.style.cssText += ';background:#f0fdf4;color:#166534;border:1px solid #86efac';
      routeInf.innerHTML = '✓ <strong>Section 4(q):</strong> Paid direct to spouse — not dutiable, outside estate. No estate duty on this benefit.';
    } else if (bt === 'Estate') {
      routeInf.style.cssText += ';background:#fff7ed;color:#92400e;border:1px solid #fed7aa';
      routeInf.innerHTML = '⚖ <strong>Routed to Estate:</strong> This benefit forms part of the dutiable estate. Estate duty and executor fees will apply.';
    } else if (bt === 'Trust') {
      routeInf.style.cssText += ';background:#f1f5f9;color:#475569;border:1px solid #cbd5e1';
      routeInf.innerHTML = '→ <strong>Routed to Trust:</strong> Deemed property under s.3(3) — dutiable for estate duty unless the trust nomination meets specific exemptions. Bypasses executor fees. Check trust deed and structure.';
    } else if (bt && bt !== 'Spouse' && bt !== 'Estate') {
      // Life Partner / Child / Parent / Dependant / Other / legacy Third Party
      routeInf.style.cssText += ';background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca';
      var routeLabel = bt === 'Third Party' ? 'Third Party (legacy tag)' : bt;
      routeInf.innerHTML = '→ <strong>Routed to '+routeLabel+':</strong> Paid direct to the named beneficiary, but <strong>deemed property under s.3(3)</strong> of the Estate Duty Act — included in the gross estate and apportioned for duty. No s.4(q) abatement (only legally-married spouse qualifies). Bypasses executor fees.';
    }
    card.appendChild(routeInf);
  }

  return card;
}

// ═══════════════════════════════════════════════════════════
// TAB 7 — ESTATE PLANNING
// ═══════════════════════════════════════════════════════════
function buildEstate() {
  var s = div();
  if(!S.scope.estate){
    var wi=div('info'); wi.textContent='Estate planning not selected in Scope.'; s.appendChild(wi); return s;
  }

  var pols = S.importedPols || [];

  // ── Helper: navy calculation box
  function makeCalcBox(title) {
    var box = div();
    box.style.cssText = 'background:var(--navy);color:#fff;border-radius:9px;padding:18px 20px;margin-bottom:16px';
    var ttl = div();
    ttl.style.cssText = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:12px';
    ttl.textContent = title;
    box.appendChild(ttl);
    var api = {
      box: box,
      row: function(lbl, val, indent, bold, borderTop) {
        var row = div();
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;font-size:13px' +
          (indent ? ';padding-left:18px' : '') +
          (borderTop ? ';border-top:1px solid #334;margin-top:8px;padding-top:10px' : '') +
          (bold ? ';font-weight:700' : '');
        var l = el('span','',lbl); l.style.color = '#ccd6f6';
        var v = el('span','',val); v.style.color = bold ? 'var(--gold)' : '#ccd6f6';
        row.appendChild(l); row.appendChild(v);
        box.appendChild(row);
      },
      sub: function(lbl, val) {
        var row = div();
        row.style.cssText = 'display:flex;justify-content:space-between;padding:2px 0 2px 18px;font-size:11px;color:#8899bb';
        row.innerHTML = '<span>'+lbl+'</span><span>'+val+'</span>';
        box.appendChild(row);
      }
    };
    return api;
  }

  // ── PHYSICAL ASSETS
  s.appendChild(stitle('Assets in Estate'));
  var inf=div('info');
  inf.innerHTML='Only assets that <strong>fall into the estate</strong> are shown. Assets in a trust, CC or with named beneficiaries are excluded from estate duty.';
  s.appendChild(inf);

  var physVal = 0;
  var physLiab = 0;
  var grossEstateItems = [];
  var preDutyLiabilityItems = [];

  // Properties
  if((S.props||[]).length>0||(S.vehicles||[]).length>0||(S.otherAssets||[]).length>0){
    var assetTbl = document.createElement('table');
    assetTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px';
    assetTbl.innerHTML='<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Asset</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Value</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Liability</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Net</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Falls to</th></tr></thead>';
    var tbody = document.createElement('tbody');

    function assetRow(desc, val, liab, benType) {
      var net = N(val) - N(liab);
      var tr = document.createElement('tr');
      tr.innerHTML = '<td style="padding:5px 8px;border-bottom:1px solid var(--mist)">'+esc2(desc)+'</td>'+
        '<td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--mist)">'+Rfmt(val)+'</td>'+
        '<td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--mist);color:var(--sub)">'+
          (N(liab)>0?'('+Rfmt(liab)+')':'—')+'</td>'+
        '<td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--mist);font-weight:600">'+Rfmt(net)+'</td>'+
        '<td style="padding:5px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">'+esc2(benType||'Estate')+'</td>';
      tbody.appendChild(tr);
      physVal += N(val);
      physLiab += N(liab);
      grossEstateItems.push({
        component: desc || 'Asset',
        category: 'Physical asset',
        amount: N(val),
        note: (benType||'Estate')==='Spouse'
          ? 'Included in gross estate; deducted later under s.4(q) if left to spouse.'
          : ((benType||'Estate')==='Estate'
              ? 'Included in gross estate as a physical estate asset.'
              : 'Included in gross estate; routed to '+(benType||'beneficiary')+' for planning context (no s.4(q) deduction).')
      });
      if(N(liab)>0){
        preDutyLiabilityItems.push({
          component: desc || 'Asset',
          category: 'Attached liability',
          amount: N(liab),
          note: 'Deducted before estate duty as debt against the asset.'
        });
      }
    }

    (S.props||[]).forEach(function(p){
      if(N(p.val)>0) assetRow(p.desc||'Property', p.val, p.bond, p.deathBenType||'Estate');
    });
    (S.vehicles||[]).forEach(function(v){
      if(N(v.val)>0) assetRow(v.desc||'Vehicle', v.val, v.finance, v.deathBenType||'Estate');
    });
    (S.otherAssets||[]).forEach(function(a){
      if(N(a.val)>0) assetRow(a.desc||'Asset', a.val, 0, a.deathBenType||'Estate');
    });

    assetTbl.appendChild(tbody);
    s.appendChild(assetTbl);
  }

  var totalDutiableAssets = physVal;

  // ── POLICY ROUTING
  s.appendChild(stitle('Policy Routing'));
  var polInf=div('info');
  polInf.innerHTML='Policies are routed based on the beneficiary type set on each policy card. '+
    '<strong>Spouse</strong> = s.4(q) deduction (not dutiable) · '+
    '<strong>Estate</strong> = dutiable, executor administers · '+
    '<strong>Life Partner / Child / Parent / Dependant / Trust / Other</strong> = deemed property (dutiable, apportioned to beneficiary) · '+
    '<strong>Business Assurance</strong> = outside estate (unless marked dutiable)';
  s.appendChild(polInf);

  var s4qPolicies = 0, estatePols = 0, thirdPartyPols = 0, bizDutiable = 0;
  var s4qAssets = 0;

  // Assets with spouse as beneficiary
  (S.props||[]).forEach(function(p){ if((p.deathBenType||'')==='Spouse') s4qAssets+=N(p.val)-N(p.bond); });
  (S.vehicles||[]).forEach(function(v){ if((v.deathBenType||'')==='Spouse') s4qAssets+=N(v.val)-N(v.finance); });
  (S.otherAssets||[]).forEach(function(a){ if((a.deathBenType||'')==='Spouse') s4qAssets+=N(a.val); });

  var polTbl = document.createElement('table');
  polTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px';
  polTbl.innerHTML='<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Policy</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Beneficiary</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Type</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Amount</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Treatment</th></tr></thead>';
  var polTbody = document.createElement('tbody');

  // Seed BeneficiaryType from Beneficiaries array if not set
  pols.forEach(function(p) {
    if(p.Beneficiaries && !p._bensSeeded){
      try {
        var bens = JSON.parse(p.Beneficiaries);
        if(bens&&bens.length>0){
          if(!p.BeneficiaryType && bens[0].type) p.BeneficiaryType = bens[0].type;
          if(!p.Beneficiary && bens[0].name)     p.Beneficiary     = bens[0].name;
          // Same rule as primary seed: Spouse → No, everything else → Yes.
          if(!p.EstateDutiable){
            if(isS4qSpouse(p.BeneficiaryType)) p.EstateDutiable='No';
            else                               p.EstateDutiable='Yes';
          }
          p._bensSeeded=true;
        }
      } catch(e){}
    }
  });

  function esc2(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function polRow(insurer,product,beneficiary,benType,amount,treatment,colour){
    var tr=document.createElement('tr');
    tr.innerHTML='<td style="padding:5px 8px;border-bottom:1px solid var(--mist)"><strong>'+esc2(insurer)+'</strong>'+(product?'<br><span style="font-size:10px;color:var(--sub)">'+esc2(product)+'</span>':'')+'</td>'+
      '<td style="padding:5px 8px;border-bottom:1px solid var(--mist);font-size:11px">'+esc2(beneficiary||'—')+'</td>'+
      '<td style="padding:5px 8px;border-bottom:1px solid var(--mist);font-size:11px">'+esc2(benType||'—')+'</td>'+
      '<td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--mist);font-weight:600">'+Rfmt(amount)+'</td>'+
      '<td style="padding:5px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:'+colour+'">'+esc2(treatment)+'</td>';
    polTbody.appendChild(tr);
  }

  pols.forEach(function(p){
    var bt = p.BeneficiaryType||'';
    if(p.Type==='Business Assurance'){
      var amt = N(p.LoanAmount)||N(p.BenDeath);
      var treatment, colour;
      if(p.EstateDutiable==='Yes'){
        bizDutiable+=amt;
        grossEstateItems.push({
          component: (p.Insurer||'Policy') + (p.BizType ? ' — ' + p.BizType : ''),
          category: 'Business assurance deemed property',
          amount: amt,
          note: 'Marked estate dutiable, so included as deemed property in the gross estate.'
        });
        treatment='Deemed property — dutiable'; colour='#dc2626';
      } else {
        treatment='Outside estate — '+esc2(p.BizType||'Business assurance'); colour='#6b7280';
      }
      if(amt>0) polRow(p.Insurer,p.Product,p.Beneficiary||p.BizType,p.Type,amt,treatment,colour);
      return;
    }
    var ben = N(p.BenDeath);
    if(!ben) return;
    if(bt==='Spouse'){
      s4qPolicies+=ben;
      grossEstateItems.push({
        component: (p.Insurer||'Policy') + (p.Product ? ' — ' + p.Product : ''),
        category: 'Policy to spouse',
        amount: ben,
        note: 'Included in gross estate, then deducted under s.4(q).'
      });
      polRow(p.Insurer,p.Product,p.Beneficiary||'Spouse','Spouse',ben,'s.4(q) — not dutiable','#16a34a');
    } else if(bt==='Estate'){
      estatePols+=ben;
      grossEstateItems.push({
        component: (p.Insurer||'Policy') + (p.Product ? ' — ' + p.Product : ''),
        category: 'Policy to estate',
        amount: ben,
        note: 'Falls into the estate and is administered by the executor.'
      });
      polRow(p.Insurer,p.Product,'Estate','Estate',ben,'Dutiable — executor administers','#dc2626');
    } else if(isDutiableNonSpouse(bt)){
      // Life Partner, Child, Parent, Dependant, Trust, Other, or the legacy
      // "Third Party" tag — all treated as deemed property for estate duty.
      thirdPartyPols+=ben;
      grossEstateItems.push({
        component: (p.Insurer||'Policy') + (p.Product ? ' — ' + p.Product : ''),
        category: bt+' deemed property',
        amount: ben,
        note: 'Paid direct, but still treated as deemed property for estate duty.'
      });
      polRow(p.Insurer,p.Product,p.Beneficiary||bt,bt,ben,'Deemed property — dutiable','#f59e0b');
    } else {
      polRow(p.Insurer,p.Product,p.Beneficiary||'—',bt||'—',ben,'Set beneficiary type on policy card','#9ca3af');
    }
  });

  polTbl.appendChild(polTbody);
  s.appendChild(polTbl);

  // Beneficiary type display on policies (read-only — CRM is source of truth)
  var benEdBox=div(); benEdBox.style.cssText='background:#f8fafc;border:var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px';
  var benEdTtl=el('div','stitle','Beneficiary Routing'); benEdTtl.style.marginBottom='8px'; benEdBox.appendChild(benEdTtl);
  var benInf2=div(); benInf2.style.cssText='font-size:11px;color:var(--sub);margin-bottom:10px';
  benInf2.textContent='Beneficiary types come from the CRM. To change them, edit the policy in the CRM and click ↻ CRM above.';
  benEdBox.appendChild(benInf2);

  pols.forEach(function(p,i){
    if(p.Type==='Business Assurance') return;
    if(!N(p.BenDeath)) return;
    var row=div(); row.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap';
    var lbl=el('span','',((p.Insurer||'Policy')+(p.Product?' — '+p.Product:''))+' '+Rfmt(p.BenDeath));
    lbl.style.cssText='font-size:12px;min-width:220px';
    row.appendChild(lbl);
    // Beneficiary type — read-only badge
    var btDisp = document.createElement('span');
    var _btV = p.BeneficiaryType || '';
    var _pal2 = benTypePalette(_btV);
    var _btC = _pal2.fg;
    var _btB = _pal2.bg;
    btDisp.textContent = _btV || '— not set —';
    btDisp.style.cssText='display:inline-block;padding:4px 10px;font-size:12px;font-weight:700;border-radius:5px;background:'+_btB+';color:'+_btC+';border:1px solid '+_btC+'33;min-width:110px;text-align:center'+(_btV?'':';font-style:italic');
    row.appendChild(btDisp);
    // Beneficiary name — read-only
    var benDisp = document.createElement('span');
    benDisp.textContent = p.Beneficiary || '— no name —';
    benDisp.style.cssText = 'font-size:12px;color:'+(p.Beneficiary?'var(--text)':'#9a9a8a')+';flex:1;min-width:140px;padding:4px 8px;border-radius:5px;background:#fafaf6;border:1px solid var(--mist)'+(p.Beneficiary?'':';font-style:italic');
    row.appendChild(benDisp);
    benEdBox.appendChild(row);
  });
  s.appendChild(benEdBox);

  // ── ESTATE DUTY CALCULATION
  // CGT on death is a deemed income tax liability — deductible from estate (s.4(a))
  var _estMR = N(S.cli.grossPM)>0 ? calcMarginalRate(N(S.cli.grossPM)*12) : 0.45;
  var _cgtResult = calcTotalCGT(_estMR*100);
  var cgtLiability = _cgtResult.totalCGT;

  var grossEstate    = totalDutiableAssets + estatePols + thirdPartyPols + bizDutiable + s4qPolicies;
  var netEstate      = Math.max(0, grossEstate - physLiab - cgtLiability);

  // Accrual — automated from assets tab data
  var accrualClaim = 0;
  var isANC = (S.cli.marital||'').toLowerCase().indexOf('accrual') > -1;
  s.appendChild(stitle('Accrual Calculation'));
  if(isANC){
    var accrInf=div('info');
    accrInf.innerHTML='ANC with accrual detected. Accrual measures the <strong>growth</strong> of each spouse\'s estate since marriage. '+
      'The spouse whose estate grew less has a claim for <strong>half the difference</strong>. '+
      'Risk policies, retirement fund death benefits paid to a nominated beneficiary, and assets inherited or received as donations during marriage are <strong>excluded</strong>.';
    s.appendChild(accrInf);
    if(!S.accrual) S.accrual={};

    // ── CLIENT'S ACCRUAL ESTATE — auto from assets + RA fund values
    var accrClientItems=[];
    (S.props||[]).forEach(function(p){
      if(N(p.val)>0) accrClientItems.push({desc:p.desc||'Property', val:N(p.val), isLiab:false});
    });
    (S.vehicles||[]).forEach(function(v){
      if(N(v.val)>0) accrClientItems.push({desc:v.desc||'Vehicle', val:N(v.val), isLiab:false});
    });
    (S.otherAssets||[]).forEach(function(a){
      if(N(a.val)>0) accrClientItems.push({desc:a.desc||'Asset', val:N(a.val), isLiab:false});
    });
    // RA / Preservation / Pension / Provident fund values
    var raFundValue = 0;
    pols.forEach(function(p){
      if(POL_RA_TYPES.indexOf(p.Type)>-1 && N(p.BenFundValue)>0){
        accrClientItems.push({desc:(p.Insurer?p.Insurer+' — ':'')+p.Type, val:N(p.BenFundValue), isLiab:false});
        raFundValue += N(p.BenFundValue);
      }
    });
    // Investment policies (endowments, unit trusts, TFS etc.)
    pols.forEach(function(p){
      if(POL_INV_TYPES.indexOf(p.Type)>-1 && N(p.BenFundValue)>0){
        accrClientItems.push({desc:(p.Insurer?p.Insurer+' — ':'')+p.Type, val:N(p.BenFundValue), isLiab:false});
      }
    });
    // Liabilities — bonds, vehicle finance, other debts
    (S.props||[]).forEach(function(p){
      if(N(p.bond)>0) accrClientItems.push({desc:'Bond: '+(p.desc||'Property'), val:N(p.bond), isLiab:true});
    });
    (S.vehicles||[]).forEach(function(v){
      if(N(v.finance)>0) accrClientItems.push({desc:'Finance: '+(v.desc||'Vehicle'), val:N(v.finance), isLiab:true});
    });
    (S.liabilities||[]).forEach(function(l){
      if(N(l.bal)>0) accrClientItems.push({desc:l.desc||'Liability', val:N(l.bal), isLiab:true});
    });
    var clientGrossAssets = accrClientItems.filter(function(x){return !x.isLiab;}).reduce(function(a,x){return a+x.val;},0);
    var clientTotalLiabs = accrClientItems.filter(function(x){return x.isLiab;}).reduce(function(a,x){return a+x.val;},0);
    var clientCurrentTotal = Math.max(0, clientGrossAssets - clientTotalLiabs);

    // Client exclusions (inheritances/donations during marriage)
    var clientExcl = N(S.accrual.clientExclusions)||0;

    // Build client accrual table
    var accrCliTitle=div(); accrCliTitle.style.cssText='font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px';
    accrCliTitle.textContent='Client\'s Accrual Estate'; s.appendChild(accrCliTitle);
    var accrCliTbl=document.createElement('table'); accrCliTbl.className='tbl';
    accrCliTbl.innerHTML='<thead><tr><th style="text-align:left">Asset / Liability</th><th style="text-align:right">Value</th></tr></thead>';
    var accrCliTb=document.createElement('tbody');
    accrClientItems.forEach(function(item){
      var tr=document.createElement('tr');
      if(item.isLiab){
        tr.innerHTML='<td style="font-size:12px;color:#991b1b">Less: '+item.desc+'</td><td style="text-align:right;font-weight:600;font-size:12px;color:#991b1b">('+Rfmt(item.val)+')</td>';
      } else {
        tr.innerHTML='<td style="font-size:12px">'+item.desc+'</td><td style="text-align:right;font-weight:600;font-size:12px">'+Rfmt(item.val)+'</td>';
      }
      accrCliTb.appendChild(tr);
    });
    // Total row
    var trTot=document.createElement('tr'); trTot.style.cssText='background:#f0fdf4;font-weight:700';
    trTot.innerHTML='<td style="font-size:12px;border-top:2px solid var(--navy)">Net current estate</td><td style="text-align:right;font-size:13px;border-top:2px solid var(--navy)">'+Rfmt(clientCurrentTotal)+'</td>';
    accrCliTb.appendChild(trTot);
    accrCliTbl.appendChild(accrCliTb);
    s.appendChild(accrCliTbl);

    // Client inputs — starting value & exclusions
    var accrCliInputs=div(); accrCliInputs.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 6px';
    accrCliInputs.appendChild(rfld('Client estate at marriage (R)', S.accrual, 'clientStartVal', {onblur:function(){render();}}));
    accrCliInputs.appendChild(rfld('Less: inheritances/donations during marriage', S.accrual, 'clientExclusions', {onblur:function(){render();}}));
    s.appendChild(accrCliInputs);

    // ── CPI ADJUSTMENT on commencement values
    // Calculate years from marriage date to today
    var marriageDate = S.cli.domDate ? new Date(S.cli.domDate) : null;
    var cpiRate = N(S.assump.cpi)||6;
    var yearsMarried = 0;
    if(marriageDate && !isNaN(marriageDate.getTime())){
      yearsMarried = Math.max(0, (new Date().getTime() - marriageDate.getTime()) / (365.25*24*60*60*1000));
    }
    // Auto CPI factor = (1 + cpi/100) ^ years
    var autoCpiFactor = yearsMarried > 0 ? Math.pow(1 + cpiRate/100, yearsMarried) : 1;
    // Manual override — if entered, use it instead
    var cpiFactor = N(S.accrual.cpiFactor) > 0 ? N(S.accrual.cpiFactor) : autoCpiFactor;

    var cpiRow = div(); cpiRow.style.cssText='background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin-bottom:16px';
    var cpiInfo = div(); cpiInfo.style.cssText='font-size:11px;color:#1e40af;margin-bottom:8px';
    cpiInfo.innerHTML='<strong>CPI Adjustment:</strong> Commencement values must be adjusted to today\'s rands using CPI (Matrimonial Property Act). '
      +(marriageDate && !isNaN(marriageDate.getTime())
        ? 'Marriage date: <strong>'+marriageDate.toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})+'</strong> · '
          +Math.round(yearsMarried*10)/10+' years · Auto factor at '+cpiRate+'%: <strong>'+Math.round(autoCpiFactor*1000)/1000+'</strong>'
        : 'Enter the marriage date on the Client tab to auto-calculate, or enter a manual CPI factor below.');
    cpiRow.appendChild(cpiInfo);
    var cpiInputs=div(); cpiInputs.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';
    cpiInputs.appendChild(pfld('CPI factor override (leave blank for auto)', S.accrual, 'cpiFactor', {onblur:function(){render();}, placeholder: Math.round(autoCpiFactor*1000)/1000}));
    var cpiUsed=div('f'); cpiUsed.appendChild(el('label','','Factor being used'));
    var cpiDisp=div(); cpiDisp.style.cssText='font-size:14px;font-weight:700;color:#1e40af;padding:8px 10px;background:#fff;border:1.5px solid #bfdbfe;border-radius:6px';
    cpiDisp.textContent=Math.round(cpiFactor*1000)/1000 + '×' + (N(S.accrual.cpiFactor)>0?' (manual override)':' (auto from CPI assumption)');
    cpiUsed.appendChild(cpiDisp); cpiInputs.appendChild(cpiUsed);
    cpiRow.appendChild(cpiInputs);
    s.appendChild(cpiRow);

    // Apply CPI to commencement values
    var clientStartCPI = Math.round(N(S.accrual.clientStartVal) * cpiFactor);
    var spouseStartCPI = Math.round(N(S.accrual.spouseStartVal) * cpiFactor);

    var clientAccrualGrowth = Math.max(0, clientCurrentTotal - clientExcl - clientStartCPI);

    // ── SPOUSE'S ACCRUAL ESTATE — manual (we don't have spouse asset data)
    var spTitle=div(); spTitle.style.cssText='font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px';
    spTitle.textContent='Spouse\'s Accrual Estate'; s.appendChild(spTitle);
    var spInf=div('info'); spInf.style.cssText='font-size:11px;padding:6px 10px;margin-bottom:6px';
    spInf.textContent='Enter the spouse\'s net estate (assets minus liabilities), starting value at marriage, and any exclusions. The CPI factor above is applied to the commencement value automatically.';
    s.appendChild(spInf);
    var accrSpInputs=div(); accrSpInputs.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:8px';
    accrSpInputs.appendChild(rfld('Spouse net estate (R)', S.accrual, 'spouseCurrentAssets', {onblur:function(){render();}}));
    accrSpInputs.appendChild(rfld('Spouse estate at marriage (R)', S.accrual, 'spouseStartVal', {onblur:function(){render();}}));
    accrSpInputs.appendChild(rfld('Less: inheritances/donations', S.accrual, 'spouseExclusions', {onblur:function(){render();}}));
    s.appendChild(accrSpInputs);

    var spouseExcl = N(S.accrual.spouseExclusions)||0;
    var spouseAccrualGrowth = Math.max(0, N(S.accrual.spouseCurrentAssets) - spouseExcl - spouseStartCPI);

    // ── ACCRUAL RESULT
    if(clientAccrualGrowth > spouseAccrualGrowth){
      accrualClaim = (clientAccrualGrowth - spouseAccrualGrowth) / 2;
    }
    var accrBox=div(); accrBox.style.cssText='background:var(--navy);color:#fff;border-radius:9px;padding:16px 18px;margin:12px 0 14px';
    function accrRow(lbl,val,bold,colour){
      var _r=div(); _r.style.cssText='display:flex;justify-content:space-between;padding:'+(bold?'7':'4')+'px 0'+(bold?';border-top:1px solid #334;margin-top:4px':'');
      var _l=el('span','',lbl); _l.style.cssText='color:#ccd6f6;font-size:'+(bold?'13':'12')+'px';
      var _v=el('span','',val); _v.style.cssText='font-size:'+(bold?'14':'12')+'px;font-weight:'+(bold?'700':'400')+';color:'+(colour||'#f0f9d4');
      _r.appendChild(_l); _r.appendChild(_v); accrBox.appendChild(_r);
    }
    accrRow('Client gross assets', Rfmt(clientGrossAssets));
    if(clientTotalLiabs>0) accrRow('Less: liabilities', '('+Rfmt(clientTotalLiabs)+')');
    accrRow('Client net estate', Rfmt(clientCurrentTotal), false);
    if(clientExcl>0) accrRow('Less: inheritances/donations', '('+Rfmt(clientExcl)+')');
    accrRow('Less: commencement (CPI-adjusted)', '('+Rfmt(clientStartCPI)+')'+(N(S.accrual.clientStartVal)?'  ['+Rfmt(N(S.accrual.clientStartVal))+' × '+Math.round(cpiFactor*1000)/1000+']':''));
    accrRow('Client accrual (growth)', Rfmt(clientAccrualGrowth), true);
    accrRow('Spouse net estate', Rfmt(N(S.accrual.spouseCurrentAssets)));
    if(spouseExcl>0) accrRow('Less: inheritances/donations', '('+Rfmt(spouseExcl)+')');
    accrRow('Less: commencement (CPI-adjusted)', '('+Rfmt(spouseStartCPI)+')'+(N(S.accrual.spouseStartVal)?'  ['+Rfmt(N(S.accrual.spouseStartVal))+' × '+Math.round(cpiFactor*1000)/1000+']':''));
    accrRow('Spouse accrual (growth)', Rfmt(spouseAccrualGrowth), true);
    var diff = clientAccrualGrowth - spouseAccrualGrowth;
    accrRow('Difference', Rfmt(Math.abs(diff)), false);
    if(accrualClaim > 0){
      accrRow('Accrual payable to spouse (½ difference)', Rfmt(accrualClaim), true, '#f87171');
      var accrNote2=div(); accrNote2.style.cssText='font-size:10px;color:#667;margin-top:8px;padding-top:6px;border-top:1px solid #334';
      accrNote2.textContent='The client\'s estate grew more than the spouse\'s. Half the difference is payable to the spouse as an accrual claim, deducted before estate duty.';
      accrBox.appendChild(accrNote2);
    } else if(diff < 0){
      accrRow('Accrual claim by client (½ difference)', Rfmt(Math.abs(diff)/2), true, '#86efac');
      var accrNote3=div(); accrNote3.style.cssText='font-size:10px;color:#667;margin-top:8px;padding-top:6px;border-top:1px solid #334';
      accrNote3.textContent='The spouse\'s estate grew more. The client has an accrual claim against the spouse\'s estate — no deduction from this estate.';
      accrBox.appendChild(accrNote3);
    } else {
      accrRow('No accrual payable', '—', true, '#86efac');
    }
    s.appendChild(accrBox);
  } else {
    var noAccrNote=div('info'); noAccrNote.textContent='Not married ANC with accrual — no accrual claim applies.';
    s.appendChild(noAccrNote);
  }

  // s.4(q) and abatement
  var accrualDed  = Math.min(accrualClaim, netEstate);
  var afterAccrual= Math.max(0, netEstate - accrualDed);
  var section4q   = s4qPolicies + s4qAssets;
  var s4qDed      = Math.min(section4q, afterAccrual);
  var afterS4q    = Math.max(0, afterAccrual - s4qDed);
  var dutiable    = Math.max(0, afterS4q - ABATEMENT);
  var estateDuty  = dutiable <= DUTY_THRESH
    ? dutiable * DUTY_RATE1
    : DUTY_THRESH * DUTY_RATE1 + (dutiable - DUTY_THRESH) * DUTY_RATE2;
  var afterAbatement = afterS4q; // apportion against afterS4q — correct s.7 base

  // Apportionment — each category pays proportional share of duty based on afterS4q
  function apportionDuty(val){
    return (afterAbatement>0 && estateDuty>0) ? estateDuty * (val / afterAbatement) : 0;
  }
  var dutyOnPhysical     = apportionDuty(totalDutiableAssets);
  var dutyOnEstatePols   = apportionDuty(estatePols);
  var dutyOnThirdParty   = apportionDuty(thirdPartyPols);
  var dutyOnBizDutiable  = apportionDuty(bizDutiable);
  var dutyPayableByEstate       = dutyOnPhysical + dutyOnEstatePols;
  var dutyPayableByThirdParties = dutyOnThirdParty + dutyOnBizDutiable;

  var bondLiabs = (S.props||[]).reduce(function(a,p){return a+N(p.bond);},0);
  var vehLiabs = (S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0);
  var otherLiabs = (S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
  if(otherLiabs>0){
    preDutyLiabilityItems.push({
      component: 'General liabilities from Assets tab',
      category: 'Other liabilities',
      amount: otherLiabs,
      note: 'Outstanding liabilities captured separately on the Assets tab.'
    });
  }
  var totalLiabsBeforeDuty = physLiab + cgtLiability;

  s.appendChild(stitle('Gross Estate Components'));
  var compInf = div('info');
  compInf.innerHTML = 'This is the full build-up of the <strong>gross estate</strong> inside the Estate tab, so you do not need to go back to Assets to see what is being counted.';
  s.appendChild(compInf);

  var compTbl = document.createElement('table');
  compTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px';
  compTbl.innerHTML='<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Component</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Category</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Amount</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Treatment</th></tr></thead>';
  var compBody = document.createElement('tbody');
  grossEstateItems.forEach(function(it){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td style="padding:6px 8px;border-bottom:1px solid var(--mist)"><strong>'+esc2(it.component)+'</strong></td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">'+esc2(it.category)+'</td>'+
      '<td style="text-align:right;padding:6px 8px;border-bottom:1px solid var(--mist);font-weight:600">'+Rfmt(it.amount)+'</td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">'+esc2(it.note)+'</td>';
    compBody.appendChild(tr);
  });
  var compTot = document.createElement('tr');
  compTot.innerHTML = '<td colspan="2" style="padding:7px 8px;border-top:2px solid var(--navy);font-weight:700">Gross estate total</td>'+
    '<td style="text-align:right;padding:7px 8px;border-top:2px solid var(--navy);font-weight:700;color:var(--navy)">'+Rfmt(grossEstate)+'</td>'+
    '<td style="padding:7px 8px;border-top:2px solid var(--navy);font-size:11px;color:var(--sub)">Total of all included physical assets and deemed-property policy proceeds.</td>';
  compBody.appendChild(compTot);
  compTbl.appendChild(compBody);
  s.appendChild(compTbl);

  s.appendChild(stitle('Liabilities & Pre-Duty Deductions Detail'));
  var dedTbl = document.createElement('table');
  dedTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px';
  dedTbl.innerHTML='<thead><tr><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Deduction</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Category</th><th style="text-align:right;padding:6px 8px;background:var(--navy);color:#fff">Amount</th><th style="text-align:left;padding:6px 8px;background:var(--navy);color:#fff">Treatment</th></tr></thead>';
  var dedBody = document.createElement('tbody');
  preDutyLiabilityItems.forEach(function(it){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td style="padding:6px 8px;border-bottom:1px solid var(--mist)"><strong>'+esc2(it.component)+'</strong></td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">'+esc2(it.category)+'</td>'+
      '<td style="text-align:right;padding:6px 8px;border-bottom:1px solid var(--mist);font-weight:600">('+Rfmt(it.amount)+')</td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">'+esc2(it.note)+'</td>';
    dedBody.appendChild(tr);
  });
  if(cgtLiability>0){
    var trCGT = document.createElement('tr');
    trCGT.innerHTML = '<td style="padding:6px 8px;border-bottom:1px solid var(--mist)"><strong>Capital Gains Tax on death</strong></td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">Tax deduction</td>'+
      '<td style="text-align:right;padding:6px 8px;border-bottom:1px solid var(--mist);font-weight:600">('+Rfmt(cgtLiability)+')</td>'+
      '<td style="padding:6px 8px;border-bottom:1px solid var(--mist);font-size:11px;color:var(--sub)">Deemed income tax liability deducted before estate duty.</td>';
    dedBody.appendChild(trCGT);
  }
  var dedTot = document.createElement('tr');
  dedTot.innerHTML = '<td colspan="2" style="padding:7px 8px;border-top:2px solid var(--navy);font-weight:700">Total liabilities / deductions before duty</td>'+
    '<td style="text-align:right;padding:7px 8px;border-top:2px solid var(--navy);font-weight:700;color:var(--navy)">('+Rfmt(totalLiabsBeforeDuty)+')</td>'+
    '<td style="padding:7px 8px;border-top:2px solid var(--navy);font-size:11px;color:var(--sub)">Used to move from gross estate to net estate before accrual and s.4(q).</td>';
  dedBody.appendChild(dedTot);
  dedTbl.appendChild(dedBody);
  s.appendChild(dedTbl);

  s.appendChild(stitle('Estate Build-Up'));
  var buildBox = makeCalcBox('What Makes Up the Gross Estate');
  buildBox.row('Physical assets in estate', Rfmt(totalDutiableAssets));
  buildBox.sub('Properties + vehicles + other assets before spouse deductions', '');
  if(s4qPolicies>0){ buildBox.row('+ Policies to spouse (s.4(q))', Rfmt(s4qPolicies), true); }
  if(estatePols>0){ buildBox.row('+ Policies to estate', Rfmt(estatePols), true); }
  if(thirdPartyPols>0){ buildBox.row('+ Third party / trust policies (deemed property)', Rfmt(thirdPartyPols), true); }
  if(bizDutiable>0){ buildBox.row('+ Business assurance deemed property', Rfmt(bizDutiable), true); }
  buildBox.row('Gross estate', Rfmt(grossEstate), false, true, true);
  buildBox.sub('Spouse-directed physical assets are already included above and are deducted later under s.4(q)', '');
  s.appendChild(buildBox.box);

  var liabBox = makeCalcBox('Liabilities & Deductions Before Estate Duty');
  if(bondLiabs>0){ liabBox.row('Bond liabilities', '('+Rfmt(bondLiabs)+')'); }
  if(vehLiabs>0){ liabBox.row('Vehicle finance', '('+Rfmt(vehLiabs)+')'); }
  if(otherLiabs>0){ liabBox.row('Other liabilities', '('+Rfmt(otherLiabs)+')'); }
  if(cgtLiability>0){
    liabBox.row('Capital Gains Tax on death', '('+Rfmt(cgtLiability)+')');
    liabBox.sub('Deductible as a tax liability before estate duty is calculated', '');
  }
  liabBox.row('Total liabilities / deductions before duty', '('+Rfmt(totalLiabsBeforeDuty)+')', false, true, true);
  liabBox.row('Net estate before accrual / s.4(q)', Rfmt(netEstate), false, true, true);
  s.appendChild(liabBox.box);

  // ── BOX 1: ESTATE DUTY
  s.appendChild(stitle('Estate Duty'));
  var b1 = makeCalcBox('Estate Duty Calculation');
  b1.row('Gross estate (see build-up above)', Rfmt(grossEstate));
  b1.sub('Use the build-up above to see exactly what sits inside the gross estate', '');
  if(physLiab>0){ b1.row('Less: Liabilities (bonds, finance, loans)', '('+Rfmt(physLiab)+')', true); }
  if(cgtLiability>0){
    b1.row('Less: CGT on death (s.4(a) — deemed income tax)', '('+Rfmt(cgtLiability)+')', true);
    b1.sub('Inclusion rate 40% · Marginal rate '+Math.round(_estMR*100)+'% · Annual exclusion R440,000 applied', '');
  }
  b1.row('Net estate', Rfmt(netEstate), false, false, true);
  if(accrualDed>0){
    b1.row('Less: Accrual claim (ANC)', '('+Rfmt(accrualDed)+')', true);
    b1.sub('Payable to spouse before estate duty is levied', '');
  }
  b1.row('Less: s.4(q) — spouse policies & assets', '('+Rfmt(s4qDed)+')', true);
  b1.sub('Paid direct to spouse — excluded from estate duty', '');
  b1.row('Less: Primary abatement', '('+Rfmt(Math.min(afterS4q, ABATEMENT))+')', true);
  b1.row('Dutiable amount', Rfmt(dutiable), false, false, true);
  b1.row('Estate duty @ 20%'+(dutiable>DUTY_THRESH?' / 25%':''), Rfmt(Math.round(estateDuty)), false, true, true);
  s.appendChild(b1.box);

  // Duty apportionment breakdown
  if(dutyPayableByThirdParties>0){
    var b1b = makeCalcBox('Duty Apportionment (s.7)');
    b1b.row('Total estate duty', Rfmt(Math.round(estateDuty)));
    b1b.sub('Apportioned in proportion to each category\'s share of the dutiable estate','');
    b1b.row('Payable by estate (physical + estate policies)', Rfmt(Math.round(dutyPayableByEstate)), false, false, true);
    if(dutyOnThirdParty>0){
      b1b.row('Payable by third party / trust beneficiaries', Rfmt(Math.round(dutyOnThirdParty)), true);
      pols.forEach(function(p){
        // Anything other than Spouse or Estate counts as "third party" for the
        // s3(3) apportionment purpose — Life Partner, Child, Parent, Dependant,
        // Trust, Other, and the legacy "Third Party" tag.
        if(isDutiableNonSpouse(p.BeneficiaryType||'')&&N(p.BenDeath)>0&&p.Type!=='Business Assurance'){
          b1b.sub((p.Insurer||'Policy')+(p.Product?' \u2014 '+p.Product:'')+' \u00b7 '+Rfmt(p.BenDeath), 'Duty: '+Rfmt(Math.round(apportionDuty(N(p.BenDeath)))));
        }
      });
    }
    if(dutyOnBizDutiable>0){
      b1b.row('Payable by business assurance beneficiary', Rfmt(Math.round(dutyOnBizDutiable)), true);
      pols.forEach(function(p){
        if(p.Type==='Business Assurance'&&p.EstateDutiable==='Yes'){
          var amt=N(p.LoanAmount)||N(p.BenDeath);
          b1b.sub((p.Insurer||'Policy')+(p.BizType?' \u2014 '+p.BizType:''), 'Duty: '+Rfmt(Math.round(apportionDuty(amt))));
        }
      });
    }
    b1b.row('Total duty by third parties', Rfmt(Math.round(dutyPayableByThirdParties)), false, false, true);
    s.appendChild(b1b.box);
  }

  // ── BOX 2: EXECUTOR FEES
  var execFeeBasis = totalDutiableAssets + estatePols;
  var execFees = execFeeBasis * EXEC_RATE;
  s.appendChild(stitle('Executor Fees'));
  var b2 = makeCalcBox('How Executor Fees Are Calculated');
  b2.row('Physical assets in estate', Rfmt(totalDutiableAssets));
  b2.sub('Market value of all assets administered by the executor','');
  if(estatePols>0){
    b2.row('+ Estate-beneficiary policy proceeds', Rfmt(estatePols), true);
    b2.sub('Policies paid into the estate \u2014 executor receives and distributes','');
  }
  b2.row('Executor fee basis', Rfmt(execFeeBasis), false, false, true);
  b2.sub('s.4(q), trust and business assurance proceeds excluded \u2014 not handled by executor','');
  b2.row('\u00d7 Executor fee rate (3.5% + 15% VAT = 4.025%)', '', true);
  b2.row('Executor fees', Rfmt(Math.round(execFees)), false, true, true);
  s.appendChild(b2.box);

  // ── BOX 3: LIQUIDITY
  // Liquid provisions — what the estate can access as cash on day 1
  var liquidCash = (S.otherAssets||[]).reduce(function(sum,a){
    var tp=(a.type||'').toLowerCase();
    var illiquid=tp.indexOf('business')>-1||tp.indexOf('farm')>-1||tp.indexOf('personal')>-1||tp.indexOf('inheritance')>-1;
    return sum + (illiquid?0:N(a.val));
  },0);
  var liqProvisions = estatePols + liquidCash;

  // Cash needs — ALL amounts the estate must pay before beneficiaries receive anything
  var liqBonds   = (S.props||[]).reduce(function(a,p){return a+N(p.bond);},0);
  var liqVehFin  = (S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0);
  var liqOtherL  = (S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
  var liqManual  = (S.deathLiabs||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var liqDuty    = Math.round(dutyPayableByEstate);
  var liqExec    = Math.round(execFees);
  var liqAccrual = Math.round(accrualDed);
  var liqPhysL   = liqBonds + liqVehFin + liqOtherL;
  var liqNeeds   = liqPhysL + liqManual + liqDuty + liqExec + liqAccrual;
  var liqGap     = liqProvisions - liqNeeds;

  s.appendChild(stitle('Liquidity Analysis'));
  var b3 = makeCalcBox('Estate Cash Flow on Day of Death');
  // Provisions
  b3.row('PROVISIONS', '', false, true);
  if(estatePols>0){
    b3.row('Policies paid to estate', Rfmt(estatePols), true);
    b3.sub('Only policies where executor receives the funds — used to fund estate costs','');
  }
  if(liquidCash>0){
    b3.row('Liquid assets (cash / bank / investments)', Rfmt(liquidCash), true);
    b3.sub('Realisable without selling property or business interests','');
  }
  b3.row('Total liquid provisions', Rfmt(liqProvisions), false, false, true);
  // Needs
  b3.row('LESS: CASH REQUIRED', '', false, true);
  if(liqBonds>0)  b3.row('Bond balances outstanding', '− '+Rfmt(liqBonds), true);
  if(liqVehFin>0) b3.row('Vehicle finance outstanding', '− '+Rfmt(liqVehFin), true);
  if(liqOtherL>0) b3.row('Other liabilities', '− '+Rfmt(liqOtherL), true);
  if(liqManual>0){
    (S.deathLiabs||[]).forEach(function(r){
      if(N(r.amt)>0) b3.row(r.desc||'Liability', '− '+Rfmt(r.amt), true);
    });
  }
  if(liqDuty>0)    b3.row('Estate duty (estate\'s share)', '− '+Rfmt(liqDuty), true);
  if(liqExec>0)    b3.row('Executor fees', '− '+Rfmt(liqExec), true);
  if(liqAccrual>0) b3.row('Accrual payable to spouse', '− '+Rfmt(liqAccrual), true);
  b3.row('Total cash required', '− '+Rfmt(liqNeeds), false, false, true);
  b3.row('Liquidity '+(liqGap>=0?'Surplus':'Shortfall'), (liqGap<0?'− ':'')+Rfmt(Math.abs(Math.round(liqGap))), false, true, true);
  s.appendChild(b3.box);

  if(liqGap<0){
    var liqAlert=div('alert');
    liqAlert.innerHTML='⚠ <strong>Liquidity shortfall of '+Rfmt(Math.abs(Math.round(liqGap)))+'.</strong> The estate cannot fund its obligations without selling assets. '
      +(liqDuty>0?'Estate duty: '+Rfmt(liqDuty)+'. ':'')
      +'Consider estate liquidity cover (policy payable to estate) of at least '+Rfmt(Math.abs(Math.round(liqGap)))+'.';
    s.appendChild(liqAlert);
  } else {
    var liqOk=div('info'); liqOk.style.cssText='background:#f0fdf4;border-color:#86efac;color:#166534';
    liqOk.innerHTML='✓ <strong>Estate is liquid.</strong> Liquid provisions cover all outstanding liabilities, estate costs'+(accrualDed>0?' and the accrual claim':'')+'. Surplus: '+Rfmt(liqGap)+'.';
    s.appendChild(liqOk);
  }

  // ── BOX 4: BENEFICIARY OUTCOME
  s.appendChild(stitle('Beneficiary Outcome'));
  var benBox=div(); benBox.style.cssText='background:var(--navy);color:#fff;border-radius:9px;padding:18px 20px;margin-bottom:16px';

  function benRow(lbl,val,note,colour){
    var row=div();
    row.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #223';
    var left=div(); left.style.cssText='display:flex;flex-direction:column;gap:2px';
    var ll=el('span','',lbl); ll.style.cssText='font-size:13px;font-weight:600;color:#ccd6f6';
    left.appendChild(ll);
    if(note){ var ln2=el('span','',note); ln2.style.cssText='font-size:11px;color:#8899bb'; left.appendChild(ln2); }
    var vv=el('span','',val); vv.style.cssText='font-size:14px;font-weight:700;color:'+(colour||'var(--gold)');
    row.appendChild(left); row.appendChild(vv);
    benBox.appendChild(row);
  }

  // Spouse s.4(q) policies
  if(s4qPolicies>0||s4qAssets>0){
    var spouseList=pols.filter(function(p){return(p.BeneficiaryType||'')==='Spouse'&&N(p.BenDeath)>0&&p.Type!=='Business Assurance';});
    var spouseNote=spouseList.map(function(p){return(p.Insurer||'')+(p.Product?' \u2014 '+p.Product:'')+': '+Rfmt(p.BenDeath);}).join(' \u00b7 ');
    benRow((S.cli.spouseName||S.cli.spouse||'Spouse')+' \u2014 Section 4(q)',Rfmt(s4qPolicies+s4qAssets),spouseNote||'Paid direct \u2014 not dutiable','#86efac');
  }

  // Spouse inherits residue option
  var afterSpouse = 0;
  var showResidueOpt = true;
  if(showResidueOpt){
    var residueRow=div(); residueRow.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #223';
    var resCb=document.createElement('input'); resCb.type='checkbox'; resCb.checked=!!S.cli.spouseInheritsResidue;
    resCb.addEventListener('change',function(e){ S.cli.spouseInheritsResidue=e.target.checked; render(); });
    var resLbl=el('span','','Spouse inherits residue of estate (tick to include)');
    resLbl.style.cssText='font-size:12px;color:#8899bb;cursor:pointer';
    residueRow.appendChild(resCb); residueRow.appendChild(resLbl);
    benBox.appendChild(residueRow);

    if(S.cli.spouseInheritsResidue){
      // Residue = what's left after ALL deductions from the estate:
      // Net estate (after liabilities + CGT) − accrual − s.4(q) bequests − estate duty (estate's share) − executor fees
      afterSpouse = Math.max(0, netEstate - Math.round(accrualDed) - Math.round(s4qDed) - Math.round(dutyPayableByEstate) - Math.round(execFees));
      if(afterSpouse>0){
        benRow((S.cli.spouseName||'Spouse')+' \u2014 Residue of estate',Rfmt(afterSpouse),'Net estate after accrual, s.4(q), estate duty and executor fees','#86efac');
      }
    }
  }

  // Estate-beneficiary policies
  if(estatePols>0){
    var estList=pols.filter(function(p){return(p.BeneficiaryType||'')==='Estate'&&N(p.BenDeath)>0;});
    var estNote=estList.map(function(p){return(p.Insurer||'')+(p.Product?' \u2014 '+p.Product:'')+': '+Rfmt(p.BenDeath);}).join(' \u00b7 ');
    benRow('Estate (executor administered)',Rfmt(estatePols),(estNote||'')+' \u2014 funds duty, executor fees, bequests','#fcd34d');
  }

  // Third party policies (any non-Spouse, non-Estate beneficiary — Life Partner,
  // Child, Parent, Dependant, Trust, Other, or the legacy "Third Party" tag).
  pols.forEach(function(p){
    if(isDutiableNonSpouse(p.BeneficiaryType||'')&&N(p.BenDeath)>0&&p.Type!=='Business Assurance'){
      var dutyOwed=Math.round(apportionDuty(N(p.BenDeath)));
      var note=(p.Insurer||'')+(p.Product?' \u2014 '+p.Product:'')+' \u00b7 Deemed property \u00b7 Duty share: '+Rfmt(dutyOwed);
      benRow((p.Beneficiary||'Third party')+' \u2014 '+Rfmt(p.BenDeath)+' (direct)',Rfmt(N(p.BenDeath)-dutyOwed)+' net',note,'#ccd6f6');
    }
  });

  // Business assurance
  pols.forEach(function(p){
    if(p.Type==='Business Assurance'){
      var amt=N(p.LoanAmount)||N(p.BenDeath);
      if(!amt) return;
      var dutyOwed2=p.EstateDutiable==='Yes'?Math.round(apportionDuty(amt)):0;
      var note2=(p.Insurer||'')+(p.BizType?' \u2014 '+p.BizType:'')+(dutyOwed2>0?' \u00b7 Deemed property \u00b7 Duty share: '+Rfmt(dutyOwed2):' \u00b7 Outside estate');
      benRow((p.Beneficiary||'Business')+' \u2014 Business assurance',Rfmt(amt),note2,'#ccd6f6');
    }
  });

  s.appendChild(benBox);

  // ── Notes
  s.appendChild(stitle('Estate Planning Notes'));
  s.appendChild(txfld('Notes / recommendations', S, 'estateNotes'));

  return s;
}



function buildSummary() {
  var s = div();
  var pols = S.importedPols || [];

  var printBtn = document.createElement('button');
  printBtn.textContent = '⎙ Print / Save PDF';
  printBtn.style.cssText = 'float:right;background:var(--navy);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:12px';
  printBtn.onclick = function(){ window.print(); };
  printBtn.className = 'noprint';
  s.appendChild(printBtn);

  function escTxt(v){ return (v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function section(t){
    var d=el('div','stitle',t);
    d.style.cssText='margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:4px';
    s.appendChild(d);
  }
  function note(html,tone){
    var b=div();
    var map={green:'background:#f0fdf4;border:1px solid #bbf7d0;color:#166534',red:'background:#fef2f2;border:1px solid #fecaca;color:#991b1b',blue:'background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8'};
    b.style.cssText='font-size:11px;padding:9px 12px;border-radius:6px;margin-bottom:10px;line-height:1.6;'+(map[tone]||'background:#f8f9fc;border:1px solid var(--mist);color:#444');
    b.innerHTML=html; s.appendChild(b); return b;
  }
  function card(lbl,val,sub,tone){
    var c=div('card');
    c.innerHTML='<div class="lbl">'+escTxt(lbl)+'</div><div class="val '+(tone||'')+'">'+escTxt(val)+'</div><div class="sub">'+(sub||'')+'</div>';
    return c;
  }
  function tinyBox(title){
    var b=div();
    b.style.cssText='background:#fff;border:1.5px solid var(--mist);border-radius:9px;padding:14px 16px;margin-bottom:12px';
    var t=el('div','',title); t.style.cssText='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--navy);margin-bottom:10px';
    b.appendChild(t);
    return b;
  }
  function addLine(box,lbl,val,strong,tone){
    var r=div(); r.style.cssText='display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #eef2f7;font-size:12px';
    var l=el('span','',lbl); l.style.cssText='color:#475569'+(strong?';font-weight:700':'');
    var v=el('span','',val); v.style.cssText='color:'+(tone||'var(--navy)')+(strong?';font-weight:700':'');
    r.appendChild(l); r.appendChild(v); box.appendChild(r);
  }
  function resultTone(gap){ return gap >= 0 ? '#166534' : '#b91c1c'; }
  function resultText(gap){ return (gap >= 0 ? 'Surplus ' : 'Shortfall ') + Rfmt(Math.abs(Math.round(gap))); }

  var cliAge = ageFrom(S.cli.dob);
  var retAge = N(S.cli.retAge) || 65;
  var retEndAge = getRetEndAge();
  var yrsToRet = cliAge ? Math.max(0, retAge - cliAge) : null;
  var yrsInRet = getYearsInRetirement(retAge);
  var mr = N(S.cli.grossPM)>0 ? calcMarginalRate(N(S.cli.grossPM)*12) : 0.45;
  var cgt = calcTotalCGT(mr*100).totalCGT;

  var propsVal = (S.props||[]).reduce(function(a,p){return a+N(p.val);},0);
  var vehVal = (S.vehicles||[]).reduce(function(a,v){return a+N(v.val);},0);
  var otherVal = (S.otherAssets||[]).reduce(function(a,x){return a+N(x.val);},0);
  var physVal = propsVal + vehVal + otherVal;
  var bondLiabs = (S.props||[]).reduce(function(a,p){return a+N(p.bond);},0);
  var vehLiabs = (S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0);
  var otherLiabs = (S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
  var physLiab = bondLiabs + vehLiabs + otherLiabs;
  var netWorth = physVal - physLiab;

  var s4qPols=0, estPols=0, tpPols=0, bizDut=0, s4qAssets=0;
  pols.forEach(function(p){
    if(p.Type==='Business Assurance'){ if(p.EstateDutiable==='Yes') bizDut += N(p.LoanAmount)||N(p.BenDeath); return; }
    var b=N(p.BenDeath); if(!b) return;
    var bt=p.BeneficiaryType||'';
    if(isS4qSpouse(bt)) s4qPols += b;
    else if(bt==='Estate') estPols += b;
    else if(isDutiableNonSpouse(bt)) tpPols += b;
  });
  (S.props||[]).forEach(function(p){ if((p.deathBenType||'Estate')==='Spouse') s4qAssets += N(p.val)-N(p.bond); });
  (S.vehicles||[]).forEach(function(v){ if((v.deathBenType||'Estate')==='Spouse') s4qAssets += N(v.val)-N(v.finance); });
  (S.otherAssets||[]).forEach(function(a){ if((a.deathBenType||'Estate')==='Spouse') s4qAssets += N(a.val); });

  var accrual = 0;
  if((S.cli.marital||'').toLowerCase().indexOf('accrual') > -1){
    var raFV = pols.reduce(function(a,p){ return POL_RA_TYPES.indexOf(p.Type)>-1 ? a + N(p.BenFundValue) : a; },0);
    var invFV_s = pols.reduce(function(a,p){ return POL_INV_TYPES.indexOf(p.Type)>-1 ? a + N(p.BenFundValue) : a; },0);
    var ce = Math.max(0, physVal + raFV + invFV_s - physLiab);
    var se = N(S.accrual&&S.accrual.spouseCurrentAssets);
    var cs = N(S.accrual&&S.accrual.clientStartVal);
    var ss = N(S.accrual&&S.accrual.spouseStartVal);
    var cex_s = N(S.accrual&&S.accrual.clientExclusions);
    var sex_s = N(S.accrual&&S.accrual.spouseExclusions);
    var _mdtS=S.cli.domDate?new Date(S.cli.domDate):null;
    var _ymrS=0; if(_mdtS&&!isNaN(_mdtS.getTime())) _ymrS=Math.max(0,(new Date().getTime()-_mdtS.getTime())/(365.25*24*60*60*1000));
    var _acfS=N(S.accrual&&S.accrual.cpiFactor)>0?N(S.accrual.cpiFactor):(_ymrS>0?Math.pow(1+(N(S.assump.cpi)||6)/100,_ymrS):1);
    accrual = Math.max(0, (Math.max(0,ce-cex_s-Math.round(cs*_acfS)) - Math.max(0,se-sex_s-Math.round(ss*_acfS))) / 2);
  }

  var grossEstate = physVal + s4qPols + estPols + tpPols + bizDut;
  var netEstate = Math.max(0, grossEstate - physLiab - cgt);
  var accrualDed = Math.min(accrual, netEstate);
  var afterAccr = Math.max(0, netEstate - accrualDed);
  var s4qDed = Math.min(s4qPols + s4qAssets, afterAccr);
  var afterS4q = Math.max(0, afterAccr - s4qDed);
  var dutiable = Math.max(0, afterS4q - ABATEMENT);
  var duty = dutiable <= DUTY_THRESH ? dutiable * DUTY_RATE1 : DUTY_THRESH * DUTY_RATE1 + (dutiable - DUTY_THRESH) * DUTY_RATE2;
  var execFees = (physVal + estPols) * EXEC_RATE;
  function apDuty(v){ return (afterS4q>0 && duty>0) ? Math.round(duty * (v / afterS4q)) : 0; }
  var estateDutyShare = apDuty(physVal + estPols);

  var autoLiab = physLiab + cgt;
  if(S.scope.estate){ autoLiab += estateDutyShare + Math.round(execFees) + Math.round(accrualDed); }
  var manLiab = (S.deathLiabs||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var deathIncomeNeed = (S.deathIncome||[]).reduce(function(a,r){return a+calcIncomeNeed(r);},0);
  var deathCapNeed = (S.deathCapital||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var deathNeed = autoLiab + manLiab + deathIncomeNeed + deathCapNeed;
  var deathHave = pols.reduce(function(a,p){ return p.Type!=='Business Assurance' ? a+N(p.BenDeath) : a; },0);
  var deathGap = deathHave - deathNeed;

  var _disAutoAB=0;
  (S.props||[]).forEach(function(p){ if(p.payOffIfDisabled && N(p.bond)>0) _disAutoAB+=N(p.bond); });
  (S.vehicles||[]).forEach(function(v){ if(v.payOffIfDisabled && N(v.finance)>0) _disAutoAB+=N(v.finance); });
  (S.liabilities||[]).forEach(function(l){ if(l.payOffIfDisabled && N(l.bal)>0) _disAutoAB+=N(l.bal); });
  var disNeed = (S.disIncome||[]).reduce(function(a,r){return a+calcIncomeNeed(r);},0) + (S.disCapital||[]).reduce(function(a,r){return a+N(r.amt);},0) + _disAutoAB;
  var disHave = pols.reduce(function(a,p){return a+N(p.BenDisability);},0);
  var disGap = disHave - disNeed;
  var dreadNeed = N(S.dreadAmt);
  var dreadHave = pols.reduce(function(a,p){return a+N(p.BenDreadDisease);},0);
  var dreadGap = dreadHave - dreadNeed;
  var ipNeed = N(S.ipGrossPM) || grossFromNett(S.ipNettPM);
  var ipHave = pols.reduce(function(a,p){
    var ib=[]; try{ ib=JSON.parse(p.IncomeBenefits||'[]'); }catch(e){}
    return a + ib.reduce(function(s2,b){ return s2 + N(b.amount); },0);
  },0);
  var ipGap = ipHave - ipNeed;

  var liquidCash = (S.otherAssets||[]).reduce(function(sum,a){
    var tp=(a.type||'').toLowerCase();
    var illiquid=tp.indexOf('business')>-1||tp.indexOf('farm')>-1||tp.indexOf('personal')>-1||tp.indexOf('inheritance')>-1;
    return sum + (illiquid ? 0 : N(a.val));
  },0);
  var liqProvisions = estPols + liquidCash;
  var liqNeeds = physLiab + manLiab + Math.round(estateDutyShare) + Math.round(execFees) + Math.round(accrualDed);
  var liqGap = liqProvisions - liqNeeds;

  // ── Life Cover Structuring calcs (used by card + Structuring box below) ──
  var spouseIncCap=0, estateIncCap=0;
  var tpByName = {};  // { name -> { incCap: n, polCover: n } }
  (S.deathIncome||[]).forEach(function(r){
    var c = calcIncomeNeed(r); if(!c) return;
    var bt = r.benTo || 'Spouse';
    if(bt==='Spouse') spouseIncCap += c;
    else if(bt==='Estate') estateIncCap += c;
    else {
      // Any non-Spouse, non-Estate type — group by name for per-beneficiary view.
      var nm = (r.benName||'').trim() || 'Unnamed third party';
      if(!tpByName[nm]) tpByName[nm] = {incCap:0, polCover:0};
      tpByName[nm].incCap += c;
    }
  });
  (S.deathCapital||[]).forEach(function(r){
    var amt = N(r.amt); if(!amt) return;
    var bt = r.benTo || 'Spouse';
    if(bt==='Spouse') spouseIncCap += amt;
    else if(bt==='Estate') estateIncCap += amt;
    else {
      // Any non-Spouse, non-Estate type (Life Partner, Child, Parent, Dependant,
      // Trust, Other, legacy Third Party) is grouped by name for the per-beneficiary
      // breakdown below.
      var nm = (r.benName||'').trim() || 'Unnamed third party';
      if(!tpByName[nm]) tpByName[nm] = {incCap:0, polCover:0};
      tpByName[nm].incCap += amt;
    }
  });
  pols.forEach(function(p){
    if(p.Type==='Business Assurance') return;
    if(!isDutiableNonSpouse(p.BeneficiaryType||'')) return;
    var amt = N(p.BenDeath); if(!amt) return;
    var nm = (p.Beneficiary||'').trim() || 'Unnamed third party';
    if(!tpByName[nm]) tpByName[nm] = {incCap:0, polCover:0};
    tpByName[nm].polCover += amt;
  });
  var estPayNeed = physLiab + manLiab + estateIncCap;
  if(S.scope.estate){ estPayNeed += cgt + estateDutyShare + Math.round(execFees) + Math.round(accrualDed); }
  var estPayHave = estPols + liquidCash;
  var estPayGap = Math.max(0, estPayNeed - estPayHave);
  var spouseNeed = spouseIncCap;
  var spouseHave = s4qPols;
  var spouseGap = Math.max(0, spouseNeed - spouseHave);
  var tpTotalGap = 0;
  Object.keys(tpByName).forEach(function(nm){
    tpTotalGap += Math.max(0, tpByName[nm].incCap - tpByName[nm].polCover);
  });
  var newCoverToSell = estPayGap + spouseGap + tpTotalGap;

  var retirementNeed = 0, retirementHave = 0, retirementGap = null;
  var monthlyAtRet = 0, rentalAtRet = 0, otherIncomeAtRet = 0, manualIncomeAtRet = 0, netGapPM = 0, retLumps = 0;
  if(S.scope.retirement && yrsToRet !== null){
    (S.retNeeds||[]).forEach(function(r){
      if(!N(r.amtToday)) return;
      var escTo = Ndef(r.esc, N(S.assump.cpi)||6);
      monthlyAtRet += Math.round(N(r.amtToday) * Math.pow(1 + escTo/100, yrsToRet));
    });
    (S.props||[]).forEach(function(p){
      if(p.soldAtRetirement || !N(p.rental)) return;
      var escTo = Ndef(p.rentalEsc, 6);
      rentalAtRet += Math.round(N(p.rental) * Math.pow(1 + escTo/100, yrsToRet));
    });
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')!=='Generates income (farm/business)' || !N(a.retirementIncomePM)) return;
      var escTo = Ndef(a.retirementIncEsc, N(S.assump.cpi)||6);
      otherIncomeAtRet += Math.round(N(a.retirementIncomePM) * Math.pow(1 + escTo/100, yrsToRet));
    });
    (S.retOtherIncome||[]).forEach(function(r){
      if(!N(r.amtPM)) return;
      var escTo = Ndef(r.escTo, N(S.assump.cpi)||6);
      manualIncomeAtRet += Math.round(N(r.amtPM) * Math.pow(1 + escTo/100, yrsToRet));
    });
    netGapPM = Math.max(0, monthlyAtRet - rentalAtRet - otherIncomeAtRet - manualIncomeAtRet);
    var capNeed = netGapPM > 0 ? capitalise(netGapPM, yrsInRet, N(S.assump.cpi)||6, N(S.assump.retReturn)||8) : 0;
    retLumps = (S.retLumps||[]).reduce(function(a,r){return a+N(r.amt);},0);
    retirementNeed = capNeed + retLumps;
    var _smrCliAge=ageFrom(S.cli.dob)||0;
    retirementHave = (S.retAssets||[]).reduce(function(a,r){
      if(!N(r.currentVal) && !N(r.monthlyContrib)) return a;
      var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
      var ec=Ndef(r.contribEsc, N(S.assump.incEsc)||6);
      var matAge=N(r.maturityAge);
      if(matAge>0&&_smrCliAge&&matAge<retAge && !r.continuePastMaturity){
        var yrsToMat=Math.max(0,matAge-_smrCliAge);
        var matVal=projectFund(r.currentVal,r.monthlyContrib,ec,gr,yrsToMat);
        var yrsMatToRet=retAge-matAge;
        return a+Math.round(matVal*Math.pow(1+gr/100,yrsMatToRet));
      }
      return a + projectFund(r.currentVal, r.monthlyContrib, ec, gr, yrsToRet);
    },0);
    // Manual lump sums at retirement (bitcoin, inheritance, etc.) — each at own growth rate
    (S.retOtherLumps||[]).forEach(function(r){
      if(!N(r.amt)) return;
      var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
      retirementHave += Math.round(N(r.amt) * Math.pow(1+gr/100, yrsToRet));
    });
    (S.props||[]).forEach(function(p){
      if(!p.soldAtRetirement || !N(p.val)) return;
      var gr=Ndef(p.propGrowth, N(S.assump.growth)||9);
      var pct=Ndef(p.retirementPct, 100);
      retirementHave += Math.round(N(p.val) * Math.pow(1+gr/100, yrsToRet) * pct/100);
    });
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')!=='Sold at retirement — proceeds to retirement' || !N(a.retirementSaleProceeds)) return;
      var gr=Ndef(a.growthRate, N(S.assump.growth)||9);
      retirementHave += Math.round(N(a.retirementSaleProceeds) * Math.pow(1+gr/100, yrsToRet));
    });
    retirementGap = retirementHave - retirementNeed;
  }

  var nonTaxable = (S.incRows||[]).slice(1).reduce(function(sum,r){ return sum + (!r._taxable ? N(r.pm) : 0); },0);
  var monthlySurplus = (N(S.cli.nettPM) + nonTaxable) - N(S.expenses);

  s.appendChild(stitle('Advice Board'));
  note('This tab is now a <strong>decision board</strong>, not a second summary of the same numbers. It shows the few outputs that actually matter for advice: key gaps, estate cash risk and retirement capital risk.', 'blue');

  var cards = div('cards');
  cards.appendChild(card('Net worth', Rfmt(netWorth), 'Assets less liabilities', netWorth>=0?'ok':'bad'));
  cards.appendChild(card('Monthly cash flow', (monthlySurplus>=0?'+ ':'− ')+Rfmt(Math.abs(monthlySurplus)), 'Nett income less expenses', monthlySurplus>=0?'ok':'bad'));
  cards.appendChild(card('Estate-payable cover gap', estPayGap>0?'Shortfall '+Rfmt(estPayGap):'Covered', 'New cover needed payable to estate', estPayGap>0?'bad':'ok'));
  cards.appendChild(card('Retirement capital', retirementGap===null?'Not modelled':resultText(retirementGap), retirementGap===null?'Retirement not in scope':'Projected capital vs required capital', retirementGap!==null&&retirementGap>=0?'ok':retirementGap===null?'':'bad'));
  s.appendChild(cards);

  section('Core Advice Gaps');
  var tbl = document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px';
  tbl.innerHTML='<thead><tr>'
    +'<th style="text-align:left;padding:7px 9px;background:var(--navy);color:#fff">Area</th>'
    +'<th style="text-align:right;padding:7px 9px;background:var(--navy);color:#fff">Need</th>'
    +'<th style="text-align:right;padding:7px 9px;background:var(--navy);color:#fff">Current</th>'
    +'<th style="text-align:right;padding:7px 9px;background:var(--navy);color:#fff">Gap</th>'
    +'<th style="text-align:left;padding:7px 9px;background:var(--navy);color:#fff">What is driving it</th>'
    +'</tr></thead>';
  var tbody = document.createElement('tbody');
  function gapRow(label, need, have, driver){
    var gap = have - need;
    var tr = document.createElement('tr');
    tr.innerHTML='<td style="padding:7px 9px;border-bottom:1px solid var(--mist);font-weight:600">'+escTxt(label)+'</td>'
      +'<td style="text-align:right;padding:7px 9px;border-bottom:1px solid var(--mist)">'+(need>0?Rfmt(need):'—')+'</td>'
      +'<td style="text-align:right;padding:7px 9px;border-bottom:1px solid var(--mist)">'+(have>0?Rfmt(have):'—')+'</td>'
      +'<td style="text-align:right;padding:7px 9px;border-bottom:1px solid var(--mist);font-weight:700;color:'+resultTone(gap)+'">'+(need>0?resultText(gap):'—')+'</td>'
      +'<td style="padding:7px 9px;border-bottom:1px solid var(--mist);font-size:11px;color:#64748b">'+driver+'</td>';
    tbody.appendChild(tr);
  }
  if(S.scope.death) gapRow('Life cover', deathNeed, deathHave, 'Combined need: liabilities, family income capital, lump sums'+(S.scope.estate?', estate duty share, executor fees'+(accrualDed>0?' and accrual':''):'')+'.');
  if(S.scope.disability) gapRow('Disability lump sum', disNeed, disHave, 'Income replacement capital plus disability lump sums.');
  if(S.scope.dread) gapRow('Dread disease / trauma', dreadNeed, dreadHave, 'Client-selected trauma capital vs cover on record.');
  if(S.scope.ip) gapRow('Income protection /pm', ipNeed, ipHave, 'Gross monthly income need vs current IP benefits.');
  if(S.scope.retirement && retirementGap !== null) gapRow('Retirement capital', retirementNeed, retirementHave, 'Monthly retirement spending less other retirement income, plus lumpsum goals.');
  tbl.appendChild(tbody); s.appendChild(tbl);

  if(S.scope.estate){
    section('Estate Lens');
    var grid = div(); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';
