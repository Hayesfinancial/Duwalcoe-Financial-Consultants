<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duwalcoe FNA</title>
<style>
:root {
  --navy:    #0e413a;
  --gold:    #a8b938;
  --gold2:   #ccd660;
  --smoke:   #f4f4f0;
  --mist:    #dde0e8;
  --white:   #ffffff;
  --text:    #1a2a2e;
  --sub:     #6b7280;
  --green:   #16a34a;
  --red:     #dc2626;
  --orange:  #d97706;
  --border:  1.5px solid var(--mist);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--smoke); color: var(--text); font-size: 13px; line-height: 1.4; }

/* ── HEADER ── */
.hdr { background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; position: sticky; top: 0; z-index: 200; }

.hdr-client { font-size: 12px; color: #ccd6f6; }
.hdr-actions { display: flex; gap: 6px; }

/* ── TABS ── */
.tabbar { background: var(--navy); display: flex; padding: 0 16px; gap: 2px; border-bottom: 2px solid var(--gold); overflow-x: auto; }
.tabbar::-webkit-scrollbar { height: 0; }
.tab { padding: 7px 11px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #8899bb; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: color .15s; }
.tab:hover { color: #ccd; }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); }

/* ── CONTENT ── */
.content { max-width: 980px; margin: 0 auto; padding: 14px 16px 80px; }

/* ── SECTION TITLES ── */
.stitle { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); padding-bottom: 5px; border-bottom: 1px solid var(--mist); margin: 16px 0 8px; }
.stitle:first-child { margin-top: 0; }

/* ── GRIDS ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.g4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }

/* ── FIELD ── */
.f { display: flex; flex-direction: column; gap: 3px; }
.f label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--sub); }
.f input, .f select, .f textarea {
  border: var(--border); border-radius: 5px; padding: 6px 8px;
  font-family: inherit; font-size: 12px; color: var(--text);
  background: var(--white); transition: border-color .15s;
}
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--gold); }
.f textarea { resize: vertical; min-height: 60px; }
/* Rand prefix */
.rw { position: relative; }
.rw .rp { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 11px; pointer-events: none; }
.rw input { padding-left: 18px; }
/* Percent suffix */
.pw { position: relative; }
.pw .pp { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 11px; pointer-events: none; }
.pw input { padding-right: 20px; }

/* ── RADIO GROUP ── */
.rg { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.rg label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text); }
.rg input[type=radio] { accent-color: var(--gold); width: 13px; height: 13px; }

/* ── CHECKBOXES ── */
.chkgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.chk { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border: var(--border); border-radius: 6px; background: var(--white); cursor: pointer; transition: all .15s; user-select: none; }
.chk:hover { border-color: var(--gold); }
.chk.on { border-color: var(--gold); background: #fdf8ee; font-weight: 600; color: var(--navy); }
.chk input { accent-color: var(--gold); width: 13px; height: 13px; flex-shrink: 0; }

/* ── TABLES ── */
.twrap { overflow-x: auto; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
thead th { background: var(--navy); color: #fff; padding: 5px 7px; text-align: left; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
tbody tr td { padding: 4px 6px; border-bottom: 1px solid #eef0f4; vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafaf8; }
table input, table select {
  border: var(--border); border-radius: 4px; padding: 4px 6px;
  font-family: inherit; font-size: 11px; width: 100%; background: var(--white);
}
table input:focus, table select:focus { outline: none; border-color: var(--gold); }
.td-r { display: flex; align-items: center; }
.td-r .rp { color: var(--sub); font-size: 10px; margin-right: 2px; flex-shrink: 0; }
.td-r input { flex: 1; min-width: 0; }

/* ── BUTTONS ── */
.btn { border: none; border-radius: 5px; padding: 7px 14px; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; }
.btn-gold  { background: var(--gold); color: #fff; }
.btn-gold:hover  { background: #b8942a; }
.btn-navy  { background: var(--navy); color: #fff; }
.btn-navy:hover  { background: #0f1e38; }
.btn-ghost { background: transparent; border: var(--border); color: var(--sub); }
.btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
.btn-sm { padding: 5px 10px; font-size: 10px; }
.btn-add { width: 100%; background: transparent; border: 1.5px dashed var(--mist); color: var(--sub); border-radius: 5px; padding: 5px; font-family: inherit; font-size: 11px; cursor: pointer; margin-top: 4px; transition: all .15s; }
.btn-add:hover { border-color: var(--gold); color: var(--gold); }
.btn-del { background: none; border: none; color: #bbb; font-size: 14px; cursor: pointer; padding: 1px 5px; border-radius: 3px; line-height: 1; }
.btn-del:hover { color: var(--red); background: #fef2f2; }

/* ── INFO / ALERT ── */
.info  { background: #fdf8ee; border: 1.5px solid var(--gold2); border-radius: 6px; padding: 7px 10px; font-size: 11px; color: #7a5f1a; margin-bottom: 10px; }
.alert { background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 6px; padding: 7px 10px; font-size: 11px; color: var(--red); margin-bottom: 10px; }

/* ── SUMMARY CARDS ── */
.cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
.cards.c3 { grid-template-columns: repeat(3,1fr); }
.cards.c2 { grid-template-columns: repeat(2,1fr); }
.card { background: var(--white); border: var(--border); border-radius: 7px; padding: 10px 12px; }
.card .lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--sub); margin-bottom: 2px; }
.card .val { font-size: 17px; font-weight: 700; color: var(--navy); }
.card .val.ok  { color: var(--green); }
.card .val.bad { color: var(--red); }
.card .val.warn { color: var(--orange); }
.card .sub { font-size: 10px; color: var(--sub); margin-top: 1px; }

/* ── GAP ROWS ── */
.gap-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 7px; border: var(--border); background: var(--white); margin-bottom: 6px; }
.gap-row.ok  { border-color: #86efac; background: #f0fdf4; }
.gap-row.bad { border-color: #fca5a5; background: #fef2f2; }
.gap-row .gl { font-size: 12px; font-weight: 700; }
.gap-row .gv { display: flex; gap: 22px; }
.gap-row .gv > div { text-align: right; }
.gap-row .gv .vl { font-size: 9px; text-transform: uppercase; color: var(--sub); }
.gap-row .gv .vn { font-size: 12px; font-weight: 700; }

/* ── TAX BOX ── */
.taxbox { background: var(--white); border: var(--border); border-radius: 6px; padding: 9px 12px; margin-bottom: 10px; }
.taxbox .tr { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
.taxbox .tr.tot { font-weight: 700; border-top: 1px solid var(--mist); margin-top: 4px; padding-top: 4px; }

/* ── CALC RESULT ── */
.calc-result { background: var(--navy); color: #fff; border-radius: 7px; padding: 10px 14px; margin-top: 6px; }
.calc-result .cr-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
.calc-result .cr-row.big { font-size: 14px; font-weight: 700; padding-top: 5px; border-top: 1px solid #334; margin-top: 3px; }
.calc-result .cr-row .gold { color: var(--gold); }

/* ── FOOTER ── */
.footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--navy); padding: 7px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 200; border-top: 2px solid var(--gold); }
.footer-l { font-size: 10px; color: #8899bb; }
.footer-r { display: flex; gap: 6px; }
</style>
</head>

function sbFetch(method,path,body,cb){
  var opts={method:method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'resolution=merge-duplicates':''}};
  if(body) opts.body=JSON.stringify(body);
  fetch(SB_URL+path,opts)
    .then(function(r){if(!r.ok){r.text().then(function(t){console.error('SB:',r.status,t);if(cb)cb(null,t);});return;}

      if(ct.indexOf('json')>=0)r.json().then(function(d){if(cb)cb(d);});
      else r.text().then(function(){if(cb)cb({});});

'use strict';

// ═══════════════════════════════════════════════════════════

// ── Policy type arrays (global)
var POL_RA_TYPES  = ['Retirement Annuity','Pension Fund','Provident Fund','Preservation Fund','Living Annuity'];
var POL_INV_TYPES = ['Tax Free Savings','Investment','Endowment','Offshore Endowment','Flexible Investment','Offshore Flexible Investment','Unit Trust'];

var DUTY_RATE2 = 0.25;

// ── Beneficiary type helpers ─────────────────────────────────────────────
// The CRM uses an expanded 8-type list: Spouse, Life Partner, Child, Parent,
// Dependant, Trust, Estate, Other — plus legacy "Third Party" retained on
// un-retagged policies. These helpers centralise the legal mapping so each
// site of conditional logic doesn't have to enumerate.
//
// s4(q) abatement only applies to a *legally married* Spouse. A Life Partner
// is a factual dependant for s37C purposes but NOT a spouse for s4(q). So
// only "Spouse" returns true here.
function isS4qSpouse(type){
  return type === 'Spouse';
}
// Anything that routes through the deceased estate (executor fees, dutiable
// as estate property). Trust is treated case-by-case — defaults to false here
// because a properly-structured trust nomination is paid outside the estate.
function isEstatePathed(type){
  return type === 'Estate';
}
// Dutiable-but-not-via-estate: a third-party-style nomination where the
// policy proceeds are deemed property of the estate (s3(3) of the Estate
// Duty Act) and the duty is apportioned to the beneficiary. Covers
// Life Partner, Child, Parent, Dependant, Trust, Other, and the legacy
// "Third Party" tag.

function ageFrom(dob) {
  if (!dob) return null;
  var p = dob.split('/');
  if (p.length !== 3) return null;
  var d = new Date(p[2] + '-' + p[1] + '-' + p[0]);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d) / 31557600000);
}

// Parse SA ID number — extracts DOB and Gender. Returns null on invalid input.
// SA ID format: YYMMDDSSSSCAZ (13 digits).
//   YYMMDD — date of birth
//   SSSS   — gender code (0000-4999 female, 5000-9999 male)
//   C      — citizenship (0 SA, 1 permanent resident)
//   A      — usually 8 (legacy), Z — checksum
// Year disambiguation: if YY > current 2-digit year, century = 1900s; else 2000s.
// (In 2026: YY=26 → 2026; YY=27 → 1927.)
function parseSAId(idNumber) {
  var s = String(idNumber || '').replace(/\s+/g, '');
  if (!/^\d{13}$/.test(s)) return null;
  var yy = parseInt(s.substr(0,2), 10);
  var mm = parseInt(s.substr(2,2), 10);
  var dd = parseInt(s.substr(4,2), 10);
  if (mm < 1 || mm > 12) return null;
  if (dd < 1 || dd > 31) return null;
  // Disambiguate century
  var nowYY = new Date().getFullYear() % 100;
  var century = (yy > nowYY) ? 1900 : 2000;
  var year = century + yy;
  // Validate the date is real (handles 31 Feb etc)
  var probe = new Date(year, mm - 1, dd);
  if (probe.getFullYear() !== year || probe.getMonth() !== (mm - 1) || probe.getDate() !== dd) return null;
  // Format DOB as DD/MM/YYYY (FNA's display format)
  var dobStr = ('0'+dd).slice(-2) + '/' + ('0'+mm).slice(-2) + '/' + year;
  // Gender: digits 7-10 form a 4-digit number; 0-4999 = female, 5000-9999 = male
  var genderCode = parseInt(s.substr(6,4), 10);
  var gender = (genderCode < 5000) ? 'Female' : 'Male';
  return { dob: dobStr, gender: gender, year: year };
}

// ── TAX TABLES 2026/2027 ──────────────────────────────────
// Returns gross monthly amount needed to yield nettPM nett
// Uses iterative approach: start with gross = nett / (1 - est rate), refine
var TAX_BRACKETS = [
  { limit: 245100,  base: 0,       rate: 0.18 },
  { limit: 383100,  base: 44118,   rate: 0.26 },
  { limit: 530200,  base: 79998,   rate: 0.31 },
  { limit: 695800,  base: 125599,  rate: 0.36 },
  { limit: 887000,  base: 185215,  rate: 0.39 },
  { limit: 1878600, base: 259783,  rate: 0.41 },
  { limit: Infinity,base: 666339,  rate: 0.45 }
];
var PRIMARY_REBATE = 17820;
var SECONDARY_REBATE = 9765; // 65+ (total R27,585 less primary R17,820)
var UIF_RATE = 0.01;
var UIF_MAX_ANNUAL = 2125;

function calcTaxPA(grossPA) {
  var g = N(grossPA);
  var prevLimit = 0;
  var tax = 0;
  for (var i = 0; i < TAX_BRACKETS.length; i++) {
    var b = TAX_BRACKETS[i];
    if (g <= b.limit) {
      tax = b.base + (g - prevLimit) * b.rate;
      break;
    }
    prevLimit = b.limit;
  }
  return Math.max(0, tax - PRIMARY_REBATE);
}

function calcMarginalRate(grossPA) {
  var g = N(grossPA);
  for (var i = 0; i < TAX_BRACKETS.length; i++) {
    if (g <= TAX_BRACKETS[i].limit) return TAX_BRACKETS[i].rate;
  }
  return TAX_BRACKETS[TAX_BRACKETS.length - 1].rate;
}

// Full breakdown: salary (subject to UIF) + other taxable income (rental etc — PAYE but no UIF)
function taxBreakdownFull(salaryGrossPM, otherTaxablePM) {
  var sal   = N(salaryGrossPM);
  var other = N(otherTaxablePM);
  var totalGrossPM = sal + other;
  if (totalGrossPM <= 0) return null;
  var totalGrossPA = totalGrossPM * 12;
  var taxPA = calcTaxPA(totalGrossPA);
  var uifPA = Math.min(sal * 12 * UIF_RATE, UIF_MAX_ANNUAL); // UIF on salary portion only
  var taxPM = Math.round(taxPA / 12);
  var uifPM = Math.round(uifPA / 12);
  return {
    salaryGrossPM:  sal,
    otherTaxablePM: other,
    totalGrossPM:   totalGrossPM,
    taxPM:          taxPM,
    uifPM:          uifPM,
    nettPM:         Math.round(totalGrossPM - taxPM - uifPM),
    marginalRate:   calcMarginalRate(totalGrossPA)
  };
}

// Legacy single-arg wrapper for callers that only have salary gross
function taxBreakdown(grossPM) {
  return taxBreakdownFull(N(grossPM), 0);
}

function grossFromNett(nettPM) {
  // Find gross monthly that yields nettPM after PAYE and UIF
  // Iterate: guess gross, compute nett, adjust
  var nett = N(nettPM);
  if (nett <= 0) return 0;
  var gross = nett / 0.72; // initial guess
  for (var i = 0; i < 20; i++) {
    var taxPA = calcTaxPA(gross * 12);
    var uifPA = Math.min(gross * 12 * UIF_RATE, UIF_MAX_ANNUAL);
    var nettCalc = gross - taxPA / 12 - uifPA / 12;
    var diff = nett - nettCalc;
    if (Math.abs(diff) < 1) break;
    gross += diff * 0.7;
  }
  return Math.round(gross);
}

// ── CAPITALISATION ────────────────────────────────────────
// Present value of a growing annuity (annual payments, beginning of year)
// grossMonthly: gross monthly amount (already tax-grossed-up)
// years: term in years
// escalation: annual escalation rate (decimal)
// drawdown: drawdown / return rate (decimal)
// Returns: capital lump sum needed today
function capitalise(grossMonthly, years, escalation, drawdown) {
  var pmt = N(grossMonthly) * 12; // annual
  var n = N(years);
  var g = pct(escalation);
  var r = pct(drawdown);
  if (pmt <= 0 || n <= 0) return 0;
  if (Math.abs(r - g) < 0.0001) {
    // Edge case: r ≈ g
    return pmt * n / (1 + r);
  }
  // PV of growing annuity (beginning of period)
  var pv = pmt * (1 - Math.pow((1 + g) / (1 + r), n)) / (r - g);
  return Math.round(pv);
}

// Confirm: monthly income the capital produces
// cap: capital amount, years: term, escalation, drawdown
function monthlyFromCapital(cap, years, escalation, drawdown) {
  var n = N(years);
  var g = pct(escalation);
  var r = pct(drawdown);
  var C = N(cap);
  if (C <= 0 || n <= 0) return 0;
  if (Math.abs(r - g) < 0.0001) return Math.round(C * (1 + r) / n / 12);
  var annual = C * (r - g) / (1 - Math.pow((1 + g) / (1 + r), n));
  return Math.round(annual / 12);
}

// ── RETIREMENT PROJECTION ─────────────────────────────────
// Grow a fund with contributions from now to retirement
// currentVal, monthlyContrib, annualEscalation, growthRate, years
function projectFund(currentVal, monthlyContrib, escalation, growth, years) {
  var pv = N(currentVal);
  var pmt = N(monthlyContrib);
  var g = pct(escalation);
  var r = pct(growth);
  var n = N(years);
  if (n <= 0) return pv;
  // Grow existing fund
  var fvExisting = pv * Math.pow(1 + r, n);
  if (pmt <= 0) return Math.round(fvExisting);
  // Future value of growing annuity of contributions (annual, beginning of year)
  var annualPmt = pmt * 12;
  var fvContribs;
  if (Math.abs(r - g) < 0.0001) {
    fvContribs = annualPmt * n * Math.pow(1 + r, n / 2);
  } else {
    fvContribs = annualPmt * (Math.pow(1 + r, n) - Math.pow(1 + g, n)) / (r - g);
  }
  return Math.round(fvExisting + fvContribs);
}

// Capital needed to fund income in retirement
// monthlyIncome: income needed in first year of retirement (today's rands, will inflate to retirement)
// yearsToRet: inflation-adjust the income to retirement date
// yearsInRet: how many years capital must last
// cpi: inflation rate
// returnRate: return on capital in retirement
function retirementCapitalNeeded(monthlyIncomeToday, yearsToRet, yearsInRet, cpiToRet, returnRate, escInRet) {
  if (N(monthlyIncomeToday) <= 0 || N(yearsInRet) <= 0) return 0;
  // Inflate to retirement date using escalation-to-retirement rate
  var incomeAtRet = N(monthlyIncomeToday) * Math.pow(1 + pct(cpiToRet), N(yearsToRet));
  // Capitalise in retirement using escInRet (separate from cpiToRet)
  // If escInRet not provided, default to cpiToRet (backward compatible)
  var inRetEsc = (escInRet !== undefined && escInRet !== null && escInRet !== '') ? N(escInRet) : N(cpiToRet);
  return capitalise(incomeAtRet, N(yearsInRet), inRetEsc, N(returnRate));
}

// ── CGT ON DEATH (SA Eighth Schedule) ────────────────────
// SA rules: deemed disposal at market value on death
// Inclusion rate: 40% for individuals
// Year-of-death annual exclusion: R440,000
// Primary residence exclusion: first R3,000,000 of gain
// Spouse beneficiary: rollover — no CGT on death
// Returns { gain, includedGain, cgt } for a single asset
// marginalRate: client's marginal income tax rate (decimal)
// primaryResidence: boolean — apply R3m exclusion
// Applied against shared R440k annual exclusion externally
var CGT_INCLUSION   = 0.40;
var CGT_ANNUAL_EXCL = 440000;  // year of death
var CGT_PRIMARY_RES = 3000000; // primary residence gain exclusion

function calcCGTAsset(marketVal, baseCost, primaryResidence) {
  var mv   = N(marketVal);
  var bc   = N(baseCost);
  if (mv <= 0 || bc <= 0) return { gain: 0, gainAfterExcl: 0 };
  var gain = Math.max(0, mv - bc);
  if (primaryResidence) gain = Math.max(0, gain - CGT_PRIMARY_RES);
  return { gain: Math.max(0, mv - bc), gainAfterExcl: gain };
}

// Total CGT liability across all assets on death
// Returns array of { desc, gain, gainAfterPR, includedGain, cgt }
// and totalCGT after applying shared annual exclusion
function calcTotalCGT(marginalRate) {
  var items = [];
  var totalGainAfterPR = 0;

  // Properties — only if NOT going to spouse (spouse = rollover)
  (S.props||[]).forEach(function(p) {
    if (!N(p.val) || !N(p.baseCost)) return;
    if ((p.deathBenType||'Estate') === 'Spouse') return; // rollover
    var r = calcCGTAsset(p.val, p.baseCost, !!p.primaryResidence);
    if (r.gainAfterExcl > 0) {
      items.push({ desc: p.desc||'Property', gain: r.gain, gainAfterPR: r.gainAfterExcl });
      totalGainAfterPR += r.gainAfterExcl;
    }
  });

  // Vehicles
  (S.vehicles||[]).forEach(function(v) {
    if (!N(v.val) || !N(v.baseCost)) return;
    if ((v.deathBenType||'Estate') === 'Spouse') return;
    var r = calcCGTAsset(v.val, v.baseCost, false);
    if (r.gainAfterExcl > 0) {
      items.push({ desc: v.desc||'Vehicle', gain: r.gain, gainAfterPR: r.gainAfterExcl });
      totalGainAfterPR += r.gainAfterExcl;
    }
  });

  // Other assets — only if cgtApplicable is not explicitly false
  (S.otherAssets||[]).forEach(function(a) {
    if (!N(a.val) || !N(a.baseCost)) return;
    if (a.cgtApplicable === false || a.cgtApplicable === 'false') return; // explicitly exempt
    if ((a.deathBenType||'Estate') === 'Spouse') return;
    var r = calcCGTAsset(a.val, a.baseCost, false);
    if (r.gainAfterExcl > 0) {
      items.push({ desc: a.desc||'Asset', gain: r.gain, gainAfterPR: r.gainAfterExcl });
      totalGainAfterPR += r.gainAfterExcl;
    }
  });

  // Investment / Unit Trust policies — CGT applies, base cost = lump sum premium
  // If Frequency = Once Off, Premium IS the lump sum premium (base cost)
  // Endowments, TFS, RA types, Living Annuity — all exempt
  (S.importedPols||[]).forEach(function(p) {
    if (p.Type !== 'Investment' && p.Type !== 'Unit Trust') return;
    if ((p.BeneficiaryType||'') === 'Spouse') return; // rollover
    // Base cost: Once Off premium = lump sum. Otherwise use manually entered LumpSumPremium.
    var baseCostPol = (p.Frequency === 'Once Off') ? N(p.Premium) : N(p.LumpSumPremium);
    if (!N(p.BenFundValue) || !baseCostPol) return;
    var r = calcCGTAsset(p.BenFundValue, baseCostPol, false);
    if (r.gainAfterExcl > 0) {
      items.push({ desc: (p.Insurer||'Investment')+(p.Product?' — '+p.Product:''), gain: r.gain, gainAfterPR: r.gainAfterExcl });
      totalGainAfterPR += r.gainAfterExcl;
    }
  });

  // Apply shared annual exclusion (R440k in year of death)
  var netGain     = Math.max(0, totalGainAfterPR - CGT_ANNUAL_EXCL);
  var includedGain= Math.round(netGain * CGT_INCLUSION);
  var mr          = N(marginalRate) > 0 ? N(marginalRate) / 100 : 0.45; // default max if unknown
  var totalCGT    = Math.round(includedGain * mr);

  return { items: items, totalGainAfterPR: totalGainAfterPR, netGain: netGain, includedGain: includedGain, totalCGT: totalCGT };
}

  // Capture the CRM internal client ID (separate from S.cli.id which is the SA IDNumber).
  // Used by refreshFromCRM() to query the policies table and by patchClientFieldToCRM()
  // to PATCH the clients table.
  if (params.get('cid')) window._crmInternalId = params.get('cid');

  // POLICIES are CRM-owned data — always refresh from CRM whenever the CRM has
  // pushed a fresh list (the presence of the du_fna_pols key IS the signal).
  // This must run BEFORE the hasSavedState early-return so returning clients
  // also get fresh policy data when the FNA is opened from the CRM. An empty
  // array is also applied (clears stale policies if all were lapsed/deleted).
  try {
    var _lsPolsEarly = localStorage.getItem('du_fna_pols');
    if (_lsPolsEarly) {
      var _polsEarly = JSON.parse(_lsPolsEarly);
      if (Array.isArray(_polsEarly)) {
        // Snapshot FNA-only flags from any existing importedPols (saved state).
        // applyPolsFromCRM replaces S.importedPols, so flags must be re-applied after.
        var _flagSnap = {};
        (S.importedPols||[]).forEach(function(op){
          var k1 = op.PolicyNo;
          var k2 = (op.Insurer||'')+'|'+(op.Product||'')+'|'+(op.Type||'');
          var snap = {};
          if (op._retInclude) snap.include = op._retInclude;
          if (op._retRows && op._retRows.length) snap.rows = op._retRows;
          if (op._retReturn !== undefined && op._retReturn !== '') snap.retReturn = op._retReturn;
          if (Object.keys(snap).length) {
            if (k1) _flagSnap[k1] = snap;
            _flagSnap[k2] = snap;
          }
        });
        applyPolsFromCRM(_polsEarly);
        // Re-apply FNA-only flags onto the freshly-imported policies
        (S.importedPols||[]).forEach(function(p){
          var k1 = p.PolicyNo;
          var k2 = (p.Insurer||'')+'|'+(p.Product||'')+'|'+(p.Type||'');
          var snap = _flagSnap[k1] || _flagSnap[k2];
          if (snap) {
            if (snap.include) p._retInclude = snap.include;
            if (snap.rows)    p._retRows    = snap.rows;
            if (snap.retReturn !== undefined) p._retReturn = snap.retReturn;
          }
          p._bensSeeded = false;
        });
      }
      localStorage.removeItem('du_fna_pols'); // clean up after reading
    }
  } catch(e) {}

  // If we have a saved state, DON'T overwrite ANY adviser-entered FNA data
  // (client fields, assets, needs, retirement etc). The FNA is now the master
  // for client demographics — its saved state wins. URL params are seeds only.
  if (hasSavedState) return;

  // Fresh FNA — seed client fields and other state from URL params (one-time only)
  if (params.get('name')) S.cli.name = decodeURIComponent(params.get('name'));
  if (params.get('id'))   S.cli.id   = params.get('id');
  if (params.get('dob')) {
    var rawDob = params.get('dob');
    if (rawDob.indexOf('T') > -1) rawDob = rawDob.split('T')[0];
    var d = rawDob.split('-');
    if (d.length === 3) S.cli.dob = d[2] + '/' + d[1] + '/' + d[0];
    else S.cli.dob = rawDob;
  }
  if (params.get('gender'))  S.cli.gender    = decodeURIComponent(params.get('gender'));
  if (params.get('smoker')) {
    var sm = decodeURIComponent(params.get('smoker'));
    S.cli.smoker = (sm === 'Yes') ? 'Smoker' : (sm === 'No') ? 'Non-smoker' : sm;
  }
  if (params.get('marital')) S.cli.marital   = decodeURIComponent(params.get('marital'));
  if (params.get('occ'))     S.cli.occ       = decodeURIComponent(params.get('occ'));
  if (params.get('edu'))     S.cli.education = decodeURIComponent(params.get('edu'));
  if (params.get('spouse'))  S.cli.spouseName= decodeURIComponent(params.get('spouse'));
  if (params.get('spousedob')) {
    var rawSpDob = decodeURIComponent(params.get('spousedob'));
    if (rawSpDob.indexOf('T') > -1) rawSpDob = rawSpDob.split('T')[0];
    var sd = rawSpDob.split('-');
    S.cli.spouseDob = (sd.length === 3) ? sd[2] + '/' + sd[1] + '/' + sd[0] : rawSpDob;
  }
  if (params.get('domdate')) {
    var rawDom = decodeURIComponent(params.get('domdate'));
    if (rawDom.indexOf('T') > -1) rawDom = rawDom.split('T')[0];
    S.cli.domDate = rawDom;
  }
  if (params.get('income')) {
    var incVal = params.get('income');
    if (!S.incRows) S.incRows = [];
    if (S.incRows.length === 0) S.incRows.push({ src: 'Salary / drawings', pm: '' });
    if (!S.incRows[0].pm) S.incRows[0].pm = incVal;
    S.cli.grossPM = incVal;
  }
  // URL fallback only — localStorage path has already run above. Handles legacy URLs.
  if (params.get('pols')) {
    try {
      applyPolsFromCRM(JSON.parse(decodeURIComponent(params.get('pols'))));
    } catch(e) {}
  }
})();

// After initial load — try to pull FNA state from server
// Runs after render() so the page is visible while waiting
(function tryServerLoad() {
  var clientId = (new URLSearchParams(window.location.search)).get('id');
  if (!clientId) return;
  var indicator = document.getElementById('syncIndicator');
  if (indicator) { indicator.textContent = '↓ Loading...'; indicator.style.color = '#a8b938'; }

  loadFromServer(clientId, function(serverState, savedTime) {
    // Silent post-load fetch: pull live POLICIES (CRM owns policies) and live
    // CLIENT DETAILS (fill-blanks-only — see fetchLiveClientFromCRM). The client
    // fetch ensures CRM-only fields (cell, email, address, education etc.)
    // populate the FNA without overwriting anything the adviser has already
    // typed into the FNA.
    var doSilentLiveFetch = function() {
      fetchLiveClientFromCRM({showStatus: false}, function(){
        fetchLivePoliciesFromCRM({showStatus: false}, function(){
          persist(); render();
        });
      });
    };

    if (!serverState) {
      if (indicator) { indicator.textContent = ''; }
      doSilentLiveFetch();
      return;
    }
    var localMetaTs = 0;
    try {
      var localMeta = JSON.parse(localStorage.getItem('du_fna_' + clientId + '_meta') || 'null');
      localMetaTs = saveStampValue(localMeta && localMeta.editedAt);
    } catch(e) {}
    var serverTs = saveStampValue(savedTime);
    if (localMetaTs && (!serverTs || localMetaTs >= serverTs)) {
      if (indicator) {
        indicator.textContent = '✓ Restored local data';
        indicator.style.color = '#86efac';
      }
      doSilentLiveFetch();
      return;
    }
    // Merge server state into S — but never overwrite importedPols (always from CRM).
    // Note: cli now uses ALL fields from server. The FNA is the master for
    // client demographics — its saved state is the canonical record. The CRM
    // is updated via patchClientFieldToCRM whenever the user blurs a field.
    var currentPols = S.importedPols;
    Object.keys(serverState).forEach(function(k) {
      if (k !== 'importedPols' && k !== 'cli') S[k] = serverState[k];
    });
    if (serverState.cli) {
      Object.keys(serverState.cli).forEach(function(k) {
        S.cli[k] = serverState.cli[k];
      });
    }
    S.importedPols = currentPols; // always use fresh CRM policies
    // Restore FNA-only flags (_retInclude, _retRows, _retReturn) from saved retIncludes map
    var retIncludes = serverState.retIncludes || {};
    if(Object.keys(retIncludes).length && S.importedPols && S.importedPols.length){
      S.importedPols.forEach(function(p){
        var k1 = p.PolicyNo;
        var k2 = p.Insurer+'|'+p.Product+'|'+p.Type;
        var _ri = retIncludes[k1] || retIncludes[k2];
        if(_ri){
          if(typeof _ri === 'object'){
            p._retInclude = _ri.include||false;
            p._retRows    = _ri.rows||[];
            if(_ri.retReturn !== undefined && _ri.retReturn !== '') p._retReturn = _ri.retReturn;
          }
          else { p._retInclude = true; p._retRows = []; } // legacy boolean
        }
      });
    }
    // If server retAssets is missing RA policies that are now in importedPols, reset so
    // buildRetirement can re-seed them. This handles the case where a policy was added
    // in the CRM after the FNA was last saved.
    var raTypes=['Retirement Annuity','Pension Fund','Provident Fund','Preservation Fund','Living Annuity','Tax Free Savings'];
    var retDescriptions=(S.retAssets||[]).map(function(r){return (r.desc||'').toLowerCase();});
    var missingRA=(currentPols||[]).some(function(p){
      if(raTypes.indexOf(p.Type)<0) return false;
      var label=((p.Insurer?p.Insurer+' \u2014 ':'')+p.Product||p.Type||'').toLowerCase();
      return !retDescriptions.some(function(d){return d.indexOf((p.Insurer||'').toLowerCase())>-1||(p.Product&&d.indexOf(p.Product.toLowerCase())>-1);});
    });
    if(missingRA) S.retAssets=[];
    persist(); // update localStorage with merged state
    render();
    if (indicator) {
      indicator.textContent = '✓ Synced ' + (savedTime ? savedTime.slice(0,16) : '');
      indicator.style.color = '#86efac';
    }
    doSilentLiveFetch();
  });
})();

// Applies CRM policy data to state — used on fresh load and on "Refresh from CRM"
function applyPolsFromCRM(pols) {
  S.importedPols = pols;
  if (!S.existingCover) S.existingCover = {death:'',disability:'',dread:'',ipPM:'',totalPrem:''};
  var totDeath=0,totDis=0,totDD=0,totIP=0,totPrem=0;

  pols.forEach(function(p){
    var n=function(v){return parseFloat(String(v||'').replace(/[^0-9.\-]/g,''))||0;};

    // Normalise CRM → FNA field names so the FNA schedule mirrors the CRM schedule
    if((p.GrowthRate==null || p.GrowthRate==='') && p.PremGrowthRate!=null && p.PremGrowthRate!=='') p.GrowthRate = p.PremGrowthRate;
    if((p.GrowthRate==null || p.GrowthRate==='') && p.IllustrativeRate!=null && p.IllustrativeRate!=='') p.GrowthRate = p.IllustrativeRate;
    if((p.PremGrowthRate==null || p.PremGrowthRate==='') && p.GrowthRate!=null && p.GrowthRate!=='') p.PremGrowthRate = p.GrowthRate;
    if((p.premEsc==null || p.premEsc==='') && p.PremEscalation!=null && p.PremEscalation!=='') p.premEsc = p.PremEscalation;
    if((p.PremEscalation==null || p.PremEscalation==='') && p.premEsc!=null && p.premEsc!=='') p.PremEscalation = p.premEsc;

    if((p.maturityAge==null || p.maturityAge==='') && p.MaturityAge!=null && p.MaturityAge!=='') p.maturityAge = String(p.MaturityAge);
    if((p.MaturityAge==null || p.MaturityAge==='') && p.maturityAge!=null && p.maturityAge!=='') p.MaturityAge = String(p.maturityAge);

    // Derive maturityAge from MaturityDate + DOB only as fallback for older CRM records
    if((p.maturityAge==null || p.maturityAge==='') && p.MaturityDate && S.cli && S.cli.dob){
      var matYear=parseInt((p.MaturityDate||'').split('-')[0]||0,10);
      var dobYear=0;
      if((S.cli.dob||'').indexOf('/')>-1) dobYear=parseInt((S.cli.dob||'').split('/')[2]||0,10);
      else dobYear=parseInt((S.cli.dob||'').split('-')[0]||0,10);
      if(matYear>0 && dobYear>0){
        p.maturityAge=String(matYear-dobYear);
        p.MaturityAge=p.maturityAge;
      }
    }

    // Beneficiary routing fallback from CRM Beneficiaries array
    if((!p.Beneficiary || !p.BeneficiaryType || !p.EstateDutiable) && p.Beneficiaries){
      try{
        var bens = typeof p.Beneficiaries==='string' ? JSON.parse(p.Beneficiaries) : p.Beneficiaries;
        if(bens && bens.length){
          var b = bens[0] || {};
          if(!p.Beneficiary && b.Name) p.Beneficiary = b.Name;
          if(!p.BeneficiaryType && b.Type) p.BeneficiaryType = b.Type;
          if(!p.EstateDutiable && b.EstateDutiable) p.EstateDutiable = b.EstateDutiable;
        }
      }catch(e){}
    }

    if(p.Type!=='Business Assurance'){
      totDeath+=n(p.BenDeath);
      totDis+=n(p.BenDisability);
      totDD+=n(p.BenDreadDisease);
    }
    // ── Group risk benefits on Pension/Provident Fund policies ────────
    // CRM stores them in p.GroupRiskBenefits as a JSON array. Route by row type:
    //   • Life Cover                       → totDeath  (lump sum cover)
    //   • Capital Disability (Lump Sum)    → totDis    (lump sum cover)
    //   • Income Disability (PHI)          → totIP     (MONTHLY cover, per CRM convention)
    //   • Dread Disease                    → totDD     (lump sum cover)
    //   • Funeral / Spouse / Child / Other → not routed (niche, not in the four core need buckets)
    // Skipped on Business Assurance policies (consistent with the BenDeath block above).
    if(p.Type!=='Business Assurance' && p.GroupRiskBenefits){
      try{
        var grRows = typeof p.GroupRiskBenefits==='string' ? JSON.parse(p.GroupRiskBenefits) : p.GroupRiskBenefits;
        if(grRows && grRows.length){
          grRows.forEach(function(r){
            var cover = n(r.cover);
            if(!cover) return;
            var t = r.type||'';
            if(t==='Life Cover')                    totDeath += cover;
            else if(t==='Capital Disability (Lump Sum)') totDis  += cover;
            else if(t==='Income Disability (PHI)')  totIP   += cover; // monthly
            else if(t==='Dread Disease')            totDD   += cover;
            // Funeral / Spouse Cover / Child Cover / Other: intentionally not routed
          });
        }
      }catch(e){}
    }
    try{
      var ib=p.IncomeBenefits?JSON.parse(p.IncomeBenefits):[];
      ib.forEach(function(r){totIP+=n(r.amount);});
    }catch(e){}
    var f=p.Frequency||'Monthly';
    if(f==='Monthly'||f==='') totPrem+=n(p.Premium);
  });

  // Always reflect the current policy list — set to current total, including
  // empty string when no policies contribute (handles the case where a policy
  // was deleted from the CRM and totals should drop to zero).
  S.existingCover.death      = totDeath > 0 ? String(Math.round(totDeath)) : '';
  S.existingCover.disability = totDis   > 0 ? String(Math.round(totDis))   : '';
  S.existingCover.dread      = totDD    > 0 ? String(Math.round(totDD))    : '';
  S.existingCover.ipPM       = totIP    > 0 ? String(Math.round(totIP))    : '';
  S.existingCover.totalPrem  = totPrem  > 0 ? String(Math.round(totPrem))  : '';
}

// ── CRM client write-back ────────────────────────────────────────────────
// FNA is the primary capture tool for client demographics. Edits to client
// fields write back to the CRM clients table on Supabase. Uses PATCH (partial
// update) so that CRM-only columns (Cell, Email, Address, etc.) aren't wiped.

// Convert FNA-shape values to CRM-shape values for write-back.
function fnaToCrmCli(fields) {
  var out = {};
  // Strings pass through (no translation needed)
  ['Name','IDNumber','Occupation','Education','SpouseName',
   'Cell','Email','TelHome','TelWork','TaxNo',
   'Address','POBox',
   'SpouseIDNumber','SpouseCell','SpouseEmail'].forEach(function(k){
    if (fields[k] !== undefined) out[k] = fields[k];
  });
  // DOB: DD/MM/YYYY -> YYYY-MM-DD
  var fmtDate = function(v){
    if (!v) return '';
    var s = String(v).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[1]).slice(-2);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.split('T')[0]; // already ISO
    return s; // pass through, server will reject malformed
  };
  if (fields.DOB !== undefined)       out.DOB = fmtDate(fields.DOB);
  if (fields.SpouseDOB !== undefined) out.SpouseDOB = fmtDate(fields.SpouseDOB);
  if (fields.Anniversary !== undefined) out.Anniversary = fmtDate(fields.Anniversary);
  // Smoker: 'Smoker'/'Non-smoker' -> 'Yes'/'No'
  if (fields.Smoker !== undefined) {
    var s = String(fields.Smoker || '');
    out.Smoker = (s === 'Smoker') ? 'Yes' : (s === 'Non-smoker') ? 'No' : s;
  }
  // Gender pass-through (CRM expects 'Male'/'Female'/'Other' which matches FNA)
  if (fields.Gender !== undefined) out.Gender = fields.Gender || '';
  // Marital: FNA em-dash -> CRM hyphen
  if (fields.MaritalStatus !== undefined) {
    var m = String(fields.MaritalStatus || '');
    if (m === 'Married \u2014 ANC with accrual')    out.MaritalStatus = 'Married - ANC with accrual';
    else if (m === 'Married \u2014 ANC no accrual') out.MaritalStatus = 'Married - ANC without accrual';
    else if (m === 'Married \u2014 COP')            out.MaritalStatus = 'Married in COP';
    else out.MaritalStatus = m;
  }
  // Income (numeric string)
  if (fields.Income !== undefined) out.Income = String(fields.Income || '');
  return out;
}

// Build the CRM-shape payload from current FNA state for ALL client fields.
// Used by createNewClientInCRM.
function fnaCliToFullCrmRow() {
  return fnaToCrmCli({
    Name:           S.cli.name,
    IDNumber:       S.cli.id,
    DOB:            S.cli.dob,
    Gender:         S.cli.gender,
    Smoker:         S.cli.smoker,
    Education:      S.cli.education,
    Occupation:     S.cli.occ,
    MaritalStatus:  S.cli.marital,
    Anniversary:    S.cli.domDate,
    SpouseName:     S.cli.spouseName,
    SpouseDOB:      S.cli.spouseDob,
    Income:         (S.incRows && S.incRows[0] && S.incRows[0].pm) || S.cli.grossPM || '',
    // Contact
    Cell:           S.cli.cell        || '',
    Email:          S.cli.email       || '',
    TelHome:        S.cli.telHome     || '',
    TelWork:        S.cli.telWork     || '',
    TaxNo:          S.cli.taxNo       || '',
    // Address
    Address:        S.cli.address     || '',
    POBox:          S.cli.poBox       || '',
    // Spouse contact
    SpouseIDNumber: S.cli.spouseId    || '',
    SpouseCell:     S.cli.spouseCell  || '',
    SpouseEmail:    S.cli.spouseEmail || ''
  });
}

// PATCH a partial set of client fields to the CRM clients table. Debounced
// per-field so that rapid blur events don't flood the network. Each (cid, field)
// gets its own timer.
var _cliPatchTimers = {};
function patchClientFieldToCRM(fieldNameInternal, fnaValue) {
  var crmClientId = window._crmInternalId
                    || (window._crmParams && window._crmParams.get('cid')) || '';
  if (!crmClientId) {
    // No CRM record yet — caller should use createNewClientInCRM instead.
    return;
  }
  // Map FNA field name to CRM column name + value translation
  var mapping = {
    'name':         'Name',
    'id':           'IDNumber',
    'dob':          'DOB',
    'gender':       'Gender',
    'smoker':       'Smoker',
    'education':    'Education',
    'occ':          'Occupation',
    'marital':      'MaritalStatus',
    'domDate':      'Anniversary',
    'spouseName':   'SpouseName',
    'spouseDob':    'SpouseDOB',
    'grossPM':      'Income',
    // Contact
    'cell':         'Cell',
    'email':        'Email',
    'telHome':      'TelHome',
    'telWork':      'TelWork',
    'taxNo':        'TaxNo',
    // Address
    'address':      'Address',
    'poBox':        'POBox',
    // Spouse contact
    'spouseId':     'SpouseIDNumber',
    'spouseCell':   'SpouseCell',
    'spouseEmail':  'SpouseEmail'
  };
  var crmCol = mapping[fieldNameInternal];
  if (!crmCol) return;
  var payloadInput = {}; payloadInput[crmCol] = fnaValue;
  var body = fnaToCrmCli(payloadInput);

  var key = crmClientId + '::' + crmCol;
  if (_cliPatchTimers[key]) clearTimeout(_cliPatchTimers[key]);
  _cliPatchTimers[key] = setTimeout(function(){
    var indicator = document.getElementById('syncIndicator');
    if (indicator) { indicator.textContent = '\u2191 Saving client...'; indicator.style.color = '#a8b938'; }
    sbFetch('PATCH',
      '/rest/v1/clients?ID=eq.' + encodeURIComponent(crmClientId),
      body,
      function(res, err){
        if (err) {
          console.error('Client PATCH failed:', crmCol, err);
          if (indicator) { indicator.textContent = '\u26A0 Client save failed'; indicator.style.color = '#f87171'; }
        } else {
          var t = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
          if (indicator) { indicator.textContent = '\u2713 Client saved ' + t; indicator.style.color = '#86efac'; }
        }
      }
    );
  }, 600);
}

// Create a new client record in the CRM from the current FNA state. Called
// when the FNA is opened with no cid (cold start) and the user clicks the
// "Save new client to CRM" button.
function createNewClientInCRM(onDone) {
  if (!S.cli.name || !S.cli.name.trim()) {
    alert('Please enter the client\'s full name before creating the CRM record.');
    if (onDone) onDone(false, 'no_name');
    return;
  }
  // Pre-flight duplicate check by IDNumber (if provided)
  var idNum = (S.cli.id || '').trim();
  var goCreate = function(){
    var newId = 'new_' + Date.now();
    var row = fnaCliToFullCrmRow();
    row.ID = newId;
    row.Status = 'Active';
    row.IsLead = 'No';
    row.Adviser = 'Clinton Hayes';
    var indicator = document.getElementById('syncIndicator');
    if (indicator) { indicator.textContent = '\u2191 Creating client...'; indicator.style.color = '#a8b938'; }
    // POST with merge-duplicates is the same pattern the CRM uses for upsert
    sbFetch('POST', '/rest/v1/clients', [row], function(res, err){
      if (err) {
        console.error('Client INSERT failed:', err);
        if (indicator) { indicator.textContent = '\u26A0 Could not create client'; indicator.style.color = '#f87171'; }
        alert('Could not create client in CRM. Check the console (F12) for details. Your FNA is still saved locally.');
        if (onDone) onDone(false, err);
        return;
      }
      // Verify the row was actually created by reading it back.
      sbFetch('GET', '/rest/v1/clients?ID=eq.' + encodeURIComponent(newId) + '&select=ID,Name', null, function(verifyRows, verifyErr){
        if (verifyErr || !Array.isArray(verifyRows) || verifyRows.length === 0) {
          // Insert appeared to succeed but row not found — flag this loudly
          console.error('Client INSERT verification failed:', verifyErr, verifyRows);
          if (indicator) { indicator.textContent = '\u26A0 Could not verify client creation'; indicator.style.color = '#f87171'; }
          alert('The client may not have saved correctly. Check the CRM (click \u270B Sync Now in the CRM sidebar) before continuing. If the client is missing, try again or check the F12 console.');
          if (onDone) onDone(false, 'verify_failed');
          return;
        }
        // Verified — store the new internal ID and update the URL (without reloading)
        window._crmInternalId = newId;
        try {
          var newUrl = new URL(window.location.href);
          newUrl.searchParams.set('cid', newId);
          if (idNum) newUrl.searchParams.set('id', idNum);
          if (S.cli.name) newUrl.searchParams.set('name', S.cli.name);
          window.history.replaceState({}, '', newUrl.toString());
          window._crmParams = newUrl.searchParams;
        } catch(e) {}
        if (indicator) {
          var t = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
          indicator.textContent = '\u2713 Client created ' + t;
          indicator.style.color = '#86efac';
        }
        // Show a clear confirmation with next-step instructions
        alert('\u2713 Client created in CRM:\n\n  ' + (verifyRows[0].Name||S.cli.name) + '\n\nIf the CRM is open in another tab, click "\uD83D\uDD04 Sync Now" in the CRM sidebar to see the new client. Until you do, the CRM tab is showing its old data.');
        if (onDone) onDone(true, newId);
      });
    });
  };
  if (!idNum) { goCreate(); return; }
  // Duplicate check
  sbFetch('GET',
    '/rest/v1/clients?IDNumber=eq.' + encodeURIComponent(idNum) + '&select=ID,Name',
    null,
    function(rows, err){
      if (err) {
        // Network error — proceed anyway, but warn
        if (!confirm('Could not check for duplicate ID number due to a network error. Create client anyway?')) {
          if (onDone) onDone(false, 'network');
          return;
        }
        goCreate();
        return;
      }
      if (Array.isArray(rows) && rows.length > 0) {
        alert('A client with ID number ' + idNum + ' already exists in the CRM ('
              + (rows[0].Name || '(no name)') + '). Open them from the CRM instead of creating a new record.');
        if (onDone) onDone(false, 'duplicate');
        return;
      }
      goCreate();
    }
  );
}

// Fetch the live client row from the CRM's clients table on Supabase. CRM-owned
// demographic and income fields are applied to S.cli and S.incRows[0]. URL
// params captured at FNA open are stale (the user can update the client in CRM
// while the FNA is open), so this is the only reliable source.
function fetchLiveClientFromCRM(opts, onDone) {
  opts = opts || {};
  var crmClientId = (window._crmParams && window._crmParams.get('cid'))
                    || window._crmInternalId || '';
  if (!crmClientId) { if (onDone) onDone(false, 'no_cid'); return; }
  if (opts.showStatus) status('\u2193 Fetching client details from CRM...');
  var path = '/rest/v1/clients'
           + '?ID=eq.' + encodeURIComponent(crmClientId)
           + '&select=*';
  sbFetch('GET', path, null, function(rows, err){
    if (err || !Array.isArray(rows) || rows.length === 0) {
      if (opts.showStatus) status('\u26A0 Could not fetch client details from CRM');
      if (onDone) onDone(false, err || 'not_found');
      return;
    }
    var c = rows[0];

    // Format DOB / Spouse DOB as DD/MM/YYYY for display
    var fmtDob = function(raw){
      if (!raw) return '';
      raw = String(raw);
      if (raw.indexOf('T') > -1) raw = raw.split('T')[0];
      var parts = raw.split('-');
      if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
      return raw;
    };
    var fmtIso = function(raw){
      if (!raw) return '';
      raw = String(raw);
      if (raw.indexOf('T') > -1) raw = raw.split('T')[0];
      return raw;
    };
    var translateMarital = function(m){
      m = m || '';
      if (m === 'Married - ANC with accrual')    return 'Married \u2014 ANC with accrual';
      if (m === 'Married - ANC without accrual') return 'Married \u2014 ANC no accrual';
      if (m === 'Married in COP')                return 'Married \u2014 COP';
      return m;
    };
    var translateSmoker = function(s){
      s = s || '';
      if (s === 'Yes') return 'Smoker';
      if (s === 'No')  return 'Non-smoker';
      return s;
    };

    // Fill-blanks-only: only copy CRM value into S.cli when the FNA field is
    // currently empty. This lets CRM data flow in for existing clients without
    // clobbering values the adviser has typed into the FNA.
    // Edge case: if CRM has been blanked out and FNA still has the old value,
    // FNA wins. That's acceptable — the adviser can manually clear the FNA field.
    var fillIfBlank = function(fnaKey, crmValue){
      if (S.cli[fnaKey] === undefined || S.cli[fnaKey] === null || S.cli[fnaKey] === '') {
        S.cli[fnaKey] = crmValue || '';
      }
    };

    // Personal
    fillIfBlank('name',       c.Name);
    fillIfBlank('id',         c.IDNumber);
    fillIfBlank('dob',        fmtDob(c.DOB));
    fillIfBlank('gender',     c.Gender);
    fillIfBlank('smoker',     translateSmoker(c.Smoker));
    fillIfBlank('occ',        c.Occupation);
    fillIfBlank('education',  c.Education);
    // Contact
    fillIfBlank('cell',       c.Cell);
    fillIfBlank('email',      c.Email);
    fillIfBlank('telHome',    c.TelHome);
    fillIfBlank('telWork',    c.TelWork);
    fillIfBlank('taxNo',      c.TaxNo);
    // Address
    fillIfBlank('address',    c.Address);
    fillIfBlank('poBox',      c.POBox);
    // Marital + spouse
    fillIfBlank('marital',    translateMarital(c.MaritalStatus));
    fillIfBlank('domDate',    fmtIso(c.Anniversary));
    fillIfBlank('spouseName', c.SpouseName);
    fillIfBlank('spouseDob',  fmtDob(c.SpouseDOB));
    fillIfBlank('spouseId',   c.SpouseIDNumber);
    fillIfBlank('spouseCell', c.SpouseCell);
    fillIfBlank('spouseEmail',c.SpouseEmail);

    // Income — special case: drive both grossPM and incRows[0].pm. Only fill
    // if the FNA's salary slot is blank.
    var incVal = (c.Income == null) ? '' : String(c.Income);
    if (!S.cli.grossPM) S.cli.grossPM = incVal;
    if (!S.incRows || S.incRows.length === 0) {
      S.incRows = [{ src: 'Salary / drawings', pm: incVal }];
    } else if (!S.incRows[0].pm) {
      S.incRows[0].pm = incVal;
      if (!S.incRows[0].src) S.incRows[0].src = 'Salary / drawings';
    }

    if (opts.showStatus) status('\u2713 Client details refreshed from CRM');
    if (onDone) onDone(true, c);
  });
}

// Fetch ACTIVE policies for this client live from Supabase. Used both on FNA
// open (silent — fast-path is the localStorage handoff from the CRM) and by
// the ↻ CRM button (with user-visible status). The policies table is keyed by
// the CRM's internal client ID (cid URL param), NOT the SA IDNumber.
function fetchLivePoliciesFromCRM(opts, onDone) {
  opts = opts || {};
  var crmClientId = (window._crmParams && window._crmParams.get('cid'))
                    || window._crmInternalId || '';
  if (!crmClientId) { if (onDone) onDone(false, 'no_cid'); return; }
  if (opts.showStatus) status('↓ Fetching policies from CRM...');
  var path = '/rest/v1/policies'
           + '?ClientID=eq.' + encodeURIComponent(crmClientId)
           + '&Status=eq.Active'
           + '&select=*';
  sbFetch('GET', path, null, function(rows, err){
    if (err || !Array.isArray(rows)) {
      if (opts.showStatus) status('⚠ Could not fetch policies from CRM');
      if (onDone) onDone(false, err || 'bad_response');
      return;
    }
    // Snapshot FNA-only flags from current importedPols (keyed by PolicyNo, with
    // Insurer|Product|Type fallback). applyPolsFromCRM replaces S.importedPols, so we
    // must re-apply these flags onto the new policy objects after the swap.
    var flagSnap = {};
    (S.importedPols||[]).forEach(function(op){
      var k1 = op.PolicyNo;
      var k2 = (op.Insurer||'')+'|'+(op.Product||'')+'|'+(op.Type||'');
      var snap = {};
      if (op._retInclude) snap.include = op._retInclude;
      if (op._retRows && op._retRows.length) snap.rows = op._retRows;
      if (op._retReturn !== undefined && op._retReturn !== '') snap.retReturn = op._retReturn;
      if (Object.keys(snap).length) {
        if (k1) flagSnap[k1] = snap;
        flagSnap[k2] = snap;
      }
    });
    applyPolsFromCRM(rows);
    // Re-apply FNA-only flags onto the freshly-imported policies
    (S.importedPols||[]).forEach(function(p){
      var k1 = p.PolicyNo;
      var k2 = (p.Insurer||'')+'|'+(p.Product||'')+'|'+(p.Type||'');
      var snap = flagSnap[k1] || flagSnap[k2];
      if (snap) {
        if (snap.include) p._retInclude = snap.include;
        if (snap.rows)    p._retRows    = snap.rows;
        if (snap.retReturn !== undefined) p._retReturn = snap.retReturn;
      }
      p._bensSeeded = false;
    });
    if (opts.showStatus) {
      if (rows.length === 0) status('✓ Refreshed from CRM — no active policies on file');
      else status('✓ Refreshed from CRM (' + rows.length + ' active ' + (rows.length===1?'policy':'policies') + ')');
    }
    if (onDone) onDone(true, rows);
  });
}

// Called by the "Refresh from CRM" button — pulls live data from Supabase for
// both client demographics (income, marital, spouse, etc.) and active policies.
// URL params captured at FNA-open are intentionally NOT used: they are stale
// the moment the user updates the client in the CRM. Live Supabase is the
// single source of truth.
function refreshFromCRM() {
  if (!confirm('Refresh active policies from CRM?\n\nYour FNA data (client details, assets, needs, retirement etc) will NOT be touched. Only the policy list will be re-pulled.')) return;
  var params = window._crmParams;
  var crmClientId = (params && params.get('cid')) || window._crmInternalId || '';
  if (!crmClientId) {
    alert('No CRM client ID found. If this is a new client, click "Save as new client to CRM" on the Client tab first.');
    return;
  }

  status('\u2193 Fetching policies from CRM...');

  fetchLivePoliciesFromCRM({showStatus: false}, function(polsOk, polsInfoOrErr){
    // Reset retirement assets so they re-seed from the current policy list
    S.retAssets = [];
    persist();
    render();

    if (polsOk) {
      var n = Array.isArray(polsInfoOrErr) ? polsInfoOrErr.length : 0;
      status('\u2713 Refreshed policies from CRM (' + n + ' active ' + (n===1?'policy':'policies') + ')');
    } else {
      status('\u26A0 Could not fetch policies from CRM');
    }
  });
}

function deepMerge(base, over) {
  if (typeof over !== 'object' || over === null) return over !== undefined ? over : base;
  var result = JSON.parse(JSON.stringify(base));
  Object.keys(over).forEach(function (k) {
    if (Array.isArray(over[k])) { result[k] = over[k]; }
    else if (typeof over[k] === 'object' && over[k] !== null && typeof base[k] === 'object') {
      result[k] = deepMerge(base[k], over[k]);
    } else { result[k] = over[k]; }
  });
  return result;
}

function persist() {
  var json = JSON.stringify(S);
  document.getElementById('saved-data').textContent = json;
  var key = fnaStateKey();
  try {
    localStorage.setItem(key, json);
    localStorage.setItem(fnaMetaKey(), JSON.stringify({editedAt: saveStampNow()}));
  } catch(e) {}
  // Remember last-worked client for recovery
  if (S.cli.id && S.cli.name) {
    try { localStorage.setItem('du_fna_lastClient', JSON.stringify({id:S.cli.id, name:S.cli.name, time:Date.now()})); } catch(e) {}
  }
}

// ═══════════════════════════════════════════════════════════
// SAVEGUARD — data-loss protection for FNA saves
// ═══════════════════════════════════════════════════════════
// Goals:
//   1. NEVER lose adviser-entered data, even if S.cli.id is blank,
//      even if Supabase is unreachable, even if the tab is closed.
//   2. Make save state IMPOSSIBLE TO MISS — persistent red banner
//      on failure, yellow banner when local-only (no ID number).
//   3. Auto-retry failed saves in the background every 30 seconds.
//   4. Block tab close with beforeunload if there is unsaved server state.
//
// Storage:
//   - localStorage 'du_fna_unsaved_<clientId>' holds the last failed
//     payload so it survives a browser/PC crash and can be replayed.
//   - In-memory _sgPending holds the same for active retry.
// ═══════════════════════════════════════════════════════════

var _sgPending = null;       // { clientId, payload, firstFailedAt, lastAttemptAt, attempts }
var _sgRetryTimer = null;    // setInterval handle for background retry
var _sgInFlight = false;     // true while a fetch is mid-flight (prevents pile-up)
var _sgSuccessAt = 0;        // timestamp of last successful save

// Show / hide the red failure banner. Idempotent.
function sgShowFailBanner(detail) {
  var b = document.getElementById('sgFailBanner');
  if (!b) return;
  b.style.display = 'block';
  var d = document.getElementById('sgFailDetail');
  if (d) d.textContent = detail || '';
}
function sgHideFailBanner() {
  var b = document.getElementById('sgFailBanner');
  if (b) b.style.display = 'none';
  var s = document.getElementById('sgRetryStatus');
  if (s) s.textContent = '';
}

// Show / hide the yellow "saving locally only" banner.
function sgShowNoIdBanner() {
  var b = document.getElementById('sgNoIdBanner');
  if (b) b.style.display = 'block';
}
function sgHideNoIdBanner() {
  var b = document.getElementById('sgNoIdBanner');
  if (b) b.style.display = 'none';
}

// Persist the pending payload to localStorage so it survives a crash.
function sgStashUnsaved() {
  if (!_sgPending) return;
  try {
    localStorage.setItem(
      'du_fna_unsaved_' + _sgPending.clientId,
      JSON.stringify(_sgPending)
    );
  } catch(e) {}
}
function sgClearUnsaved(clientId) {
  try { localStorage.removeItem('du_fna_unsaved_' + clientId); } catch(e) {}
}

// Manual retry button — fires immediately.
function sgManualRetry() {
  if (!_sgPending) { sgHideFailBanner(); return; }
  var s = document.getElementById('sgRetryStatus');
  if (s) s.textContent = '(retrying now…)';
  sgFlushPending(false);
}

// Build the save payload from the current state. Pure function — no side effects.
function sgBuildPayload(clientId) {
  var saveData = {};
  var skip = {importedPols: true};
  Object.keys(S).forEach(function(k){ if(!skip[k]) saveData[k] = S[k]; });
  var retIncludes = {};
  (S.importedPols||[]).forEach(function(p){
    if(p._retInclude || (p._retRows && p._retRows.length) || (p._retReturn !== undefined && p._retReturn !== '')){
      var key2 = p.PolicyNo || (p.Insurer+'|'+p.Product+'|'+p.Type);
      if(key2) retIncludes[key2] = {
        include:   p._retInclude||false,
        rows:      p._retRows||[],
        retReturn: (p._retReturn !== undefined && p._retReturn !== '') ? p._retReturn : ''
      };
    }
  });
  saveData.retIncludes = retIncludes;
  var now = new Date().toISOString().slice(0,16).replace('T',' ');
  return {
    ClientID: clientId,
    Version: 'working',
    Locked: false,
    Data: JSON.stringify(saveData),
    LastSaved: now,
    SavedBy: 'Clinton Hayes'
  };
}

// The single low-level POST. Updates banners & in-flight state.
// Used both by the initial save and by retries.
function sgFlushPending(silent) {
  if (!_sgPending) return;
  if (_sgInFlight) return; // a retry is already running; don't pile up
  _sgInFlight = true;

  var indicator = document.getElementById('syncIndicator');
  if(indicator){ indicator.textContent = '↑ Saving...'; indicator.style.color = '#a8b938'; }

  var attempt = _sgPending; // snapshot — _sgPending may be replaced mid-flight

  sbFetch('POST','/rest/v1/fnadata?on_conflict=ClientID,Version', [attempt.payload], function(res, err){
    _sgInFlight = false;
    if (err) {
      attempt.attempts = (attempt.attempts||0) + 1;
      attempt.lastAttemptAt = Date.now();
      if (!attempt.firstFailedAt) attempt.firstFailedAt = attempt.lastAttemptAt;
      // _sgPending may have been overwritten by a fresh save while we were in flight.
      // Only mirror our attempt counters back if it's still the same payload.
      if (_sgPending && _sgPending.payload === attempt.payload) {
        _sgPending.attempts = attempt.attempts;
        _sgPending.firstFailedAt = attempt.firstFailedAt;
        _sgPending.lastAttemptAt = attempt.lastAttemptAt;
      }
      sgStashUnsaved();
      var when = new Date(attempt.firstFailedAt).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
      sgShowFailBanner('Unsaved since ' + when + ' · ' + attempt.attempts + ' attempt(s) · ' + String(err).slice(0,120));
      if (indicator) { indicator.textContent = '⚠ Sync failed — retrying'; indicator.style.color = '#f87171'; }
      if (!silent) status('⚠ Save failed — will retry. Your data is safe in this browser.');
      sgStartRetryLoop();
    } else {
      // Success — but only clear if _sgPending is still the same attempt we tried.
      // If a fresh save replaced it mid-flight, leave that fresh one to retry/succeed on its own.
      if (_sgPending && _sgPending.payload === attempt.payload) {
        sgClearUnsaved(_sgPending.clientId);
        _sgPending = null;
        sgHideFailBanner();
        sgStopRetryLoop();
      }
      _sgSuccessAt = Date.now();
      var t = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
      if (indicator) { indicator.textContent = '✓ Synced '+t; indicator.style.color = '#86efac'; }
      if (!silent) status('✓ Saved at '+t);
    }
  });
}

function sgStartRetryLoop() {
  if (_sgRetryTimer) return;
  _sgRetryTimer = setInterval(function(){
    if (!_sgPending) { sgStopRetryLoop(); return; }
    sgFlushPending(true);
  }, 30000); // every 30 seconds
}
function sgStopRetryLoop() {
  if (_sgRetryTimer) { clearInterval(_sgRetryTimer); _sgRetryTimer = null; }
}

// Recover an unsaved payload from a previous session, if one exists for this client.
// Called from init after S.cli.id is established.
function sgRecoverUnsaved() {
  var clientId = S.cli.id;
  if (!clientId) return;
  try {
    var raw = localStorage.getItem('du_fna_unsaved_' + clientId);
    if (!raw) return;
    var rec = JSON.parse(raw);
    if (!rec || !rec.payload) return;
    // We have a previously-failed save for this client. Queue it for retry.
    // Do NOT overwrite S — the recovered payload is older than current S anyway
    // (since the user opened the FNA again, persist() has likely run).
    // Instead, build a fresh payload from current S and queue THAT for retry,
    // because current S already contains everything the failed save had plus
    // any newer edits (persist() runs before every saveToServer call).
    _sgPending = {
      clientId: clientId,
      payload: sgBuildPayload(clientId),
      firstFailedAt: rec.firstFailedAt || Date.now(),
      lastAttemptAt: 0,
      attempts: rec.attempts || 0
    };
    sgStashUnsaved();
    var when = new Date(_sgPending.firstFailedAt).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
    sgShowFailBanner('Recovered unsaved changes from previous session (' + when + ')');
    sgFlushPending(true); // try immediately
  } catch(e) {}
}

// Public entry point. Replaces the previous saveToServer.
// If S.cli.id is blank, persist() (already called by the caller) has saved
// locally; we show the yellow banner and stop here — NO data loss.
function saveToServer(silent) {
  var clientId = S.cli.id;
  if (!clientId) {
    // No SA ID yet. localStorage has the data (via persist()). Make this VISIBLE.
    sgShowNoIdBanner();
    var indicator = document.getElementById('syncIndicator');
    if (indicator) { indicator.textContent = '💾 Local only'; indicator.style.color = '#d97706'; }
    if (!silent) status('💾 Saved locally — enter ID number to enable server sync');
    return;
  }
  sgHideNoIdBanner();
  _sgPending = {
    clientId: clientId,
    payload: sgBuildPayload(clientId),
    firstFailedAt: _sgPending ? _sgPending.firstFailedAt : 0,
    lastAttemptAt: 0,
    attempts: _sgPending ? _sgPending.attempts : 0
  };
  sgFlushPending(silent);
}

// Load FNA state from Supabase
function loadFromServer(clientId, onDone) {
  if(!clientId){ if(onDone) onDone(null); return; }
  sbFetch('GET','/rest/v1/fnadata?ClientID=eq.'+encodeURIComponent(clientId)+'&Version=eq.working&select=*&order=LastSaved.desc&limit=1',null,function(rows,err){
    if(rows && rows.length && rows[0].Data){
      try {
        var serverState = typeof rows[0].Data==='string' ? JSON.parse(rows[0].Data) : rows[0].Data;
        if(onDone) onDone(serverState, rows[0].LastSaved||'');
      } catch(e){ if(onDone) onDone(null); }
    } else {
      if(onDone) onDone(null);
    }
  });
}

// ═══════════════════════════════════════════════════════════
// FNA VERSIONING (FAIS compliance — snapshot-on-demand)
// ═══════════════════════════════════════════════════════════

// Lock the current working FNA as a dated, read-only final version.
// Flow: 1) save current state to server  2) rename Version working→dated  3) save fresh working copy
function lockFinalVersion() {
  var clientId = S.cli.id;
  if(!clientId){ alert('No client loaded — cannot lock.'); return; }
  if(!S.cli.name || !S.cli.name.trim()){ alert('Enter the client name before locking.'); return; }

  var notes = prompt('Optional note for this locked version (e.g. "Initial FNA signed", "Annual review"):','');
  if(notes === null) return; // user cancelled
  notes = (notes||'').trim();

  var today = new Date();
  var y = today.getFullYear();
  var m = String(today.getMonth()+1).padStart(2,'0');
  var d = String(today.getDate()).padStart(2,'0');
  var baseLabel = y+'-'+m+'-'+d+' — Signed';
  var versionLabel = baseLabel;

  if(!confirm('Lock this FNA as final version "'+versionLabel+'"?\n\nThis creates a read-only snapshot for FAIS compliance. You can continue editing the working copy afterwards — the locked version cannot be changed.')) return;

  var indicator = document.getElementById('syncIndicator');
  if(indicator){ indicator.textContent = '🔒 Locking...'; indicator.style.color = '#a8b938'; }
  status('🔒 Locking final version — do not close this tab.');

  // Check for same-day label collision; if found, append (2), (3) etc.
  sbFetch('GET','/rest/v1/fnadata?ClientID=eq.'+encodeURIComponent(clientId)+'&Version=like.'+encodeURIComponent(baseLabel+'%')+'&select=Version',null,function(existing){
    if(existing && existing.length){
      var n = existing.length + 1;
      versionLabel = baseLabel + ' ('+n+')';
    }
    doLockSteps();
  });

  function doLockSteps() {

  // Step 1: save current state so we lock the absolute latest
  persist();
  var saveData = {};
  var skip = {importedPols: true};
  Object.keys(S).forEach(function(k){ if(!skip[k]) saveData[k] = S[k]; });
  var retIncludes = {};
  (S.importedPols||[]).forEach(function(p){
    if(p._retInclude || (p._retRows && p._retRows.length) || (p._retReturn !== undefined && p._retReturn !== '')){
      var key2 = p.PolicyNo || (p.Insurer+'|'+p.Product+'|'+p.Type);
      if(key2) retIncludes[key2] = {
        include:   p._retInclude||false,
        rows:      p._retRows||[],
        retReturn: (p._retReturn !== undefined && p._retReturn !== '') ? p._retReturn : ''
      };
    }
  });
  saveData.retIncludes = retIncludes;
  var dataStr = JSON.stringify(saveData);
  var now = new Date().toISOString().slice(0,16).replace('T',' ');

  // Save the working copy one more time (fresh snapshot)
  sbFetch('POST','/rest/v1/fnadata?on_conflict=ClientID,Version',
    [{ClientID:clientId,Version:'working',Locked:false,Data:dataStr,LastSaved:now,SavedBy:'Clinton Hayes'}],
  function(res1,err1){
    if(err1){
      if(indicator){ indicator.textContent = '⚠ Lock failed'; indicator.style.color = '#f87171'; }
      alert('Lock failed at step 1 (save current): '+err1+'\n\nNo changes were made. Please try again or check your connection.');
      return;
    }

    // Step 2: rename Version from 'working' to the dated label (uses PATCH on composite key)
    sbFetch('PATCH','/rest/v1/fnadata?ClientID=eq.'+encodeURIComponent(clientId)+'&Version=eq.working',
      {Version:versionLabel,Locked:true,Notes:notes},
    function(res2,err2){
      if(err2){
        if(indicator){ indicator.textContent = '⚠ Lock failed'; indicator.style.color = '#f87171'; }
        alert('Lock failed at step 2 (rename to '+versionLabel+'): '+err2+'\n\nThe working copy is safe. Please try again.');
        return;
      }

      // Step 3: create a fresh working copy containing the same data
      sbFetch('POST','/rest/v1/fnadata?on_conflict=ClientID,Version',
        [{ClientID:clientId,Version:'working',Locked:false,Data:dataStr,LastSaved:now,SavedBy:'Clinton Hayes'}],
      function(res3,err3){
        if(err3){
          if(indicator){ indicator.textContent = '⚠ Lock failed'; indicator.style.color = '#f87171'; }

        alert('✓ Locked as "'+versionLabel+'"\n\nThis version is now read-only and available in Version History.\nYou can continue editing the working copy.');
      });
    });
  });
  } // end doLockSteps
}

// ═══════════════════════════════════════════════════════════
// FIELD BUILDER HELPERS (no re-render on input)
// ═══════════════════════════════════════════════════════════
function el(tag, className, textContent) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (textContent !== undefined) e.textContent = textContent;
  return e;
}
function div(className) { return el('div', className); }

// Read-only display field for CRM-owned data — values shown but not editable.
// Use this for any client/policy field that lives in the CRM (the source of truth).
// `value` is shown as displayed text. `placeholder` shown when value is empty.
function roDisp(labelTxt, value, opts) {
  opts = opts || {};
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var box = document.createElement('div');
  var v = (value == null || value === '') ? '' : String(value);
  if (v) {
    box.textContent = v;
    box.style.cssText = 'border:1.5px solid var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fafaf6;color:#1a1a1a;min-height:20px;line-height:20px;'+(opts.style||'');
  } else {
    box.textContent = opts.placeholder || '— from CRM —';
    box.style.cssText = 'border:1.5px dashed var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:transparent;color:#9a9a8a;min-height:20px;line-height:20px;font-style:italic;'+(opts.style||'');
  }
  wrap.appendChild(box);
  return wrap;
}

// Text field: binds to obj[key], no render on input, optional blur callback
function fld(labelTxt, obj, key, opts) {
  opts = opts || {};
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var inp = document.createElement('input');
  inp.type = opts.type || 'text';
  inp.value = obj[key] || '';
  if (opts.placeholder) inp.placeholder = opts.placeholder;
  if (opts.readonly) inp.readOnly = true;
  inp.addEventListener('input', function (e) { obj[key] = e.target.value; });
  if (opts.onblur) inp.addEventListener('blur', function (e) { obj[key] = e.target.value; opts.onblur(e.target.value); });
  wrap.appendChild(inp);
  return wrap;
}

// Rand field
function rfld(labelTxt, obj, key, opts) {
  opts = opts || {};
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var rw = div('rw');
  var rp = el('span', 'rp', 'R');
  var inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric';
  inp.value = obj[key] || '';
  if (opts.readonly) inp.readOnly = true;
  inp.addEventListener('input', function (e) { obj[key] = e.target.value; });
  if (opts.onblur) inp.addEventListener('blur', function (e) { obj[key] = e.target.value; opts.onblur(e.target.value); });
  rw.appendChild(rp); rw.appendChild(inp);
  wrap.appendChild(rw);
  return wrap;
}

// Percent field
function pfld(labelTxt, obj, key, opts) {
  opts = opts || {};
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var pw = div('pw');
  var pp = el('span', 'pp', '%');
  var inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric';
  inp.value = obj[key] || '';
  if (opts.placeholder !== undefined && opts.placeholder !== '') inp.placeholder = opts.placeholder;
  if (opts.readonly) inp.readOnly = true;
  inp.addEventListener('input', function (e) { obj[key] = e.target.value; });
  if (opts.onblur) inp.addEventListener('blur', function (e) { obj[key] = e.target.value; opts.onblur(e.target.value); });
  pw.appendChild(inp); pw.appendChild(pp);
  wrap.appendChild(pw);
  return wrap;
}

// Select field
function sfld(labelTxt, obj, key, options) {
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var sel = document.createElement('select');
  options.forEach(function (o) {
    var opt = document.createElement('option');
    var v = typeof o === 'object' ? o.v : o;
    var l = typeof o === 'object' ? o.l : o;
    opt.value = v; opt.textContent = l;
    if (String(obj[key]) === String(v)) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function (e) { obj[key] = e.target.value; render(); });
  wrap.appendChild(sel);
  return wrap;
}

// Textarea
function txfld(labelTxt, obj, key) {
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var ta = document.createElement('textarea');
  ta.value = obj[key] || '';
  ta.addEventListener('input', function (e) { obj[key] = e.target.value; });
  wrap.appendChild(ta);
  return wrap;
}

// Radio group
function radioGrp(labelTxt, obj, key, options) {
  var wrap = div('f');
  if (labelTxt) { var lb = el('label'); lb.textContent = labelTxt; wrap.appendChild(lb); }
  var rg = div('rg');
  var gname = key + '_' + Math.random().toString(36).slice(2);
  options.forEach(function (o) {
    var v = typeof o === 'object' ? o.v : o;
    var l = typeof o === 'object' ? o.l : o;
    var lbl = document.createElement('label');
    var inp = document.createElement('input'); inp.type = 'radio'; inp.name = gname; inp.value = v;
    if (String(obj[key]) === String(v)) inp.checked = true;
    inp.addEventListener('change', function (e) { obj[key] = e.target.value; });
    lbl.appendChild(inp); lbl.appendChild(document.createTextNode(l));
    rg.appendChild(lbl);
  });
  wrap.appendChild(rg);
  return wrap;
}

// Add / Delete buttons
function addBtn(txt, onClick) {
  var b = document.createElement('button'); b.className = 'btn-add'; b.textContent = txt;
  b.addEventListener('click', onClick); return b;
}
function delBtn(onClick) {
  var b = el('button', 'btn-del', '✕'); b.type = 'button';
  b.addEventListener('click', onClick); return b;
}

// Section title
function stitle(txt) { return el('div', 'stitle', txt); }

// Grid helpers
function g2() { return div('g2'); }
function g3() { return div('g3'); }
function g4() { return div('g4'); }
