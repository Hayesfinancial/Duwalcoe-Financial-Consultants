    var estateBox = tinyBox('Gross Estate Build-Up');
    addLine(estateBox,'Physical assets',Rfmt(physVal));
    if(s4qPols>0) addLine(estateBox,'Policies to spouse (s.4(q))',Rfmt(s4qPols));
    if(estPols>0) addLine(estateBox,'Policies to estate',Rfmt(estPols));
    if(tpPols>0) addLine(estateBox,'Third party / trust policies',Rfmt(tpPols));
    if(bizDut>0) addLine(estateBox,'Business assurance deemed property',Rfmt(bizDut));
    addLine(estateBox,'Gross estate',Rfmt(grossEstate),true);
    addLine(estateBox,'Less liabilities', '('+Rfmt(physLiab)+')');
    if(cgt>0) addLine(estateBox,'Less CGT on death', '('+Rfmt(cgt)+')');
    addLine(estateBox,'Net estate before accrual / s.4(q)',Rfmt(netEstate),true,'#1d4ed8');
    grid.appendChild(estateBox);

    // ── Life Cover Structuring (calculations already hoisted above) ──

    var strBox = tinyBox('Life Cover Structuring');
    // Estate-payable section
    addLine(strBox,'ESTATE-PAYABLE','',true);
    if(physLiab>0)        addLine(strBox,'Bonds, vehicle finance, other liabs',Rfmt(physLiab));
    if(manLiab>0)         addLine(strBox,'Manual death liabilities',Rfmt(manLiab));
    if(cgt>0)             addLine(strBox,'CGT on death',Rfmt(cgt));
    if(estateDutyShare>0) addLine(strBox,'Estate duty (estate share)',Rfmt(estateDutyShare));
    if(execFees>0)        addLine(strBox,'Executor fees',Rfmt(Math.round(execFees)));
    if(accrualDed>0)      addLine(strBox,'Accrual payable to spouse',Rfmt(Math.round(accrualDed)));
    if(estateIncCap>0)    addLine(strBox,'Tagged needs (paid via estate)',Rfmt(estateIncCap));
    addLine(strBox,'Need',Rfmt(estPayNeed),true);
    if(estPols>0)    addLine(strBox,'Less: existing estate-payable policies', '('+Rfmt(estPols)+')');
    if(liquidCash>0) addLine(strBox,'Less: liquid estate cash', '('+Rfmt(liquidCash)+')');
    addLine(strBox,'New estate-payable cover to sell',Rfmt(estPayGap),true,estPayGap>0?'#b91c1c':'#166534');

    // Spouse-direct section
    addLine(strBox,'\u00a0','');
    addLine(strBox,'SPOUSE-DIRECT (s.4(q))','',true);
    if(spouseIncCap>0) addLine(strBox,'Income & capital needs (spouse-tagged)',Rfmt(spouseIncCap));
    addLine(strBox,'Need',Rfmt(spouseNeed),true);
    if(s4qPols>0) addLine(strBox,'Less: existing spouse-direct policies', '('+Rfmt(s4qPols)+')');
    addLine(strBox,'New spouse-direct cover to sell',Rfmt(spouseGap),true,spouseGap>0?'#b91c1c':'#166534');

    // Third-party sections (one per named beneficiary)
    Object.keys(tpByName).forEach(function(nm){
      var t = tpByName[nm];
      if(t.incCap===0 && t.polCover===0) return;
      var tpGap = Math.max(0, t.incCap - t.polCover);
      addLine(strBox,'\u00a0','');
      addLine(strBox,'THIRD PARTY \u2014 '+nm.toUpperCase(),'',true);
      if(t.incCap>0)   addLine(strBox,'Need (capital + capitalised income)',Rfmt(t.incCap));
      if(t.polCover>0) addLine(strBox,'Less: existing cover','('+Rfmt(t.polCover)+')');
      addLine(strBox,'New '+nm+' cover to sell',Rfmt(tpGap),true,tpGap>0?'#b91c1c':'#166534');
    });

    // Bottom line
    addLine(strBox,'\u00a0','');
    addLine(strBox,'TOTAL NEW LIFE COVER TO SELL',Rfmt(newCoverToSell),true,newCoverToSell>0?'#b91c1c':'#166534');

    grid.appendChild(strBox);
    s.appendChild(grid);

    // Closing note
    note(newCoverToSell>0
      ? 'The total new life cover to sell is <strong>'+Rfmt(newCoverToSell)+'</strong>. Each bucket above is a separate structuring instruction \u2014 the buckets cannot substitute for one another. Estate-payable cover must be paid into the estate; spouse-direct and third-party cover must be ceded or nominated to the named recipient.'
      : 'No new life cover required \u2014 existing cover meets the need in each bucket. Confirm beneficiary nominations on existing policies match this structure.', newCoverToSell>0?'red':'green');
  }

  if(S.scope.retirement){
    section('Retirement Lens');
    var rgrid = div(); rgrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';
    var incomeBox = tinyBox('Retirement Income Build-Up');
    addLine(incomeBox,'Retirement age',String(retAge));
    addLine(incomeBox,'Planning to age',String(retEndAge));
    addLine(incomeBox,'Years to retirement',String(yrsToRet!==null?yrsToRet:'—'));
    addLine(incomeBox,'Years in retirement',String(yrsInRet));
    addLine(incomeBox,'Monthly need at retirement',Rfmt(monthlyAtRet)+'/pm',true);
    if(rentalAtRet>0) addLine(incomeBox,'Less rental income at retirement',Rfmt(rentalAtRet)+'/pm');
    if(otherIncomeAtRet>0) addLine(incomeBox,'Less other retirement income',Rfmt(otherIncomeAtRet)+'/pm');
    if(manualIncomeAtRet>0) addLine(incomeBox,'Less manual income items at retirement',Rfmt(manualIncomeAtRet)+'/pm');
    addLine(incomeBox,'Net income gap to fund',Rfmt(netGapPM)+'/pm',true,'#1d4ed8');
    rgrid.appendChild(incomeBox);

    var capitalBox = tinyBox('Capital Build-Up');
    addLine(capitalBox,'Capital required for income gap',Rfmt(Math.max(0, retirementNeed - retLumps)));
    if(retLumps>0) addLine(capitalBox,'Retirement lump sums',Rfmt(retLumps));
    addLine(capitalBox,'Total capital required',Rfmt(retirementNeed),true);
    addLine(capitalBox,'Projected retirement capital',Rfmt(retirementHave),true,'#1d4ed8');
    addLine(capitalBox,'Retirement result', retirementGap===null ? '—' : resultText(retirementGap), true, retirementGap===null ? 'var(--navy)' : resultTone(retirementGap));
    if(retirementGap!==null && retirementGap<0 && yrsToRet>0){
      var _sfAB = Math.abs(retirementGap);
      var _rAB = (N(S.assump.growth)||9)/100;
      var _gAB = (N(S.assump.incEsc)||6)/100;
      var _nAB = yrsToRet;
      var _pmtAB;
      if(Math.abs(_rAB-_gAB)<0.0001){
        _pmtAB = Math.round(_sfAB / _nAB / Math.pow(1+_rAB, _nAB/2) / 12);
      } else {
        _pmtAB = Math.round(_sfAB * (_rAB-_gAB) / (Math.pow(1+_rAB,_nAB) - Math.pow(1+_gAB,_nAB)) / 12);
      }
      addLine(capitalBox,'Extra saving needed /pm (esc '+(N(S.assump.incEsc)||6)+'%)',Rfmt(_pmtAB),true,'#d97706');
    }
    rgrid.appendChild(capitalBox);
    s.appendChild(rgrid);
  }

  return s;
}


function buildOverview() {
  var s = div();
  var pols = S.importedPols || [];

  // Print button (hidden when printing)
  var printBtn = document.createElement('button');
  printBtn.textContent = '\u2399 Print / Save PDF';
  printBtn.style.cssText = 'float:right;background:var(--navy);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:12px';
  printBtn.onclick = function(){ window.print(); };
  printBtn.className = 'noprint';
  s.appendChild(printBtn);

  // ── RE-COMPUTE ALL GAPS (same logic as buildSummary pre-calc) ────────────
  var _smrO = N(S.cli.grossPM)>0 ? calcMarginalRate(N(S.cli.grossPM)*12) : 0.45;
  var _cgtO = calcTotalCGT(_smrO*100).totalCGT;
  var _physO = (S.props||[]).reduce(function(a,p){return a+N(p.val);},0)
    +(S.vehicles||[]).reduce(function(a,v){return a+N(v.val);},0)
    +(S.otherAssets||[]).reduce(function(a,x){return a+N(x.val);},0);
  var _liabsO = (S.props||[]).reduce(function(a,p){return a+N(p.bond);},0)
    +(S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0)
    +(S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
  var _s4qO=0,_epO=0,_tpO=0,_bdO=0;
  pols.forEach(function(p){
    if(p.Type==='Business Assurance'){if(p.EstateDutiable==='Yes')_bdO+=N(p.LoanAmount)||N(p.BenDeath);return;}
    var b=N(p.BenDeath);if(!b)return;
    var bt=p.BeneficiaryType||'';
    if(isS4qSpouse(bt))_s4qO+=b;
    else if(bt==='Estate')_epO+=b;
    else if(isDutiableNonSpouse(bt))_tpO+=b;
  });
  var _accO=0;
  if((S.cli.marital||'').indexOf('accrual')>-1){
    var _raO=pols.reduce(function(a,p){return POL_RA_TYPES.indexOf(p.Type)>-1?a+N(p.BenFundValue):a;},0);
    var _invO=pols.reduce(function(a,p){return POL_INV_TYPES.indexOf(p.Type)>-1?a+N(p.BenFundValue):a;},0);
    var _ceO=Math.max(0,_physO+_raO+_invO-_liabsO),_seO=N(S.accrual&&S.accrual.spouseCurrentAssets);
    var _csO=N(S.accrual&&S.accrual.clientStartVal),_ssO=N(S.accrual&&S.accrual.spouseStartVal);
    var _cexO=N(S.accrual&&S.accrual.clientExclusions),_sexO=N(S.accrual&&S.accrual.spouseExclusions);
    var _mdtO=S.cli.domDate?new Date(S.cli.domDate):null;
    var _ymrO=0; if(_mdtO&&!isNaN(_mdtO.getTime())) _ymrO=Math.max(0,(new Date().getTime()-_mdtO.getTime())/(365.25*24*60*60*1000));
    var _acfO=N(S.accrual&&S.accrual.cpiFactor)>0?N(S.accrual.cpiFactor):(_ymrO>0?Math.pow(1+(N(S.assump.cpi)||6)/100,_ymrO):1);
    _accO=Math.max(0,(Math.max(0,_ceO-_cexO-Math.round(_csO*_acfO))-Math.max(0,_seO-_sexO-Math.round(_ssO*_acfO)))/2);
  }
  var _grossO=_physO+_s4qO+_epO+_tpO+_bdO;
  var _netO=Math.max(0,_grossO-_liabsO-_cgtO);
  var _netAfAO=Math.max(0,_netO-_accO);
  var _s4qDedO=Math.min(_s4qO,_netAfAO);
  var _aftS4qO=Math.max(0,_netAfAO-_s4qDedO);
  var _dutO=Math.max(0,_aftS4qO-ABATEMENT);
  var _dutyO=_dutO<=DUTY_THRESH?_dutO*DUTY_RATE1:DUTY_THRESH*DUTY_RATE1+(_dutO-DUTY_THRESH)*DUTY_RATE2;
  var _execO=(_physO+_epO)*EXEC_RATE;
  var _totalEstCostO=Math.round(_dutyO+_execO);

  // Life cover need
  var _autoLO=0;
  (S.props||[]).forEach(function(p){if(N(p.bond)>0)_autoLO+=N(p.bond);});
  (S.vehicles||[]).forEach(function(v){if(N(v.finance)>0)_autoLO+=N(v.finance);});
  _autoLO+=_cgtO;
  if(S.scope.estate){
    function _apO(v){return (_aftS4qO>0&&_dutyO>0)?Math.round(_dutyO*(v/_aftS4qO)):0;}
    _autoLO+=_apO(_physO+_epO)+Math.round(_execO)+Math.round(_accO);
  }
  var _totLiabO=_autoLO+(S.deathLiabs||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var _totIncO=(S.deathIncome||[]).reduce(function(a,r){return a+calcIncomeNeed(r);},0);
  var _totCapO=(S.deathCapital||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var _deathNeedO=_totLiabO+_totIncO+_totCapO;
  var _deathHaveO=pols.reduce(function(a,p){return p.Type!=='Business Assurance'?a+N(p.BenDeath):a;},0);
  var _deathGapO=_deathHaveO-_deathNeedO;

  var _disIncO=(S.disIncome||[]).reduce(function(a,r){return a+calcIncomeNeed(r);},0);
  var _disCapO=(S.disCapital||[]).reduce(function(a,r){return a+N(r.amt);},0);
  var _disAutoO=0;
  (S.props||[]).forEach(function(p){ if(p.payOffIfDisabled && N(p.bond)>0) _disAutoO+=N(p.bond); });
  (S.vehicles||[]).forEach(function(v){ if(v.payOffIfDisabled && N(v.finance)>0) _disAutoO+=N(v.finance); });
  (S.liabilities||[]).forEach(function(l){ if(l.payOffIfDisabled && N(l.bal)>0) _disAutoO+=N(l.bal); });
  var _disTotO=_disIncO+_disCapO+_disAutoO;
  var _disHaveO=pols.reduce(function(a,p){return a+N(p.BenDisability);},0);
  var _dreadHaveO=pols.reduce(function(a,p){return a+N(p.BenDreadDisease);},0);
  var _ipHaveO=pols.reduce(function(a,p){
    var ib=[];try{ib=JSON.parse(p.IncomeBenefits||'[]');}catch(e){}
    return a+ib.reduce(function(s2,b){return s2+N(b.amount);},0);
  },0);

  // Liquidity
  var _liqCashO=(S.otherAssets||[]).reduce(function(sum,a){
    var tp=(a.type||'').toLowerCase();
    return sum+(tp.indexOf('business')>-1||tp.indexOf('farm')>-1||tp.indexOf('personal')>-1||tp.indexOf('inheritance')>-1?0:N(a.val));
  },0);
  var _liqProvO=_epO+_liqCashO;
  var _liqNeedO=_liabsO+(S.deathLiabs||[]).reduce(function(a,r){return a+N(r.amt);},0)+Math.round(_dutyO)+Math.round(_execO)+Math.round(_accO);
  var _liqGapO=_liqProvO-_liqNeedO;

  // Retirement
  var _cliAgeO=ageFrom(S.cli.dob),_retAgeO=N(S.cli.retAge)||65;
  var _yrsToRO=_cliAgeO?Math.max(0,_retAgeO-_cliAgeO):null;
  var _yrsInRetO=getYearsInRetirement(_retAgeO);
  var _retNeedO=0,_retHaveO=0,_retGapO=null;
  if(S.scope.retirement&&_yrsToRO&&_yrsInRetO>0){
    // Calculate net monthly gap at retirement — must match buildRetirement logic exactly
    var _ovMonthlyAtRet=0;
    (S.retNeeds||[]).forEach(function(r){
      if(!N(r.amtToday))return;
      var et=Ndef(r.esc, N(S.assump.cpi)||6);
      _ovMonthlyAtRet+=Math.round(N(r.amtToday)*Math.pow(1+et/100,_yrsToRO));
    });
    var _ovRentalAtRet=0;
    (S.props||[]).forEach(function(p){
      if(p.soldAtRetirement||!N(p.rental))return;
      var escTo=Ndef(p.rentalEsc, 6);
      _ovRentalAtRet+=Math.round(N(p.rental)*Math.pow(1+escTo/100,_yrsToRO));
    });
    var _ovOtherIncAtRet=0;
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')!=='Generates income (farm/business)')return;
      if(!N(a.retirementIncomePM))return;
      var escTo=Ndef(a.retirementIncEsc, N(S.assump.cpi)||6);
      _ovOtherIncAtRet+=Math.round(N(a.retirementIncomePM)*Math.pow(1+escTo/100,_yrsToRO));
    });
    var _ovManualIncAtRet=0;
    (S.retOtherIncome||[]).forEach(function(r){
      if(!N(r.amtPM))return;
      var escTo=Ndef(r.escTo, N(S.assump.cpi)||6);
      _ovManualIncAtRet+=Math.round(N(r.amtPM)*Math.pow(1+escTo/100,_yrsToRO));
    });
    var _ovNetGap=Math.max(0, _ovMonthlyAtRet - _ovRentalAtRet - _ovOtherIncAtRet - _ovManualIncAtRet);
    var _ovCpi=N(S.assump.cpi)||6;
    var _ovRetRet=N(S.assump.retReturn)||8;
    var _capNeedO = _ovNetGap > 0 ? capitalise(_ovNetGap, _yrsInRetO, _ovCpi, _ovRetRet) : 0;
    _retNeedO=_capNeedO+(S.retLumps||[]).reduce(function(a,r){return a+N(r.amt);},0);
    _retHaveO=S.retAssets.reduce(function(a,r){
      if(!N(r.currentVal)&&!N(r.monthlyContrib))return a;
      var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
      var ec=Ndef(r.contribEsc, N(S.assump.incEsc)||6);
      var matAge=N(r.maturityAge);
      if(matAge>0&&_cliAgeO&&matAge<_retAgeO && !r.continuePastMaturity){
        var yrsToMat=Math.max(0,matAge-_cliAgeO);
        var matVal=projectFund(r.currentVal,r.monthlyContrib,ec,gr,yrsToMat);
        var yrsMatToRet=_retAgeO-matAge;
        return a+Math.round(matVal*Math.pow(1+gr/100,yrsMatToRet));
      }
      return a+projectFund(r.currentVal,r.monthlyContrib,ec,gr,_yrsToRO);
    },0);
    // Manual lump sums at retirement — each at own growth rate
    (S.retOtherLumps||[]).forEach(function(r){
      if(!N(r.amt))return;
      var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
      _retHaveO+=Math.round(N(r.amt)*Math.pow(1+gr/100,_yrsToRO));
    });
    (S.props||[]).forEach(function(p){
      if(!p.soldAtRetirement||!N(p.val))return;
      var gr=Ndef(p.propGrowth, N(S.assump.growth)||9);
      _retHaveO+=Math.round(N(p.val)*Math.pow(1+gr/100,_yrsToRO)*Ndef(p.retirementPct, 100)/100);
    });
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')==='Sold at retirement — proceeds to retirement'&&N(a.retirementSaleProceeds)){
        var gr=Ndef(a.growthRate, N(S.assump.growth)||9);
        _retHaveO+=Math.round(N(a.retirementSaleProceeds)*Math.pow(1+gr/100,_yrsToRO));
      }
    });
    _retGapO=_retHaveO-_retNeedO;
  }

  // ── SUMMARY TABLE ────────────────────────────────────────────────────────
  function pctFmt(need,have){
    if(!need||need===0) return '\u2014';
    var p=Math.round(have/need*100);
    return p+'%';
  }
  function pctStyle(need,have){
    if(!need) return 'color:#999';
    var p=have/need*100;
    return 'color:'+(p>=100?'#16a34a':p>=75?'#d97706':'#dc2626')+';font-weight:700';
  }

  var sumDiv=div(); sumDiv.style.cssText='margin-bottom:20px';

  var sumTbl=document.createElement('table');
  sumTbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px';
  sumTbl.innerHTML='<thead><tr>'
    +'<th style="text-align:left;padding:8px 10px;background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px">Event</th>'
    +'<th style="text-align:right;padding:8px 10px;background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px">Provisions</th>'
    +'<th style="text-align:right;padding:8px 10px;background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px">Need</th>'
    +'<th style="text-align:right;padding:8px 10px;background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px">Surplus / Deficit</th>'
    +'<th style="text-align:right;padding:8px 10px;background:var(--navy);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px">% Funded</th>'
    +'</tr></thead>';
  var stb=document.createElement('tbody');
  var _ri=0;
  function sRow(label,have,need,sub){
    var tr=document.createElement('tr');
    var bg=sub?'#fafafa':(_ri%2===0?'#fff':'#f8f8f8');
    _ri++;
    var gap=have-need;
    var gapTxt=need>0?(gap>=0?'\u25b2 '+Rfmt(gap):'\u25bc '+Rfmt(Math.abs(gap))):'\u2014';
    var gapCol=need>0?(gap>=0?'#16a34a':'#dc2626'):'#999';
    tr.innerHTML='<td style="padding:'+(sub?'4':'8')+'px 10px'+(sub?';padding-left:22px':'')+'border-bottom:1px solid #eef;'+(sub?'font-size:11px;color:#666':'font-weight:600;color:#1a2a2e')+';background:'+bg+'">'+label+'</td>'
      +'<td style="text-align:right;padding:'+(sub?'4':'8')+'px 10px;border-bottom:1px solid #eef;background:'+bg+'">'+( have>0?Rfmt(have):'\u2014')+'</td>'
      +'<td style="text-align:right;padding:'+(sub?'4':'8')+'px 10px;border-bottom:1px solid #eef;background:'+bg+'">'+( need>0?Rfmt(need):'\u2014')+'</td>'
      +'<td style="text-align:right;padding:'+(sub?'4':'8')+'px 10px;border-bottom:1px solid #eef;font-weight:700;color:'+gapCol+';background:'+bg+'">'+gapTxt+'</td>'
      +'<td style="text-align:right;padding:'+(sub?'4':'8')+'px 10px;border-bottom:1px solid #eef;'+pctStyle(need,have)+';background:'+bg+'">'+pctFmt(need,have)+'</td>';
    stb.appendChild(tr);
  }
  function sCatRow(label){
    var tr=document.createElement('tr');
    tr.innerHTML='<td colspan="5" style="padding:8px 10px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);background:#f4f4f0;border-top:2px solid var(--mist)">'+label+'</td>';
    stb.appendChild(tr); _ri=0;
  }

  if(S.scope.death||S.scope.disability||S.scope.dread||S.scope.ip){
    sCatRow('Protection');
    if(S.scope.death){
      sRow('Life cover',_deathHaveO,_deathNeedO);
      if(_totLiabO>0) sRow('\u2514 Liabilities & estate costs: '+Rfmt(_totLiabO)+(S.scope.estate?' (incl. est. duty)':''),0,0,true);
      if(_totIncO>0)  sRow('\u2514 Income replacement (capitalised): '+Rfmt(_totIncO),0,0,true);
      if(_totCapO>0)  sRow('\u2514 Capital needs: '+Rfmt(_totCapO),0,0,true);
    }
    if(S.scope.disability) sRow('Disability (lump sum)',_disHaveO,_disTotO);
    if(S.scope.dread)       sRow('Dread disease / trauma',_dreadHaveO,N(S.dreadAmt));
    if(S.scope.ip)          sRow('Income protection /pm',_ipHaveO,N(S.ipGrossPM||S.ipNettPM));
  }
  if(S.scope.estate&&_totalEstCostO>0){
    sCatRow('Estate (context)');
    sRow('\u2514 Estate duty: '+Rfmt(Math.round(_dutyO))+(Math.round(_execO)>0?' + Executor: '+Rfmt(Math.round(_execO)):'')+' (already in life cover need above)',0,0,true);
  }
  if(S.scope.retirement&&_retGapO!==null){
    sCatRow('Retirement (age '+_retAgeO+')');
    sRow('Capital at retirement',_retHaveO,_retNeedO);
  }
  sumTbl.appendChild(stb);
  sumDiv.appendChild(sumTbl);
  s.appendChild(sumDiv);

  // ── DISCLOSURES ──────────────────────────────────────────────────────────
  var discTitle=el('div','stitle','Disclosures'); discTitle.style.margin='20px 0 8px'; s.appendChild(discTitle);
  var discBox=div(); discBox.style.cssText='background:#f4f4f0;border:1px solid #dde0e8;border-radius:7px;padding:14px 16px;font-size:11px;color:#444;line-height:1.7;margin-bottom:16px';
  discBox.innerHTML='<p style="margin-bottom:6px">The value of financial products and portfolios can increase or decrease depending on the value of underlying securities and market conditions. Past performance and forecasts are not reliable indicators of future performance.</p>'
    +'<p style="margin-bottom:6px">The validity and accuracy of any illustrations or forecasts are not guaranteed; they are provided for illustrative purposes only. All maturity values are as per the illustrative rate specified — the final return will be affected by the actual rate of return achieved on the investment portfolio after investment costs are deducted.</p>'
    +'<p style="margin-bottom:6px">This proposal has been prepared with utmost care and is based upon the information provided by you. It forms the basis of the advice provided. Please check <strong>all</strong> information to ensure its accuracy and provide amended detail if needed <strong>prior</strong> to the finalisation of any financial product or investment. Duwalcoe Financial Consultants CC cannot be held liable for losses arising from incorrect information provided and/or not corrected at this stage.</p>'
    +'<p>All portfolio information has been captured as provided by the respective product providers.</p>';
  s.appendChild(discBox);

  // ── SIGNATURE BLOCK ──────────────────────────────────────────────────────
  var sigTitle=el('div','stitle','Acceptance'); sigTitle.style.margin='20px 0 8px'; s.appendChild(sigTitle);
  var sigInfo=div('info'); sigInfo.textContent='By signing below, the client confirms they have read and understood the disclosures above and that the information in this FNA is accurate to the best of their knowledge.'; s.appendChild(sigInfo);

  var today2=new Date().toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'});
  var sigGrid=div(); sigGrid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:20px';

  function sigBlock(label, prefill){
    var blk=div(); blk.style.cssText='display:flex;flex-direction:column;gap:6px';
    var lbl=el('div','',label); lbl.style.cssText='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)'; blk.appendChild(lbl);
    var line=div(); line.style.cssText='border-bottom:1.5px solid #333;min-height:32px;padding-bottom:4px;font-size:13px;font-weight:600;color:#1a2a2e'; if(prefill) line.textContent=prefill; blk.appendChild(line);
    var dateLbl=el('div','','Date: '+today2); dateLbl.style.cssText='font-size:10px;color:#888;margin-top:6px'; blk.appendChild(dateLbl);
    return blk;
  }
  sigGrid.appendChild(sigBlock('Signature: Client', S.cli.name||''));
  sigGrid.appendChild(sigBlock('Signature: Adviser', 'Clinton Hayes'));
  s.appendChild(sigGrid);

  var discSub=div(); discSub.style.cssText='font-size:9.5px;color:#aaa;text-align:center;margin-top:28px;padding-top:12px;border-top:1px solid #dde0e8';
  discSub.innerHTML='Duwalcoe Financial Consultants CC &nbsp;|&nbsp; FSP No: 9978 &nbsp;|&nbsp; T: 031 763 5194 &nbsp;|&nbsp; clinton@duwalcoe.co.za';
  s.appendChild(discSub);

  return s;
}

function buildROATab() {
  var s = div();
  if (!S.roa) S.roa = {};
  var r = S.roa;
  if (!r.needsRows) r.needsRows = [
    { area:'Life Cover',              quantified:'', priority:'', addressed:'', shortfall:'', review:'' },
    { area:'Disability',              quantified:'', priority:'', addressed:'', shortfall:'', review:'' },
    { area:'Dread Disease / Trauma',  quantified:'', priority:'', addressed:'', shortfall:'', review:'' },

  function roaSec(title, key, ph, ht) {

    + '<th style="width:18%">Shortfall / Notes</th>'
    + '<th style="width:12%">Review Date</th>'
    + '</tr></thead>';
  var tb = document.createElement('tbody');

  // Pre-populate from FNA where possible
  function fnaHint(rowIdx) {
    var pols = S.importedPols || [];
    switch(rowIdx) {
      case 0: // Life cover
        var need = S.deathLiabs.reduce(function(a,x){return a+N(x.amt);},0)
                 + S.deathIncome.reduce(function(a,x){return a+calcIncomeNeed(x);},0)
                 + S.deathCapital.reduce(function(a,x){return a+N(x.amt);},0);
        var have = pols.reduce(function(a,p){return p.Type!=='Business Assurance'?a+N(p.BenDeath):a;},0);
        return need > 0 ? 'FNA need: '+Rfmt(need)+' / Have: '+Rfmt(have) : '';
      case 1: // Disability
        var dn = S.disIncome.reduce(function(a,x){return a+calcIncomeNeed(x);},0)+S.disCapital.reduce(function(a,x){return a+N(x.amt);},0);

        (S.liabilities||[]).forEach(function(l){ if(l.payOffIfDisabled && N(l.bal)>0) dn+=N(l.bal); });
        var dh = pols.reduce(function(a,p){return a+N(p.BenDisability);},0);
        return dn > 0 ? 'FNA need: '+Rfmt(dn)+' / Have: '+Rfmt(dh) : '';
      case 2: // Dread
        var drh = pols.reduce(function(a,p){return a+N(p.BenDreadDisease);},0);
        return N(S.dreadAmt) > 0 ? 'FNA need: '+Rfmt(S.dreadAmt)+' / Have: '+Rfmt(drh) : '';
      case 3: // IP
        return N(S.ipGrossPM) > 0 ? 'FNA need: '+Rfmt(S.ipGrossPM)+'/pm gross' : '';

        var cliAge=ageFrom(S.cli.dob), retAge=N(S.cli.retAge)||65, yrsToR=cliAge?Math.max(0,retAge-cliAge):null;
        if(!yrsToR) return '';
        var totalProj=S.retAssets.reduce(function(a,r2){if(!N(r2.currentVal)&&!N(r2.monthlyContrib))return a;var g=Ndef(r2.growthRate, S.assump.growth);var e=Ndef(r2.contribEsc, S.assump.incEsc);return a+projectFund(r2.currentVal,r2.monthlyContrib,e,g,yrsToR);},0);
        var mNeed=(S.retNeeds&&S.retNeeds.length>0)?S.retNeeds.reduce(function(a,r2){return a+N(r2.amtToday);},0):N(S.retIncomeToday)+N(S.retMedAidToday)+N(S.retOtherMonthly);
        var capNeed=retirementCapitalNeeded(mNeed,yrsToR,getYearsInRetirement(retAge),S.assump.cpi,S.assump.retReturn);
        var gap=totalProj-capNeed;
        return capNeed>0?'FNA: need '+Rfmt(capNeed)+' / have '+Rfmt(totalProj)+(gap<0?' \u25bc '+Rfmt(Math.abs(gap))+' shortfall':' \u25b2 surplus'):'';
      default: return '';

  b2.addEventListener('click', saveFile); brow.appendChild(b2);
  s.appendChild(brow);

}

  h+='</div>';

  h+='<div><div class="sig-line">Adviser Signature &amp; Date</div></div>';

  var ov = document.createElement('div');

  // Select all / none
  var selRow = document.createElement('div');
  selRow.style.cssText = 'display:flex;gap:12px;margin:10px 0 16px;padding-left:10px';
  selRow.innerHTML = '<a href="#" style="font-size:11px;color:#0e413a" onclick="event.preventDefault();document.querySelectorAll(\'[id^=prt_]\').forEach(function(c){c.checked=true})">Select all</a>'
    +'<a href="#" style="font-size:11px;color:#9e2a2b" onclick="event.preventDefault();document.querySelectorAll(\'[id^=prt_]\').forEach(function(c){c.checked=false})">Clear all</a>';
  box.appendChild(selRow);
  // Buttons
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;justify-content:flex-end;gap:8px';

  cancelBtn.style.cssText = 'padding:8px 18px;border-radius:7px;border:1.5px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#555';
  cancelBtn.onclick = function(){ document.body.removeChild(ov); };
  var printBtn = document.createElement('button');
  printBtn.textContent = '🖨 Print';

function printFNA(sections) {
  if(!sections) sections = {client:true,assets:true,policies:true,needs:true,retirement:true,estate:true,summary:true};
  persist();
  var pols = S.importedPols || [];
  var today = new Date().toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'});

  function e(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function r(v){ var n=parseFloat(String(v||'').replace(/[^0-9.-]/g,'')); return isNaN(n)||n===0?'&#8212;':'R&#160;'+Math.round(n).toLocaleString('en-ZA'); }
  function p2(v){ var n=N(v); return n>0?n+'%':'&#8212;'; }
  function row(lbl,val,bold,indent){
    return '<tr'+(bold?' style="font-weight:700;background:#f0f4fa"':'')+'>'
      +'<td style="padding:4px 8px;border-bottom:1px solid #eef;'+(indent?'padding-left:20px;color:#555':'font-weight:'+(bold?'700':'400'))+'">'+lbl+'</td>'
      +'<td style="text-align:right;padding:4px 8px;border-bottom:1px solid #eef;'+(bold?'font-weight:700':'')+'">'+val+'</td></tr>';
  }
  function sec(title){
    return '<h2 style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#0e413a;'
      +'border-bottom:1.5px solid #a8b938;padding-bottom:3px;margin:14px 0 7px">'+title+'</h2>';
  }
  function tblHead(heads){
    return '<table style="width:100%;border-collapse:collapse;font-size:10px;margin-bottom:10px"><thead><tr>'
      +heads.map(function(hd,i){return '<th style="background:#0e413a;color:#fff;padding:5px 7px;text-align:'+(i>0?'right':'left')+';font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">'+hd+'</th>';}).join('')
      +'</tr></thead><tbody>';
  }
  function td(v,right,bold){
    return '<td style="padding:4px 7px;border-bottom:1px solid #eef;vertical-align:top;'+(right?'text-align:right;':'')+(bold?'font-weight:700;':'')+'">'+v+'</td>';
  }
  function navyBox(rows){
    return '<div style="background:#0e413a;color:#fff;border-radius:6px;padding:11px 14px;margin-bottom:10px;font-size:10.5px">'+rows+'</div>';
  }
  function nrow(lbl,val,bold,sub){
    return '<div style="display:flex;justify-content:space-between;padding:'+(bold?'6':'3')+'px 0;'
      +(bold?'border-top:1px solid #334;margin-top:4px;font-weight:700;':'')
      +(sub?'padding-left:12px;':'')
      +'">'
      +'<span style="color:'+(sub?'#8899bb':'#ccd6f6')+'">'+lbl+'</span>'
      +'<span style="color:#f0f9d4">'+val+'</span></div>';
  }

  // Shared calculations
  var cliAge = ageFrom(S.cli.dob);
  var retAge = N(S.cli.retAge)||65;
  var yrsToRet = cliAge ? Math.max(0,retAge-cliAge) : null;
  var yrsInRet = getYearsInRetirement(retAge);

  var physAssets=(S.props||[]).reduce(function(a,p){return a+N(p.val);},0)
    +(S.vehicles||[]).reduce(function(a,v){return a+N(v.val);},0)
    +(S.otherAssets||[]).reduce(function(a,x){return a+N(x.val);},0);
  var physLiab=(S.props||[]).reduce(function(a,p){return a+N(p.bond);},0)
    +(S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0)
    +(S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);

  var s4qPols=0,estPols=0,tpPols=0,bizDut=0,s4qAssets=0;
  pols.forEach(function(p){
    if(p.Type==='Business Assurance'){if(p.EstateDutiable==='Yes')bizDut+=N(p.LoanAmount)||N(p.BenDeath);return;}
    var b=N(p.BenDeath);if(!b)return;
    var bt=p.BeneficiaryType||'';
    if(isS4qSpouse(bt)) s4qPols+=b;
    else if(bt==='Estate') estPols+=b;
    else if(isDutiableNonSpouse(bt)) tpPols+=b;
  });
  (S.props||[]).forEach(function(p){if((p.deathBenType||'Estate')==='Spouse')s4qAssets+=N(p.val)-N(p.bond);});
  (S.vehicles||[]).forEach(function(v){if((v.deathBenType||'Estate')==='Spouse')s4qAssets+=N(v.val)-N(v.finance);});

  var _emr=N(S.cli.grossPM)>0?calcMarginalRate(N(S.cli.grossPM)*12):0.45;
  var _cgtResult=calcTotalCGT(_emr*100);
  var _cgtTotal=_cgtResult.totalCGT;

  var accrualClaim=0;
  if((S.cli.marital||'').indexOf('accrual')>-1){
    var _ra=pols.reduce(function(a,p){return POL_RA_TYPES.indexOf(p.Type)>-1?a+N(p.BenFundValue):a;},0);
    var _invP=pols.reduce(function(a,p){return POL_INV_TYPES.indexOf(p.Type)>-1?a+N(p.BenFundValue):a;},0);
    var _ce=Math.max(0,physAssets+_ra+_invP-physLiab),_se=N(S.accrual&&S.accrual.spouseCurrentAssets);
    var _cs=N(S.accrual&&S.accrual.clientStartVal),_ss=N(S.accrual&&S.accrual.spouseStartVal);
    var _cexP=N(S.accrual&&S.accrual.clientExclusions),_sexP=N(S.accrual&&S.accrual.spouseExclusions);
    var _mdtP=S.cli.domDate?new Date(S.cli.domDate):null;
    var _ymrP=0; if(_mdtP&&!isNaN(_mdtP.getTime())) _ymrP=Math.max(0,(new Date().getTime()-_mdtP.getTime())/(365.25*24*60*60*1000));
    var _acfP=N(S.accrual&&S.accrual.cpiFactor)>0?N(S.accrual.cpiFactor):(_ymrP>0?Math.pow(1+(N(S.assump.cpi)||6)/100,_ymrP):1);
    accrualClaim=Math.max(0,(Math.max(0,_ce-_cexP-Math.round(_cs*_acfP))-Math.max(0,_se-_sexP-Math.round(_ss*_acfP)))/2);
  }

  var grossEstate=physAssets+s4qPols+estPols+tpPols+bizDut;
  var netEstate=Math.max(0,grossEstate-physLiab-_cgtTotal);
  var accrualDed=Math.min(accrualClaim,netEstate);
  var afterAccrual=Math.max(0,netEstate-accrualDed);
  var s4qDed=Math.min(s4qPols+s4qAssets,afterAccrual);
  var afterS4q=Math.max(0,afterAccrual-s4qDed);
  var dutiable=Math.max(0,afterS4q-ABATEMENT);
  var estateDuty=dutiable<=DUTY_THRESH?dutiable*DUTY_RATE1:DUTY_THRESH*DUTY_RATE1+(dutiable-DUTY_THRESH)*DUTY_RATE2;
  var execFees=(physAssets+estPols)*EXEC_RATE;
  function apDuty(v){return(afterS4q>0&&estateDuty>0)?Math.round(estateDuty*(v/afterS4q)):0;}
  var dutyEstate=apDuty(physAssets+estPols);

  // Death needs
  var autoLiabsP=[];
  (S.props||[]).forEach(function(p){if(N(p.bond)>0)autoLiabsP.push({desc:(p.desc||'Property')+' \u2014 bond outstanding',amt:N(p.bond)});});
  (S.vehicles||[]).forEach(function(v){if(N(v.finance)>0)autoLiabsP.push({desc:(v.desc||'Vehicle')+' \u2014 finance outstanding',amt:N(v.finance)});});
  if(_cgtTotal>0) autoLiabsP.push({desc:'CGT on death (estimated)',amt:_cgtTotal});
  if(S.scope.estate){
    if(dutyEstate>0) autoLiabsP.push({desc:'Estate duty \u2014 estate\'s share',amt:dutyEstate});
    if(execFees>0) autoLiabsP.push({desc:'Executor fees (4.025%)',amt:Math.round(execFees)});
    if(accrualDed>0) autoLiabsP.push({desc:'Accrual payable to spouse',amt:Math.round(accrualDed)});
  }
  var autoLiabTotal=autoLiabsP.reduce(function(a,x){return a+x.amt;},0);
  var manLiabTotal=(S.deathLiabs||[]).reduce(function(a,rn){return a+N(rn.amt);},0);
  var totLiab=autoLiabTotal+manLiabTotal;
  var totInc=(S.deathIncome||[]).reduce(function(a,rn){return a+calcIncomeNeed(rn);},0);
  var totCap=(S.deathCapital||[]).reduce(function(a,rn){return a+N(rn.amt);},0);
  var totalDeathNeed=totLiab+totInc+totCap;
  var totalDeathHave=pols.reduce(function(a,p){return p.Type!=='Business Assurance'?a+N(p.BenDeath):a;},0);

  // Retirement
  var rentalAtRetP=0;
  (S.props||[]).forEach(function(p){
    if(p.soldAtRetirement||!N(p.rental)||!yrsToRet) return;
    var esc=Ndef(p.rentalEsc, 6);
    rentalAtRetP+=Math.round(N(p.rental)*Math.pow(1+esc/100,yrsToRet));
  });
  var otherIncAtRetP=0;
  (S.otherAssets||[]).forEach(function(a){
    if((a.retirementRole||'')!=='Generates income (farm/business)'||!N(a.retirementIncomePM)||!yrsToRet) return;
    var esc=Ndef(a.retirementIncEsc, N(S.assump.cpi)||6);
    otherIncAtRetP+=Math.round(N(a.retirementIncomePM)*Math.pow(1+esc/100,yrsToRet));
  });
  var manualIncAtRetP=0;
  (S.retOtherIncome||[]).forEach(function(r){
    if(!N(r.amtPM)||!yrsToRet) return;
    var esc=Ndef(r.escTo, N(S.assump.cpi)||6);
    manualIncAtRetP+=Math.round(N(r.amtPM)*Math.pow(1+esc/100,yrsToRet));
  });
  var capNeedP=0;
  // Calculate net monthly gap at retirement — must match buildRetirement logic
  var _prMonthlyAtRet=0;
  (S.retNeeds||[]).forEach(function(rn){
    if(!N(rn.amtToday)) return;
    var escTo=Ndef(rn.esc, N(S.assump.cpi)||6);
    _prMonthlyAtRet+=Math.round(N(rn.amtToday)*Math.pow(1+escTo/100,yrsToRet||0));
  });
  var _prNetGap=Math.max(0, _prMonthlyAtRet - rentalAtRetP - otherIncAtRetP - manualIncAtRetP);
  var _prCpi=N(S.assump.cpi)||6;
  var _prRetRet=N(S.assump.retReturn)||8;
  capNeedP = _prNetGap > 0 ? capitalise(_prNetGap, yrsInRet, _prCpi, _prRetRet) : 0;
  var lumpNeedP=(S.retLumps||[]).reduce(function(a,rn){return a+N(rn.amt);},0);
  var totalCapNeedP=capNeedP+lumpNeedP;
  var _prCliAge=ageFrom(S.cli.dob)||0;
  var totalProjP=S.retAssets.reduce(function(a,rn){
    if(!N(rn.currentVal)&&!N(rn.monthlyContrib)) return a;
    var gr=Ndef(rn.growthRate, N(S.assump.growth)||9);
    var esc=Ndef(rn.contribEsc, N(S.assump.incEsc)||6);
    var matAge=N(rn.maturityAge);
    if(matAge>0&&_prCliAge&&matAge<retAge && !rn.continuePastMaturity){
      var yrsToMat=Math.max(0,matAge-_prCliAge);
      var matVal=projectFund(rn.currentVal,rn.monthlyContrib,esc,gr,yrsToMat);
      var yrsMatToRet=retAge-matAge;
      return a+Math.round(matVal*Math.pow(1+gr/100,yrsMatToRet));
    }
    return a+projectFund(rn.currentVal,rn.monthlyContrib,esc,gr,yrsToRet||0);
  },0);
  // Manual lump sums at retirement — each at own growth rate
  (S.retOtherLumps||[]).forEach(function(r){
    if(!N(r.amt)||!yrsToRet) return;
    var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
    totalProjP+=Math.round(N(r.amt)*Math.pow(1+gr/100,yrsToRet));
  });
  var propSoldP=0;
  (S.props||[]).forEach(function(p){
    if(!p.soldAtRetirement||!N(p.val)||!yrsToRet) return;
    var gr=Ndef(p.propGrowth, N(S.assump.growth)||9);
    var projV=Math.round(N(p.val)*Math.pow(1+gr/100,yrsToRet));
    var pct=Ndef(p.retirementPct, 100);
    propSoldP+=Math.round(projV*pct/100);
  });
  totalProjP+=propSoldP;
  var laIncAtRetP=0;
  var laIncPolsP=(pols||[]).filter(function(p){return p.Type==='Living Annuity'&&N(p.BenLAIncome)>0;});
  laIncPolsP.forEach(function(p){
    var esc=(function(r){return r>0?r:N(S.assump.cpi)||6;})(laEscRate(p));
    laIncAtRetP+=yrsToRet?Math.round((N(p.BenLAIncome)+N(p.LABonus||0))*Math.pow(1+esc/100,yrsToRet)):(N(p.BenLAIncome)+N(p.LABonus||0));
  });
  var lifeAnnPolsP=(pols||[]).filter(function(p){return p.Type==='Life Annuity'&&N(p.BenLifeAnnuityIncome)>0;});
  lifeAnnPolsP.forEach(function(p){
    var esc=Ndef(p.LifeAnnuityEsc, N(S.assump.cpi)||6);
    laIncAtRetP+=yrsToRet?Math.round(N(p.BenLifeAnnuityIncome)*Math.pow(1+esc/100,yrsToRet)):N(p.BenLifeAnnuityIncome);
  });
  var retGapP=totalProjP-totalCapNeedP;

  // Liquidity variables — used on Page 6 and Page 7
  var liqCashP=(S.otherAssets||[]).reduce(function(sum,a){
    var tp=(a.type||'').toLowerCase();
    var illiq=tp.indexOf('business')>-1||tp.indexOf('farm')>-1||tp.indexOf('personal')>-1||tp.indexOf('inheritance')>-1;
    return sum+(illiq?0:N(a.val));
  },0);
  var liqProvsP=estPols+liqCashP;
  var liqNeedP=physLiab+manLiabTotal+Math.round(dutyEstate)+Math.round(execFees)+Math.round(accrualDed);
  var liqGapP=liqProvsP-liqNeedP;

  // Disability / dread / IP have values — used on Page 7
  var disHaveP=pols.reduce(function(a,p){return a+N(p.BenDisability);},0);
  var dreadHaveP=pols.reduce(function(a,p){return a+N(p.BenDreadDisease);},0);
  var ipHaveP=pols.reduce(function(a,p){
    var ib=[];try{ib=JSON.parse(p.IncomeBenefits||'[]');}catch(e){}
    return a+ib.reduce(function(s2,b){return s2+N(b.amount);},0);
  },0);

  // CSS
  var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FNA \u2014 '+e(S.cli.name)+'</title><style>';
  h+='*{box-sizing:border-box;margin:0;padding:0}';
  h+='body{font-family:Arial,Helvetica,sans-serif;font-size:10.5px;color:#0e413a;line-height:1.45}';
  h+='@media print{@page{margin:12mm 14mm;size:A4}.pb{page-break-before:always}.noprint{display:none}}';
  h+='@media screen{body{max-width:880px;margin:0 auto;padding:20px}}';
  h+='.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #a8b938;padding-bottom:6px;margin-bottom:10px}';
  h+='.cliName{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#0e413a}';
  h+='.adv{text-align:right;font-size:9.5px;color:#555;line-height:1.6}';
  h+='.adv strong{font-size:11px;color:#0e413a;display:block}';
  h+='table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:10px}';
  h+='th{background:#0e413a;color:#fff;padding:5px 7px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}';
  h+='td{padding:4px 7px;border-bottom:1px solid #eef;vertical-align:top}';
  h+='tr:nth-child(even) td{background:#f8f9fc}';
  h+='.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 16px;margin-bottom:10px}';
  h+='.lbl{font-size:8.5px;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-bottom:1px}';
  h+='.val{font-weight:700;font-size:10.5px;color:#0e413a}';
  h+='.surp{color:#16a34a}.short{color:#dc2626}';

        +'<td class="r b">'+R(equity)+'</td></tr>';
    });
    h += '<tr class="subtotal"><td>Property Total</td><td class="r">'+R(totPropVal)+'</td><td class="r">'+(totPropBond>0?'('+R(totPropBond)+')':'&#8212;')+'</td><td class="r"></td><td class="r">'+R(totPropVal-totPropBond)+'</td></tr>';
    h += '</tbody></table>';
  }

  // Vehicles
  if((S.vehicles||[]).some(function(v){return N(v.val)>0;})){
    h += '<table><thead><tr><th>Vehicle</th><th class="r">Market Value</th><th class="r">Finance Outstanding</th><th class="r">Net Value</th></tr></thead><tbody>';
    (S.vehicles||[]).forEach(function(v){
      if(!N(v.val)) return;
      var net=N(v.val)-N(v.finance);
      h += '<tr><td>'+e(v.desc||'Vehicle')+'</td>'
        +'<td class="r">'+R(v.val)+'</td>'
        +'<td class="r">'+(N(v.finance)>0?'('+R(v.finance)+')':'&#8212;')+'</td>'
        +'<td class="r b">'+R(net)+'</td></tr>';
    });
    h += '<tr class="subtotal"><td>Vehicle Total</td><td class="r">'+R(totVehVal)+'</td><td class="r">'+(totVehFin>0?'('+R(totVehFin)+')':'&#8212;')+'</td><td class="r">'+R(totVehVal-totVehFin)+'</td></tr>';
    h += '</tbody></table>';
  }

  // Other assets
  if((S.otherAssets||[]).some(function(a){return N(a.val)>0;})){
    h += '<table><thead><tr><th>Other Asset</th><th>Type</th><th class="r">Value</th></tr></thead><tbody>';
    (S.otherAssets||[]).forEach(function(a){
      if(!N(a.val)) return;
      h += '<tr><td>'+e(a.desc||'Asset')+'</td><td style="font-size:9.5px;color:#555">'+e(a.type||'')+'</td><td class="r">'+R(a.val)+'</td></tr>';
    });
    h += '<tr class="subtotal"><td colspan="2">Other Assets Total</td><td class="r">'+R(totOthVal)+'</td></tr>';
    h += '</tbody></table>';
  }

  // Retirement & Investment fund values
  var raList=pols.filter(function(p){return POL_RA_TYPES.indexOf(p.Type)>-1&&N(p.BenFundValue)>0;});
  var invList=pols.filter(function(p){return POL_INV_TYPES.indexOf(p.Type)>-1&&N(p.BenFundValue)>0;});
  if(raList.length>0||invList.length>0){
    h += '<table><thead><tr><th>Investment / Retirement Fund</th><th>Type</th><th class="r">Fund Value</th></tr></thead><tbody>';
    raList.concat(invList).forEach(function(p){
      h += '<tr><td>'+e((p.Insurer||'')+(p.Product?' — '+p.Product:''))+'</td>'
        +'<td style="font-size:9.5px;color:#555">'+e(p.Type)+'</td>'
        +'<td class="r">'+R(p.BenFundValue)+'</td></tr>';
    });
    if(totRetFV+totInvFV>0){
      h += '<tr class="subtotal"><td colspan="2">Funds Total</td><td class="r">'+R(totRetFV+totInvFV)+'</td></tr>';
    }
    h += '</tbody></table>';
  }

  // ── LIABILITIES
  h += '<h2>Liabilities</h2>';
  var hasLiabs = totPropBond>0||totVehFin>0||(S.liabilities||[]).some(function(l){return N(l.bal)>0;});
  if(hasLiabs){
    h += '<table><thead><tr><th>Liability</th><th class="r">Outstanding Balance</th><th class="r">Monthly Payment</th></tr></thead><tbody>';
    (S.props||[]).forEach(function(p){
      if(!N(p.bond)) return;
      h += '<tr><td>'+e(p.desc||'Property')+' — Bond</td><td class="r">'+R(p.bond)+'</td><td class="r">'+(N(p.bondPM)>0?Rm(p.bondPM):'&#8212;')+'</td></tr>';
    });
    (S.vehicles||[]).forEach(function(v){
      if(!N(v.finance)) return;
      h += '<tr><td>'+e(v.desc||'Vehicle')+' — Finance</td><td class="r">'+R(v.finance)+'</td><td class="r">&#8212;</td></tr>';
    });
    (S.liabilities||[]).forEach(function(l){
      if(!N(l.bal)) return;
      h += '<tr><td>'+e(l.desc||'Liability')+'</td><td class="r">'+R(l.bal)+'</td><td class="r">'+(N(l.pmt)>0?Rm(l.pmt):'&#8212;')+'</td></tr>';
    });
    h += '<tr class="subtotal"><td>Total Liabilities</td><td class="r">'+R(totalLiabs)+'</td><td class="r">'+(totalDebtPmt>0?Rm(totalDebtPmt):'&#8212;')+'</td></tr>';
    h += '</tbody></table>';
  } else {
    h += '<p style="font-size:10px;color:#888;margin-bottom:10px">No liabilities recorded.</p>';
  }

  // ── NET WORTH SUMMARY
  h += '<div class="summary">';
  h += '<div class="sum-grid">';
  h += '<div class="sum-card"><div class="sum-lbl">Total Assets</div><div class="sum-val">'+R(totalAssets)+'</div></div>';
  h += '<div class="sum-card"><div class="sum-lbl">Total Liabilities</div><div class="sum-val">'+R(totalLiabs)+'</div></div>';
  h += '<div class="sum-card"><div class="sum-lbl">Net Worth</div><div class="sum-val '+(netWorth>=0?'ok':'bad')+'">'+R(netWorth)+'</div></div>';
  h += '</div>';

  // Monthly income vs commitments
  if(grossPM>0){
    h += '<div style="border-top:1px solid #334;padding-top:10px;margin-top:4px">';
    h += '<div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:#8899bb;margin-bottom:6px">Monthly Income &amp; Commitments</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    h += '<div>';
    h += '<div class="inc-row"><span class="inc-lbl">Gross income</span><span class="inc-val">'+Rm(grossPM)+'</span></div>';
    if(nettPM>0) h += '<div class="inc-row"><span class="inc-lbl">Nett income</span><span class="inc-val">'+Rm(nettPM)+'</span></div>';
    h += '</div>';
    h += '<div>';
    if(totalDebtPmt>0) h += '<div class="inc-row"><span class="inc-lbl">Debt repayments</span><span class="inc-val">'+Rm(totalDebtPmt)+'</span></div>';
    if(totalPremPM>0)  h += '<div class="inc-row"><span class="inc-lbl">Insurance premiums</span><span class="inc-val">'+Rm(totalPremPM)+'</span></div>';
    var totalCommit=totalDebtPmt+totalPremPM;
    if(totalCommit>0&&grossPM>0){
      var commitPct=Math.round(totalCommit/grossPM*100);
      h += '<div class="inc-row" style="border-bottom:none;margin-top:4px"><span class="inc-lbl" style="font-weight:700;color:#ccd6f6">Total commitments</span><span class="inc-val" style="color:'+(commitPct>40?'#f87171':'#86efac')+'">'+Rm(totalCommit)+' ('+commitPct+'%)</span></div>';
    }
    h += '</div></div></div>';
  }
  h += '</div>';

  // ── Declaration
  h += '<div class="declaration">';
  h += '<strong>Declaration</strong><br>';
  h += 'I, <strong>'+e(cli.name||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')+'</strong>, hereby declare that the information contained in this Asset and Liability Statement is true, accurate and complete to the best of my knowledge and belief. I acknowledge that this statement has been prepared for financial planning and/or credit assessment purposes.';
  h += '<div class="sig-grid">';
  h += '<div><div class="sig-line">Client Signature</div></div>';
  h += '<div><div class="sig-line">Date</div></div>';
  h += '</div>';
  h += '</div>';

  // ── Disclaimer
  h += '<div class="disclaimer">Values reflected are estimates based on information provided by the client and/or loaded in the FNA system. Market values of properties and vehicles may differ from professional valuations. Retirement and investment fund values reflect balances at the time of capture and will fluctuate with market conditions. This statement does not constitute a formal valuation and should be read in conjunction with supporting documentation.</div>';

  h += '<div class="fnote">Duwalcoe Financial Consultants CC &nbsp;·&nbsp; FSP No: 9978 &nbsp;·&nbsp; Prepared: '+today+' &nbsp;·&nbsp; This document is confidential and prepared for '+e(cli.name||'the named client')+' only.</div>';

  h += '<div class="noprint" style="position:fixed;bottom:16px;right:16px;display:flex;gap:8px">';
  h += '<button onclick="window.print()" style="background:#0e413a;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700">Print / Save PDF</button>';
  h += '<button onclick="window.close()" style="background:#888;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:13px">Close</button></div>';

  h += '</div></body></html>';

  var win = window.open('','_blank');
  if(win){ win.document.write(h); win.document.close(); }
  else { alert('Pop-up blocked. Please allow pop-ups for this page.'); }
}

document.addEventListener('visibilitychange', function(){ if(document.hidden) autoSave(); });
document.addEventListener('input', function(e){
  var t = e.target;
  if (!t) return;
  var tag = (t.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') queueSmartSave();
}, true);
document.addEventListener('change', function(e){
  var t = e.target;
  if (!t) return;
  var tag = (t.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') queueSmartSave();
}, true);
window.addEventListener('pagehide', function(){ persist(); saveToServer(true); });
window.addEventListener('beforeunload', function(e){
  persist();
  // SaveGuard: warn before close if there are unsaved server changes.
  // Modern browsers ignore the custom message but still show their default prompt.
  if (_sgPending) {
    var msg = 'You have FNA changes that have not yet been saved to the server. Are you sure you want to leave?';
    e.preventDefault();
    e.returnValue = msg;
    return msg;
  }
});
</script>
