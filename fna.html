    {k:'retirement', l:'Retirement Planning'},
    {k:'investment', l:'Local Investment'},
    {k:'offshore',   l:'Offshore Investment'},
    {k:'will',       l:'Will & Testament'},
    {k:'estate',     l:'Estate Planning'},
    {k:'review',     l:'Annual Review'},
    {k:'other',      l:'Other'},
  ];
  var cg = div('chkgrid');
  scopeItems.forEach(function (item) {
    var d = div('chk' + (S.scope[item.k] ? ' on' : ''));
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!S.scope[item.k];
    cb.addEventListener('change', function (e) { S.scope[item.k] = e.target.checked; render(); });
    var sp = el('span','',item.l);
    d.appendChild(cb); d.appendChild(sp);
    d.addEventListener('click', function (e) {
      if (e.target !== cb) { cb.checked = !cb.checked; S.scope[item.k] = cb.checked; render(); }
    });
    cg.appendChild(d);
  });
  s.appendChild(cg);

  s.appendChild(stitle("Client's Goals & Priorities"));
  var notesWrap = div();
  var nta = document.createElement('textarea'); nta.className = 'f';
  nta.style.cssText = 'width:100%;border:var(--border);border-radius:7px;padding:10px 12px;font-family:inherit;font-size:13px;min-height:90px;resize:vertical';
  nta.value = S.whyHere || '';
  nta.addEventListener('input', function(e) { S.whyHere = e.target.value; });
  notesWrap.appendChild(nta); s.appendChild(notesWrap);

  s.appendChild(stitle('Assumptions'));
  var ainf = div('info'); ainf.textContent = 'Default assumptions used in all calculations. Review with client.'; s.appendChild(ainf);
  var ag = g4();
  ag.appendChild(pfld('CPI / Inflation',     S.assump, 'cpi'));
  ag.appendChild(pfld('Fund Growth Rate',    S.assump, 'growth'));
  ag.appendChild(pfld('Income Escalation',   S.assump, 'incEsc'));
  ag.appendChild(pfld('Medical Inflation',   S.assump, 'medInflation'));
  s.appendChild(ag);
  var ag2 = g3();
  ag2.appendChild(pfld('Drawdown Rate (default)', S.assump, 'drawdown'));
  ag2.appendChild(pfld('Return on Capital (retirement)', S.assump, 'retReturn'));
  s.appendChild(ag2);

  return s;
}

// ═══════════════════════════════════════════════════════════
// TAB 2 — INCOME
// ═══════════════════════════════════════════════════════════
function buildIncome() {
  var s = div();

  // Auto-sync rental income rows from Properties tab
  // Rows with src starting with "Rental:" are managed automatically
  var rentalSrcs = S.props.filter(function(p){ return N(p.rental) > 0; })
                           .map(function(p){ return 'Rental: ' + (p.desc||'Property'); });
  // Remove stale auto rental rows (property deleted or rental cleared)
  S.incRows = S.incRows.filter(function(r){
    if (r._auto) return rentalSrcs.indexOf(r.src) > -1;
    return true;
  });
  // Add missing rental rows
  rentalSrcs.forEach(function(src) {
    var exists = S.incRows.filter(function(r){ return r.src === src; })[0];
    if (!exists) {
      var prop = S.props.filter(function(p){ return 'Rental: '+(p.desc||'Property') === src; })[0];
      S.incRows.push({ src: src, pm: prop ? String(Math.round(N(prop.rental))) : '', _auto: true, _taxable: true });
    } else {
      var prop2 = S.props.filter(function(p){ return 'Rental: '+(p.desc||'Property') === src; })[0];
      if (prop2) exists.pm = String(Math.round(N(prop2.rental)));
      exists._taxable = true; // mark as taxable
    }
  });

  s.appendChild(stitle('Income Sources'));
  var incInf = div('info');
  incInf.innerHTML = 'The <strong>first row (Salary / drawings)</strong> is the client\'s monthly gross income \u2014 changes here save back to the CRM client record automatically. ' +
    'Rental income rows (from the Assets tab) are automatically included in taxable income. ' +
    'Add other income sources below; tick the <strong>Taxable</strong> box if subject to income tax.';
  s.appendChild(incInf);

  var itbl = document.createElement('table');
  itbl.innerHTML = '<thead><tr><th>Source</th><th>Gross R/pm</th><th>Taxable</th><th></th></tr></thead>';
  var ib = document.createElement('tbody');
  S.incRows.forEach(function(r, i) {
    var tr = document.createElement('tr');
    var isCrmSalary = (i === 0); // first row maps to CRM Income column

    // Source description (read-only for auto rental rows; salary label is fixed)
    var t1 = document.createElement('td');
    if (r._auto) {
      var autoLbl = document.createElement('span');
      autoLbl.textContent = r.src;
      autoLbl.style.cssText = 'font-size:12px;color:var(--sub);font-style:italic';
      t1.appendChild(autoLbl);
    } else if (isCrmSalary) {
      // Salary label is fixed (it's hardwired to the CRM Income column)
      var salLbl = document.createElement('span');
      salLbl.textContent = r.src || 'Salary / drawings';
      salLbl.style.cssText = 'font-size:12px;color:var(--text);font-weight:600';
      t1.appendChild(salLbl);
      // Ensure src is set in state
      if (!r.src) S.incRows[i].src = 'Salary / drawings';
    } else {
      var si = document.createElement('input'); si.type = 'text'; si.value = r.src || '';
      si.addEventListener('input', function(e) { S.incRows[i].src = e.target.value; });
      t1.appendChild(si);
    }
    tr.appendChild(t1);

    // Amount — editable for salary (writes back to CRM Income on blur)
    var t2 = document.createElement('td');
    var rw = div('td-r'); rw.appendChild(el('span', 'rp', 'R'));
    var vi = document.createElement('input'); vi.type = 'text'; vi.inputMode = 'numeric';
    vi.value = r.pm || '';
    vi.readOnly = !!r._auto; // auto rows are read-only (driven by Assets tab)
    if (r._auto) vi.style.color = 'var(--sub)';
    vi.addEventListener('input', function(e) { if (!S.incRows[i]._auto) S.incRows[i].pm = e.target.value; });
    vi.addEventListener('blur', function(e) {
      if (S.incRows[i]._auto) return;
      S.incRows[i].pm = e.target.value;
      if (isCrmSalary) {
        // Mirror to S.cli.grossPM and write back to CRM
        S.cli.grossPM = e.target.value;
        patchClientFieldToCRM('grossPM', e.target.value);
      }
      render();
    });
    rw.appendChild(vi); t2.appendChild(rw);
    tr.appendChild(t2);

    // Taxable checkbox (row 0 always taxable; auto rental always taxable — both locked)
    var t3 = document.createElement('td'); t3.style.textAlign = 'center';
    var tcb = document.createElement('input'); tcb.type = 'checkbox';
    var isTaxable = (i === 0) || !!r._taxable;
    tcb.checked = isTaxable;
    tcb.disabled = (i === 0 || !!r._auto); // can't untick salary or auto rental
    tcb.addEventListener('change', function(e) { S.incRows[i]._taxable = e.target.checked; render(); });
    t3.appendChild(tcb); tr.appendChild(t3);

    // Delete
    var t4 = document.createElement('td');
    if (i > 0 && !r._auto) t4.appendChild(delBtn(function() { S.incRows.splice(i, 1); render(); }));
    tr.appendChild(t4);

    ib.appendChild(tr);
  });
  itbl.appendChild(ib);
  var itw = div('twrap'); itw.appendChild(itbl); s.appendChild(itw);
  s.appendChild(addBtn('+ Add Income Source', function() {
    S.incRows.push({ src: '', pm: '', _taxable: false }); render();
  }));

  // ── Tax calculation: salary + all taxable other income together
  var salaryGross    = N(S.incRows[0] && S.incRows[0].pm);
  var otherTaxable   = S.incRows.slice(1).reduce(function(sum, r) {
    return sum + (r._taxable ? N(r.pm) : 0);
  }, 0);
  var nonTaxable     = S.incRows.slice(1).reduce(function(sum, r) {
    return sum + (!r._taxable ? N(r.pm) : 0);
  }, 0);

  if (salaryGross > 0 || otherTaxable > 0) {
    var t = taxBreakdownFull(salaryGross, otherTaxable);
    if (t) {
      S.cli.grossPM = String(salaryGross);
      S.cli.nettPM  = String(t.nettPM);
      var tb = div('taxbox');
      tb.style.marginTop = '12px';
      tb.innerHTML =
        '<div class="tr"><span>Gross salary / drawings</span><span>' + Rfmt(t.salaryGrossPM) + '</span></div>' +
        (t.otherTaxablePM > 0 ?
          '<div class="tr"><span>Other taxable income (rental etc)</span><span>+ ' + Rfmt(t.otherTaxablePM) + '</span></div>' +
          '<div class="tr"><span>Total taxable income p/m</span><span>' + Rfmt(t.totalGrossPM) + '</span></div>'
          : '') +
        '<div class="tr"><span>PAYE (income tax)</span><span>− ' + Rfmt(t.taxPM) + '</span></div>' +
        '<div class="tr"><span>UIF (on salary only)</span><span>− ' + Rfmt(t.uifPM) + '</span></div>' +
        '<div class="tr tot"><span>Estimated nett income p/m</span><span>' + Rfmt(t.nettPM) + '</span></div>' +
        (t.otherTaxablePM > 0 ?
          '<div class="tr" style="font-size:11px;color:#aab;margin-top:4px"><span>Marginal rate (combined income)</span><span>' +
          Math.round(t.marginalRate * 100) + '%</span></div>'
          : '');
      s.appendChild(tb);

      if (t.otherTaxablePM > 0) {
        var raNote = div('info');
        raNote.style.cssText = 'font-size:11px;background:#eff6ff;border-color:#bfdbfe;color:#1e40af;margin-top:6px';
        raNote.innerHTML = '💡 <strong>RA tax benefit:</strong> At a marginal rate of ' + Math.round(t.marginalRate * 100) +
          '%, an RA contribution of R10 000/pm saves approximately <strong>' +
          Rfmt(Math.round(10000 * t.marginalRate)) + ' in tax per month</strong>. ' +
          'Rental income pushes the marginal rate up — contributing to an RA is more tax-efficient.';
        s.appendChild(raNote);
      }
    }
  }

  // Retirement age
  var retRow = g2(); retRow.style.marginTop = '14px';
  retRow.appendChild(sfld('Retirement Age', S.cli, 'retAge', ['55','60','63','65','67','70']));
  s.appendChild(retRow);

  // Total income summary
  var nettIncome = N(S.cli.nettPM);
  var totInc     = nettIncome + nonTaxable; // nett already includes rental nett via taxBreakdownFull

  if (totInc > 0) {
    var ti = div('info'); ti.style.marginTop = '4px';
    ti.innerHTML = 'Total nett income: <strong>' + Rfmt(nettIncome) + '</strong>' +
      (nonTaxable > 0 ? ' + Non-taxable: <strong>' + Rfmt(nonTaxable) + '</strong>' : '') +
      ' = <strong>' + Rfmt(totInc) + ' /pm</strong>';
    s.appendChild(ti);
  }

  s.appendChild(stitle('Monthly Expenses'));
  var eg = g2();
  window._fnaTotInc = totInc; // store for live surplus update

  // Show bond payments hint from properties
  var totalBonds = (S.props||[]).reduce(function(a,p){ return a+N(p.bondPM); }, 0);
  if(totalBonds > 0){
    var bondHint = div();
    bondHint.style.cssText = 'font-size:11px;color:#888;margin-bottom:6px;padding:6px 10px;background:#f8f5ef;border-radius:6px;border:1px solid var(--mist)';
    bondHint.innerHTML = '💡 Bond payments from Assets tab: <strong>R ' + Math.round(totalBonds).toLocaleString('en-ZA') + '/pm</strong> — include these in your total expenses below.';
    eg.appendChild(bondHint);
  }

  eg.appendChild(rfld('Total monthly expenses', S, 'expenses', {onblur: updateSurplus}));
  var surplus = totInc - N(S.expenses);
  var sf = div('f');
  sf.appendChild(el('label', '', 'Monthly surplus / shortfall'));
  var si2 = document.createElement('input'); si2.type = 'text'; si2.readOnly = true;
  si2.id = 'fna_surplus_field';
  si2.value = totInc > 0 ? (surplus >= 0 ? '+ ' : '') + Rfmt(surplus) : '';
  si2.style.fontWeight = '700';
  si2.style.color = surplus >= 0 ? 'var(--green)' : 'var(--red)';
  sf.appendChild(si2);
  eg.appendChild(sf);
  s.appendChild(eg);

  s.appendChild(txfld('Income notes', S, 'incNotes'));
  return s;
}

// ═══════════════════════════════════════════════════════════
// TAB 3 — ASSETS & LIABILITIES
// ═══════════════════════════════════════════════════════════
function buildAssets() {
  var s = div();
  var cliAge  = ageFrom(S.cli.dob);
  var retAge  = N(S.cli.retAge)||65;
  var yrsToRet = cliAge ? Math.max(0, retAge - cliAge) : null;

  // ── Properties
  s.appendChild(stitle('Properties'));
  S.props.forEach(function(p,i){
    var card=div(); card.style.cssText='background:#fff;border:var(--border);border-radius:8px;padding:14px;margin-bottom:10px';
    var ch=div(); ch.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    var ct=el('div','','Property '+(i+1)); ct.style.fontWeight='700'; ch.appendChild(ct);
    ch.appendChild(delBtn(function(){S.props.splice(i,1);render();})); card.appendChild(ch);

    // Row 1: Description, Market Value, Bond Outstanding
    var r1=g3();
    var df=div('f'); df.appendChild(el('label','','Description'));
    var di=document.createElement('input'); di.type='text'; di.value=p.desc||'';
    di.addEventListener('input',function(e){S.props[i].desc=e.target.value;}); df.appendChild(di); r1.appendChild(df);
    r1.appendChild(rfld('Market Value', p, 'val', {onblur:function(){render();}}));
    r1.appendChild(rfld('Bond Outstanding', p, 'bond'));
    card.appendChild(r1);

    // Row 2: Bond /pm, Rental, Base Cost (CGT), Date Bought
    var r2=g4();
    r2.appendChild(rfld('Bond Payment /pm', p, 'bondPM'));
    r2.appendChild(rfld('Rental Income /pm', p, 'rental'));
    r2.appendChild(rfld('Base Cost (CGT)', p, 'baseCost', {onblur:function(){render();}}));
    r2.appendChild(fld('Date Acquired', p, 'dateBought', {placeholder:'DD/MM/YYYY or year'}));
    card.appendChild(r2);

    // Row 3: Ticks + growth rate + deathBenType
    var r3=div(); r3.style.cssText='display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--mist)';

    function propChk(lbl, field){
      var wrap=div(); wrap.style.cssText='display:flex;align-items:center;gap:6px;cursor:pointer';
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!p[field];
      cb.addEventListener('change',function(e){S.props[i][field]=e.target.checked;render();});
      var lb=el('label','',lbl); lb.style.cssText='font-size:12px;cursor:pointer;color:var(--navy)';
      wrap.appendChild(cb); wrap.appendChild(lb); return wrap;
    }
    r3.appendChild(propChk('Primary residence', 'primaryResidence'));
    r3.appendChild(propChk('Sold at death', 'soldAtDeath'));
    r3.appendChild(propChk('Sold at retirement', 'soldAtRetirement'));
    if(N(p.bond)>0) r3.appendChild(propChk('Pay off bond if disabled', 'payOffIfDisabled'));

    // On death, falls to
    var dbtFld=div('f'); dbtFld.style.cssText='display:flex;flex-direction:column;gap:4px;min-width:160px';
    dbtFld.appendChild(el('label','','On death, falls to'));
    var dbtSel=document.createElement('select');
    dbtSel.style.cssText='border:1.5px solid var(--mist);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit';
    // 8-type list per CRM alignment. Legacy "Third Party" preserved so old
    // data isn't silently mutated when the editor opens.
    var _propTypeOpts = BEN_TYPE_OPTIONS.slice();
    if((p.deathBenType||'')==='Third Party') _propTypeOpts.push('Third Party');
    _propTypeOpts.forEach(function(o){
      var opt=document.createElement('option'); opt.value=o; opt.textContent=o;
      if((p.deathBenType||'Estate')===o) opt.selected=true;
      dbtSel.appendChild(opt);
    });
    dbtSel.addEventListener('change',function(e){S.props[i].deathBenType=e.target.value;render();});
    dbtFld.appendChild(dbtSel); r3.appendChild(dbtFld);
    card.appendChild(r3);

    // Row 4: Retirement-specific fields — depends on soldAtRetirement tick and rental
    var r4=div(); r4.style.cssText='display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--mist)';
    var hasR4=false;

    // Growth rate — always shown (used for projected value at retirement and CGT)
    var propGrFld=div('f'); propGrFld.style.minWidth='130px';
    propGrFld.appendChild(el('label','','Property growth % p.a.'));
    var propGrPw=div('pw'); propGrPw.style.position='relative';
    var propGrPp=el('span','pp','%'); propGrPp.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none';
    var propGrInp=document.createElement('input'); propGrInp.type='text'; propGrInp.inputMode='numeric';
    propGrInp.value=p.propGrowth||''; propGrInp.placeholder=S.assump.growth||'9';
    propGrInp.style.cssText='width:100%;border:1.5px solid var(--mist);border-radius:6px;padding:7px 24px 7px 10px;font-size:13px;font-family:inherit;box-sizing:border-box';
    propGrInp.addEventListener('blur',function(e){S.props[i].propGrowth=e.target.value;render();});
    propGrInp.addEventListener('input',function(e){S.props[i].propGrowth=e.target.value;});
    propGrPw.appendChild(propGrInp); propGrPw.appendChild(propGrPp); propGrFld.appendChild(propGrPw);
    r4.appendChild(propGrFld); hasR4=true;

    if(p.soldAtRetirement && yrsToRet){
      // % of net proceeds to retirement
      var pctFld=div('f'); pctFld.style.minWidth='160px';
      pctFld.appendChild(el('label','','% of net proceeds to retirement'));
      var pctPw=div('pw'); pctPw.style.position='relative';
      var pctPp=el('span','pp','%'); pctPp.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none';
      var pctInp=document.createElement('input'); pctInp.type='text'; pctInp.inputMode='numeric';
      pctInp.value=p.retirementPct||'100'; pctInp.placeholder='100';
      pctInp.style.cssText='width:100%;border:1.5px solid var(--mist);border-radius:6px;padding:7px 24px 7px 10px;font-size:13px;font-family:inherit;box-sizing:border-box';
      pctInp.addEventListener('blur',function(e){S.props[i].retirementPct=e.target.value;render();});
      pctInp.addEventListener('input',function(e){S.props[i].retirementPct=e.target.value;});
      pctPw.appendChild(pctInp); pctPw.appendChild(pctPp); pctFld.appendChild(pctPw);
      r4.appendChild(pctFld);

      // Show projected retirement proceeds
      var propGr=Ndef(p.propGrowth, N(S.assump.growth)||9);
      var projVal=Math.round(N(p.val)*Math.pow(1+propGr/100,yrsToRet));
      var projNet=Math.max(0,projVal-N(p.bond));
      var pct2=Ndef(p.retirementPct, 100);
      var toRet=Math.round(projNet*pct2/100);
      var projBox=div('info'); projBox.style.cssText='font-size:11px;padding:6px 10px;align-self:flex-end;margin-bottom:0';
      projBox.innerHTML='Projected value at '+retAge+': <strong>'+Rfmt(projVal)+'</strong>'+
        ' · Less bond: <strong>'+Rfmt(projNet)+'</strong>'+
        ' · '+pct2+'% to retirement: <strong>'+Rfmt(toRet)+'</strong>';
      r4.appendChild(projBox);
    }

    if(!p.soldAtRetirement && N(p.rental)>0){
      // Rental escalation to retirement
      var renEscFld=div('f'); renEscFld.style.minWidth='140px';
      renEscFld.appendChild(el('label','','Rental esc to retirement %'));
      var renEscPw=div('pw'); renEscPw.style.position='relative';
      var renEscPp=el('span','pp','%'); renEscPp.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none';
      var renEscInp=document.createElement('input'); renEscInp.type='text'; renEscInp.inputMode='numeric';
      renEscInp.value=p.rentalEsc||'6'; renEscInp.placeholder='6';
      renEscInp.style.cssText='width:100%;border:1.5px solid var(--mist);border-radius:6px;padding:7px 24px 7px 10px;font-size:13px;font-family:inherit;box-sizing:border-box';
      renEscInp.addEventListener('blur',function(e){S.props[i].rentalEsc=e.target.value;render();});
      renEscInp.addEventListener('input',function(e){S.props[i].rentalEsc=e.target.value;});
      renEscPw.appendChild(renEscInp); renEscPw.appendChild(renEscPp); renEscFld.appendChild(renEscPw);
      r4.appendChild(renEscFld);

      // Rental escalation in retirement
      var renRetFld=div('f'); renRetFld.style.minWidth='140px';
      renRetFld.appendChild(el('label','','Rental esc in retirement %'));
      var renRetPw=div('pw'); renRetPw.style.position='relative';
      var renRetPp=el('span','pp','%'); renRetPp.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none';
      var renRetInp=document.createElement('input'); renRetInp.type='text'; renRetInp.inputMode='numeric';
      renRetInp.value=p.rentalRetEsc||''; renRetInp.placeholder=S.assump.cpi||'6';
      renRetInp.style.cssText='width:100%;border:1.5px solid var(--mist);border-radius:6px;padding:7px 24px 7px 10px;font-size:13px;font-family:inherit;box-sizing:border-box';
      renRetInp.addEventListener('blur',function(e){S.props[i].rentalRetEsc=e.target.value;render();});
      renRetInp.addEventListener('input',function(e){S.props[i].rentalRetEsc=e.target.value;});
      renRetPw.appendChild(renRetInp); renRetPw.appendChild(renRetPp); renRetFld.appendChild(renRetPw);
      r4.appendChild(renRetFld);

      // Show projected rental at retirement
      if(yrsToRet){
        var renEscRate=Ndef(p.rentalEsc, 6);
        var renAtRet=Math.round(N(p.rental)*Math.pow(1+renEscRate/100,yrsToRet));
        var renBox=div('info'); renBox.style.cssText='font-size:11px;padding:6px 10px;align-self:flex-end;margin-bottom:0';
        renBox.innerHTML='Rental at retirement (age '+retAge+'): <strong>'+Rfmt(renAtRet)+'/pm</strong> (@ '+renEscRate+'% p.a.)';
        r4.appendChild(renBox);
      }
    }

    if(hasR4){ card.appendChild(r4); }

    // CGT preview — only if base cost entered and not going to spouse
    if(N(p.baseCost)>0 && N(p.val)>0 && (p.deathBenType||'Estate')!=='Spouse'){
      var cgtR=calcCGTAsset(p.val, p.baseCost, !!p.primaryResidence);
      var mr=N(S.cli.grossPM)>0?calcMarginalRate(N(S.cli.grossPM)*12):0.45;
      var cgtEst=Math.round(cgtR.gainAfterExcl*CGT_INCLUSION*mr);
      var cgtBox=div(); cgtBox.style.cssText='margin-top:8px;padding:8px 12px;border-radius:6px;background:#fef9ee;border:1px solid var(--gold2);font-size:11px';
      cgtBox.innerHTML='<strong>CGT estimate on death:</strong> Gain: '+Rfmt(cgtR.gain)+
        (p.primaryResidence&&N(p.baseCost)>0?' (less R3m primary residence exclusion = '+Rfmt(cgtR.gainAfterExcl)+')':'')+
        ' · Included gain (40%): '+Rfmt(Math.round(cgtR.gainAfterExcl*CGT_INCLUSION))+
        ' · Est. CGT @ '+Math.round(mr*100)+'% marginal: <strong>'+Rfmt(cgtEst)+'</strong>'+
        ' <span style="color:var(--sub)">(before R440k annual exclusion shared across all assets)</span>';

                  S.vehicles.reduce(function(s,v){return s+N(v.finance);},0) +
                  S.liabilities.reduce(function(s,l){return s+N(l.bal);},0);
  if(totAssets>0||totLiabs>0){
    var nw=totAssets-totLiabs;

  s.appendChild(txfld('Notes', S, 'assetNotes'));

}

// ── Income Need helpers — global, used by buildNeeds, buildSummary, printFNA
function calcIncomeNeed(r) {
  var gross = N(r.grossPM) || grossFromNett(r.nettPM);
  if (!gross) return 0;
  var escRate = Ndef(r.esc, S.assump.cpi);
  var dr = N(r.drawdown) > 0 ? r.drawdown : S.assump.drawdown;
  return capitalise(gross, r.years, escRate, dr);
}

function buildNeeds() {

  });
  s.appendChild(subBar);

  // If no scope items ticked, show helpful message instead of blank

      'Life Cover, Disability, Income Protection and/or Dread Disease. The needs analysis will then populate here.</div>';
    s.appendChild(msg);
    return s;
  }

  var activeNeed = S._needsTab || 'death';

  // ── LIFE COVER TAB
  if (activeNeed === 'death' && S.scope.death) {
    s.appendChild(stitle('Liabilities — payable on death'));
    var inf1=div('info');
    inf1.innerHTML='Bonds and vehicle finance pull automatically from the Assets tab. '+
      'CGT pulls from the Assets tab. Estate costs pull from Estate Planning (if in scope). '+
      'Add personal loans, income tax and funeral costs manually below.';
    s.appendChild(inf1);

    // ── Auto rows — read only, sourced from Assets tab
    var autoLiabs = [];

    // Bonds from properties
    (S.props||[]).forEach(function(p){
      if(N(p.bond)>0) autoLiabs.push({desc:(p.desc||'Property')+' — bond outstanding', amt:N(p.bond), _auto:true});
    });

    // Finance from vehicles
    (S.vehicles||[]).forEach(function(v){
      if(N(v.finance)>0) autoLiabs.push({desc:(v.desc||'Vehicle')+' — finance outstanding', amt:N(v.finance), _auto:true});
    });

    // Other liabilities from Assets tab (personal loans, credit, store accounts, etc.)
    (S.liabilities||[]).forEach(function(l){
      if(N(l.bal)>0) autoLiabs.push({desc:(l.desc||'Liability')+' — outstanding', amt:N(l.bal), _auto:true});
    });

    // CGT on death
    var _mr = N(S.cli.grossPM)>0 ? calcMarginalRate(N(S.cli.grossPM)*12) : 0.45;
    var _cgt = calcTotalCGT(_mr*100);
    if(_cgt.totalCGT>0){
      autoLiabs.push({desc:'Capital Gains Tax on death (estimated)', amt:_cgt.totalCGT, _auto:true, _cgt:true});
    }

    // Estate costs — if estate in scope, pull duty (estate share), exec fees, accrual
    if(S.scope.estate){
      // Recalculate using same logic as buildEstate/buildSummary
      var _pv=(S.props||[]).reduce(function(a,p){return a+N(p.val);},0)
        +(S.vehicles||[]).reduce(function(a,v){return a+N(v.val);},0)
        +(S.otherAssets||[]).reduce(function(a,x){return a+N(x.val);},0);
      var _pl=(S.props||[]).reduce(function(a,p){return a+N(p.bond);},0)
        +(S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0)
        +(S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
      var _s4q=0,_ep=0,_tp=0,_bd=0;
      (S.importedPols||[]).forEach(function(p){
        if(p.Type==='Business Assurance'){if(p.EstateDutiable==='Yes')_bd+=N(p.LoanAmount)||N(p.BenDeath);return;}
        var b=N(p.BenDeath);if(!b)return;
        var bt=p.BeneficiaryType||'';
        if(isS4qSpouse(bt))_s4q+=b;
        else if(bt==='Estate')_ep+=b;
        else if(isDutiableNonSpouse(bt))_tp+=b;
      });
      var _acc=0;
      if((S.cli.marital||'').indexOf('accrual')>-1){
        var _ra=(S.importedPols||[]).reduce(function(a,p){return POL_RA_TYPES.indexOf(p.Type)>-1?a+(N(p.BenFundValue)||N(p.BenDeath)):a;},0);
        var _invFV=(S.importedPols||[]).reduce(function(a,p){return POL_INV_TYPES.indexOf(p.Type)>-1?a+N(p.BenFundValue):a;},0);
        var _cLiabs=(S.props||[]).reduce(function(a,p){return a+N(p.bond);},0)
          +(S.vehicles||[]).reduce(function(a,v){return a+N(v.finance);},0)
          +(S.liabilities||[]).reduce(function(a,l){return a+N(l.bal);},0);
        var _ce=Math.max(0,_pv+_ra+_invFV-_cLiabs), _se=N(S.accrual&&S.accrual.spouseCurrentAssets);
        var _cs=N(S.accrual&&S.accrual.clientStartVal), _ss=N(S.accrual&&S.accrual.spouseStartVal);
        var _cex=N(S.accrual&&S.accrual.clientExclusions), _sex=N(S.accrual&&S.accrual.spouseExclusions);
        // CPI adjust commencement values
        var _mdt=S.cli.domDate?new Date(S.cli.domDate):null;
        var _ymr=0; if(_mdt&&!isNaN(_mdt.getTime())) _ymr=Math.max(0,(new Date().getTime()-_mdt.getTime())/(365.25*24*60*60*1000));
        var _acf=N(S.accrual&&S.accrual.cpiFactor)>0?N(S.accrual.cpiFactor):(_ymr>0?Math.pow(1+(N(S.assump.cpi)||6)/100,_ymr):1);
        var _csCPI=Math.round(_cs*_acf), _ssCPI=Math.round(_ss*_acf);
        _acc=Math.max(0,(Math.max(0,_ce-_cex-_csCPI)-Math.max(0,_se-_sex-_ssCPI))/2);
      }
      var _cgtNeed=calcTotalCGT((N(S.cli.grossPM)>0?calcMarginalRate(N(S.cli.grossPM)*12):0.45)*100).totalCGT;
      var _gr=_pv+_s4q+_ep+_tp+_bd;
      var _ne=Math.max(0,_gr-_pl-_cgtNeed);
      var _ad=Math.min(_acc,_ne);
      var _aa=Math.max(0,_ne-_ad);
      var _s4d=Math.min(_s4q,_aa);
      var _as4=Math.max(0,_aa-_s4d);
      var _dut=Math.max(0,_as4-ABATEMENT);
      var _duty=_dut<=DUTY_THRESH?_dut*DUTY_RATE1:DUTY_THRESH*DUTY_RATE1+(_dut-DUTY_THRESH)*DUTY_RATE2;
      var _exec=(_pv+_ep)*EXEC_RATE;
      // Apportion duty (s.7) — each category pays duty proportional to its share of estate after s4q
      // Use _aa (after s4q, before abatement) as the denominator — that is the correct base
      function _ap(v){return (_aa>0&&_duty>0)?Math.round(_duty*(v/_aa)):0;}
      var _de=_ap(_pv+_ep); // estate's share: physical assets + estate policies
      if(_de>0) autoLiabs.push({desc:'Estate duty — estate\'s share', amt:_de, _auto:true});
      if(_exec>0) autoLiabs.push({desc:'Executor fees (4.025%)', amt:Math.round(_exec), _auto:true});
      if(_ad>0) autoLiabs.push({desc:'Accrual payable to spouse', amt:Math.round(_ad), _auto:true});
    }

    // Render auto rows (read-only)
    if(autoLiabs.length>0){
      var autoTbl=document.createElement('table'); autoTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px';
      autoTbl.innerHTML='<thead><tr><th style="text-align:left;padding:5px 8px;background:var(--navy);color:#fff">Item (auto-calculated)</th><th style="text-align:right;padding:5px 8px;background:var(--navy);color:#fff">Amount</th></tr></thead>';

    // ── Manual rows — personal loans, tax, funeral
    var manInf=div('info'); manInf.style.cssText='font-size:11px;background:#f0f4ff;border-color:#c7d2fe;color:#3730a3;margin-bottom:6px';
    manInf.textContent='Add personal loans, outstanding income tax and funeral costs below.';

    S.deathLiabs.forEach(function(r,i){

    s.appendChild(stitle('Capital requirements'));
    var inf3=div('info'); inf3.textContent='Lump sums needed — education, emergency fund, bequests.'; s.appendChild(inf3);
    S.deathCapital.forEach(function(r,i){
      var card=div(); card.style.cssText='background:#fff;border:var(--border);border-radius:8px;padding:12px;margin-bottom:10px';

      var bf=div('f'); bf.appendChild(el('label','','Pays to'));

    var autoTotal2=(autoLiabs||[]).reduce(function(a,r){return a+r.amt;},0);
    var totLiab=autoTotal2+S.deathLiabs.reduce(function(a,r){return a+N(r.amt);},0);
    var totInc=S.deathIncome.reduce(function(a,r){return a+calcIncomeNeed(r);},0);
    var totCap=S.deathCapital.reduce(function(a,r){return a+N(r.amt);},0);
    var totalNeed=totLiab+totInc+totCap;
    var totalHave=N(S.existingCover&&S.existingCover.death);
    if(totalNeed>0){
      var sumBox=div('calc-result'); sumBox.style.marginTop='16px';
      sumBox.innerHTML='<div class="cr-row"><span>Liabilities</span><span class="gold">'+Rfmt(totLiab)+'</span></div>'+
        '<div class="cr-row"><span>Income (capitalised)</span><span class="gold">'+Rfmt(totInc)+'</span></div>'+
        '<div class="cr-row"><span>Capital needs</span><span class="gold">'+Rfmt(totCap)+'</span></div>'+
        '<div class="cr-row big"><span>Total cover needed</span><span class="gold">'+Rfmt(totalNeed)+'</span></div>'+
        '<div class="cr-row"><span>Existing cover</span><span class="gold">'+Rfmt(totalHave)+'</span></div>'+
        '<div class="cr-row big"><span>'+(totalHave>=totalNeed?'Surplus':'Shortfall')+'</span><span style="color:'+(totalHave>=totalNeed?'var(--green)':'var(--red)')+'">'+Rfmt(Math.abs(totalHave-totalNeed))+'</span></div>';
      s.appendChild(sumBox);
    }
  }

  // ── DISABILITY & IP TAB
  if (activeNeed === 'disability' && (S.scope.disability || S.scope.ip)) {
    if(S.scope.ip) {
      s.appendChild(stitle('Income Protection'));
      var ipInf=div('info'); ipInf.textContent='Monthly income protection benefit needed.'; s.appendChild(ipInf);
      var ipg=g3();
      ipg.appendChild(rfld('Nett benefit needed /pm', S, 'ipNettPM', {onblur:function(){S.ipGrossPM=String(Math.round(grossFromNett(S.ipNettPM)));render();}}));
      ipg.appendChild(rfld('Gross benefit /pm (auto)', S, 'ipGrossPM', {readonly:true}));
      ipg.appendChild(div());
      s.appendChild(ipg);
      var ipg2=g3();
      ipg2.appendChild(sfld('Waiting period', S, 'ipWait', ['1 month','3 months','6 months','12 months']));
      ipg2.appendChild(sfld('Benefit period', S, 'ipBenefit', ['2 years','5 years','To age 60','To age 65','To age 70']));
      s.appendChild(ipg2);
    }
    if(S.scope.disability) {
      s.appendChild(stitle('Disability — income needs (capitalised)'));
      S.disIncome.forEach(function(r,i){ buildIncomeNeedRow(s,r,i,'disIncome'); });
      var dab=addBtn('+ Add income need',function(){S.disIncome.push({desc:'',nettPM:'',grossPM:'',years:'',esc:'',drawdown:''});render();}); s.appendChild(dab);

      // Auto-pull liabilities flagged for disability from Assets tab
      var disAutoLiabs=[];
      (S.props||[]).forEach(function(p){
        if(p.payOffIfDisabled && N(p.bond)>0) disAutoLiabs.push({desc:(p.desc||'Property')+' — bond outstanding', amt:N(p.bond)});
      });
      (S.vehicles||[]).forEach(function(v){
        if(v.payOffIfDisabled && N(v.finance)>0) disAutoLiabs.push({desc:(v.desc||'Vehicle')+' — finance outstanding', amt:N(v.finance)});
      });
      (S.liabilities||[]).forEach(function(l){
        if(l.payOffIfDisabled && N(l.bal)>0) disAutoLiabs.push({desc:(l.desc||'Liability')+' — pay off', amt:N(l.bal)});
      });

      s.appendChild(stitle('Disability — lump sum capital needs'));

      if(disAutoLiabs.length>0){
        var disAutoInf=div('info'); disAutoInf.style.cssText='font-size:11px;padding:6px 10px;margin-bottom:8px';
        disAutoInf.textContent='These liabilities are flagged on the Assets tab to be paid off if disabled. They are included automatically.';
        s.appendChild(disAutoInf);
        var disAutoTbl=document.createElement('table'); disAutoTbl.style.cssText='width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px';
        disAutoTbl.innerHTML='<thead><tr><th style="text-align:left;padding:5px 8px;background:var(--navy);color:#fff">Liability (auto from Assets tab)</th><th style="text-align:right;padding:5px 8px;background:var(--navy);color:#fff">Amount</th></tr></thead>';
        var disAutoTb=document.createElement('tbody');
        disAutoLiabs.forEach(function(r){
          var tr=document.createElement('tr');
          tr.innerHTML='<td style="padding:5px 8px;border-bottom:1px solid var(--mist);color:var(--sub);font-style:italic">'+r.desc+'</td>'+
            '<td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--mist);color:var(--sub)">'+Rfmt(r.amt)+'</td>';
          disAutoTb.appendChild(tr);
        });
        disAutoTbl.appendChild(disAutoTb);
        var disAutoTw=div('twrap'); disAutoTw.appendChild(disAutoTbl); s.appendChild(disAutoTw);
      }
      S.disCapital.forEach(function(r,i){
        var row=g3();
        row.appendChild(fld('Description',r,'desc'));
        row.appendChild(rfld('Amount',r,'amt',{onblur:function(){render();}}));
        row.appendChild(div());
        var del=delBtn(function(){S.disCapital.splice(i,1);render();}); var dw=div('f'); dw.appendChild(del); row.appendChild(dw);
        s.appendChild(row);
      });
      var dcab=addBtn('+ Add capital need',function(){S.disCapital.push({desc:'',amt:''});render();}); s.appendChild(dcab);
    }
    var disInc=S.disIncome.reduce(function(a,r){return a+calcIncomeNeed(r);},0);
    var disCap=S.disCapital.reduce(function(a,r){return a+N(r.amt);},0);
    // Add auto-pulled liabilities flagged for disability
    var disAutoCap=0;
    (S.props||[]).forEach(function(p){ if(p.payOffIfDisabled && N(p.bond)>0) disAutoCap+=N(p.bond); });
    (S.vehicles||[]).forEach(function(v){ if(v.payOffIfDisabled && N(v.finance)>0) disAutoCap+=N(v.finance); });
    (S.liabilities||[]).forEach(function(l){ if(l.payOffIfDisabled && N(l.bal)>0) disAutoCap+=N(l.bal); });
    var disHave=N(S.existingCover&&S.existingCover.disability);
    var disTotal=disInc+disCap+disAutoCap;
    if(disTotal>0||N(S.ipGrossPM)>0){
      var disBox=div('calc-result'); disBox.style.marginTop='16px';
      disBox.innerHTML=(N(S.ipGrossPM)>0?'<div class="cr-row"><span>IP benefit needed /pm</span><span class="gold">'+Rfmt(S.ipGrossPM)+'</span></div>':'')+
        (disTotal>0?'<div class="cr-row big"><span>Lump sum needed</span><span class="gold">'+Rfmt(disTotal)+'</span></div>':'')+
        '<div class="cr-row"><span>Existing disability cover</span><span class="gold">'+Rfmt(disHave)+'</span></div>'+
        (disTotal>0?'<div class="cr-row big"><span>'+(disHave>=disTotal?'Surplus':'Shortfall')+'</span><span style="color:'+(disHave>=disTotal?'var(--green)':'var(--red)')+'">'+Rfmt(Math.abs(disHave-disTotal))+'</span></div>':'');
      s.appendChild(disBox);
    }
  }

  // ── DREAD DISEASE TAB
  if (activeNeed === 'dread' && S.scope.dread) {
    s.appendChild(stitle('Dread Disease / Trauma'));
    var drInf=div('info'); drInf.textContent='Suggested: 18-24 months gross income, or cost of treatment + income for recovery period.'; s.appendChild(drInf);
    var drg=g3();
    drg.appendChild(rfld('Cover needed', S, 'dreadAmt', {onblur:function(){render();}}));
    var dreadHave=N(S.existingCover&&S.existingCover.dread);
    var drGap=dreadHave-N(S.dreadAmt);
    drg.appendChild(rfld('Existing cover (auto)', {v:String(dreadHave)}, 'v', {readonly:true}));
    drg.appendChild(div());
    s.appendChild(drg);
    if(N(S.dreadAmt)>0){
      var drBox=div('calc-result'); drBox.style.marginTop='8px';
      drBox.innerHTML='<div class="cr-row big"><span>Cover needed</span><span class="gold">'+Rfmt(S.dreadAmt)+'</span></div>'+
        '<div class="cr-row"><span>Existing cover</span><span class="gold">'+Rfmt(dreadHave)+'</span></div>'+
        '<div class="cr-row big"><span>'+(drGap>=0?'Surplus':'Shortfall')+'</span><span style="color:'+(drGap>=0?'var(--green)':'var(--red)')+'">'+Rfmt(Math.abs(drGap))+'</span></div>';
      s.appendChild(drBox);
    }
  }

  return s;
}

function buildRetirement() {
  var s = div();
  if(!S.scope.retirement){
    var wi=div('info'); wi.textContent='Retirement planning not selected in Scope. Enable it there to use this tab.'; s.appendChild(wi); return s;
  }

  var cliAge = ageFrom(S.cli.dob);
  var retAge = N(S.cli.retAge) || 65;
  var retEndAge = getRetEndAge();
  var yrsToRet = cliAge ? Math.max(0, retAge - cliAge) : null;
  var yrsInRet = getYearsInRetirement(retAge);

  if(!S.retScenario) S.retScenario = { growth:'', extraLump:'', extraPM:'', extraEsc:'', extraAnnual:'', extraAnnualEsc:'', retAge:'' };
  // Backfill new fields on existing FNAs that loaded an older retScenario object
  if(S.retScenario.extraAnnual === undefined) S.retScenario.extraAnnual = '';
  if(S.retScenario.extraAnnualEsc === undefined) S.retScenario.extraAnnualEsc = '';
  if(S.retScenario.retAge === undefined) S.retScenario.retAge = '';

  // ── Assumptions reminder
  s.appendChild(stitle('Retirement Planning'));
  var inf=div('info');
  inf.innerHTML = 'All amounts in <strong>today\'s rands</strong>. The system inflates to retirement using CPI and projects funds using the growth rate. '
    + 'Use <strong>Planning to age</strong> below as the main retirement-horizon lever for this client.';
  s.appendChild(inf);

  // ── Retirement age and planning horizon
  var rg0 = div();
  rg0.style.cssText='display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px';
  rg0.appendChild(rfld('Current Age (auto)', {v:String(cliAge||'')}, 'v', {readonly:true}));
  var retAgeF = div('f'); retAgeF.appendChild(el('label','','Retirement Age'));
  var retAgeI = document.createElement('input'); retAgeI.type='text'; retAgeI.inputMode='numeric';
  retAgeI.value = S.cli.retAge||'65'; retAgeI.placeholder='65';
  retAgeI.addEventListener('blur',function(e){ S.cli.retAge=e.target.value; render(); });
  retAgeF.appendChild(retAgeI); rg0.appendChild(retAgeF);
  var retEndF = div('f'); retEndF.appendChild(el('label','','Planning to age'));
  var retEndI = document.createElement('input'); retEndI.type='text'; retEndI.inputMode='numeric';
  retEndI.value = S.assump.retEndAge||'85'; retEndI.placeholder='85';
  retEndI.addEventListener('blur',function(e){ S.assump.retEndAge=e.target.value||'85'; render(); });
  retEndF.appendChild(retEndI); rg0.appendChild(retEndF);
  rg0.appendChild(rfld('Years to retirement (auto)', {v:String(yrsToRet||'')}, 'v', {readonly:true}));
  rg0.appendChild(rfld('Years in retirement (auto)', {v:String(yrsInRet||'')}, 'v', {readonly:true}));
  s.appendChild(rg0);

  // ── Retirement Income Needs (flexible table)
  s.appendChild(stitle('Monthly Income Needs at Retirement (Today\'s Rands)'));
  var ri=div('info'); ri.textContent='Add each income need separately. Enter in today\'s rands — the system inflates to retirement. Leave escalation blank to use CPI.'; s.appendChild(ri);

  if(!S.retNeeds) S.retNeeds=[];
  // Ensure at least living expenses and medical aid rows
  if(S.retNeeds.length===0){
    S.retNeeds.push({desc:'Monthly living expenses', amtToday:'', esc:'', _isPremRow:false});
    S.retNeeds.push({desc:'Medical aid', amtToday:'', esc:String(S.assump.medInflation||9), _isPremRow:false});
  }

  S.retNeeds.forEach(function(r,i){
    var card=div(); card.style.cssText='background:#fff;border:var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px';
    var ch=div(); ch.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
    var df=div('f'); df.appendChild(el('label','','Description'));
    var di=document.createElement('input'); di.type='text'; di.value=r.desc||'';
    di.addEventListener('input',function(e){S.retNeeds[i].desc=e.target.value;});
    df.appendChild(di); ch.appendChild(df);
    if(!r._isPremRow){
      ch.appendChild(delBtn(function(){S.retNeeds.splice(i,1);render();}));
    } else {
      var lbl=el('span','','(from policy)'); lbl.style.cssText='font-size:10px;color:var(--sub);margin-right:8px'; ch.appendChild(lbl);
      ch.appendChild(delBtn(function(){S.retNeeds.splice(i,1);render();}));
    }
    card.appendChild(ch);
    var rg=g4();

    // Amount today
    var af=div('f'); af.appendChild(el('label','','Amount today (R/pm)'));
    var arw=div('rw'); arw.appendChild(el('span','rp','R'));
    var ai=document.createElement('input'); ai.type='text'; ai.inputMode='numeric'; ai.value=r.amtToday||'';
    ai.addEventListener('input',function(e){S.retNeeds[i].amtToday=e.target.value;});
    ai.addEventListener('blur',function(){render();}); arw.appendChild(ai); af.appendChild(arw); rg.appendChild(af);

    // Escalation to retirement
    var ef=div('f'); ef.appendChild(el('label','','Esc to retirement % (blank=CPI)'));
    var epw=div('pw'); epw.appendChild(el('span','pp','%'));
    var ei=document.createElement('input'); ei.type='text'; ei.value=r.esc||''; ei.placeholder=S.assump.cpi||'6';
    ei.addEventListener('input',function(e){S.retNeeds[i].esc=e.target.value;});
    ei.addEventListener('blur',function(){render();}); epw.insertBefore(ei,epw.firstChild); ef.appendChild(epw); rg.appendChild(ef);

    // Escalation IN retirement
    var erf=div('f'); erf.appendChild(el('label','','Esc in retirement % (blank=CPI)'));
    var erpw=div('pw'); erpw.appendChild(el('span','pp','%'));
    var eri=document.createElement('input'); eri.type='text'; eri.value=r.escInRet||''; eri.placeholder=S.assump.cpi||'6';
    eri.addEventListener('input',function(e){S.retNeeds[i].escInRet=e.target.value;});
    eri.addEventListener('blur',function(){render();}); erpw.insertBefore(eri,erpw.firstChild); erf.appendChild(erpw); rg.appendChild(erf);

    // Show escalated value at retirement + capital needed
    if(N(r.amtToday)>0&&yrsToRet){
      var escRate=Ndef(r.esc, N(S.assump.cpi)||6);
      var escInRetRate=r.escInRet!==''&&r.escInRet!==undefined?N(r.escInRet):escRate;
      var atRet=Math.round(N(r.amtToday)*Math.pow(1+escRate/100,yrsToRet));
      var capThis=retirementCapitalNeeded(N(r.amtToday),yrsToRet,yrsInRet,escRate,S.assump.retReturn,escInRetRate);
      var af2=div('f');
      af2.appendChild(el('label','','At retirement → capital needed'));
      var retDisp=div(); retDisp.style.cssText='font-size:12px;padding:7px 10px;border:1.5px solid var(--mist);border-radius:6px;background:#f9f9f6;color:var(--navy)';
      retDisp.innerHTML=Rfmt(atRet)+'/pm → <strong>'+Rfmt(capThis)+'</strong>';
      af2.appendChild(retDisp); rg.appendChild(af2);
    }
    card.appendChild(rg);
    s.appendChild(card);
  });

  var addRow=addBtn('+ Add income need', function(){
    S.retNeeds.push({desc:'',amtToday:'',esc:'',_isPremRow:false});render();
  }); s.appendChild(addRow);

  // Clear policy premium rows — useful when unticking policies on Policies tab
  var hasPremRows=(S.retNeeds||[]).some(function(r){return r._isPremRow;});
  if(hasPremRows){
    var clrBtn=document.createElement('button');
    clrBtn.className='btn'; clrBtn.style.cssText='margin-top:6px;font-size:11px;background:#fef2f2;color:#991b1b;border:1px solid #fca5a5';
    clrBtn.textContent='✕ Clear all policy premium rows';
    clrBtn.addEventListener('click',function(){
      S.retNeeds=S.retNeeds.filter(function(r){return !r._isPremRow;});
      render();
    });
    s.appendChild(clrBtn);
  }

  // ── Lump sum needs at retirement
  s.appendChild(stitle('Lump Sum Needs at Retirement'));
  if(!S.retLumps) S.retLumps=[];
  S.retLumps.forEach(function(r,i){
    var row=g3();
    row.appendChild(fld('Description',r,'desc'));
    row.appendChild(rfld('Amount (today\'s rands)',r,'amt',{onblur:function(){render();}}));
    row.appendChild(div());
    var dw=div('f'); dw.appendChild(delBtn(function(){S.retLumps.splice(i,1);render();})); row.appendChild(dw);
    s.appendChild(row);
  });
  s.appendChild(addBtn('+ Add lump sum need',function(){S.retLumps.push({desc:'',amt:''});render();}));

  // ── Retirement Assets
  s.appendChild(stitle('Retirement Assets / Funds'));
  var rai=div('info'); rai.textContent='Existing RAs, TFS, pension funds. Current values and monthly contributions. Growth rate for projection (blank = assumption).'; s.appendChild(rai);

  // Seed from CRM policies if empty
  var raPolTypes=['Retirement Annuity','Pension Fund','Provident Fund','Preservation Fund','Living Annuity','Tax Free Savings','Endowment','Offshore Endowment','Flexible Investment','Offshore Flexible Investment','Unit Trust'];
  var discretionaryTypes=['Endowment','Offshore Endowment','Flexible Investment','Offshore Flexible Investment','Unit Trust'];
  if(S.retAssets.length===0 && S.importedPols && S.importedPols.length>0){
    S.importedPols.forEach(function(p){
      if(raPolTypes.indexOf(p.Type)>-1){
        // Discretionary investments (Endowment, Offshore Endowment, Flexible Investment,
        // Offshore Flexible Investment, Unit Trust) only seed into retirement assets when
        // explicitly flagged. Core retirement vehicles (RA / Pension / Provident /
        // Preservation / LA / TFS) always seed. This forces the advisor to confirm
        // discretionary inclusion with the client at capture time.
        if(discretionaryTypes.indexOf(p.Type)>-1 && p.IncludeInRetirement !== 'Yes') return;

        var escRaw=String(p.PremEscalation!=null&&p.PremEscalation!==''?p.PremEscalation:(p.premEsc!=null&&p.premEsc!==''?p.premEsc:'')).replace(/,/g,'.').replace(/[^0-9.]/g,'');

        // ── Monthly contribution for FV projection ──
        // For Pension/Provident Fund: use the NET-to-retirement figure (gross premium
        // minus the monthly portion of annual group risk premiums and admin fees) —
        // this is what actually compounds in the fund. Using gross overstates the
        // projected fund value because ~20-25% of contributions typically leak to
        // costs in employer schemes.
        //
        // For all other types (RA, Preservation, TFS, Endowment, Living Annuity etc.)
        // the premium IS what gets invested, so use the gross Premium as before.
        //
        // Legacy/incomplete records (no GroupRiskBenefits, no AnnualAdminFees) fall
        // through to the gross figure — same behaviour as before this fix.
        var contribForRet = '';
        var isPensionType = (p.Type==='Pension Fund' || p.Type==='Provident Fund');
        var isMonthly = (p.Frequency==='Monthly' || !p.Frequency);
        if(isMonthly && p.Premium){
          if(isPensionType){
            var grossMonthly = parseFloat(String(p.Premium).replace(/[^0-9.\-]/g,''))||0;
            var annualRisk = 0;
            try {
              var grRows = p.GroupRiskBenefits ? JSON.parse(p.GroupRiskBenefits) : [];
              if(grRows && grRows.length){
                grRows.forEach(function(r){
                  annualRisk += parseFloat(String(r.prem||'').replace(/[^0-9.\-]/g,''))||0;
                });
              }
            } catch(e){}
            var annualAdmin = parseFloat(String(p.AnnualAdminFees||'').replace(/[^0-9.\-]/g,''))||0;
            var netMonthly = grossMonthly - (annualRisk/12) - (annualAdmin/12);
            // If costs exceed gross (shouldn't happen on a healthy scheme), fall back to gross
            // to avoid feeding negative/zero contributions into the projection.
            contribForRet = netMonthly > 0 ? String(Math.round(netMonthly*100)/100) : p.Premium;
          } else {
            contribForRet = p.Premium;
          }
        }

        S.retAssets.push({
          desc:(p.Insurer?p.Insurer+' — ':'')+p.Product||p.Type||'Fund',
          currentVal: p.BenFundValue||'',
          growthRate: p.GrowthRate||'',
          monthlyContrib: contribForRet,
          contribEsc: escRaw||'',
          maturityAge: p.maturityAge||'',
          // Discretionary rollover flag — if Yes and maturity<retirement, premiums
          // continue past maturity. Read by all 7 projection sites in this file.
          continuePastMaturity: (p.ContinuePastMaturity==='Yes')
        });
      }
    });
  }

  // CRM → FNA sync for matched funds (matched by Insurer/Product name in description).
  // Design intent: the Policies tab is read-only and CRM is the source of truth there.
  // The Retirement tab is where the advisor works the FNA, so once a value is entered
  // (or seeded from CRM into an empty field) it is FNA-owned and is not overwritten
  // by subsequent renders. To re-pull a CRM value, clear the FNA field — it will be
  // re-populated from CRM on the next render.
  if(S.importedPols && S.importedPols.length>0){
    S.retAssets.forEach(function(ra){
      var match=(S.importedPols||[]).find(function(p){
        if(raPolTypes.indexOf(p.Type)<0) return false;
        var desc=(ra.desc||'').toLowerCase();
        return (p.Insurer&&desc.indexOf(p.Insurer.toLowerCase())>-1)
          || (p.Product&&desc.indexOf(p.Product.toLowerCase())>-1);
      });
      if(match){
        var escRaw=String(match.PremEscalation!=null&&match.PremEscalation!==''?match.PremEscalation:(match.premEsc!=null&&match.premEsc!==''?match.premEsc:'')).replace(/,/g,'.').replace(/[^0-9.]/g,'');
        // Empty-only sync — preserves user overrides on the FNA retirement card,
        // including a deliberate "0" (e.g. no salary increase confirmed by client).
        if(escRaw && (ra.contribEsc == null || String(ra.contribEsc).trim() === '')) ra.contribEsc=escRaw;
        if(match.GrowthRate && (ra.growthRate == null || String(ra.growthRate).trim() === '')) ra.growthRate=match.GrowthRate;
        if(match.BenFundValue && (ra.currentVal == null || String(ra.currentVal).trim() === '')) ra.currentVal=match.BenFundValue;
        // Sync maturity age from policy
        if(match.maturityAge&&!ra.maturityAge) ra.maturityAge=match.maturityAge;
        // Sync rollover flag — CRM-side toggle with no FNA UI, so always reflects CRM
        ra.continuePastMaturity = (match.ContinuePastMaturity==='Yes');

        // ── Pension / Provident Fund: seed monthlyContrib as NET-to-retirement ──
        // The CRM holds Premium as the GROSS contractual figure (matches IRP5). For
        // FV projections we need the NET that actually compounds in the fund:
        //   Net monthly = Premium − (annual group risk premiums ÷ 12) − (annual admin ÷ 12)
        //
        // Empty-only seeding — consistent with contribEsc / growthRate / currentVal
        // above. Once the advisor enters a value on the retirement card it is
        // preserved (FNA-owned). To re-pull the CRM-derived net figure after a CRM
        // change to group risk premiums or admin fees, clear the FNA field — it will
        // recalculate on next render.
        //
        // For all other RA types (Retirement Annuity, Preservation, TFS, Endowment,
        // Living Annuity etc.) initial seeding happens in the seed block above and
        // monthlyContrib is NOT touched here.
        if(match.Type==='Pension Fund' || match.Type==='Provident Fund'){
          if(match.Frequency==='Monthly' || !match.Frequency){
            if(ra.monthlyContrib == null || String(ra.monthlyContrib).trim() === ''){
              var _grossM = parseFloat(String(match.Premium||'').replace(/[^0-9.\-]/g,''))||0;
              if(_grossM > 0){
                var _annRisk = 0;
                try {
                  var _grR = match.GroupRiskBenefits ? JSON.parse(match.GroupRiskBenefits) : [];
                  if(_grR && _grR.length){
                    _grR.forEach(function(rw){
                      _annRisk += parseFloat(String(rw.prem||'').replace(/[^0-9.\-]/g,''))||0;
                    });
                  }
                } catch(e){}
                var _annAdmin = parseFloat(String(match.AnnualAdminFees||'').replace(/[^0-9.\-]/g,''))||0;
                var _netM = _grossM - (_annRisk/12) - (_annAdmin/12);

        pmtNeeded2 = Math.round(shortfall2 / _pmtN / Math.pow(1+_pmtR, _pmtN/2) / 12);
      } else {
        var annPmt2 = shortfall2 * (_pmtR-_pmtG) / (Math.pow(1+_pmtR,_pmtN) - Math.pow(1+_pmtG,_pmtN));
        pmtNeeded2 = Math.round(annPmt2/12);
      }
      var pmtRow2=div();
      pmtRow2.style.cssText='display:flex;justify-content:space-between;padding:6px 0;margin-top:4px;font-size:12px';
      var pmtL2=el('span','','Additional saving needed (escalating '+savEsc2+'% p.a. at '+growthPct2+'% growth)'); pmtL2.style.color='#8899bb';
      var pmtV2=el('span','',Rfmt(pmtNeeded2)+' /pm starting today'); pmtV2.style.cssText='font-weight:700;color:#fbbf24';
      pmtRow2.appendChild(pmtL2); pmtRow2.appendChild(pmtV2);
      calcBox.appendChild(pmtRow2);
    }

    s.appendChild(calcBox);

    // ── What-if calculator
    s.appendChild(stitle('Retirement What-If Calculator'));
    var scInf = div('info');
    scInf.innerHTML = 'Test a different growth assumption, additional savings, and a different retirement age without changing the core retirement inputs above. The "Scenario retirement age" field at the top changes the entire projection horizon — leave blank to use the core retirement age ('+retAge+').';
    s.appendChild(scInf);

    // Row 0: Scenario retirement age (changes the whole projection horizon)
    var scGrid0 = g2();
    var scAgeF = div('f'); scAgeF.appendChild(el('label','','Scenario retirement age'));
    var scAgeW = document.createElement('div'); scAgeW.style.cssText='position:relative';
    var scAgeI = document.createElement('input'); scAgeI.type='text'; scAgeI.inputMode='numeric';
    scAgeI.value = S.retScenario.retAge||''; scAgeI.placeholder='blank = core age '+retAge;
    scAgeI.style.cssText='width:100%;padding:8px;border:1px solid #334;background:#0e413a;color:#e8f0d4;border-radius:6px;font-size:13px';
    scAgeI.addEventListener('input',function(e){ S.retScenario.retAge=e.target.value; });
    scAgeI.addEventListener('blur',function(){ render(); });
    scAgeW.appendChild(scAgeI); scAgeF.appendChild(scAgeW); scGrid0.appendChild(scAgeF);
    scGrid0.appendChild(div()); // empty cell for spacing
    s.appendChild(scGrid0);

    // Row 1: Growth % | Extra lump sum now
    var scGrid1 = g2();
    var scGrowthF = div('f'); scGrowthF.appendChild(el('label','','Growth %'));
    var scGrowthW = div('pw'); scGrowthW.appendChild(el('span','pp','%'));
    var scGrowthI = document.createElement('input'); scGrowthI.type='text'; scGrowthI.inputMode='numeric';
    scGrowthI.value = S.retScenario.growth||''; scGrowthI.placeholder = S.assump.growth||'9';
    scGrowthI.addEventListener('input',function(e){ S.retScenario.growth=e.target.value; });
    scGrowthI.addEventListener('blur',function(){ render(); });
    scGrowthW.insertBefore(scGrowthI, scGrowthW.firstChild); scGrowthF.appendChild(scGrowthW); scGrid1.appendChild(scGrowthF);

    var scLumpF = div('f'); scLumpF.appendChild(el('label','','Extra lump sum now'));
    var scLumpW = div('rw'); scLumpW.appendChild(el('span','rp','R'));
    var scLumpI = document.createElement('input'); scLumpI.type='text'; scLumpI.inputMode='numeric';
    scLumpI.value = S.retScenario.extraLump||'';
    scLumpI.addEventListener('input',function(e){ S.retScenario.extraLump=e.target.value; });
    scLumpI.addEventListener('blur',function(){ render(); });
    scLumpW.appendChild(scLumpI); scLumpF.appendChild(scLumpW); scGrid1.appendChild(scLumpF);
    s.appendChild(scGrid1);

    // Row 2: Extra monthly saving | Escalation on monthly %
    var scGrid2 = g2();
    var scPmF = div('f'); scPmF.appendChild(el('label','','Extra monthly saving'));
    var scPmW = div('rw'); scPmW.appendChild(el('span','rp','R'));
    var scPmI = document.createElement('input'); scPmI.type='text'; scPmI.inputMode='numeric';
    scPmI.value = S.retScenario.extraPM||'';
    scPmI.addEventListener('input',function(e){ S.retScenario.extraPM=e.target.value; });
    scPmI.addEventListener('blur',function(){ render(); });
    scPmW.appendChild(scPmI); scPmF.appendChild(scPmW); scGrid2.appendChild(scPmF);

    var scEscF = div('f'); scEscF.appendChild(el('label','','Escalation on monthly %'));
    var scEscW = div('pw'); scEscW.appendChild(el('span','pp','%'));
    var scEscI = document.createElement('input'); scEscI.type='text'; scEscI.inputMode='numeric';
    scEscI.value = S.retScenario.extraEsc||'';
    scEscI.addEventListener('input',function(e){ S.retScenario.extraEsc=e.target.value; });
    scEscI.addEventListener('blur',function(){ render(); });
    scEscW.insertBefore(scEscI, scEscW.firstChild); scEscF.appendChild(scEscW); scGrid2.appendChild(scEscF);
    s.appendChild(scGrid2);

    // Row 3: Extra annual contribution | Escalation on annual %
    var scGrid3 = g2();
    var scAnnF = div('f'); scAnnF.appendChild(el('label','','Extra annual contribution (e.g. bonus)'));
    var scAnnW = div('rw'); scAnnW.appendChild(el('span','rp','R'));
    var scAnnI = document.createElement('input'); scAnnI.type='text'; scAnnI.inputMode='numeric';
    scAnnI.value = S.retScenario.extraAnnual||'';
    scAnnI.addEventListener('input',function(e){ S.retScenario.extraAnnual=e.target.value; });
    scAnnI.addEventListener('blur',function(){ render(); });
    scAnnW.appendChild(scAnnI); scAnnF.appendChild(scAnnW); scGrid3.appendChild(scAnnF);

    var scAnnEscF = div('f'); scAnnEscF.appendChild(el('label','','Escalation on annual %'));
    var scAnnEscW = div('pw'); scAnnEscW.appendChild(el('span','pp','%'));
    var scAnnEscI = document.createElement('input'); scAnnEscI.type='text'; scAnnEscI.inputMode='numeric';
    scAnnEscI.value = S.retScenario.extraAnnualEsc||'';
    scAnnEscI.addEventListener('input',function(e){ S.retScenario.extraAnnualEsc=e.target.value; });
    scAnnEscI.addEventListener('blur',function(){ render(); });
    scAnnEscW.insertBefore(scAnnEscI, scAnnEscW.firstChild); scAnnEscF.appendChild(scAnnEscW); scGrid3.appendChild(scAnnEscF);
    s.appendChild(scGrid3);

    var scGrowth = Ndef(S.retScenario.growth, N(S.assump.growth)||9);
    var scExtraLump = N(S.retScenario.extraLump);
    var scExtraPM = N(S.retScenario.extraPM);
    var scExtraEsc = N(S.retScenario.extraEsc);
    var scExtraAnnual = N(S.retScenario.extraAnnual);
    var scExtraAnnualEsc = N(S.retScenario.extraAnnualEsc);

    // ── Scenario retirement age — validation and horizon calc
    // Default to core retirement age; override only if user enters a valid scenario age.
    var scRetAge = retAge;
    var scYrsToRet = yrsToRet;
    var scYrsInRet = yrsInRet;
    var scAgeError = '';
    var scAgeOverridden = false;
    if(N(S.retScenario.retAge) > 0){
      var _inputAge = N(S.retScenario.retAge);
      var _endAge = getRetEndAge();
      if(clientAgeNow && _inputAge <= clientAgeNow){
        scAgeError = 'Scenario age ('+_inputAge+') must be later than current age ('+clientAgeNow+'). Using core age '+retAge+'.';
      } else if(_inputAge >= _endAge){
        scAgeError = 'Scenario age ('+_inputAge+') must be earlier than life expectancy ('+_endAge+'). Using core age '+retAge+'.';
      } else {
        scRetAge = _inputAge;
        scYrsToRet = clientAgeNow ? Math.max(0, scRetAge - clientAgeNow) : yrsToRet;
        scYrsInRet = getYearsInRetirement(scRetAge);
        scAgeOverridden = (scRetAge !== retAge);
      }
    }

    // Show validation error or scenario age confirmation banner
    if(scAgeError){
      var scErr = document.createElement('div');
      scErr.style.cssText='background:#7f1d1d;color:#fecaca;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12px';
      scErr.textContent=scAgeError;
      s.appendChild(scErr);
    } else if(scAgeOverridden){
      var scInfo2 = document.createElement('div');
      scInfo2.style.cssText='background:#a8b938;color:#0e413a;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12px;font-weight:600';
      var _diff = scRetAge - retAge;
      var _diffTxt = _diff > 0 ? ('+'+_diff+' years later') : (_diff+' years earlier');
      scInfo2.textContent='Comparing at age '+scRetAge+' ('+_diffTxt+' than core) — '+scYrsToRet+' yrs to retirement, '+scYrsInRet+' yrs in retirement';
      s.appendChild(scInfo2);
    }

    // ── Scenario-age-driven projections (replaces the previous single-horizon calcs)
    // When no scenario age override is set, scYrsToRet === yrsToRet and these values collapse
    // to the same arithmetic that produced totalProj / totalCapNeed in the core calc above.

    // Monthly need at scenario retirement age (each retNeed at its own escalation)
    var scMonthlyAtRet = 0;
    (S.retNeeds||[]).forEach(function(r){
      if(!N(r.amtToday)) return;
      var escTo=Ndef(r.esc, N(S.assump.cpi)||6);
      scMonthlyAtRet+=Math.round(N(r.amtToday)*Math.pow(1+escTo/100,scYrsToRet));
    });

    // Rental income at scenario age (only properties not sold)
    var scRentalAtRet = 0;
    (S.props||[]).forEach(function(p){
      if(p.soldAtRetirement||!N(p.rental)) return;
      var escTo=Ndef(p.rentalEsc, 6);
      scRentalAtRet+=Math.round(N(p.rental)*Math.pow(1+escTo/100,scYrsToRet));
    });

    // Farm/business income at scenario age
    var scOtherIncAtRet = 0;
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')!=='Generates income (farm/business)' || !N(a.retirementIncomePM)) return;
      var escTo=Ndef(a.retirementIncEsc, N(S.assump.cpi)||6);
      scOtherIncAtRet+=Math.round(N(a.retirementIncomePM)*Math.pow(1+escTo/100,scYrsToRet));
    });

    // Manual monthly income (son's contribution, etc.) at scenario age
    var scManualIncAtRet = 0;
    (S.retOtherIncome||[]).forEach(function(r){
      if(!N(r.amtPM)) return;
      var escTo=Ndef(r.escTo, N(S.assump.cpi)||6);
      scManualIncAtRet+=Math.round(N(r.amtPM)*Math.pow(1+escTo/100,scYrsToRet));
    });

    var scNetMonthlyGap = Math.max(0, scMonthlyAtRet - scRentalAtRet - scOtherIncAtRet - scManualIncAtRet);
    var scCapNeed = scNetMonthlyGap > 0 ? capitalise(scNetMonthlyGap, scYrsInRet, defaultCpi, defaultRet) : 0;
    var scLumpNeed = lumpNeed; // same fixed amount per design decision
    var scTotalCapNeed = scCapNeed + scLumpNeed;

    var lumpNeededNow = 0;
    var extraPMNeeded = 0;
    // Cards use core retGap / yrsToRet — unchanged, they answer "fix the baseline plan"
    if(retGap < 0 && yrsToRet > 0){
      var _sf0 = Math.abs(retGap);
      lumpNeededNow = scGrowth>0 ? Math.round(_sf0 / Math.pow(1+scGrowth/100, yrsToRet)) : Math.round(_sf0);
      // Escalating PMT: solve for starting annual payment
      var _r0 = scGrowth/100;
      var _g0 = scExtraEsc/100;
      var _n0 = yrsToRet;
      if(Math.abs(_r0-_g0)<0.0001){
        extraPMNeeded = _n0>0 ? Math.round(_sf0 / _n0 / Math.pow(1+_r0, _n0/2) / 12) : Math.round(_sf0);
      } else {
        var _annPmt0 = _sf0 * (_r0-_g0) / (Math.pow(1+_r0,_n0) - Math.pow(1+_g0,_n0));
        extraPMNeeded = Math.round(_annPmt0/12);
      }
    }

    // Scenario fund projection — uses scGrowth and scRetAge (for maturity branching)
    var scenarioFundsProj = S.retAssets.reduce(function(a,r){
      if(!N(r.currentVal)&&!N(r.monthlyContrib)) return a;
      var esc3=Ndef(r.contribEsc, N(S.assump.incEsc)||6);
      var matAge=N(r.maturityAge);
      if(matAge>0&&clientAgeNow&&matAge<scRetAge && !r.continuePastMaturity){
        var yrsToMat=Math.max(0,matAge-clientAgeNow);
        var matVal=projectFund(r.currentVal,r.monthlyContrib,esc3,scGrowth,yrsToMat);
        var yrsMatToRet=scRetAge-matAge;
        return a+Math.round(matVal*Math.pow(1+scGrowth/100,yrsMatToRet));
      }
      return a+projectFund(r.currentVal,r.monthlyContrib,esc3,scGrowth,scYrsToRet);
    },0);

    // Manual lumps re-projected to scenario age, each at its own growth rate
    var scenarioOtherLumps = 0;
    (S.retOtherLumps||[]).forEach(function(r){
      if(!N(r.amt)) return;
      var gr=Ndef(r.growthRate, N(S.assump.growth)||9);
      scenarioOtherLumps+=Math.round(N(r.amt)*Math.pow(1+gr/100,scYrsToRet));
    });

    // Properties sold at retirement — re-projected to scenario age
    var scenarioPropSold = 0;
    (S.props||[]).forEach(function(p){
      if(!p.soldAtRetirement||!N(p.val)) return;
      var gr=Ndef(p.propGrowth, N(S.assump.growth)||9);
      var projV=Math.round(N(p.val)*Math.pow(1+gr/100,scYrsToRet));
      var pct=Ndef(p.retirementPct, 100);
      scenarioPropSold+=Math.round(projV*pct/100);
    });

    // Other assets sold at retirement — re-projected to scenario age
    var scenarioSoldProceeds = 0;
    (S.otherAssets||[]).forEach(function(a){
      if((a.retirementRole||'')!=='Sold at retirement — proceeds to retirement') return;
      if(!N(a.retirementSaleProceeds)) return;
      var gr=Ndef(a.growthRate, N(S.assump.growth)||9);
      scenarioSoldProceeds+=Math.round(N(a.retirementSaleProceeds)*Math.pow(1+gr/100,scYrsToRet));
    });

    var extraLumpFV = (scExtraLump>0 && scYrsToRet>0) ? Math.round(scExtraLump*Math.pow(1+scGrowth/100,scYrsToRet)) : scExtraLump;
    var extraPMFV = (scExtraPM>0 && scYrsToRet>0) ? projectFund(0, scExtraPM, scExtraEsc, scGrowth, scYrsToRet) : 0;

    // Extra annual contribution — end-of-year growing annuity FV
    // If r=g: FV = annualPmt * n * (1+r)^(n-1)   (correct end-of-year identity)
    // Else:    FV = annualPmt * (R^n - G^n) / (R - G)
    var extraAnnualFV = 0;
    if(scExtraAnnual>0 && scYrsToRet>0){
      var _ra = scGrowth/100;
      var _ga = scExtraAnnualEsc/100;
      if(Math.abs(_ra-_ga)<0.0001){
        extraAnnualFV = Math.round(scExtraAnnual * scYrsToRet * Math.pow(1+_ra, scYrsToRet-1));
      } else {
        extraAnnualFV = Math.round(scExtraAnnual * (Math.pow(1+_ra,scYrsToRet) - Math.pow(1+_ga,scYrsToRet)) / (_ra-_ga));
      }
    }

    var scenarioTotal = scenarioFundsProj + scenarioOtherLumps + scenarioPropSold + scenarioSoldProceeds + extraLumpFV + extraPMFV + extraAnnualFV;
    var scenarioGap = scenarioTotal - scTotalCapNeed;

    var scCards = div('cards c2');
    var scC1 = div('card');
    scC1.innerHTML = '<div class="lbl">Lump sum needed now</div><div class="val '+(retGap<0?'warn':'ok')+'">'+(retGap<0?Rfmt(lumpNeededNow):'—')+'</div><div class="sub">At '+scGrowth+'% growth to core retirement age '+retAge+'</div>';
    scCards.appendChild(scC1);
    var scC2 = div('card');
    scC2.innerHTML = '<div class="lbl">Extra saving needed /pm</div><div class="val '+(retGap<0?'warn':'ok')+'">'+(retGap<0?Rfmt(extraPMNeeded):'—')+'</div><div class="sub">'+(scExtraEsc>0?'Starting today, escalating '+scExtraEsc+'% p.a.':'Level payment — set escalation % to reduce')+'</div>';
    scCards.appendChild(scC2);
    s.appendChild(scCards);

    var scBox = div(); scBox.className='calc-result';
    function scRow(lbl,val,big){
      var r=div('cr-row'+(big?' big':''));
      var l=el('span','',lbl);
      var v=el('span','',val);
      r.appendChild(l); r.appendChild(v); scBox.appendChild(r);
    }
    var _atAgeLbl = scAgeOverridden ? ' (at age '+scRetAge+')' : '';
    scRow('Scenario growth', scGrowth+'%');
    if(scAgeOverridden){
      scRow('Scenario retirement age', String(scRetAge)+' yrs (core: '+retAge+')');
      scRow('Capital needed at age '+scRetAge, Rfmt(scTotalCapNeed));
    }
    scRow('Scenario total at retirement'+_atAgeLbl, Rfmt(scenarioTotal));
    if(extraLumpFV>0) scRow('Extra lump sum at retirement value', Rfmt(extraLumpFV));
    if(extraPMFV>0) scRow('Extra monthly savings at retirement value', Rfmt(extraPMFV));
    if(extraAnnualFV>0) scRow('Extra annual contribution at retirement value', Rfmt(extraAnnualFV));
    scRow(scenarioGap>=0?'Scenario surplus':'Scenario shortfall', Rfmt(Math.abs(scenarioGap)), true);

    // ── Income coverage analysis — what monthly income can the scenario actually fund?
    // Logic: scenarioTotal minus lump sum needs leaves capital available for income.
    // Reverse-capitalise that to a sustainable monthly income using SCENARIO yrsInRet,
    // then add rental/farm/manual at SCENARIO age. Compare to gross desired income at scenario age.
    if(scMonthlyAtRet > 0){
      var scCapForIncome = Math.max(0, scenarioTotal - scLumpNeed);
      var scIncomeFromCap = monthlyFromCapital(scCapForIncome, scYrsInRet, defaultCpi, defaultRet);
      var scIncomeFromOther = scRentalAtRet + scOtherIncAtRet + scManualIncAtRet;
      var scAchievable = scIncomeFromCap + scIncomeFromOther;
      var scAchievableToday = scYrsToRet>0 ? Math.round(scAchievable / Math.pow(1+defaultCpi/100, scYrsToRet)) : scAchievable;
      var monthlyTodayDesired = (S.retNeeds||[]).reduce(function(a,r){return a+N(r.amtToday);},0);
      // Coverage % — clamped at 100% (surplus is already shown in the row above)
      var scCovPct = Math.min(100, Math.round(scAchievable / scMonthlyAtRet * 100));
      var scCovColor = scCovPct >= 95 ? '#86efac' : (scCovPct >= 75 ? '#fbbf24' : '#f87171');

      // Subhead divider
      var scCovHead = document.createElement('div');
      scCovHead.style.cssText='border-top:1px solid #334;margin:10px 0 6px 0;padding-top:8px;font-size:12px;font-weight:600;color:#a8b938';
      scCovHead.textContent='Income coverage in this scenario'+(scAgeOverridden?' (at age '+scRetAge+')':'');
      scBox.appendChild(scCovHead);

      scRow('Desired monthly income'+_atAgeLbl, Rfmt(scMonthlyAtRet)+'/pm');
      scRow('Achievable monthly income'+_atAgeLbl, Rfmt(scAchievable)+'/pm');

      // Today's-rand equivalent — secondary line, dimmed
      if(monthlyTodayDesired>0){
        var scToday = div('cr-row');
        scToday.style.cssText='font-size:11px;opacity:0.8';
        scToday.appendChild(el('span','','\u2248 in today\'s rands'));
        scToday.appendChild(el('span','', Rfmt(scAchievableToday)+'/pm vs '+Rfmt(monthlyTodayDesired)+'/pm desired'));
        scBox.appendChild(scToday);
      }

      // Coverage % — bold colour-coded line
      var scCovRow = div('cr-row big');
      scCovRow.appendChild(el('span','','Coverage of desired income'));
      var scCovV = el('span','', scCovPct + '%');
      scCovV.style.color = scCovColor;
      scCovV.style.fontWeight = '700';
      scCovRow.appendChild(scCovV);
      scBox.appendChild(scCovRow);
    }

    s.appendChild(scBox);
  }

  return s;
}

function buildPolicies() {
  var s = div();

  if (!S.importedPols) S.importedPols = [];
  var pols = S.importedPols;

  var inf = div('info');
  inf.innerHTML = 'All fields are editable here for scenario planning. ' +
    'Changes are <strong>FNA only</strong> — the CRM is not affected. ' +
    (pols.length ? '<strong>' + pols.length + ' polic' + (pols.length === 1 ? 'y' : 'ies') + '</strong> loaded from CRM.' :
      'No policies loaded. Add below or open from a CRM client profile.');
  s.appendChild(inf);

  // ── Render each policy as an editable card
  pols.forEach(function(p, i) {
    s.appendChild(buildPolCard(p, i));
  });

  // Note for the user — policy editing/adding happens in the CRM
  if (pols.length > 0) {
    var crmEditNote = div('info');
    crmEditNote.style.cssText = 'background:#f5f3ec;border-left:3px solid var(--gold);font-size:11px;color:#6a5f1a;margin-top:10px';
    crmEditNote.textContent = 'ℹ All policy details above are pulled from the CRM. To add, edit, or remove a policy, do it in the CRM and click ↻ CRM at the top.';
    s.appendChild(crmEditNote);
  }

  // ── Premium totals + affordability projection
  var _riskTypes = pols.filter(function(p){
    return p.Type !== 'Business Assurance' &&
           POL_RA_TYPES.indexOf(p.Type||'') < 0 &&
           POL_INV_TYPES.indexOf(p.Type||'') < 0 &&
           p.Type !== 'Medical Aid' &&
           (p.Frequency||'Monthly') === 'Monthly' &&
           N(p.Premium) > 0;
  });

  var totalPrem = _riskTypes.reduce(function(s,p){ return s+N(p.Premium); }, 0);
  var totalAllPrem = pols.reduce(function(s,p){
    return s + ((p.Frequency||'Monthly')==='Monthly' ? N(p.Premium) : 0);
  }, 0);

  if (pols.length > 0) {
    var totCards = div('cards c3');
    totCards.style.marginTop = '20px';
    var c1 = div('card'); c1.innerHTML = '<div class="lbl">Risk Premiums /pm</div><div class="val">' + Rfmt(totalPrem) + '</div><div class="sub">Life, disability, dread, IP</div>'; totCards.appendChild(c1);
    var c2 = div('card'); c2.innerHTML = '<div class="lbl">All Premiums /pm</div><div class="val">' + Rfmt(totalAllPrem) + '</div><div class="sub">Including RA, investments</div>'; totCards.appendChild(c2);
    var c3 = div('card'); c3.innerHTML = '<div class="lbl">Policies on Record</div><div class="val">' + pols.length + '</div>'; totCards.appendChild(c3);
    s.appendChild(totCards);

    // Affordability at retirement
    var cliAge2  = ageFrom(S.cli.dob);
    var retAge2  = N(S.cli.retAge) || 65;
    var yrsToRet2 = cliAge2 ? Math.max(0, retAge2 - cliAge2) : null;
    var yrsInRet  = getYearsInRetirement(retAge2);
    var grossPM   = N(S.cli.grossPM) || N(S.incRows&&S.incRows[0]&&S.incRows[0].pm);
    var incEscRate = N(S.assump.incEsc) || 6;

    if (yrsToRet2 !== null && yrsToRet2 > 0 && _riskTypes.length > 0) {
      s.appendChild(stitle('Premium Affordability at Retirement'));
      var afford = div('info');
      afford.innerHTML = 'Shows each premium escalated to retirement at its own rate. '
        + 'Income escalation assumption: <strong>' + incEscRate + '% p.a.</strong> '
        + 'Premiums escalating <em>faster</em> than income are shown in <span style="color:var(--red)">red</span> — '
        + 'these policies become increasingly unaffordable. '
        + 'Tick policies to include in retirement budget, then send to the Retirement tab.';
      s.appendChild(afford);

      // Projected gross income at retirement
      var incAtRet = grossPM > 0 ? Math.round(grossPM * Math.pow(1 + incEscRate/100, yrsToRet2)) : 0;

      var affTbl = document.createElement('table');
      affTbl.innerHTML = '<thead><tr>' +
        '<th style="width:28px"></th>' +
        '<th>Policy</th>' +
        '<th style="text-align:right">Premium today</th>' +
        '<th style="text-align:right">% of income</th>' +

// ── IRR calculation for FNA
function calcPolicyIRR_fna(startDateStr, premium, frequency, premEsc, fundValue){
  if(!startDateStr || !fundValue || N(fundValue)===0) return null;
  var fv = N(fundValue);
  if(fv === 0) return null;
  var sp = String(startDateStr).split(/[T ]/)[0].split(/[-\/]/);
  if(sp.length < 3) return null;
  var start = new Date(+sp[0], +sp[1]-1, +sp[2]);
  var today = new Date();
  var yrs = (today - start) / (365.25 * 24 * 60 * 60 * 1000);
  if(yrs < 0.1) return null;
  var freq = frequency || 'Monthly';
  var isOnce = freq === 'Once Off' || freq === 'Paid Up' || freq === 'Lump Sum';
  var prem = N(premium);
  if(isOnce || prem === 0){
    if(prem === 0) return null;
    var r = Math.pow(fv / prem, 1 / yrs) - 1;
    return Math.round(r * 1000) / 10;
  }
  var esc = N(premEsc) / 100;
  var months = Math.round(yrs * 12);
  if(months < 2) return null;
  function npv(monthlyRate){
    var pv = 0; var p = prem; var annualCount = 0;
    for(var m = 0; m < months; m++){
      if(m > 0 && m % 12 === 0){ annualCount++; p = prem * Math.pow(1 + esc, annualCount); }
      pv -= p / Math.pow(1 + monthlyRate, m + 1);
    }
    pv += fv / Math.pow(1 + monthlyRate, months);
    return pv;
  }
  var r = 0.007;
  for(var i = 0; i < 50; i++){
    var f = npv(r); var delta = 0.00001;
    var df = (npv(r + delta) - f) / delta;
    if(Math.abs(df) < 1e-10) break;
    var rNew = r - f / df;
    if(Math.abs(rNew - r) < 1e-7){ r = rNew; break; }
    r = rNew;
    if(r < -0.5 || r > 2) return null;
  }
  var annualIRR = Math.pow(1 + r, 12) - 1;
  return Math.round(annualIRR * 1000) / 10;
}

        : '<strong>Tax treatment:</strong> <strong>Partially / non-taxable</strong> — disallowed contributions; tax-free portion applies per SARS formula.';
      card.appendChild(taxRow);

      // Tax treatment note — based on CRM setting
      var taxNote=div(); taxNote.style.cssText='font-size:11px;padding:6px 10px;border-radius:6px;margin-top:4px';
      if(_isFullyTaxable){
        taxNote.style.cssText+='background:#fff7ed;border:1px solid #fed7aa;color:#92400e';
        taxNote.innerHTML='⚖ <strong>Taxable:</strong> Full drawing added to gross income — taxed at marginal rate. Note in ROA.';
      } else {
        taxNote.style.cssText+='background:#f0fdf4;border:1px solid #86efac;color:#166534';
        taxNote.innerHTML='✓ <strong>Partially/fully non-taxable:</strong> Disallowed contributions — tax-free portion per SARS "cost" formula. Document basis in ROA.';
      }
      card.appendChild(taxNote);

      // Drawdown rate regulatory warning
      var drRate=N(p.DrawdownRate);
      if(drRate>0 && (drRate<2.5 || drRate>17.5)){
        var drWarn=div('alert');
        drWarn.style.marginTop='6px';
        drWarn.textContent='⚠ FSCA regulation: the annual drawdown rate must be between 2.5% and 17.5%.';
        card.appendChild(drWarn);
      } else if(drRate>=2.5 && drRate<=17.5){
        // Show sustainability indicator
        var fv=N(p.BenFundValue);
        if(fv>0){
          var annualDraw=fv*(drRate/100);
          var monthlyCheck=Math.round(annualDraw/12);
          var drInfo=div(); drInfo.style.cssText='font-size:11px;padding:6px 10px;margin-top:6px;border-radius:6px;background:#f0fdf4;border:1px solid #86efac;color:#166534';
          drInfo.textContent='✓ At '+drRate+'% drawdown on R'+Rfmt(fv)+' fund: ≈ '+Rfmt(monthlyCheck)+' /pm income. Rate within FSCA limits (2.5% – 17.5%).';
          card.appendChild(drInfo);
        }
      }
    } else if(isPreRet){
      var raNote2=div(); raNote2.style.cssText='font-size:11px;padding:6px 10px;margin-top:4px;border-radius:6px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af';
      raNote2.innerHTML='<strong>Retirement fund:</strong> No CGT on death. Outside estate (trustees governed by s.37C). '+
        'Retirement lump sum tax applies to cash withdrawals in the beneficiary\'s hands.';
      card.appendChild(raNote2);
    }

    var premNote = div('info');
    premNote.style.cssText = 'font-size:11px;padding:6px 10px;margin-top:4px';
    premNote.textContent = isLA
      ? 'If still contributing to this Living Annuity, enter the monthly contribution as the Premium above. Leave blank if fully in drawdown phase. Growth rate is used for fund projection.'
      : 'Premium = monthly contribution. Growth rate used for retirement projection.';
    card.appendChild(premNote);
  }

  if (isBiz) {
    var bstBiz = el('div','stitle','Business Assurance Details');
    bstBiz.style.marginTop = '10px';
    card.appendChild(bstBiz);
    var rbBiz = g3();
    rbBiz.appendChild(sfld('Business Type', p, 'BizType', ['','Buy & Sell','Keyman','Contingent Liability']));
    rbBiz.appendChild(div()); // spacer
