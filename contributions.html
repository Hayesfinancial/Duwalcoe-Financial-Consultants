<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Duwalcoe — Retirement Fund Contributions Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e413a;--navy2:#1a5a50;--gold:#a8b938;--cream:#f8f5ef;--smoke:#edeae3;--mist:#d8d4cb;--ink:#1a1a2e;--sage:#2e7d5a;--rose:#9e2a2b;--sky:#2563ab;--orange:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:13px;min-height:100vh}
.topbar{background:var(--navy);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--gold)}.logo em{color:#fff;font-style:italic}
.fsp{font-size:10px;color:#8899bb;margin-top:2px}
.topright{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s}.btn:hover{opacity:.85}
.b-gold{background:var(--gold);color:#fff}.b-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}.b-sage{background:var(--sage);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border:1.5px solid var(--smoke);border-radius:10px;margin-bottom:16px;overflow:hidden}
.ch{padding:12px 18px;border-bottom:1.5px solid var(--smoke);display:flex;align-items:center;justify-content:space-between;background:#fafaf8}
.ch h2{font-family:'DM Serif Display',serif;font-size:15px;color:var(--navy)}
.ch .badge{font-size:10px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700}
.cb{padding:16px 18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:700;color:#667;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select{border:1.5px solid var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;width:100%;background:#fff}
.f input:focus,.f select:focus{border-color:var(--navy)}.f input[readonly]{background:#f4f4f0;color:#667}
.info{font-size:11px;color:#889;padding:8px 12px;background:#f8f8f4;border:1px solid var(--smoke);border-radius:6px;margin-bottom:10px;line-height:1.6}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);padding:10px 0 6px;border-top:1px solid var(--smoke);margin-top:10px}
.result-box{background:var(--navy);border-radius:10px;padding:16px 20px;color:#fff;margin-bottom:16px}
.result-box .headline{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.result-box .hl{text-align:center;flex:1;min-width:120px}
.result-box .hl .v{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold)}
.result-box .hl .l{font-size:10px;color:#8899bb;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.result-box .hl .warn{color:#f87171}.result-box .hl .ok{color:#86efac}
.row-r{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#ccd6f6}
.row-r .lbl{color:#8899bb}.row-r .val{font-weight:600;color:#d4f0a8}
.row-r.bold{border-top:1px solid #334;margin-top:4px;padding-top:7px}.row-r.bold .val{font-size:14px;color:#f0f9d4}
.row-r .neg{color:#f87171}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.dt{width:100%;border-collapse:collapse;font-size:11px}
table.dt th{background:var(--navy);color:#ccd6f6;padding:7px 8px;text-align:right;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
table.dt th:first-child{text-align:left}
table.dt td{padding:6px 8px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}
table.dt td:first-child{text-align:left;font-weight:600;color:var(--navy)}
table.dt tr.subtotal{background:#f4f8f4;font-weight:700}
.add-btn{background:var(--smoke);border:1.5px dashed var(--mist);border-radius:7px;padding:8px 14px;font-size:12px;font-weight:600;color:#889;cursor:pointer;width:100%;text-align:center;font-family:inherit;margin-top:8px}.add-btn:hover{border-color:var(--navy);color:var(--navy);background:#fff}
.del-btn{background:var(--rose);color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer}
.tax-col{padding:14px;border-right:1px solid #334}.tax-col:last-child{border-right:none}
.tax-col .col-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8899bb;margin-bottom:10px;text-align:center;font-weight:700}
.tax-col .col-title.active{color:var(--gold)}
.disclaimer{font-size:10px;color:#889;padding:12px 16px;background:#f8f8f4;border:1px solid var(--smoke);border-radius:7px;line-height:1.7;margin-top:16px}
.saved-note{font-size:11px;color:#889;margin:0 0 10px 4px}.saved-note a{color:var(--sage);font-weight:600;text-decoration:none}
@media(max-width:700px){.g3,.g5{grid-template-columns:1fr}.topbar{flex-direction:column;gap:8px}.topright{flex-wrap:wrap;justify-content:center}}
@media print{@page{size:A4 portrait;margin:12mm}.topbar,.noprint{display:none!important}body{background:#fff;font-size:11px}.wrap{max-width:100%;padding:5px}.card{border:1px solid #ddd;break-inside:avoid}.result-box{break-inside:avoid}}
</style>
</head>

<script>

var SB_URL='https://ayyexuwxaghzljykslxr.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5eWV4dXd4YWdoemxqeWtzbHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTUyMTcsImV4cCI6MjA4OTg5MTIxN30.hp2cQ64FjKnThsLh2qfdqRKdiy39_900JfH6C0KKIx4';
function sbFetch(method,path,body,cb){
  var opts={method:method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'resolution=merge-duplicates':''}};
  if(body) opts.body=JSON.stringify(body);
  fetch(SB_URL+path,opts)
    .then(function(r){return r.text().then(function(t){return{ok:r.ok,text:t};});})
    .then(function(r){
      if(!r.ok){if(cb)cb(null,r.text);return;}
      try{if(cb)cb(r.text?JSON.parse(r.text):[],null);}catch(e){if(cb)cb([],null);}
    }).catch(function(e){if(cb)cb(null,e.message);});
}

/* ══ SARS 2026/2027 TAX — Momentum Tax Guide ══ */
var TAX=[{l:245100,b:0,r:.18},{l:383100,b:44118,r:.26},{l:530200,b:79998,r:.31},{l:695800,b:125599,r:.36},{l:887000,b:185215,r:.39},{l:1878600,b:259783,r:.41},{l:Infinity,b:666339,r:.45}];
var REB1=17820, REB2=9765, REB3=3249, MAX_DED=430000, DED_PCT=.275;

/* ══ HELPERS ══ */
function N(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function R(v){return 'R '+Math.round(v).toLocaleString('en-ZA');}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function div(c){return el('div',c);}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.style.background=t==='err'?'var(--rose)':t==='ok'?'var(--sage)':'var(--navy)';e.style.opacity=1;setTimeout(function(){e.style.opacity=0;},2500);}

function taxPA(gross,age){
  var g=N(gross);if(g<=0)return 0;var t=0;
  for(var i=0;i<TAX.length;i++){var b=TAX[i],p=i?TAX[i-1].l:0;if(g<=b.l){t=b.b+(g-p)*b.r;break;}}
  var reb=REB1;if(N(age)>=65)reb+=REB2;if(N(age)>=75)reb+=REB3;
  return Math.max(0,t-reb);
}
function margRate(gross){var g=N(gross);for(var i=0;i<TAX.length;i++){if(g<=TAX[i].l)return TAX[i].r;}return .45;}

/* ══ STATE ══ */
var S={clientName:'',clientAge:'',clientId:'',taxYear:'2026/2027',
  reportDate:new Date().toISOString().slice(0,10),
  income:{},retContribs:[],proposedRA:'',_lastSaved:''};

var INC=[
  {label:'Salary',ded:false},{label:'Bonus',ded:false},{label:'Commission',ded:true},
  {label:'Employer Retirement Fund Contribution',ded:false},{label:'Employer Medical Aid Contribution',ded:false},
  {label:'Travel Allowance',ded:true},{label:'Company Vehicle (taxable value)',ded:false},
  {label:'Use of Property (taxable value)',ded:false},{label:'Housing Allowance',ded:false},
  {label:'Taxable Subsistence Allowance',ded:false},{label:'Taxable Reimbursement',ded:false},
  {label:'Other Employment Income',ded:false},{label:'Other Fringe Benefits',ded:false}
];

/* ══ COLLECT ALL FORM DATA INTO S ══ */
function collect(){
  var e;
  if(e=document.getElementById('clientName')) S.clientName=e.value;
  if(e=document.getElementById('clientAge'))  S.clientAge=e.value;
  if(e=document.getElementById('reportDate')) S.reportDate=e.value;
  if(e=document.getElementById('proposedRA')) S.proposedRA=e.value;
  S.income={};
  INC.forEach(function(_,i){
    var g=document.getElementById('ig'+i), d=document.getElementById('id'+i);
    S.income[i]={g:g?N(g.value):0, d:d?N(d.value):0};
  });
  // retContribs are kept in sync via oninput handlers — no DOM read needed
}

/* ══ PERSIST TO SESSIONSTORAGE (survives refresh) ══ */
function saveSession(){
  try{sessionStorage.setItem('du_contrib_ses',JSON.stringify(S));}catch(e){}
}
function loadSession(){
  try{var r=sessionStorage.getItem('du_contrib_ses');if(!r)return false;
  var d=JSON.parse(r);Object.keys(d).forEach(function(k){S[k]=d[k];});return true;}catch(e){return false;}
}

/* ══ BUILD UI ══ */
function build(){
  var a=document.getElementById('app');a.innerHTML='';

  if(S._lastSaved){var sn=div('saved-note');sn.innerHTML='Last saved: '+S._lastSaved+' · <a href="#" onclick="saveCalc();return false">Save now</a>';a.appendChild(sn);}

  // Client card
  var c1=div('card');
  c1.innerHTML='<div class="ch"><h2>Client & Adviser Details</h2><span class="badge">'+S.taxYear+'</span></div>'
    +'<div class="cb"><div class="g5">'
    +'<div class="f"><label>Financial Planner</label><input value="Clinton Hayes" readonly></div>'
    +'<div class="f"><label>Client Name</label><input id="clientName" value="'+esc(S.clientName)+'" placeholder="Client name"></div>'
    +'<div class="f"><label>Current Age</label><input id="clientAge" type="number" value="'+esc(S.clientAge)+'" placeholder="e.g. 45" oninput="calc()"></div>'
    +'<div class="f"><label>Tax Year</label><input value="'+S.taxYear+'" readonly></div>'
    +'<div class="f"><label>Date of Report</label><input id="reportDate" type="date" value="'+(S.reportDate||new Date().toISOString().slice(0,10))+'"></div>'
    +'</div></div>';
  a.appendChild(c1);

  // Income
  var c2=div('card');
  c2.innerHTML='<div class="ch"><h2>Sources of Income</h2><span class="badge">Monthly</span></div>';
  var b2=div('cb');
  b2.innerHTML='<div class="info">Enter <strong>monthly</strong> gross amounts. Employer retirement fund and medical aid contributions are taxable fringe benefits forming part of remuneration for s11F purposes.</div>';
  var tbl=document.createElement('table');tbl.className='dt';
  tbl.innerHTML='<thead><tr><th style="text-align:left">Income Source</th><th>Gross Amount</th><th>Deduction</th><th>Remuneration</th><th>Taxable Income</th></tr></thead>';
  var tb=document.createElement('tbody');tb.id='itb';
  INC.forEach(function(item,i){
    var d=S.income[i]||{};
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+item.label+'</td>'
      +'<td><input id="ig'+i+'" type="text" value="'+(d.g||0)+'" style="text-align:right;width:120px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="calc()"></td>'
      +'<td>'+(item.ded?'<input id="id'+i+'" type="text" value="'+(d.d||0)+'" style="text-align:right;width:100px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="calc()">':'<span style="color:#ccc">—</span>')+'</td>'
      +'<td id="ir'+i+'" style="font-size:12px;color:var(--sage);font-weight:600">0</td>'
      +'<td id="it'+i+'" style="font-size:12px;color:var(--navy);font-weight:600">0</td>';
    tb.appendChild(tr);
  });
  var trs=document.createElement('tr');trs.className='subtotal';
  trs.innerHTML='<td style="font-weight:700">Monthly Totals</td><td id="itg"></td><td id="itd"></td><td id="itr" style="color:var(--sage)"></td><td id="itt" style="color:var(--navy)"></td>';
  tb.appendChild(trs);tbl.appendChild(tb);
  var tw=div('tbl-wrap');tw.appendChild(tbl);b2.appendChild(tw);c2.appendChild(b2);a.appendChild(c2);

  // Existing ret contribs
  var c3=div('card');
  c3.innerHTML='<div class="ch"><h2>Existing Retirement Fund Contributions</h2><span class="badge">Employee — Monthly</span></div>';
  var b3=div('cb');
  b3.innerHTML='<div class="info">Enter existing <strong>employee</strong> contributions to pension, provident, or RA funds. Employer contributions entered above are already included.</div>';
  var rw=div();rw.id='rwrap';b3.appendChild(rw);
  var ab=el('button','add-btn','+ Add Retirement Contribution');
  ab.onclick=function(){S.retContribs.push({type:'Retirement Annuity',amount:0});renderRet();calc();};
  b3.appendChild(ab);c3.appendChild(b3);a.appendChild(c3);

  // Max deduction
  var c4=div('card');c4.innerHTML='<div class="ch"><h2>Maximum Tax-Deductible Contribution</h2></div>';
  var b4=div('cb');b4.id='mdBody';c4.appendChild(b4);a.appendChild(c4);

  // Tax comparison — with proposed RA input
  var c5=div('card');c5.innerHTML='<div class="ch"><h2>Tax Benefit Comparison</h2></div>';
  var b5=div('cb');
  b5.innerHTML='<div class="g3" style="margin-bottom:14px">'
    +'<div class="f"><label>Proposed Total RA Contribution (pm)</label><input id="proposedRA" type="text" value="'+esc(S.proposedRA)+'" placeholder="e.g. 3000" oninput="calc()"></div>'
    +'<div class="f"><label>&nbsp;</label><div class="info" style="margin:0">Enter a proposed <strong>total</strong> monthly RA contribution to model an alternative scenario. Leave blank to hide this column.</div></div>'
    +'<div></div></div><div id="tcr"></div>';
  c5.appendChild(b5);a.appendChild(c5);

  // Net cost card
  var c6=div('card');c6.innerHTML='<div class="ch"><h2>Net Cost of Retirement Annuity</h2></div>';
  var b6=div('cb');b6.id='ncBody';c6.appendChild(b6);a.appendChild(c6);

  // Disclaimer
  var disc=div('disclaimer');
  disc.innerHTML='<strong>Disclaimer:</strong> This calculator assists in determining the maximum tax-deductible contribution to retirement funds for the '+S.taxYear+' tax year. It does not constitute financial advice. Consult with the client\'s tax practitioner. Tax tables: SARS '+S.taxYear+'. Annual deduction cap: R430,000.<br><br><strong>Duwalcoe Financial Consultants</strong> · FSP 9978 · Clinton Hayes';
  a.appendChild(disc);

  renderRet();
  calc();
}

function esc(v){return String(v||'').replace(/"/g,'&quot;');}

function renderRet(){
  var w=document.getElementById('rwrap');if(!w)return;w.innerHTML='';
  if(!S.retContribs.length){w.innerHTML='<div style="font-size:12px;color:#aab;padding:8px 0">No existing employee contributions entered.</div>';return;}
  var tbl=document.createElement('table');tbl.className='dt';
  tbl.innerHTML='<thead><tr><th style="text-align:left">Fund Type</th><th>Monthly Contribution</th><th style="width:50px"></th></tr></thead>';
  var tb=document.createElement('tbody');
  S.retContribs.forEach(function(row,i){
    var tr=document.createElement('tr');
    tr.innerHTML='<td><select onchange="S.retContribs['+i+'].type=this.value" style="border:1.5px solid var(--mist);border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit">'
      +'<option'+(row.type==='Pension Fund'?' selected':'')+'>Pension Fund</option>'
      +'<option'+(row.type==='Provident Fund'?' selected':'')+'>Provident Fund</option>'
      +'<option'+(row.type==='Retirement Annuity'?' selected':'')+'>Retirement Annuity</option>'
      +'</select></td>'
      +'<td><input type="text" value="'+(row.amount||0)+'" style="text-align:right;width:120px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="S.retContribs['+i+'].amount=N(this.value);calc()"></td>'
      +'<td><button class="del-btn" onclick="S.retContribs.splice('+i+',1);renderRet();calc()">✕</button></td>';
    tb.appendChild(tr);
  });
  var trt=document.createElement('tr');trt.className='subtotal';
  trt.innerHTML='<td style="font-weight:700">Total Employee Contributions</td><td id="rctot" style="font-weight:700"></td><td></td>';
  tb.appendChild(trt);tbl.appendChild(tb);w.appendChild(tbl);
}

/* ══ MAIN CALCULATION ══ */
function calc(){
  collect();
  var age=N(S.clientAge);
  var tGross=0,tDed=0,tRem=0,tTax=0;
  INC.forEach(function(item,i){
    var d=S.income[i]||{};
    var g=d.g||0, dd=item.ded?(d.d||0):0;
    var rem=g, tax=g-dd;
    var re=document.getElementById('ir'+i), te=document.getElementById('it'+i);
    if(re)re.textContent=R(rem); if(te)te.textContent=R(tax);
    tGross+=g; tDed+=dd; tRem+=rem; tTax+=tax;
  });
  var se=function(id,v){var e=document.getElementById(id);if(e)e.textContent=R(v);};
  se('itg',tGross);se('itd',tDed);se('itr',tRem);se('itt',tTax);

  var empRetPM=S.income[3]?(S.income[3].g||0):0;
  var empContrib=S.retContribs.reduce(function(a,r){return a+N(r.amount);},0);
  se('rctot',empContrib);
  var totalContribPM=empContrib+empRetPM;

  var remPA=tRem*12, taxPA_=tTax*12;
  var l1=MAX_DED, l2a=remPA*DED_PCT, l2b=taxPA_*DED_PCT, l2=Math.max(l2a,l2b), l3=taxPA_;
  var maxDedPA=Math.min(l1,l2,l3), maxDedPM=maxDedPA/12;
  var availPM=Math.max(0,maxDedPM-totalContribPM);
  var excessPM=Math.max(0,totalContribPM-maxDedPM);

  // ── Max Deduction Card
  var md=document.getElementById('mdBody');
  if(md){
    md.innerHTML='';
    var rb=div('result-box');
    rb.innerHTML='<div class="headline">'
      +'<div class="hl"><div class="v">'+R(Math.round(maxDedPM))+'</div><div class="l">Max Deductible /month</div></div>'
      +'<div class="hl"><div class="v">'+R(Math.round(maxDedPA))+'</div><div class="l">Max Deductible /year</div></div>'
      +'<div class="hl"><div class="v '+(availPM>0?'ok':'warn')+'">'+R(Math.round(availPM))+'</div><div class="l">Available Additional /month</div></div></div>';
    function ar(l,v,b,w){var r=div('row-r'+(b?' bold':''));r.innerHTML='<span class="lbl">'+l+'</span><span class="val'+(w?' neg':'')+'">'+v+'</span>';rb.appendChild(r);}
    ar('(1) Annual ceiling','R 430,000 → '+R(Math.round(l1/12))+' /month');
    ar('(2a) 27.5% × Remuneration ('+R(remPA)+')','→ '+R(Math.round(l2a/12))+' /month');
    ar('(2b) 27.5% × Taxable Income ('+R(taxPA_)+')','→ '+R(Math.round(l2b/12))+' /month');
    ar('Greater of (2a) and (2b)',R(Math.round(l2/12))+' /month');
    ar('(3) Taxable income (excl. lump sums & CGT)',R(Math.round(l3/12))+' /month');
    ar('Maximum deductible contribution',R(Math.round(maxDedPM))+' /month',true);
    rb.appendChild(el('div','sec','Current Contributions'));
    ar('Employee contributions (pension/provident/RA)',R(Math.round(empContrib))+' /month');
    ar('Employer retirement fund contribution (deemed)',R(Math.round(empRetPM))+' /month');
    ar('Total current contributions',R(Math.round(totalContribPM))+' /month',true);
    if(excessPM>0) ar('⚠ Excess (non-deductible, carried forward)',R(Math.round(excessPM))+' /month',false,true);
    else ar('Available for additional contribution',R(Math.round(availPM))+' /month',true);
    md.appendChild(rb);
  }

  // ── Tax Benefit Comparison — ALWAYS 4 columns when proposed is entered, else 3
  var proposedPM=N(S.proposedRA);
  var tcr=document.getElementById('tcr');
  if(!tcr){saveSession();return;}
  tcr.innerHTML='';

  var scenarios=[
    {name:'No Contribution', ra:0},
    {name:'Current',         ra:totalContribPM},
  ];
  if(proposedPM>0){
    scenarios.push({name:'Proposed', ra:proposedPM+empRetPM});
  }
  scenarios.push({name:'Maximum', ra:totalContribPM+availPM});

  var nc=scenarios.length;
  var cb=div('result-box');

  // Top grid: tax calc per scenario
  var topG=div();topG.style.cssText='display:grid;grid-template-columns:repeat('+nc+',1fr);gap:0';
  var txR=[];
  scenarios.forEach(function(sc){
    var col=div('tax-col');
    var sub='';
    if(sc.name==='Current') sub=' ('+R(totalContribPM)+'/m)';
    if(sc.name==='Proposed') sub=' ('+R(proposedPM)+'/m)';
    if(sc.name==='Maximum') sub=' ('+R(Math.round(totalContribPM+availPM))+'/m)';
    col.innerHTML='<div class="col-title'+(sc.name==='Maximum'?' active':'')+'">'+sc.name+sub+'</div>';

    var dedPA=Math.min(sc.ra*12, maxDedPA);
    var tiAfter=Math.max(0, taxPA_-dedPA);
    var tx=taxPA(tiAfter, age);
    txR.push(tx);

    function cr(l,m,a,b){
      var r=div('row-r'+(b?' bold':''));r.innerHTML='<span class="lbl">'+l+'</span>';
      var v=div();v.style.cssText='text-align:right';
      v.innerHTML='<div class="val" style="font-size:11px">'+R(Math.round(m))+' /m</div><div style="font-size:10px;color:#667">'+R(Math.round(a))+' /yr</div>';
      r.appendChild(v);col.appendChild(r);
    }
    cr('Taxable income (before)',taxPA_/12,taxPA_);
    cr('Retirement deduction',dedPA/12,dedPA);
    cr('Taxable income (after)',tiAfter/12,tiAfter);
    cr('Tax payable',tx/12,tx,true);
    topG.appendChild(col);
  });
  cb.appendChild(topG);

  // Bottom grid: cash flow per scenario
  var btG=div();btG.style.cssText='display:grid;grid-template-columns:repeat('+nc+',1fr);gap:0;border-top:1px solid #334;margin-top:4px';
  scenarios.forEach(function(sc,si){
    var txPM=Math.round(txR[si]/12);
    var raPM=Math.round(sc.ra);
    var cash=tRem-txPM-raPM;
    var sav=txR[0]-txR[si];
    var d=div();d.style.cssText='padding:12px 14px';
    function fl(l,v,b,c){var r=div('row-r'+(b?' bold':''));r.innerHTML='<span class="lbl">'+l+'</span><span class="val" style="'+(c?'color:'+c:'')+'">'+v+'</span>';d.appendChild(r);}
    fl('Gross Income',R(tRem)+' /m');
    fl('Less: Tax','('+R(txPM)+') /m');
    fl('Less: RA','('+R(raPM)+') /m');
    fl('Cash in Pocket',R(cash)+' /m',true,cash>=0?'#86efac':'#f87171');
    if(sav>0) fl('Tax Saving vs No RA',R(Math.round(sav/12))+' /m',false,'#86efac');
    btG.appendChild(d);
  });
  cb.appendChild(btG);
  tcr.appendChild(cb);

  // ── Net Cost Card
  var nc2=document.getElementById('ncBody');
  if(nc2){
    nc2.innerHTML='';
    var mr=margRate(taxPA_), mp=Math.round(mr*100);
    var nb=div('result-box');
    nb.innerHTML='<div class="headline"><div class="hl"><div class="v">'+mp+'%</div><div class="l">Marginal Tax Rate</div></div><div class="hl"><div class="v">'+(100-mp)+'c</div><div class="l">Net Cost per R1</div></div><div class="hl"><div class="v ok">'+mp+'c</div><div class="l">Tax Relief per R1</div></div></div>';
    var ni=div();ni.style.cssText='font-size:11px;color:#8899bb;margin-top:8px;padding-top:8px;border-top:1px solid #334;line-height:1.7';
    ni.innerHTML='<strong style="color:var(--gold)">The tax advantage of Retirement Annuities</strong><br>At a marginal rate of <strong>'+mp+'%</strong>, every R100 contributed to an RA effectively costs only <strong>R'+(100-mp)+'</strong> after tax relief.';
    nb.appendChild(ni);
    var rt=div('tbl-wrap');
    rt.innerHTML='<table class="dt"><thead><tr><th style="text-align:left">At Marginal Rate</th><th>18%</th><th>26%</th><th>31%</th><th>36%</th><th>39%</th><th>41%</th><th>45%</th></tr></thead><tbody><tr><td>RA Contribution</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td></tr><tr><td>Less: Tax Relief</td><td>R18</td><td>R26</td><td>R31</td><td>R36</td><td>R39</td><td>R41</td><td>R45</td></tr><tr class="subtotal"><td>After-Tax Cost</td><td><strong>R82</strong></td><td><strong>R74</strong></td><td><strong>R69</strong></td><td><strong>R64</strong></td><td><strong>R61</strong></td><td><strong>R59</strong></td><td><strong>R55</strong></td></tr></tbody></table>';
    nb.appendChild(rt);
    if(availPM>0&&mr>0){
      var eq=availPM/(1-mr);
      var bi=div();bi.style.cssText='margin-top:12px;padding-top:10px;border-top:1px solid #334;font-size:12px;color:#ccd6f6;line-height:1.8';
      bi.innerHTML='At your marginal rate of <strong style="color:var(--gold)">'+mp+'%</strong>:<br>An RA investment of <strong style="color:#86efac">'+R(Math.round(eq))+'</strong> /month has the same after-tax cost as a discretionary investment of <strong>'+R(Math.round(availPM))+'</strong> /month.';
      nb.appendChild(bi);
    }
    nc2.appendChild(nb);
  }

  // Save to sessionStorage after every calc
  saveSession();
}

/* ══ SAVE TO SUPABASE + LOCALSTORAGE ══ */
function saveCalc(){
  collect();
  var name=(S.clientName||'').trim();
  if(!name){toast('Enter a client name before saving','err');return;}
  var id='contrib_'+name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase()+'_'+S.taxYear.replace(/\//g,'');
  var now=new Date().toISOString().slice(0,16).replace('T',' ');
  var row={"ID":id,"ClientName":name,"TaxYear":S.taxYear,"Data":JSON.stringify(S),"LastSaved":now,"SavedBy":"Clinton Hayes"};
  try{localStorage.setItem('du_contrib_'+id,JSON.stringify(row));}catch(e){}
  try{
    var idx=JSON.parse(localStorage.getItem('du_contrib_index')||'[]');
    var ex=idx.find(function(x){return x.id===id;});
    if(!ex) idx.unshift({id:id,name:name,taxYear:S.taxYear,saved:now});
    else ex.saved=now;
    localStorage.setItem('du_contrib_index',JSON.stringify(idx));
  }catch(e){}
  var done=false;
  var tm=setTimeout(function(){if(done)return;done=true;toast('Saved locally — server timed out','err');},12000);
  sbFetch('POST','/rest/v1/contributions?on_conflict=ID',[row],function(res,err){
    if(done)return;done=true;clearTimeout(tm);
    if(err){toast('Saved locally — server error','err');return;}
    S._lastSaved=now;toast(name+' ('+S.taxYear+') saved ✓','ok');
    build();
  });
}

/* ══ LOAD ══ */
function loadCalc(id){
  try{
    var loc=JSON.parse(localStorage.getItem('du_contrib_'+id)||'null');
    if(loc&&loc.Data){
      var st=JSON.parse(loc.Data);Object.keys(st).forEach(function(k){S[k]=st[k];});
      S._lastSaved=loc.LastSaved||'';build();toast('Loaded '+(S.clientName||id)+' (local)','ok');return;
    }
  }catch(e){}
  sbFetch('GET','/rest/v1/contributions?ID=eq.'+encodeURIComponent(id)+'&select=*',null,function(rows){
    if(!rows||!rows.length){toast('Not found','err');return;}
    try{var st=JSON.parse(rows[0].Data);Object.keys(st).forEach(function(k){S[k]=st[k];});S._lastSaved=rows[0].LastSaved||'';build();toast('Loaded '+(S.clientName||id),'ok');}
    catch(e){toast('Error loading','err');}
  });
}

/* ══ SEARCH ══ */
function searchSaved(q){
  var drop=document.getElementById('loadDrop');if(!drop)return;
  if(!q||q.length<1){drop.style.display='none';return;}
  q=q.toLowerCase();
  var results=[];
  try{var idx=JSON.parse(localStorage.getItem('du_contrib_index')||'[]');results=idx.filter(function(x){return(x.name||'').toLowerCase().indexOf(q)>-1;}).slice(0,8);}catch(e){}
  if(!results.length){
    sbFetch('GET','/rest/v1/contributions?ClientName=ilike.*'+encodeURIComponent(q)+'*&select=ID,ClientName,TaxYear,LastSaved&limit=8',null,function(rows){
      if(!rows||!rows.length){drop.innerHTML='<div style="padding:12px;font-size:12px;color:#aaa">No results</div>';drop.style.display='block';return;}
      drop.innerHTML=rows.map(function(r){return'<div onmousedown="loadCalc(\''+r.ID+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee;font-size:13px" onmouseover="this.style.background=\'#f5f7fa\'" onmouseout="this.style.background=\'#fff\'"><div style="font-weight:600;color:var(--navy)">'+r.ClientName+'</div><div style="font-size:11px;color:#889">'+(r.TaxYear||'')+' · '+(r.LastSaved||'')+'</div></div>';}).join('');
      drop.style.display='block';
    });return;
  }
  drop.innerHTML=results.map(function(r){return'<div onmousedown="loadCalc(\''+r.id+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee;font-size:13px" onmouseover="this.style.background=\'#f5f7fa\'" onmouseout="this.style.background=\'#fff\'"><div style="font-weight:600;color:var(--navy)">'+r.name+'</div><div style="font-size:11px;color:#889">'+(r.taxYear||'')+' · '+(r.saved||'')+'</div></div>';}).join('');
  drop.style.display='block';
}

/* ══ CRM LAUNCH ══ */
function pickupCRM(){
  try{
    var raw=localStorage.getItem('du_contrib_launch');
    if(!raw) return false;
    localStorage.removeItem('du_contrib_launch');
    var d=JSON.parse(raw);
    if(d.name) S.clientName=d.name;
    if(d.age)  S.clientAge=String(d.age);
    if(d.clientId) S.clientId=d.clientId;
    if(d.income) S.income[0]={g:N(d.income),d:0};
    if(d.retContribs&&d.retContribs.length) S.retContribs=d.retContribs;
    return true;
  }catch(e){return false;}
}

function resetAll(){
  S={clientName:'',clientAge:'',clientId:'',taxYear:'2026/2027',reportDate:new Date().toISOString().slice(0,10),income:{},retContribs:[],proposedRA:'',_lastSaved:''};
  try{sessionStorage.removeItem('du_contrib_ses');}catch(e){}
  build();toast('New calculation started');
}

/* ══ INIT ══ */
// Priority: 1) CRM launch data  2) sessionStorage (refresh)  3) blank
if(!pickupCRM()){ loadSession(); }
build();
</script>
