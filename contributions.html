var taxableBeforeRetPA=taxablePA;

var scenarios=[{label:'No Contribution',totalContrib:0},{label:'Current',totalContrib:totalContribPM}];
if(showProposed) scenarios.push({label:'Proposed',totalContrib:personalChoicePM+employerRetPM});
scenarios.push({label:'Maximum',totalContrib:totalContribPM+availableAdditionalPM});
var nCols=scenarios.length;
var compBox=div('result-box');var compGrid=div();compGrid.style.cssText='display:grid;grid-template-columns:repeat('+nCols+',1fr);gap:0';var taxResults=[];
scenarios.forEach(function(sc,si){var col=div('tax-col');var subLabel=sc.label==='Current'?' ('+R(totalContribPM)+'/m)':sc.label==='Proposed'?' ('+R(personalChoicePM)+'/m)':sc.label==='Maximum'?' ('+R(Math.round(totalContribPM+availableAdditionalPM))+'/m)':'';col.innerHTML='<div class="col-title'+(sc.label==='Maximum'?' active':'')+'">'+sc.label+subLabel+'</div>';var scPA=sc.totalContrib*12,dedPA=Math.min(scPA,maxDeductPA),dedPM=dedPA/12;var taxAfterPA=Math.max(0,taxableBeforeRetPA-dedPA),taxPA=calcTaxPA(taxAfterPA,age);taxResults.push({taxPA:taxPA});
function cRow(lbl,m,a,bold){var r=div('row-r'+(bold?' bold':''));r.innerHTML='<span class="lbl">'+lbl+'</span>';var vd=div();vd.style.cssText='text-align:right';vd.innerHTML='<div class="val" style="font-size:11px">'+R(Math.round(m))+' /m</div><div style="font-size:10px;color:#667">'+R(Math.round(a))+' /yr</div>';r.appendChild(vd);col.appendChild(r);}
cRow('Taxable income (before ret.)',taxableBeforeRetPA/12,taxableBeforeRetPA);cRow('Retirement fund deduction',dedPM,dedPA);cRow('Taxable income (after ret.)',taxAfterPA/12,taxAfterPA);cRow('Tax payable',taxPA/12,taxPA,true);compGrid.appendChild(col);});compBox.appendChild(compGrid);
var cfRow=div();cfRow.style.cssText='display:grid;grid-template-columns:repeat('+nCols+',1fr);gap:0;border-top:1px solid #334;margin-top:4px';
var grossPM=totalRem;
scenarios.forEach(function(sc,si){
var taxPM=Math.round(taxResults[si].taxPA/12);var raPM=Math.round(sc.totalContrib);var cashPM=grossPM-taxPM-raPM;
var d=div();d.style.cssText='padding:12px 14px';
function cfLine(lbl,val,bold,color){var r=div('row-r'+(bold?' bold':''));r.innerHTML='<span class="lbl">'+lbl+'</span><span class="val" style="'+(color?'color:'+color:'')+'">'+val+'</span>';d.appendChild(r);}
cfLine('Gross Income',R(grossPM)+' /m');cfLine('Less: Tax','('+R(taxPM)+') /m');cfLine('Less: RA Contribution','('+R(raPM)+') /m');cfLine('Cash in Pocket',R(cashPM)+' /m',true,cashPM>=0?'#86efac':'#f87171');
var saving=taxResults[0].taxPA-taxResults[si].taxPA;
if(saving>0){cfLine('Tax Saving vs No RA',R(Math.round(saving/12))+' /m',false,'#86efac');}
cfRow.appendChild(d);});
compBox.appendChild(cfRow);
tcr.appendChild(compBox);
var ncBody=document.getElementById('netCostBody');if(!ncBody)return;ncBody.innerHTML='';var margRate=calcMarginalRate(taxableBeforeRetPA),margPct=Math.round(margRate*100);var ncBox=div('result-box');ncBox.innerHTML='<div class="headline"><div class="hl"><div class="v">'+margPct+'%</div><div class="l">Marginal Tax Rate</div></div><div class="hl"><div class="v">'+(100-margPct)+'c</div><div class="l">Net Cost per R1 Contributed</div></div><div class="hl"><div class="v ok">'+margPct+'c</div><div class="l">Tax Relief per R1</div></div></div>';
var ncInfo=div();ncInfo.style.cssText='font-size:11px;color:#8899bb;margin-top:8px;padding-top:8px;border-top:1px solid #334;line-height:1.7';ncInfo.innerHTML='<strong style="color:var(--gold)">The tax advantage of Retirement Annuities</strong><br>At a marginal rate of <strong>'+margPct+'%</strong>, every R100 contributed to an RA effectively costs only <strong>R'+(100-margPct)+'</strong> after tax relief.';ncBox.appendChild(ncInfo);
var rateTbl=div('tbl-wrap');rateTbl.innerHTML='<table class="dt"><thead><tr><th style="text-align:left">At Marginal Rate</th><th>18%</th><th>26%</th><th>31%</th><th>36%</th><th>39%</th><th>41%</th><th>45%</th></tr></thead><tbody><tr><td>RA Contribution</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td></tr><tr><td>Less: Tax Relief</td><td>R18</td><td>R26</td><td>R31</td><td>R36</td><td>R39</td><td>R41</td><td>R45</td></tr><tr class="subtotal"><td>After-Tax Cost</td><td><strong>R82</strong></td><td><strong>R74</strong></td><td><strong>R69</strong></td><td><strong>R64</strong></td><td><strong>R61</strong></td><td><strong>R59</strong></td><td><strong>R55</strong></td></tr></tbody></table>';ncBox.appendChild(rateTbl);
if(availableAdditionalPM>0&&margRate>0){var raEquiv=availableAdditionalPM/(1-margRate);var beInfo=div();beInfo.style.cssText='margin-top:12px;padding-top:10px;border-top:1px solid #334;font-size:12px;color:#ccd6f6;line-height:1.8';beInfo.innerHTML='At your marginal rate of <strong style="color:var(--gold)">'+margPct+'%</strong>:<br>An RA investment of <strong style="color:#86efac">'+R(Math.round(raEquiv))+'</strong> /month has the same after-tax cost as a discretionary investment of <strong>'+R(Math.round(availableAdditionalPM))+'</strong> /month.';ncBox.appendChild(beInfo);}
ncBody.appendChild(ncBox);}

function saveCalc(){collectAll();var name=(S.clientName||'').trim();if(!name){toast('Enter a client name before saving','err');return;}var id='contrib_'+name.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase()+'_'+S.taxYear.replace(/\//g,'');var now=new Date().toISOString().slice(0,16).replace('T',' ');var row={"ID":id,"ClientName":name,"TaxYear":S.taxYear,"Data":JSON.stringify(S),"LastSaved":now,"SavedBy":"Clinton Hayes"};try{localStorage.setItem('du_contrib_'+id,JSON.stringify(row));}catch(e){}try{var idx=JSON.parse(localStorage.getItem('du_contrib_index')||'[]');var ex=idx.find(function(x){return x.id===id;});if(!ex)idx.unshift({id:id,name:name,taxYear:S.taxYear,saved:now});else ex.saved=now;localStorage.setItem('du_contrib_index',JSON.stringify(idx));}catch(e){}var _done=false;var _timer=setTimeout(function(){if(_done)return;_done=true;toast('Saved locally — server timed out','err');},12000);sbFetch('POST','/rest/v1/contributions?on_conflict=ID',[row],function(res,err){if(_done)return;_done=true;clearTimeout(_timer);if(err){toast('Saved locally — server error','err');return;}S._lastSaved=now;toast(name+' ('+S.taxYear+') saved ✓','ok');build();});}

function loadCalc(id){try{var local=JSON.parse(localStorage.getItem('du_contrib_'+id)||'null');if(local&&local.Data){var state=JSON.parse(local.Data);Object.keys(state).forEach(function(k){S[k]=state[k];});S._lastSaved=local.LastSaved||'';build();toast('Loaded '+(S.clientName||id)+' (local)','ok');return;}}catch(e){}sbFetch('GET','/rest/v1/contributions?ID=eq.'+encodeURIComponent(id)+'&select=*',null,function(rows){if(!rows||!rows.length){toast('Not found','err');return;}try{var state=JSON.parse(rows[0].Data);Object.keys(state).forEach(function(k){S[k]=state[k];});S._lastSaved=rows[0].LastSaved||'';build();toast('Loaded '+(S.clientName||id),'ok');}catch(e){toast('Error loading data','err');}});}

function searchSaved(q){var drop=document.getElementById('loadDrop');if(!drop)return;if(!q||q.length<1){drop.style.display='none';return;}q=q.toLowerCase();var results=[];try{var idx=JSON.parse(localStorage.getItem('du_contrib_index')||'[]');results=idx.filter(function(x){return(x.name||'').toLowerCase().indexOf(q)>-1;}).slice(0,8);}catch(e){}if(!results.length){sbFetch('GET','/rest/v1/contributions?ClientName=ilike.*'+encodeURIComponent(q)+'*&select=ID,ClientName,TaxYear,LastSaved&limit=8',null,function(rows){if(!rows||!rows.length){drop.innerHTML='<div style="padding:12px;font-size:12px;color:#aaa">No saved calculations found</div>';drop.style.display='block';return;}drop.innerHTML=rows.map(function(r){return'<div onmousedown="loadCalc(\''+r.ID+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee;font-size:13px" onmouseover="this.style.background=\'#f5f7fa\'" onmouseout="this.style.background=\'#fff\'"><div style="font-weight:600;color:var(--navy)">'+r.ClientName+'</div><div style="font-size:11px;color:#889">'+(r.TaxYear||'')+' · Saved: '+(r.LastSaved||'—')+'</div></div>';}).join('');drop.style.display='block';});return;}drop.innerHTML=results.map(function(r){return'<div onmousedown="loadCalc(\''+r.id+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #eee;font-size:13px" onmouseover="this.style.background=\'#f5f7fa\'" onmouseout="this.style.background=\'#fff\'"><div style="font-weight:600;color:var(--navy)">'+r.name+'</div><div style="font-size:11px;color:#889">'+(r.taxYear||'')+' · Saved: '+(r.saved||'—')+'</div></div>';}).join('');drop.style.display='block';}

function pickupCRMData(){try{var raw=localStorage.getItem('du_contrib_launch');if(!raw)return false;localStorage.removeItem('du_contrib_launch');var data=JSON.parse(raw);if(data.name)S.clientName=data.name;if(data.age)S.clientAge=String(data.age);if(data.clientId)S.clientId=data.clientId;if(data.income)S.income[0]={gross:N(data.income),deduction:0};if(data.retContribs&&data.retContribs.length)S.retContribs=data.retContribs;return true;}catch(e){console.warn('CRM pickup error:',e);return false;}}
function restoreLastSession(){try{var idx=JSON.parse(localStorage.getItem('du_contrib_index')||'[]');if(!idx.length)return false;var last=idx[0];var local=JSON.parse(localStorage.getItem('du_contrib_'+last.id)||'null');if(local&&local.Data){var state=JSON.parse(local.Data);Object.keys(state).forEach(function(k){S[k]=state[k];});S._lastSaved=local.LastSaved||'';return true;}return false;}catch(e){return false;}}
function resetAll(){S={clientName:'',clientAge:'',clientId:'',taxYear:'2026/2027',reportDate:new Date().toISOString().slice(0,10),income:{},retContribs:[],personalChoice:0,_lastSaved:''};build();toast('New calculation started');}
if(!pickupCRMData()){restoreLastSession();}
build();
