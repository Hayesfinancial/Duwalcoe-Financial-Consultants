<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Duwalcoe — Retirement Fund Contributions Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e413a;--navy2:#1a5a50;--gold:#a8b938;--cream:#f8f5ef;--smoke:#edeae3;--mist:#d8d4cb;--ink:#1a1a2e;--sage:#2e7d5a;--rose:#9e2a2b;--sky:#2563ab;--orange:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:13px;min-height:100vh}
.topbar{background:var(--navy);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--gold)}.logo em{color:#fff;font-style:italic}
.fsp{font-size:10px;color:#8899bb;margin-top:2px}
.topright{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s}
.btn:hover{opacity:.85}
.b-gold{background:var(--gold);color:#fff}.b-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.b-navy{background:var(--navy);color:#fff}.b-sage{background:var(--sage);color:#fff}.b-rose{background:var(--rose);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.card{background:#fff;border:1.5px solid var(--smoke);border-radius:10px;margin-bottom:16px;overflow:hidden}
.ch{padding:12px 18px;border-bottom:1.5px solid var(--smoke);display:flex;align-items:center;justify-content:space-between;background:#fafaf8}
.ch h2{font-family:'DM Serif Display',serif;font-size:15px;color:var(--navy)}
.ch .badge{font-size:10px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700}
.cb{padding:16px 18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-weight:700;color:#667;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select{border:1.5px solid var(--mist);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;width:100%;background:#fff}
.f input:focus,.f select:focus{border-color:var(--navy)}
.f input[readonly]{background:#f4f4f0;color:#667}
.info{font-size:11px;color:#889;padding:8px 12px;background:#f8f8f4;border:1px solid var(--smoke);border-radius:6px;margin-bottom:10px;line-height:1.6}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);padding:10px 0 6px;border-top:1px solid var(--smoke);margin-top:10px}
.result-box{background:var(--navy);border-radius:10px;padding:16px 20px;color:#fff;margin-bottom:16px}
.result-box .headline{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.result-box .hl{text-align:center;flex:1;min-width:140px}
.result-box .hl .v{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold)}
.result-box .hl .l{font-size:10px;color:#8899bb;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.result-box .hl .warn{color:#f87171}.result-box .hl .ok{color:#86efac}
.row-r{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#ccd6f6}
.row-r .lbl{color:#8899bb}.row-r .val{font-weight:600;color:#d4f0a8}
.row-r.bold{border-top:1px solid #334;margin-top:4px;padding-top:7px}.row-r.bold .val{font-size:14px;color:#f0f9d4}
.row-r .neg{color:#f87171}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--navy);color:#ccd6f6;padding:7px 8px;text-align:right;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
th:first-child{text-align:left}
td{padding:6px 8px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}
td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.add-btn{background:var(--smoke);border:1.5px dashed var(--mist);border-radius:7px;padding:8px 14px;font-size:12px;font-weight:600;color:#889;cursor:pointer;width:100%;text-align:center;font-family:inherit;margin-top:8px}
.add-btn:hover{border-color:var(--navy);color:var(--navy);background:#fff}
.del-btn{background:var(--rose);color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer}
.tax-benefit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.tax-col{padding:14px;border-right:1px solid #334}
.tax-col:last-child{border-right:none}
.tax-col .col-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8899bb;margin-bottom:10px;text-align:center;font-weight:700}
.tax-col .col-title.active{color:var(--gold)}
.disclaimer{font-size:10px;color:#889;padding:12px 16px;background:#f8f8f4;border:1px solid var(--smoke);border-radius:7px;line-height:1.7;margin-top:16px}
@media(max-width:700px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .tax-benefit-grid{grid-template-columns:1fr}
  .tax-col{border-right:none;border-bottom:1px solid #334}
  .topbar{flex-direction:column;gap:8px}
  .topright{flex-wrap:wrap;justify-content:center}
}
@media print{
  @page{size:A4 portrait;margin:12mm}
  .topbar,.noprint{display:none!important}
  body{background:#fff;font-size:11px}
  .wrap{max-width:100%;padding:5px}
  .card{border:1px solid #ddd;break-inside:avoid}
  .result-box{break-inside:avoid}
}
</style>
</head>
<body>
<div class="topbar noprint">
  <div>
    <div class="logo">Duwalcoe <em>Contributions Calculator</em></div>
    <div class="fsp">Retirement Fund Contribution Tax Optimiser · FSP 9978</div>
  </div>
  <div class="topright">
    <button class="btn b-gold" onclick="calculate()">📊 Calculate</button>
    <button class="btn b-ghost" onclick="resetAll()">🔄 Reset</button>
    <button class="btn b-ghost" onclick="window.print()">🖨 Print</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div id="toast" style="position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none"></div>

<script>
// ══════════════════════════════════════════════════════════════
// SARS 2026/2027 TAX TABLES — Momentum Tax Guide
// ══════════════════════════════════════════════════════════════
var TAX_BRACKETS = [
  { limit: 245100,   base: 0,       rate: 0.18 },
  { limit: 383100,   base: 44118,   rate: 0.26 },
  { limit: 530200,   base: 79998,   rate: 0.31 },
  { limit: 695800,   base: 125599,  rate: 0.36 },
  { limit: 887000,   base: 185215,  rate: 0.39 },
  { limit: 1878600,  base: 259783,  rate: 0.41 },
  { limit: Infinity, base: 666339,  rate: 0.45 }
];
var REBATE_PRIMARY   = 17820;   // < 65
var REBATE_SECONDARY = 9765;    // 65-74  (27585 - 17820)
var REBATE_TERTIARY  = 3249;    // 75+    (30834 - 27585)
var MAX_DEDUCTION_PA = 430000;  // Annual ceiling
var DEDUCTION_PCT    = 0.275;   // 27.5%

// ══ HELPERS ═════════════════════════════════════════════════
function N(v){ var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function R(v){ return 'R '+Math.round(v).toLocaleString('en-ZA'); }
function pct(v){ return (N(v)/100); }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e; }
function div(cls){ return el('div',cls); }

function toast(msg,ms){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  setTimeout(function(){ t.style.opacity=0; }, ms||2500);
}

// ══ TAX CALCULATION ═════════════════════════════════════════
function calcTaxPA(grossPA, age){
  var g = N(grossPA);
  if(g<=0) return 0;
  var prevLimit = 0, tax = 0;
  for(var i=0;i<TAX_BRACKETS.length;i++){
    var b = TAX_BRACKETS[i];
    if(g <= b.limit){
      tax = b.base + (g - (i===0?0:TAX_BRACKETS[i-1].limit)) * b.rate;
      break;
    }
  }
  // Apply rebates
  var rebate = REBATE_PRIMARY;
  if(N(age)>=65) rebate += REBATE_SECONDARY;
  if(N(age)>=75) rebate += REBATE_TERTIARY;
  return Math.max(0, tax - rebate);
}

function calcMarginalRate(grossPA){
  var g = N(grossPA);
  for(var i=0;i<TAX_BRACKETS.length;i++){
    if(g <= TAX_BRACKETS[i].limit) return TAX_BRACKETS[i].rate;
  }
  return 0.45;
}

// ══ INCOME ROWS ═════════════════════════════════════════════
var incomeRows = [];
var defaultIncomeTypes = [
  {label:'Salary', taxable:true, remuneration:true, deduction:false},
  {label:'Bonus', taxable:true, remuneration:true, deduction:false},
  {label:'Commission', taxable:true, remuneration:true, deduction:false},
  {label:'Employer Retirement Fund Contribution', taxable:true, remuneration:true, deduction:false},
  {label:'Employer Medical Aid Contribution', taxable:true, remuneration:true, deduction:false},
  {label:'Travel Allowance', taxable:true, remuneration:true, deduction:true},
  {label:'Company Vehicle (taxable value)', taxable:true, remuneration:true, deduction:false},
  {label:'Use of Property (taxable value)', taxable:true, remuneration:true, deduction:false},
  {label:'Housing Allowance', taxable:true, remuneration:true, deduction:false},
  {label:'Taxable Subsistence Allowance', taxable:true, remuneration:true, deduction:false},
  {label:'Taxable Reimbursement', taxable:true, remuneration:true, deduction:false},
  {label:'Other Employment Income', taxable:true, remuneration:true, deduction:false},
  {label:'Other Fringe Benefits', taxable:true, remuneration:true, deduction:false},
];

// Existing retirement contributions
var retContribRows = [];

// ══ BUILD UI ════════════════════════════════════════════════
function build(){
  var app = document.getElementById('app');
  app.innerHTML = '';

  // ── Client Info Card
  var c1 = div('card');
  var h1 = div('ch'); h1.innerHTML='<h2>Client & Adviser Details</h2><span class="badge">2026/2027</span>'; c1.appendChild(h1);
  var b1 = div('cb');
  b1.innerHTML = '<div class="g4">'
    +'<div class="f"><label>Financial Planner</label><input id="planner" value="Clinton Hayes" readonly></div>'
    +'<div class="f"><label>Client Name</label><input id="clientName" placeholder="Client name"></div>'
    +'<div class="f"><label>Current Age</label><input id="clientAge" type="number" placeholder="e.g. 45" onchange="calculate()"></div>'
    +'<div class="f"><label>Date of Report</label><input id="reportDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'
    +'</div>';
  c1.appendChild(b1);
  app.appendChild(c1);

  // ── Sources of Income Card
  var c2 = div('card');
  var h2 = div('ch'); h2.innerHTML='<h2>Sources of Income</h2><span class="badge">Monthly</span>'; c2.appendChild(h2);
  var b2 = div('cb');
  b2.id = 'incomeBody';
  var info2 = div('info');
  info2.innerHTML = 'Enter <strong>monthly</strong> gross amounts. Employer contributions to retirement funds and medical aid are taxable fringe benefits and form part of remuneration for s11F purposes. Travel allowance deductions reduce taxable income but not remuneration.';
  b2.appendChild(info2);

  // Build income table
  var tbl = document.createElement('table');
  tbl.innerHTML = '<thead><tr><th style="text-align:left">Income Source</th><th>Gross Amount</th><th>Deduction</th><th>Remuneration</th><th>Taxable Income</th></tr></thead>';
  var tbody = document.createElement('tbody');
  tbody.id = 'incomeTbody';
  tbl.appendChild(tbody);
  var tw = div('tbl-wrap'); tw.appendChild(tbl);
  b2.appendChild(tw);

  // Subtotal row area
  var subDiv = div(); subDiv.id = 'incomeSubtotals'; subDiv.style.marginTop='8px';
  b2.appendChild(subDiv);

  c2.appendChild(b2);
  app.appendChild(c2);

  // ── Existing Retirement Fund Contributions
  var c3 = div('card');
  var h3 = div('ch'); h3.innerHTML='<h2>Existing Retirement Fund Contributions</h2><span class="badge">Monthly</span>'; c3.appendChild(h3);
  var b3 = div('cb');
  b3.id = 'retContribBody';
  var info3 = div('info');
  info3.innerHTML = 'Enter existing <strong>employee</strong> contributions to pension, provident, or retirement annuity funds. Employer contributions entered above are already included in the calculation.';
  b3.appendChild(info3);
  var retTbl = document.createElement('table');
  retTbl.innerHTML = '<thead><tr><th style="text-align:left">Fund Type</th><th>Monthly Contribution</th><th style="width:60px"></th></tr></thead>';
  var retTbody = document.createElement('tbody');
  retTbody.id = 'retContribTbody';
  retTbl.appendChild(retTbody);
  var rtw = div('tbl-wrap'); rtw.appendChild(retTbl);
  b3.appendChild(rtw);

  var addRetBtn = el('button','add-btn','+ Add Retirement Contribution');
  addRetBtn.onclick = function(){ retContribRows.push({type:'Pension Fund',amount:0}); renderRetContribs(); };
  b3.appendChild(addRetBtn);

  c3.appendChild(b3);
  app.appendChild(c3);

  // ── Maximum Deduction Result
  var c4 = div('card');
  var h4 = div('ch'); h4.innerHTML='<h2>Maximum Tax-Deductible Contribution</h2>'; c4.appendChild(h4);
  var b4 = div('cb'); b4.id = 'maxDeductionBody';
  c4.appendChild(b4);
  app.appendChild(c4);

  // ── Tax Benefit Comparison
  var c5 = div('card');
  var h5 = div('ch'); h5.innerHTML='<h2>Tax Benefit of Retirement Fund Contribution</h2>'; c5.appendChild(h5);
  var b5 = div('cb'); b5.id = 'taxBenefitBody';
  // Personal choice input
  b5.innerHTML = '<div class="g3" style="margin-bottom:14px">'
    +'<div class="f"><label>Personal Choice Contribution (pm)</label><input id="personalChoice" type="text" placeholder="0" oninput="calculate()"></div>'
    +'<div class="f"><label>&nbsp;</label><div class="info" style="margin:0">Enter a proposed monthly contribution to compare against no contribution and maximum deductible contribution.</div></div>'
    +'<div></div></div>'
    +'<div id="taxCompareResult"></div>';
  c5.appendChild(b5);
  app.appendChild(c5);

  // ── Net Cost of RA / Comparison Card
  var c6 = div('card');
  var h6 = div('ch'); h6.innerHTML='<h2>Net Cost of Retirement Annuity</h2>'; c6.appendChild(h6);
  var b6 = div('cb'); b6.id = 'netCostBody';
  c6.appendChild(b6);
  app.appendChild(c6);

  // ── Disclaimer
  var disc = div('disclaimer');
  disc.innerHTML = '<strong>Disclaimer:</strong> This calculator assists in determining the maximum tax-deductible contribution to retirement funds for the 2026/2027 tax year. '
    +'It does not constitute financial advice. The correctness of the output depends on the accuracy of the information provided. '
    +'Consult with the client\'s tax practitioner to ensure all relevant facts are considered. '
    +'Tax tables: SARS 2026/2027 (1 March 2026 – 28 February 2027). Annual deduction cap: R430,000. '
    +'<br><br><strong>Duwalcoe Financial Consultants</strong> · FSP 9978 · Clinton Hayes';
  app.appendChild(disc);

  // Initialise rows
  renderIncomeRows();
  renderRetContribs();
  calculate();
}

// ══ RENDER INCOME ROWS ══════════════════════════════════════
function renderIncomeRows(){
  var tbody = document.getElementById('incomeTbody');
  tbody.innerHTML = '';
  defaultIncomeTypes.forEach(function(item, idx){
    var tr = document.createElement('tr');
    var grossId = 'inc_gross_'+idx;
    var dedId = 'inc_ded_'+idx;
    tr.innerHTML = '<td>'+item.label+'</td>'
      +'<td><input id="'+grossId+'" type="text" value="0" style="text-align:right;width:120px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="calculate()"></td>'
      +'<td>'+(item.deduction?'<input id="'+dedId+'" type="text" value="0" style="text-align:right;width:100px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="calculate()">':'—')+'</td>'
      +'<td id="inc_rem_'+idx+'" style="font-size:12px;color:var(--sage);font-weight:600">0</td>'
      +'<td id="inc_tax_'+idx+'" style="font-size:12px;color:var(--navy);font-weight:600">0</td>';
    tbody.appendChild(tr);
  });
  // Subtotal row
  var trSub = document.createElement('tr');
  trSub.style.cssText = 'background:#f4f8f4;font-weight:700';
  trSub.innerHTML = '<td style="font-weight:700">Totals</td>'
    +'<td id="inc_total_gross" style="font-weight:700">0</td>'
    +'<td id="inc_total_ded" style="font-weight:700">0</td>'
    +'<td id="inc_total_rem" style="font-weight:700;color:var(--sage)">0</td>'
    +'<td id="inc_total_tax" style="font-weight:700;color:var(--navy)">0</td>';
  tbody.appendChild(trSub);
}

// ══ RENDER RET CONTRIB ROWS ═════════════════════════════════
function renderRetContribs(){
  var tbody = document.getElementById('retContribTbody');
  tbody.innerHTML = '';
  retContribRows.forEach(function(row, idx){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>'
      +'<select id="retType_'+idx+'" onchange="retContribRows['+idx+'].type=this.value" style="border:1.5px solid var(--mist);border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit">'
      +'<option'+(row.type==='Pension Fund'?' selected':'')+'>Pension Fund</option>'
      +'<option'+(row.type==='Provident Fund'?' selected':'')+'>Provident Fund</option>'
      +'<option'+(row.type==='Retirement Annuity'?' selected':'')+'>Retirement Annuity</option>'
      +'</select></td>'
      +'<td><input id="retAmt_'+idx+'" type="text" value="'+(row.amount||0)+'" style="text-align:right;width:120px;padding:5px 8px;border:1.5px solid var(--mist);border-radius:5px;font-size:12px;font-family:inherit" oninput="retContribRows['+idx+'].amount=N(this.value);calculate()"></td>'
      +'<td><button class="del-btn" onclick="retContribRows.splice('+idx+',1);renderRetContribs();calculate()">✕</button></td>';
    tbody.appendChild(tr);
  });
  // Total row
  if(retContribRows.length > 0){
    var trT = document.createElement('tr');
    trT.style.cssText = 'background:#f4f8f4;font-weight:700';
    trT.innerHTML = '<td style="font-weight:700">Total Employee Contributions</td><td id="retContribTotal" style="font-weight:700;text-align:right">0</td><td></td>';
    tbody.appendChild(trT);
  }
}

// ══ MAIN CALCULATION ════════════════════════════════════════
function calculate(){
  var age = N(document.getElementById('clientAge').value);

  // ── Step 1: Income totals
  var totalGross = 0, totalDed = 0, totalRem = 0, totalTax = 0;
  defaultIncomeTypes.forEach(function(item, idx){
    var gross = N(document.getElementById('inc_gross_'+idx).value);
    var ded = 0;
    if(item.deduction){
      var dedEl = document.getElementById('inc_ded_'+idx);
      if(dedEl) ded = N(dedEl.value);
    }
    var rem = item.remuneration ? gross : 0;
    var tax = item.taxable ? (gross - ded) : 0;

    document.getElementById('inc_rem_'+idx).textContent = R(rem);
    document.getElementById('inc_tax_'+idx).textContent = R(tax);

    totalGross += gross;
    totalDed += ded;
    totalRem += rem;
    totalTax += tax;
  });

  document.getElementById('inc_total_gross').textContent = R(totalGross);
  document.getElementById('inc_total_ded').textContent = R(totalDed);
  document.getElementById('inc_total_rem').textContent = R(totalRem);
  document.getElementById('inc_total_tax').textContent = R(totalTax);

  // ── Step 2: Existing employee retirement contributions
  var totalRetContrib = 0;
  retContribRows.forEach(function(row){ totalRetContrib += N(row.amount); });
  var retTotalEl = document.getElementById('retContribTotal');
  if(retTotalEl) retTotalEl.textContent = R(totalRetContrib);

  // ── Step 3: Employer retirement fund contribution (row index 3)
  var employerRetPM = N(document.getElementById('inc_gross_3').value);

  // ── Step 4: Total contributions (employee + employer deemed)
  var totalContribPM = totalRetContrib + employerRetPM;
  var totalContribPA = totalContribPM * 12;

  // ── Step 5: Annual figures
  var remPA = totalRem * 12;
  var taxablePA = totalTax * 12;

  // ── Step 6: Maximum deductible contribution calculation
  // Lesser of:
  // (1) R430,000 pa = R35,833.33 pm
  // (2) 27.5% of GREATER of (a) Remuneration or (b) Taxable Income (before ret deduction)
  // (3) Taxable income (excl. lump sums and taxable capital gains) before donations deduction

  var limit1_PA = MAX_DEDUCTION_PA;
  var limit2a_PA = remPA * DEDUCTION_PCT;
  var limit2b_PA = taxablePA * DEDUCTION_PCT;
  var limit2_PA = Math.max(limit2a_PA, limit2b_PA);
  var limit3_PA = taxablePA;  // Simplified — excluding lump sums and CGT

  var maxDeductPA = Math.min(limit1_PA, limit2_PA, limit3_PA);
  var maxDeductPM = maxDeductPA / 12;

  // ── Step 7: Available additional contribution
  var availableAdditionalPM = Math.max(0, maxDeductPM - totalContribPM);
  var excessPM = Math.max(0, totalContribPM - maxDeductPM);

  // ── Render Max Deduction Card
  var mdBody = document.getElementById('maxDeductionBody');
  mdBody.innerHTML = '';

  var resBox = div('result-box');

  // Headline figures
  var hl = div('headline');
  hl.innerHTML = '<div class="hl"><div class="v">'+R(Math.round(maxDeductPM))+'</div><div class="l">Max Deductible /month</div></div>'
    +'<div class="hl"><div class="v">'+R(Math.round(maxDeductPA))+'</div><div class="l">Max Deductible /year</div></div>'
    +'<div class="hl"><div class="v '+(availableAdditionalPM>0?'ok':'warn')+'">'+R(Math.round(availableAdditionalPM))+'</div><div class="l">Available Additional /month</div></div>';
  resBox.appendChild(hl);

  // Detail rows
  function addRow(lbl,val,bold,warn){
    var r = div('row-r'+(bold?' bold':''));
    r.innerHTML = '<span class="lbl">'+lbl+'</span><span class="val'+(warn?' neg':'')+'">'+val+'</span>';
    resBox.appendChild(r);
  }

  addRow('(1) Annual ceiling','R 430,000 → '+R(Math.round(limit1_PA/12))+' /month');
  addRow('(2a) 27.5% × Remuneration ('+R(remPA)+')','→ '+R(Math.round(limit2a_PA/12))+' /month');
  addRow('(2b) 27.5% × Taxable Income ('+R(taxablePA)+')','→ '+R(Math.round(limit2b_PA/12))+' /month');
  addRow('Greater of (2a) and (2b)',R(Math.round(limit2_PA/12))+' /month');
  addRow('(3) Taxable income (excl. lump sums & CGT)',R(Math.round(limit3_PA/12))+' /month');
  addRow('Maximum deductible contribution',R(Math.round(maxDeductPM))+' /month',true);

  resBox.appendChild(el('div','sec','Current Contributions'));
  addRow('Employee contributions (pension/provident/RA)',R(Math.round(totalRetContrib))+' /month');
  addRow('Employer retirement fund contribution (deemed)',R(Math.round(employerRetPM))+' /month');
  addRow('Total current contributions',R(Math.round(totalContribPM))+' /month',true);

  if(excessPM > 0){
    addRow('⚠ Excess (non-deductible, carried forward)',R(Math.round(excessPM))+' /month',false,true);
  } else {
    addRow('Available for additional contribution',R(Math.round(availableAdditionalPM))+' /month',true);
  }

  mdBody.appendChild(resBox);

  // ── Step 8: Tax Benefit Comparison
  var personalChoicePM = N(document.getElementById('personalChoice').value);
  var tcr = document.getElementById('taxCompareResult');
  tcr.innerHTML = '';

  // Three scenarios: No contribution, Personal choice, Maximum
  var scenarios = [
    { label:'No Contribution', addContrib:0 },
    { label:'Personal Choice', addContrib: personalChoicePM },
    { label:'Maximum Deductible', addContrib: availableAdditionalPM }
  ];

  var compBox = div('result-box');
  var compGrid = div('tax-benefit-grid');

  // Annual taxable income BEFORE any retirement deduction
  var taxableBeforeRetPA = taxablePA;

  scenarios.forEach(function(sc, si){
    var col = div('tax-col');
    var titleCls = si===2 ? 'col-title active' : 'col-title';
    col.innerHTML = '<div class="'+titleCls+'">'+sc.label+'</div>';

    // Total retirement contribution for this scenario
    var scenarioContribPM = totalContribPM + sc.addContrib;
    var scenarioContribPA = scenarioContribPM * 12;

    // Deductible amount (capped)
    var deductiblePA = Math.min(scenarioContribPA, maxDeductPA);
    var deductiblePM = deductiblePA / 12;

    // Taxable income after retirement deduction
    var taxableAfterRetPA = Math.max(0, taxableBeforeRetPA - deductiblePA);

    // Tax payable
    var taxPA = calcTaxPA(taxableAfterRetPA, age);
    var taxPM = taxPA / 12;

    function cRow(lbl,mVal,aVal,bold){
      var r = div('row-r'+(bold?' bold':''));
      r.innerHTML = '<span class="lbl">'+lbl+'</span>';
      var vd = div();
      vd.style.cssText = 'text-align:right';
      vd.innerHTML = '<div class="val" style="font-size:11px">'+R(Math.round(mVal))+' /m</div><div style="font-size:10px;color:#667">'+R(Math.round(aVal))+' /yr</div>';
      r.appendChild(vd);
      col.appendChild(r);
    }

    cRow('Taxable income (before ret.)', taxableBeforeRetPA/12, taxableBeforeRetPA);
    cRow('Retirement fund deduction', deductiblePM, deductiblePA);
    cRow('Taxable income (after ret.)', taxableAfterRetPA/12, taxableAfterRetPA);
    cRow('Tax payable', taxPM, taxPA, true);

    compGrid.appendChild(col);
  });

  compBox.appendChild(compGrid);

  // Tax saving summary
  var noContribTax = calcTaxPA(Math.max(0, taxableBeforeRetPA - Math.min(totalContribPM*12, maxDeductPA)), age);
  var personalTax = calcTaxPA(Math.max(0, taxableBeforeRetPA - Math.min((totalContribPM+personalChoicePM)*12, maxDeductPA)), age);
  var maxTax = calcTaxPA(Math.max(0, taxableBeforeRetPA - Math.min((totalContribPM+availableAdditionalPM)*12, maxDeductPA)), age);

  var savingPersonal = noContribTax - personalTax;
  var savingMax = noContribTax - maxTax;

  var savRow = div();
  savRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid #334;padding-top:10px;margin-top:4px';

  function savCol(lbl,val){
    var d = div();
    d.style.cssText = 'text-align:center;padding:6px';
    d.innerHTML = '<div style="font-size:10px;color:#8899bb;text-transform:uppercase;letter-spacing:.4px">'+lbl+'</div>'
      +'<div style="font-family:DM Serif Display,serif;font-size:18px;color:'+(val>0?'#86efac':'#ccc')+'">'+R(Math.round(val))+' /yr</div>'
      +'<div style="font-size:10px;color:#8899bb">'+R(Math.round(val/12))+' /month</div>';
    return d;
  }
  savRow.appendChild(savCol('Tax Saving', 0));
  savRow.appendChild(savCol('Tax Saving', savingPersonal));
  savRow.appendChild(savCol('Tax Saving', savingMax));
  compBox.appendChild(savRow);

  // Income after tax + Net cost
  var incAfterRow = div();
  incAfterRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid #334;padding-top:10px;margin-top:4px';

  scenarios.forEach(function(sc,si){
    var scenarioContribPM = totalContribPM + sc.addContrib;
    var scenarioContribPA = scenarioContribPM * 12;
    var deductiblePA = Math.min(scenarioContribPA, maxDeductPA);
    var taxableAfterRetPA = Math.max(0, taxableBeforeRetPA - deductiblePA);
    var taxPA = calcTaxPA(taxableAfterRetPA, age);
    var incAfterTaxPA = taxableBeforeRetPA - taxPA;
    var incAfterTaxPM = incAfterTaxPA / 12;

    var d = div();
    d.style.cssText = 'text-align:center;padding:6px';
    d.innerHTML = '<div style="font-size:10px;color:#8899bb;text-transform:uppercase;letter-spacing:.4px">Income After Tax</div>'
      +'<div style="font-family:DM Serif Display,serif;font-size:16px;color:#d4f0a8">'+R(Math.round(incAfterTaxPM))+' /m</div>';

    if(si > 0){
      // Net cost of RA = contribution - tax saving
      var contribPA = sc.addContrib * 12;
      var saving = (si===1) ? savingPersonal : savingMax;
      var netCost = contribPA - saving;
      d.innerHTML += '<div style="margin-top:6px;font-size:10px;color:#8899bb;text-transform:uppercase;letter-spacing:.4px">Net Cost of RA</div>'
        +'<div style="font-size:14px;font-weight:700;color:var(--gold)">'+R(Math.round(netCost/12))+' /m</div>'
        +'<div style="font-size:10px;color:#667">'+R(Math.round(netCost))+' /yr</div>';
    }
    incAfterRow.appendChild(d);
  });
  compBox.appendChild(incAfterRow);

  tcr.appendChild(compBox);

  // ── Step 9: Net Cost / RA Comparison Card
  var ncBody = document.getElementById('netCostBody');
  ncBody.innerHTML = '';

  var margRate = calcMarginalRate(taxableBeforeRetPA);
  var margPct = Math.round(margRate * 100);

  var ncBox = div('result-box');

  var ncHl = div('headline');
  ncHl.innerHTML = '<div class="hl"><div class="v">'+margPct+'%</div><div class="l">Marginal Tax Rate</div></div>'
    +'<div class="hl"><div class="v">'+(100 - margPct)+'%</div><div class="l">Net Cost per R1 Contributed</div></div>'
    +'<div class="hl"><div class="v ok">'+margPct+'c</div><div class="l">Tax Relief per R1</div></div>';
  ncBox.appendChild(ncHl);

  // RA comparison table — at each marginal rate
  var ncInfo = div();
  ncInfo.style.cssText = 'font-size:11px;color:#8899bb;margin-top:8px;padding-top:8px;border-top:1px solid #334;line-height:1.7';
  ncInfo.innerHTML = '<strong style="color:var(--gold)">The tax advantage of Retirement Annuities</strong><br>'
    +'Retirement fund contributions provide tax relief, making them cost less than equivalent discretionary investments. '
    +'At a marginal rate of <strong>'+margPct+'%</strong>, every R100 contributed to an RA effectively costs only <strong>R'+(100-margPct)+'</strong> after tax relief.';
  ncBox.appendChild(ncInfo);

  // Comparison at all marginal rates
  var rateTable = '<div class="tbl-wrap" style="margin-top:12px"><table>'
    +'<thead><tr><th style="text-align:left">At Marginal Rate</th><th>18%</th><th>26%</th><th>31%</th><th>36%</th><th>39%</th><th>41%</th><th>45%</th></tr></thead>'
    +'<tbody>'
    +'<tr><td>RA Contribution</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td><td>R100</td></tr>'
    +'<tr><td>Less: Tax Relief</td><td>R18</td><td>R26</td><td>R31</td><td>R36</td><td>R39</td><td>R41</td><td>R45</td></tr>'
    +'<tr style="background:#f0fdf4;font-weight:700"><td style="font-weight:700">After-Tax Cost</td><td><strong>R82</strong></td><td><strong>R74</strong></td><td><strong>R69</strong></td><td><strong>R64</strong></td><td><strong>R61</strong></td><td><strong>R59</strong></td><td><strong>R55</strong></td></tr>'
    +'</tbody></table></div>';

  var rateDiv = div();
  rateDiv.innerHTML = rateTable;
  ncBox.appendChild(rateDiv);

  // Breakeven growth comparison
  if(availableAdditionalPM > 0 && margRate > 0){
    var raEquiv = availableAdditionalPM / (1 - margRate);
    var beInfo = div();
    beInfo.style.cssText = 'margin-top:12px;padding-top:10px;border-top:1px solid #334;font-size:12px;color:#ccd6f6;line-height:1.8';
    beInfo.innerHTML = 'At your marginal rate of <strong style="color:var(--gold)">'+margPct+'%</strong>:<br>'
      +'An RA investment of <strong style="color:#86efac">'+R(Math.round(raEquiv))+'</strong> /month has the same after-tax cost as a discretionary investment of <strong>'+R(Math.round(availableAdditionalPM))+'</strong> /month.<br>'
      +'The discretionary investment must first achieve substantial growth just to match the tax advantage of the RA before it can begin to compete on investment returns.';
    ncBox.appendChild(beInfo);
  }

  ncBody.appendChild(ncBox);
}

// ══ RESET ═══════════════════════════════════════════════════
function resetAll(){
  retContribRows = [];
  build();
  toast('Reset complete');
}

// ══ INIT ════════════════════════════════════════════════════
build();
</script>
</body>
</html>
